paytda sport zaliga kelayotganingni tez-tez koʻryapman."], ["陈天中", "我每天下午都来跑一个小时步。", "Har kuni tushdan keyin kelib bir soat yuguraman."], ["李文", "你的运动习惯真不错。", "Sport odating juda yaxshi ekan."], ["陈天中", "因为我今年胖了十多斤，不能再胖下去了，有点儿不健康。", "Chunki bu yil besh kilodan koʻproq semirdim, bundan ortiq semirib ketmasligim kerak, biroz sogʻliqqa zararli."], ["李文", "我下课以后常去打羽毛球，你也来玩吧。", "Men darsdan keyin tez-tez badminton oʻynagani boraman, sen ham kel."], ["陈天中", "我知道，但是你们的水平太高了，我打得不怎么样。", "Bilaman, lekin sizlarning darajangiz juda baland, men unchalik yaxshi oʻynamayman."], ["李文", "没关系，我可以教你。", "Hechqisi yoʻq, men seni oʻrgataman."]]}, {"k": 2, "scene": "在教室，安妮问候陈天中。", "sceneuz": "Sinfda Anni Chen Tyanchjunning holini soʻrayapti.", "lines": [["安妮", "你怎么了？看上去有点儿不舒服。", "Senga nima boʻldi? Mazang yoʻqqa oʻxshaysan."], ["陈天中", "昨天游完泳以后，耳朵一直有点儿疼。", "Kecha suzib boʻlgandan beri qulogʻim ogʻriyapti."], ["安妮", "是不是感冒了？发烧吗？", "Shamollamadingmi? Isitmang bormi?"], ["陈天中", "好像发低烧了。", "Biroz isitmam bor shekilli."], ["安妮", "我送你去医院，让医生检查一下吧。", "Seni kasalxonaga olib boray, shifokor tekshirib koʻrsin."], ["陈天中", "我先回去睡一觉，可能休息休息就好了。", "Avval borib bir uxlab olay, dam olsam oʻtib ketar."], ["安妮", "好吧，如果下午还发烧，就一定要去看医生。", "Mayli, agar tushdan keyin ham isitmang boʻlsa, albatta shifokorga bor."], ["陈天中", "谢谢关心，我会注意的。", "Gʻamxoʻrliging uchun rahmat, ehtiyot boʻlaman."]]}, {"k": 3, "scene": "在医院病房，安妮探望陈天中。", "sceneuz": "Kasalxona palatasida Anni Chen Tyanchjunni koʻrgani keldi.", "lines": [["安妮", "你怎么突然住院了？大家都很担心你。", "Nega toʻsatdan kasalxonaga yotib qolding? Hamma sendan xavotirda."], ["陈天中", "我的腿疼了几个星期了，医生说需要住院做检查。", "Oyogʻim bir necha haftadan beri ogʻriyapti, shifokor kasalxonada yotib tekshiruvdan oʻtish kerak dedi."], ["安妮", "你看起来一点儿也不像病人。", "Sen umuman bemorga oʻxshamaysan."], ["陈天中", "是啊，我很少生病。我上次来医院已经过去差不多两年了。", "Ha, men kam kasal boʻlaman. Oxirgi marta kasalxonaga kelganimga deyarli ikki yil boʻldi."], ["安妮", "你每天跑步，有时候还去游泳，是不是运动太多了？", "Har kuni yugurasan, baʼzan suzishga ham borasan, haddan tashqari koʻp sport qilmadingmi?"], ["陈天中", "医生也这么说，但是还得做完检查才能知道。", "Shifokor ham shunday dedi, lekin tekshiruv tugagandagina bilsa boʻladi."], ["安妮", "别担心！听医生的话，好好休息，你的腿一定能好。", "Xavotir olma! Shifokorning gapiga quloq sol, yaxshilab dam ol, oyogʻing albatta tuzaladi."], ["陈天中", "谢谢。有人来看我，我就开心多了。", "Rahmat. Kimdir koʻrgani kelsa, ancha xursand boʻlaman."]]}, {"k": 4, "scene": "在家里，陈天中吃药、休息。", "sceneuz": "Uyda Chen Tyanchjun dori ichib, dam olyapti.", "lines": [["", "今天我出院了。", "Bugun kasalxonadan chiqdim."], ["", "出院前，医生给我开了几种药，而且告诉了我吃药的方法。", "Chiqishdan oldin shifokor menga bir necha xil dori yozib berdi va qanday ichishni ham aytdi."], ["", "有一种药需要每天睡前吃一次，其他几种每天吃三次，饭后吃。", "Bir xil dorini har kuni uxlashdan oldin bir marta, qolganlarini kuniga uch marta ovqatdan keyin ichish kerak."], ["", "除了吃药，医生还说最重要的是多休息。", "Dori ichishdan tashqari, shifokor eng muhimi koʻproq dam olish ekanini ham aytdi."], ["", "我都记在心里了，回家以后一定会多注意。", "Hammasini yodimga saqladim, uyda albatta koʻproq eʼtibor beraman."], ["", "希望我的腿能快一点儿好。", "Oyogʻim tezroq tuzalib ketsin deb umid qilaman."]]}]}, {"n": 9, "zh": "打不好没关系", "py": "Dǎ bu hǎo méi guānxi", "uz": "Yaxshi oʻynay olmasang ham mayli", "words": [["校园", "xiàoyuán", "n", "kampus, oʻquv shaharchasi", "校 (学校 dagi) + 园 bogʻ (囗 ramka ichida): “maktab bogʻi”. 校园卡 — talaba kartasi.", "", "家月，对不起，我昨天忘了还你校园卡了。", "Jiayue, kechir, kecha talaba kartangni qaytarishni unutibman."], ["卡", "kǎ", "n", "karta", "上 + 下: ustida ham, ostida ham — oʻrtada qisilib turgan yupqa narsa. 银行卡 — bank kartasi.", "银行卡", "这是我的校园卡。", "Bu mening talaba kartam."], ["球场", "qiúchǎng", "n", "sport maydoni (toʻp oʻyinlari uchun)", "球 toʻp + 场 maydon (土 yer): “toʻp oʻynaladigan yer”.", "", "我正在球场打球呢。", "Hozir maydonda toʻp oʻynayapman."], ["为了", "wèile", "prep", "…uchun, …maqsadida", "为 wèi — uchun. Maqsad 为了 dan keyin keladi, harakat — undan keyin.", "", "为了准备运动会，你们几个男生每天都练球。", "Sport musobaqasiga tayyorlanish uchun siz bir necha yigit har kuni toʻp mashq qilyapsiz."], ["运动会", "yùndònghuì", "n", "sport musobaqasi (spartakiada)", "运动 sport + 会 yigʻin, tadbir: “sport tadbiri”.", "", "你打算参加运动会吗？", "Sport musobaqasida qatnashmoqchimisan?"], ["男生", "nánshēng", "n", "yigit (talaba, oʻquvchi)", "男 erkak + 生 (学生 dagi). Teskarisi — 女生.", "", "我们班有十个男生。", "Sinfimizda oʻnta oʻgʻil bola bor."], ["练", "liàn", "v", "mashq qilmoq", "练习 ning qisqasi. 练球 — toʻp oʻyinini mashq qilmoq.", "", "你可以过来跟我们一起练。", "Kelib biz bilan birga mashq qilishing mumkin."], ["参加", "cānjiā", "v", "qatnashmoq", "参 qoʻshilmoq + 加 qoʻshmoq: oʻzingni biror ishga “qoʻshmoq”.", "", "我想参加网球比赛。", "Tennis musobaqasida qatnashmoqchiman."], ["网球", "wǎngqiú", "n", "tennis", "网 toʻr + 球 toʻp: toʻr ustidan oshirib uriladigan toʻp.", "", "她每个周末都去打网球。", "U har dam olish kuni tennis oʻynagani boradi."], ["比赛", "bǐsài", "n/v", "musobaqa, oʻyin; bellashmoq", "比 solishtirmoq + 赛 bellashmoq: kim kuchli ekanini solishtirish.", "", "好，到时候我去看你的比赛。", "Xoʻp, oʻsha payt borib oʻyiningni koʻraman."], ["练习", "liànxí", "v/n", "mashq qilmoq; mashq", "练 mashq + 习 (学习 dagi) takrorlamoq.", "", "我想参加网球比赛，最近一直在练习。", "Tennis musobaqasida qatnashmoqchiman, oxirgi paytda doim mashq qilyapman."], ["好多", "hǎoduō", "num", "juda koʻp", "好 bu yerda “juda” + 多 koʻp. 好多年 — koʻp yillar.", "", "我好多年没打羽毛球了。", "Koʻp yillardan beri badminton oʻynamaganman."], ["几乎", "jīhū", "adv", "deyarli", "几 bu yerda jī (jǐ emas!). 差不多 (8-mavzu) ga yaqin, lekin 几乎 faqat ravish.", "", "我几乎忘了怎么打了。", "Qanday oʻynashni deyarli unutib qoʻydim."], ["只是", "zhǐshì", "adv/conj", "faqat, shunchaki; lekin", "只 faqat + 是: “faqat shu, xolos”.", "", "大家打球只是为了锻炼身体。", "Hamma toʻpni shunchaki sogʻliq uchun oʻynaydi."], ["啤酒", "píjiǔ", "n", "pivo", "啤 (口 + 卑 tovush) + 酒 ichimlik (氵 suyuqlik).", "", "冰箱里有啤酒和饮料。", "Muzlatgichda pivo va ichimliklar bor."], ["回", "huí", "m", "(voqea, ish uchun) hol, gap", "回 qaytmoq ning yangi maʼnosi — hisob soʻzi: 怎么回事 — nima gap?", "怎么回事", "今天怎么回事？", "Bugun nima boʻldi?"], ["紧张", "jǐnzhāng", "adj", "hayajonlangan, asabiy", "紧 tarang (糸 ip) + 张 tortmoq (弓 kamon): kamon ipi tarang tortilgan.", "", "新球员第一次参加这么重要的比赛，太紧张了。", "Yangi oʻyinchilar birinchi marta bunday muhim oʻyinda qatnashyapti, juda hayajonda."], ["主要", "zhǔyào", "adj", "asosiy", "主 egasi, bosh + 要 muhim: “eng muhimi”.", "", "主要的球员没参加比赛。", "Asosiy oʻyinchilar oʻyinda qatnashmadi."], ["受到", "shòudào", "v", "(taʼsir, yordam) olmoq, …ga uchramoq", "受 qabul qilmoq + 到 yetib keldi: biror narsa senga yetib keldi.", "", "大家也都受到影响了。", "Hamma ham buning taʼsirini sezdi."], ["影响", "yǐngxiǎng", "n/v", "taʼsir; taʼsir qilmoq", "影 soya + 响 ovoz, aks-sado: soya va aks-sado kabi orqadan ergashib keladigan narsa.", "", "奥运会是世界上影响最大的体育比赛。", "Olimpiya oʻyinlari dunyodagi eng taʼsirli sport musobaqasi."], ["得分", "défēn", "v/n", "ochko olmoq; hisob", "得 dé olmoq + 分 ochko, ball.", "", "你们告诉我得分吧。", "Hisobni menga aytib turinglar."], ["体育", "tǐyù", "n", "sport, jismoniy tarbiya", "体 tana (身体 dagi) + 育 tarbiya: “tanani tarbiyalash”. 体育馆 — 8-mavzu.", "", "我喜欢看体育比赛。", "Sport musobaqalarini koʻrishni yaxshi koʻraman."], ["世界", "shìjiè", "n", "dunyo", "世 avlod, dunyo + 界 chegara (田 dala + 介): hamma chegaralar ichidagi joy.", "", "他让世界认识了中国。", "U dunyoni Xitoy bilan tanishtirdi."], ["运动员", "yùndòngyuán", "n", "sportchi", "运动 sport + 员 xodim (服务员 dagi 员).", "", "每次奥运会都有非常多的运动员参加。", "Har bir Olimpiadada juda koʻp sportchi qatnashadi."], ["得到", "dédào", "v", "olmoq, erishmoq", "得 dé olmoq + 到 yetmoq: qoʻlga kiritmoq. 得 ning uchinchi oʻqilishi (8-mavzu: de, dé, děi).", "", "他没有得到好成绩。", "U yaxshi natijaga erisha olmadi."], ["成绩", "chéngjì", "n", "natija, baho", "成 bajarmoq + 绩 (纟) yutuq: qilingan ishning natijasi.", "", "这次考试她的成绩很好。", "Bu safargi imtihonda uning natijasi juda yaxshi."], ["奥运会", "Àoyùnhuì", "prop", "Olimpiya oʻyinlari", "奥 (奥林匹克 Olimpiya) + 运(动)会 sport musobaqasi.", "", "我最爱看的就是奥运会。", "Eng yaxshi koʻrib tomosha qiladiganim — Olimpiya oʻyinlari."], ["刘长春", "Liú Chángchūn", "prop", "Lyu Chanchun (ism)", "Olimpiadada qatnashgan birinchi xitoylik sportchi (1932). 长 bu yerda cháng.", "", "第一位参加奥运会的中国运动员是刘长春。", "Olimpiadada qatnashgan birinchi xitoylik sportchi Lyu Chanchun edi."]], "grammar": [{"zh": "目的复句“为了……，……”", "uz": "…uchun, … (maqsad gapi)", "f": ["为了 + maqsad，harakat", "harakat + 是为了 + maqsad"], "ex": "为了 dan keyingi qism maqsadni bildiradi, ikkinchi qism esa shu maqsadga erishish uchun qilinadigan harakatni bildiradi.", "eg": [["听说为了准备运动会，你们几个男生每天都练球。", "Eshitishimcha, sport musobaqasiga tayyorlanish uchun siz bir necha yigit har kuni toʻp mashq qilyapsiz.", "听说:N|为了准备运动会，:K|你们几个男生:S|每天:D|都:D|练:P|球:O", 0], ["为了考上大学，她每天努力学习。", "Universitetga kirish uchun u har kuni tirishib oʻqiydi.", "为了考上大学，:K|她:S|每天:D|努力:D|学习:P", 0], ["为了早点儿到家，我打算坐飞机回去。", "Uyga tezroq yetib olish uchun samolyotda qaytmoqchiman.", "为了早点儿到家，:K|我:S|打算:D|坐飞机:D|回去:P", 0], ["为了参加网球比赛，她最近一直在练习。", "Tennis musobaqasida qatnashish uchun u oxirgi paytda doim mashq qilyapti.", "为了参加网球比赛，:K|她:S|最近:D|一直:D|在练习:P", 1], ["为了得到好成绩，运动员们每天练十多个小时。", "Yaxshi natijaga erishish uchun sportchilar har kuni oʻn soatdan koʻproq mashq qiladi.", "为了得到好成绩，:K|运动员们:S|每天:D|练:P|十多个小时:C", 1]], "why": "为了 = 为 “uchun” + 了. Oʻzbekchada maqsad feʼl oldida “…uchun” bilan keladi; xitoychada ham 为了 va maqsad gap BOSHIDA turadi, harakat keyin keladi. Maqsadni oxirida aytmoqchi boʻlsang, 是为了 bilan ayt: 大家打球只是为了锻炼身体.", "mis": [["我学汉语为了去中国。", "我学汉语是为了去中国。", "Maqsad gap oxirida kelsa, oldiga 是 qoʻyiladi: …是为了…"]]}, {"zh": "可能补语", "uz": "…a olmoq / …a olmaslik (imkoniyat toʻldiruvchisi)", "f": ["feʼl + 得 + toʻldiruvchi (qila oladi)", "feʼl + 不 + toʻldiruvchi (qila olmaydi)", "feʼl得… + feʼl不…? / feʼl得…吗?"], "ex": "Feʼl bilan natija yoki yoʻnalish toʻldiruvchisi orasiga 得 yoki 不 qoʻyilsa, imkoniyat toʻldiruvchisi hosil boʻladi: sharoit shu natijaga erishishga imkon beradimi, yoʻqmi. Soʻroq shakli: feʼl+得+toʻldiruvchi+feʼl+不+toʻldiruvchi yoki feʼl+得+toʻldiruvchi+吗.", "eg": [["打不好没关系。", "Yaxshi oʻynay olmasang ham mayli.", "打:P|不好:K|没关系:N", 0], ["这本书你看得懂看不懂？", "Bu kitobni oʻqib tushuna olasanmi, yoʻqmi?", "这本书:O|你:S|看:P|得懂:K|看:P|不懂:K", 0], ["你只有一个星期的时间，学得会游泳吗？", "Bor-yoʻgʻi bir haftang bor, suzishni oʻrganib ulgurasanmi?", "你:S|只有:P|一个星期的:A|时间，:O|学:P|得会:K|游泳:O|吗:N", 0], ["今天总是踢不进去！", "Bugun toʻpni hech kirita olmayapti.", "今天:D|总是:D|踢:P|不进去:K", 1], ["我说话，你听得见吗？", "Gapimni eshita olyapsanmi?", "我说话，:N|你:S|听:P|得见:K|吗:N", 1]], "why": "Imkoniyat toʻldiruvchisi oʻzbekchadagi “-a olmoq / -a olmaslik” ga toʻgʻri keladi: 听得懂 — eshitib tushuna olaman, 听不懂 — tushuna olmayman. Natijaga erishib boʻlmasa, 不能 emas, 不 feʼl bilan toʻldiruvchi ORASIGA kiradi.", "mis": [["我不能听懂他说的话。", "我听不懂他说的话。", "Natijaga erisha olmaslik 不能 bilan emas, 听不懂 kabi aytiladi."], ["这本书我看得不懂。", "这本书我看不懂。", "Boʻlishsiz shaklda 得 qoʻyilmaydi: 看不懂."]]}, {"zh": "固定格式“越A越B”", "uz": "Qancha A boʻlsa, shuncha B", "f": ["越 + A + 越 + B"], "ex": "越A越B qolipida A va B ikkalasi ham feʼl yoki sifat birikmasi boʻlishi mumkin, yoki biri feʼl, ikkinchisi sifat boʻladi. B ning A ga qarab oʻzgarib borishini bildiradi.", "eg": [["今天的足球比赛我越看越着急。", "Bugungi futbol oʻyinini qancha koʻrsam, shuncha asabim buzilyapti.", "今天的:A|足球比赛:O|我:S|越:K|看:P|越:K|着急:P", 0], ["妈妈越说，他越不高兴。", "Onasi qancha gapirsa, u shuncha xafa boʻlyapti.", "妈妈:S|越:K|说，:P|他:S|越:K|不高兴:P", 0], ["我想认识中国朋友，越多越好。", "Xitoylik doʻstlar bilan tanishmoqchiman, qancha koʻp boʻlsa, shuncha yaxshi.", "我:S|想:D|认识:P|中国朋友，:O|越:K|多:P|越:K|好:P", 0], ["我越练越紧张。", "Qancha mashq qilsam, shuncha hayajonlanaman.", "我:S|越:K|练:P|越:K|紧张:P", 1], ["比赛越重要，运动员越紧张。", "Musobaqa qanchalik muhim boʻlsa, sportchilar shunchalik hayajonlanadi.", "比赛:S|越:K|重要，:P|运动员:S|越:K|紧张:P", 1]], "why": "Oʻzbekchadagi “qancha …, shuncha …” ga aynan mos: 越看越着急 — qancha koʻrsam, shuncha asabim buziladi. Ikkala 越 ham feʼl yoki sifat OLDIDAN keladi; ega ikki xil boʻlsa, har biri oʻz 越 sidan oldin turadi: 妈妈越说，他越不高兴.", "mis": [["越妈妈说，越他不高兴。", "妈妈越说，他越不高兴。", "越 egadan keyin, feʼldan oldin turadi."], ["我越看越很着急。", "我越看越着急。", "越 dan keyin 很 qoʻyilmaydi: darajani 越 ning oʻzi bildiradi."]]}], "texts": [{"k": 1, "scene": "在图书馆门口，李文向白家月跑过去。", "sceneuz": "Kutubxona eshigi oldida Li Ven Bay Jiayue tomon yugurib keldi.", "lines": [["李文", "家月，对不起，我昨天忘了还你校园卡了。", "Jiayue, kechir, kecha talabalik kartangni qaytarishni unutibman."], ["白家月", "没关系。你怎么这么快就过来了？", "Hechqisi yoʻq. Nega bunchalik tez kelding?"], ["李文", "我正在球场打球呢，接了你的电话就跑过来了。", "Maydonda toʻp oʻynayotgan edim, qoʻngʻirogʻingni olishim bilan yugurib keldim."], ["白家月", "听说为了准备运动会，你们几个男生每天都练球。", "Eshitishimcha, sport musobaqasiga tayyorlanish uchun siz bir necha yigit har kuni toʻp mashq qilarkansiz."], ["李文", "是啊！你打算参加运动会吗？", "Ha! Sen musobaqada qatnashmoqchimisan?"], ["白家月", "我想参加网球比赛，最近一直在练习。", "Tennis bellashuvida qatnashmoqchiman, oxirgi paytda toʻxtovsiz mashq qilyapman."], ["李文", "好，到时候我去看你的比赛。", "Yaxshi, oʻshanda borib bellashuvingni tomosha qilaman."]]}, {"k": 2, "scene": "在校园里，李文和白家月在聊天儿。", "sceneuz": "Universitet hududida Li Ven va Bay Jiayue suhbatlashyapti.", "lines": [["李文", "家月，你跟我们一起打羽毛球吧？", "Jiayue, biz bilan birga badminton oʻynaysanmi?"], ["白家月", "我好多年没打羽毛球了，几乎忘了怎么打了。", "Koʻp yillardan beri badminton oʻynamadim, qanday oʻynashni deyarli unutibman."], ["李文", "不是比赛，打不好没关系。", "Bu musobaqa emas, yaxshi oʻynay olmasang ham mayli."], ["白家月", "这么多同学一起打，如果总是接不住球，就太不好意思了。", "Shuncha sinfdosh bilan oʻynasam, agar doim toʻpni qaytara olmasam, juda uyat boʻladi."], ["李文", "你想得太多了！大家打球只是为了锻炼身体。", "Koʻp oʻylab yuboryapsan! Hamma faqat badantarbiya uchun oʻynaydi."], ["白家月", "我先自己练练吧，下周再跟你们一起打。", "Avval oʻzim mashq qilib olay, kelasi hafta sizlar bilan oʻynayman."], ["李文", "我在教天中打羽毛球，你可以过来跟我们一起练。", "Men Tyanchjunga badminton oʻrgatyapman, sen ham kelib biz bilan birga mashq qilishing mumkin."]]}, {"k": 3, "scene": "在李文家，李文、白家月和陈天中一起看电视。", "sceneuz": "Li Vennikida Li Ven, Bay Jiayue va Chen Tyanchjun birga televizor koʻryapti.", "lines": [["陈天中", "足球比赛已经开始了，快过来看吧！", "Futbol oʻyini boshlanib ketdi, tezroq kelib koʻringlar!"], ["李文", "你们先看，冰箱里有啤酒和饮料，我去拿一下。", "Sizlar koʻraveringlar, muzlatgichda pivo va ichimlik bor, borib olib kelaman."], ["白家月", "今天怎么回事？总是踢不进去！", "Bugun nima boʻldi? Hech gol ura olishmayapti!"], ["陈天中", "几个老球员生病了，新球员第一次参加这么重要的比赛，太紧张了。", "Bir nechta tajribali futbolchi kasal boʻlib qolgan, yangi futbolchilar bunday muhim oʻyinda birinchi marta qatnashyapti, juda hayajonda."], ["李文", "是啊，主要的球员没参加比赛，所以大家也都受到影响了。", "Ha, asosiy futbolchilar oʻynamayapti, shuning uchun hammaga taʼsir qilgan."], ["白家月", "越看越着急。我不看了，你们告诉我得分吧。", "Koʻrgan sari asabim buzilyapti. Koʻrmayman, hisobni sizlar aytib qoʻyinglar."]]}, {"k": 4, "scene": "在家里，李文准备演讲稿。", "sceneuz": "Uyda Li Ven nutq matnini tayyorlayapti.", "lines": [["", "我喜欢看体育比赛，最爱看的就是奥运会。", "Sport musobaqalarini tomosha qilishni yaxshi koʻraman, eng yoqtirganim — Olimpiada oʻyinlari."], ["", "奥运会是世界上影响最大的体育比赛。", "Olimpiada — dunyodagi eng taʼsirli sport musobaqasi."], ["", "从1896年到2024年，每次奥运会都有非常多的运动员参加。", "1896-yildan 2024-yilgacha har bir Olimpiadada juda koʻp sportchi qatnashgan."], ["", "第一位参加奥运会的中国运动员是刘长春，他1932年参加了100米和200米短跑比赛。", "Olimpiadada qatnashgan birinchi xitoylik sportchi Lyu Chanchun boʻlgan, u 1932-yilda 100 va 200 metrga yugurishda qatnashgan."], ["", "虽然他没有得到好成绩，但是他让世界认识了中国。", "Garchi u yaxshi natijaga erishmagan boʻlsa ham, dunyoni Xitoy bilan tanishtirdi."]]}]}, {"n": 10, "zh": "你明天再把书还给我", "py": "Nǐ míngtiān zài bǎ shū huán gěi wǒ", "uz": "Kitobni ertaga qaytarib berasan", "words": [["数学", "shùxué", "n", "matematika", "数 son + 学 fan: “sonlar fani”.", "", "你的数学越来越好。", "Matematikang tobora yaxshilanyapti."], ["认真", "rènzhēn", "adj", "jiddiy, astoydil, puxta", "认 tanimoq + 真 haqiqiy: ishni “haqiqiy” deb bilib, jiddiy qilish.", "", "没有什么特别的方法，认真听课，认真记笔记。", "Hech qanday maxsus usul yoʻq: darsni diqqat bilan tingla, konspektni puxta yoz."], ["笔记", "bǐjì", "n", "konspekt, yozuv", "笔 qalam (⺮ bambuk) + 记 yozib olmoq. 记笔记 — konspekt yozmoq.", "", "我没有记笔记的习惯。", "Menda konspekt yozish odati yoʻq."], ["清楚", "qīngchu", "adj/v", "aniq, ravshan; aniq bilmoq", "清 tiniq (氵 suv) + 楚: suvdek tiniq.", "", "我看过你的笔记，记得非常清楚。", "Konspektingni koʻrganman, juda aniq yozilgan."], ["黑板", "hēibǎn", "n", "doska", "黑 qora + 板 taxta (木): “qora taxta”.", "", "老师写在黑板上的题都很重要。", "Ustoz doskaga yozgan masalalarning hammasi muhim."], ["把", "bǎ", "prep", "(toʻldiruvchini feʼldan oldinga chiqaradi)", "扌 qoʻl: narsani “qoʻlga olib”, keyin unga nimadir qilish. 把书还给我 — kitobni menga qaytar.", "", "我会把这些题都记在本子上。", "Bu masalalarning hammasini daftarga yozib olaman."], ["作业", "zuòyè", "n", "uy vazifasi", "作 qilmoq + 业 ish: “qilinadigan ish”. 写作业 — uy vazifasini bajarmoq.", "", "老师把作业本放到桌子上了。", "Ustoz vazifa daftarlarini stolga qoʻydi."], ["遍", "biàn", "m", "marta (boshidan oxirigacha)", "辶 yoʻl: yoʻlni boshidan oxirigacha bir yurib chiqish. Farqi: 次 — shunchaki marta, 遍 — toʻliq bir marta.", "", "笔记挺重要的，我每天都要看一遍。", "Konspekt juda muhim, har kuni bir marta koʻrib chiqaman."], ["提高", "tígāo", "v", "oshirmoq, yaxshilamoq", "提 koʻtarmoq (扌 qoʻl) + 高 baland: “balandga koʻtarmoq”.", "", "我以后也试试，希望能提高成绩。", "Men ham bundan keyin sinab koʻraman, natijamni yaxshilay olsam kerak."], ["历史", "lìshǐ", "n", "tarix", "历 oʻtgan (vaqt) + 史 tarix yozuvi.", "", "我觉得历史有点儿难。", "Menimcha, tarix biroz qiyin boʻldi."], ["难", "nán", "adj", "qiyin", "Teskarisi — 容易. 难看 — xunuk, 难过 — xafa: “qiyin koʻrinadigan”, “qiyin oʻtadigan”.", "", "外语考试难不难？", "Chet tili imtihoni qiyinmi?"], ["要求", "yāoqiú", "n/v", "talab; talab qilmoq", "要 bu yerda yāo (yào emas!) + 求 soʻramoq.", "", "数学考试我没看清楚要求。", "Matematika imtihonida talabni yaxshilab oʻqimabman."], ["差", "chà", "adj/v", "yomon, past; yetishmaslik", "差不多 (8-mavzu) dagi 差: “farq bor” — demak yetishmaydi, yomon.", "很差", "做错了好几个题，考得挺差的。", "Bir nechta masalani xato yechdim, imtihonni ancha yomon topshirdim."], ["复习", "fùxí", "v", "takrorlamoq (darsni)", "复 qayta + 习 (学习 dagi): “qayta oʻrganmoq”. Teskarisi — 预习 oldindan oʻqish.", "", "明天还有考试呢，先复习外语吧。", "Ertaga yana imtihon bor, avval chet tilini takrorlaylik."], ["外语", "wàiyǔ", "n", "chet tili", "外 tashqi (外卖 — 6-mavzu) + 语 til (汉语 dagi).", "", "外语作业里有几个问题，我可以问问你吗？", "Chet tili vazifasida bir nechta savol bor, sendan soʻrasam boʻladimi?"], ["当然", "dāngrán", "adv", "albatta", "当 munosib + 然 shunday: “shunday boʻlishi tabiiy”.", "", "当然可以。", "Albatta boʻladi."], ["遇到", "yùdào", "v", "duch kelmoq, uchratmoq", "遇 uchrashmoq (辶 yoʻl) + 到: yoʻlda uchrab qoldi.", "", "在学习上，遇到什么问题都可以问我。", "Oʻqishda qanday muammoga duch kelsang ham, mendan soʻrayver."], ["办公室", "bàngōngshì", "n", "idora, kabinet (ofis)", "办 ish bajarmoq + 公 jamoat + 室 xona: “ish xonasi”.", "", "咱们还是一起去办公室问问李老师吧。", "Yaxshisi birga kabinetga borib Li ustozdan soʻraylik."], ["页", "yè", "m", "bet, sahifa", "页 — bosh tasviri (顶, 题 dagi 页 shu). Kitob “boshi” — sahifasi.", "", "请看第十五页。", "Iltimos, oʻn beshinchi betga qarang."], ["对话", "duìhuà", "v/n", "suhbatlashmoq; dialog", "对 qarama-qarshi + 话 gap: ikki kishi bir-biriga gapiradi.", "", "书上第五页的这个对话我看不懂。", "Kitobning beshinchi betidagi bu dialogni tushunmayapman."], ["明白", "míngbai", "v/adj", "tushunmoq; aniq", "明 yorugʻ + 白 oq: hammasi yorugʻ va oq — aniq.", "", "我也明白了，谢谢您，李老师。", "Men ham tushundim, rahmat sizga, Li ustoz."], ["讲", "jiǎng", "v", "tushuntirmoq, gapirmoq", "讠 soʻz: soʻz bilan tushuntirmoq. 讲题 — masalani tushuntirmoq.", "", "李老师给学生讲题。", "Li ustoz oʻquvchilarga masalani tushuntiryapti."], ["句", "jù", "m", "(gap, jumla uchun hisob soʻz)", "句子 ning qisqasi: 一句话 — bir gap.", "", "我课上讲过这几句话，再给你们讲一遍。", "Bu gaplarni darsda tushuntirganman, yana bir marta tushuntirib beraman."], ["句子", "jùzi", "n", "gap, jumla", "句 gap + 子 qoʻshimcha.", "", "我终于懂了，这些句子一点儿也不难。", "Nihoyat tushundim, bu gaplar umuman qiyin emas ekan."], ["年级", "niánjí", "n", "sinf, kurs (oʻqish yili)", "年 yil + 级 bosqich (纟): “oʻqish yilining bosqichi”.", "", "我现在上初中二年级。", "Hozir oʻrta maktabning ikkinchi sinfida oʻqiyman."], ["后年", "hòunián", "n", "indinga yil (2 yildan keyin)", "后 keyin + 年 yil. Qatori: 前年 — 去年 — 今年 — 明年 — 后年.", "", "后年就要考高中了。", "Ikki yildan keyin litseyga imtihon topshiraman."], ["一般", "yìbān", "adj", "odatda, oddiy", "一 bir + 般 xil: “bir xil, odatdagidek”.", "", "中国的学校一般是小学六年，初中三年，高中三年。", "Xitoy maktablari odatda: boshlangʻich — olti yil, oʻrta — uch yil, yuqori — uch yil."], ["努力", "nǔlì", "adj/v", "tirishqoq; harakat qilmoq", "努 + 力 — ikkalasida ham 力 kuch bor: “bor kuch bilan”.", "", "所以我现在非常努力。", "Shuning uchun hozir juda tirishib oʻqiyapman."]], "grammar": [{"zh": "“把”字句（1）", "uz": "把 bilan joy oʻzgarishi", "f": ["ega + (不/没/modal) + 把 + toʻldiruvchi + feʼl + 在/到 + joy"], "ex": "把 gap aniq bir kishi yoki narsa ustida harakat qilinib, uning joyi oʻzgarishini bildiradi. 不/没 inkor ravishlari va modal feʼllar 把 dan OLDIN qoʻyiladi.", "eg": [["我会把这些题都记在本子上。", "Bu masalalarning hammasini daftarga yozib olaman.", "我:S|会:D|把这些题:K|都:D|记:P|在本子上:K", 0], ["老师把作业本放到桌子上了。", "Ustoz vazifa daftarlarini stolga qoʻydi.", "老师:S|把作业本:K|放:P|到桌子上了:K", 0], ["你不能把名字写在这里。", "Ismingni bu yerga yozishing mumkin emas.", "你:S|不能:D|把名字:K|写:P|在这里:K", 0], ["我把校园卡放在桌子上了。", "Talaba kartamni stolning ustiga qoʻydim.", "我:S|把校园卡:K|放:P|在桌子上了:K", 1], ["你把笔记写在本子上吧。", "Konspektni daftarga yozib qoʻy.", "你:S|把笔记:K|写:P|在本子上吧:K", 1]], "why": "把 soʻzma-soʻz “qoʻlga olmoq” (扌 qoʻl). Gap shu mantiqda tuziladi: avval narsani “qoʻlga olasan” (把+toʻldiruvchi), keyin unga ish qilasan (feʼl), oxirida u yangi joyga tushadi (在/到+joy). Oʻzbekchadagi tartibga yaqin: “Bu masalalarni daftarga yozaman”.", "mis": [["我把这些题记。", "我把这些题记在本子上。", "把 gapda feʼl yakka qolmaydi: oxiriga joy yoki natija (在本子上) qoʻshiladi."], ["我把作业没放在桌子上。", "我没把作业放在桌子上。", "没/不 va modal feʼllar 把 dan OLDIN turadi."]]}, {"zh": "固定格式“在……上/中/下”", "uz": "…da (soha) / …da, davomida / … ostida (sharoit)", "f": ["在 + ot + 上 = soha, jihat", "在 + … + 中 = muhit, vaqt", "在 + aniqlovchi + ikki boʻgʻinli feʼl + 下 = sharoit"], "ex": "在 predlogi va 上, 中, 下 joy soʻzlaridan tuzilgan qolip soha, vaqt, sharoitni bildiradi. 在+ot+上 — soha, jihat; 在……中 — harakat boʻlayotgan yoki holat mavjud muhit, vaqt; 在+aniqlovchili ikki boʻgʻinli feʼl+下 — sharoit.", "eg": [["在学习上，遇到什么问题都可以问我。", "Oʻqishda qanday muammoga duch kelsang ham, mendan soʻrayver.", "在学习上，:K|遇到:P|什么问题:O|都:D|可以问我:P", 0], ["在工作上，他总是能给我很多帮助。", "Ishda u menga doim koʻp yordam beradi.", "在工作上，:K|他:S|总是:D|能:D|给:P|我很多帮助:O", 0], ["在比赛中，他得分最高。", "Oʻyinda eng koʻp ochkoni u oldi.", "在比赛中，:K|他得分:S|最高:P", 0], ["在假期中，我认识了几个新朋友。", "Taʼtil davomida bir nechta yangi doʻst orttirdim.", "在假期中，:K|我:S|认识了:P|几个新朋友:O", 0], ["在她的影响下，我开始喜欢拍照。", "Uning taʼsirida suratga olishni yaxshi koʻra boshladim.", "在她的影响下，:K|我:S|开始:D|喜欢拍照:P", 0], ["在老师的帮助下，我的成绩提高很快。", "Ustozning yordami bilan natijalarim tez yaxshilandi.", "在老师的帮助下，:K|我的成绩:S|提高:P|很快:C", 0], ["在考试中，我做错了好几个题。", "Imtihonda bir nechta masalani xato yechdim.", "在考试中，:K|我:S|做错了:P|好几个题:O", 1], ["在大家的帮助下，我的汉语提高很快。", "Hammaning yordami bilan xitoy tilim tez yaxshilandi.", "在大家的帮助下，:K|我的汉语:S|提高:P|很快:C", 1]], "why": "Oʻzbekchada ham shunday: “oʻqishda” (在学习上 — soha), “oʻyin davomida” (在比赛中 — vaqt, muhit), “ustoz yordamida” (在老师的帮助下 — sharoit). 下 “ostida” maʼnosidan sharoit chiqadi: biror narsaning taʼsiri OSTIDA.", "mis": [["在老师的帮助，我的成绩提高很快。", "在老师的帮助下，我的成绩提高很快。", "在……下 qolipida 下 tushib qolmasin."], ["在学习，遇到问题可以问我。", "在学习上，遇到问题可以问我。", "Soha maʼnosida 在 dan keyin 上 kerak: 在学习上."]]}, {"zh": "“把”字句（2）", "uz": "把 … 给 … (narsani birovga oʻtkazish)", "f": ["ega + 把 + toʻldiruvchi₁ (narsa) + feʼl + 给 + toʻldiruvchi₂ (kishi)"], "ex": "Bu 把 gap harakat orqali aniq bir narsa bir kishidan boshqasiga oʻtishini bildiradi.", "eg": [["你明天再把书还给我。", "Kitobni ertaga menga qaytarib berasan.", "你:S|明天:D|再:D|把书:K|还:P|给我:K", 0], ["我把礼物送给她了。", "Sovgʻani unga berdim.", "我:S|把礼物:K|送:P|给她了:K", 0], ["请你把这本书带给老师。", "Iltimos, bu kitobni ustozga olib borib ber.", "请:N|你:S|把这本书:K|带:P|给老师:K", 0], ["我把笔记借给同学了。", "Konspektimni sinfdoshimga qarzga berdim.", "我:S|把笔记:K|借:P|给同学了:K", 1], ["请你把作业带给老师。", "Iltimos, uy vazifasini ustozga olib borib ber.", "请:N|你:S|把作业:K|带:P|给老师:K", 1]], "why": "Bu 把 gapda narsa bir kishidan boshqasiga oʻtadi: 把书 — qaysi kitob (aniq), 还给我 — kimga oʻtdi. 给 feʼldan keyin keladi va narsa kimga “yetib borgan”ini koʻrsatadi.", "mis": [["你明天把书还我给。", "你明天把书还给我。", "给 feʼldan keyin, oluvchidan oldin turadi: 还给我."], ["我把一本书送给她了。", "我把那本书送给她了。", "把 dan keyingi narsa aniq boʻlishi kerak: 一本书 emas, 那本书 / 这本书."]]}], "texts": [{"k": 1, "scene": "在教室里，刘小雪跟同学聊学习方法。", "sceneuz": "Sinfda Lyu Syaosyue sinfdoshi bilan oʻqish usullari haqida gaplashyapti.", "lines": [["同学", "你的数学越来越好，能不能介绍一下学习方法？", "Matematikang tobora yaxshilanyapti, oʻqish usulingni aytib bera olasanmi?"], ["刘小雪", "没有什么特别的方法，认真听课，认真记笔记。", "Hech qanday maxsus usul yoʻq, darsni diqqat bilan tinglayman, konspektni astoydil yozaman."], ["同学", "我看过你的笔记，记得非常清楚。", "Konspektingni koʻrganman, juda aniq yozilgan."], ["刘小雪", "老师写在黑板上的题都很重要，所以我会把这些题都记在本子上。", "Ustoz doskaga yozgan masalalar hammasi muhim, shuning uchun ularning hammasini daftarga yozib olaman."], ["同学", "你说得对。我没有记笔记的习惯。", "Toʻgʻri aytasan. Menda konspekt yozish odati yoʻq."], ["刘小雪", "笔记挺重要的，我每天写作业以前，都要看一遍。", "Konspekt juda muhim, har kuni uy vazifasini qilishdan oldin bir marta koʻrib chiqaman."], ["同学", "这个方法真好！我以后也试试，希望能提高成绩。", "Bu usul juda zoʻr! Men ham bundan keyin sinab koʻraman, baholarim yaxshilansa kerak."]]}, {"k": 2, "scene": "在教室里，刘小雪跟同学聊昨天的考试。", "sceneuz": "Sinfda Lyu Syaosyue sinfdoshi bilan kechagi imtihon haqida gaplashyapti.", "lines": [["同学", "小雪，昨天的考试，你考得怎么样？", "Syaosyue, kechagi imtihondan qanday oʻtding?"], ["刘小雪", "我觉得历史有点儿难，你呢？", "Menimcha tarix biroz qiyin boʻldi, senchi?"], ["同学", "数学考试我没看清楚要求，做错了好几个题，考得挺差的。", "Matematika imtihonida shartni yaxshi oʻqimabman, bir nechta masalani xato yechdim, juda yomon topshirdim."], ["刘小雪", "明天还有考试呢，别想那么多了，先复习外语吧。", "Ertaga yana imtihon bor, koʻp oʻylama, avval chet tilini takrorlaylik."], ["同学", "外语作业里有几个问题，我可以问问你吗？", "Chet tili vazifasida bir nechta savol bor, sendan soʻrasam boʻladimi?"], ["刘小雪", "当然可以。在学习上，遇到什么问题都可以问我。", "Albatta. Oʻqishda qanday savol chiqsa ham, mendan soʻrayver."], ["刘小雪", "不好意思，这几个题我也不会。咱们还是一起去办公室问问李老师吧。", "Kechirasan, bu masalalarni men ham bilmayman. Yaxshisi birga xonaga borib Li ustozdan soʻraylik."]]}, {"k": 3, "scene": "在李老师办公室，刘小雪跟同学问问题。", "sceneuz": "Li ustozning xonasida Lyu Syaosyue va sinfdoshi savol soʻrayapti.", "lines": [["同学", "李老师，书上有几个问题，我们想问问您。", "Li ustoz, kitobda bir nechta savol bor, sizdan soʻramoqchi edik."], ["李老师", "好，坐下说吧，哪个题不会？", "Xoʻp, oʻtirib gapiringlar, qaysi masalani bilmayapsizlar?"], ["同学", "书上第五页的这个对话我看不懂，小雪也不明白。", "Kitobning beshinchi betidagi bu dialogni tushunmayapman, Syaosyue ham tushunmadi."], ["李老师", "我课上讲过这几句话，再给你们讲一遍。", "Bu gaplarni darsda tushuntirganman, yana bir marta tushuntirib beraman."], ["同学", "我终于懂了。这些句子一点儿也不难。", "Nihoyat tushundim. Bu gaplar umuman qiyin emas ekan."], ["刘小雪", "我也明白了，谢谢您，李老师。", "Men ham tushundim, rahmat sizga, Li ustoz."], ["李老师", "我这本书上还有几个练习，你们回家也做一做，明天再把书还给我。", "Bu kitobimda yana bir nechta mashq bor, uyga borib ularni ham bajaringlar, kitobni ertaga qaytarib berasizlar."]]}, {"k": 4, "scene": "在家里，刘小雪在写邮件。", "sceneuz": "Uyda Lyu Syaosyue elektron xat yozyapti.", "lines": [["", "家月姐姐：你最近怎么样？忙不忙？", "Jiayue opa, oxirgi paytda qalaysiz? Bandmisiz?"], ["", "我现在上初中二年级，学习越来越忙，后年就要考高中了。", "Men hozir oʻrta maktabning ikkinchi sinfida oʻqiyman, oʻqish tobora qizgʻinlashyapti, kelasi yildan keyin litseyga imtihon topshiraman."], ["", "中国的学校一般是小学六年，初中三年，高中三年。", "Xitoy maktablarida odatda boshlangʻich maktab olti yil, oʻrta maktab uch yil, yuqori sinflar uch yil."], ["", "妈妈说想考上好大学，就得上一个好高中；为了考上好高中，初中就得有一个不错的成绩，所以我现在非常努力。", "Onamning aytishicha, yaxshi universitetga kirish uchun yaxshi litseyda oʻqish kerak; yaxshi litseyga kirish uchun esa oʻrta maktabda yaxshi baholar kerak, shuning uchun hozir juda tirishyapman."], ["", "家月姐姐，你知道吗？在你的影响下，我也开始喜欢拍照了。", "Jiayue opa, bilasizmi? Sizning taʼsiringizda men ham suratga olishni yoqtirib qoldim."], ["", "下次你再来北京，我给你看看我照的照片。", "Keyingi safar Pekinga kelsangiz, olgan suratlarimni koʻrsataman."]]}]}, {"n": 11, "zh": "看来我没办法解决这个问题", "py": "Kànlái wǒ méi bànfǎ jiějué zhège wèntí", "uz": "Koʻrinishidan, bu muammoni hal qila olmayman", "words": [["会议", "huìyì", "n", "majlis, yigʻilish", "会 yigʻilish + 议 muhokama (讠 soʻz): “yigʻilib muhokama qilish”. 会议室 — majlislar zali.", "", "会议下午几点开始？", "Majlis tushdan keyin soat nechada boshlanadi?"], ["经理", "jīnglǐ", "n", "menejer, rahbar", "经 boshqarmoq + 理 tartibga solmoq: “ishni boshqaradigan odam”.", "", "今天下午经理不在，不开会了。", "Bugun tushdan keyin menejer yoʻq, majlis boʻlmaydi."], ["开会", "kāihuì", "v", "majlis qilmoq", "开 ochmoq + 会 yigʻilish. Ajraladigan soʻz: 开了一个会.", "", "那什么时候开会？", "Unda majlis qachon boʻladi?"], ["后天", "hòutiān", "n", "indinga", "后 keyin + 天 kun. Qatori: 前天 — 昨天 — 今天 — 明天 — 后天. 后年 — 10-mavzu.", "", "我们今天去、明天去还是后天去？", "Bugun boramizmi, ertagami yoki indinga?"], ["地点", "dìdiǎn", "n", "joy (biror ish oʻtadigan)", "地 yer + 点 nuqta: xaritadagi “nuqta”.", "", "你知道开会的地点吗？", "Majlis qayerda boʻlishini bilasanmi?"], ["室", "shì", "n", "xona", "宀 tom: tom ostidagi joy. 办公室 (10-mavzu), 会议室, 教室.", "", "会议地点换到第一会议室。", "Majlis joyi birinchi majlislar zaliga koʻchirildi."], ["发", "fā", "v", "yubormoq (xat, xabar)", "发烧 (8-mavzu) dagi 发 — chiqarmoq: xatni oʻzingdan “chiqarib” yuborasan. 发邮件 — email yubormoq.", "发邮件", "我正要给大家发邮件。", "Hozir hammaga email yubormoqchi edim."], ["笔记本电脑", "bǐjìběn diànnǎo", "n", "noutbuk", "笔记本 — konspekt daftari (笔记 — 10-mavzu): daftardek ochiladigan kompyuter. Qisqasi — 笔记本.", "", "开会的时候，我们用会议室的电脑还是自己的笔记本电脑？", "Majlisda majlis zalining kompyuteridan foydalanamizmi yoki oʻz noutbukimizdanmi?"], ["或者", "huòzhě", "conj", "yoki (darak gapda)", "Farqi: 还是 — soʻroq gapda (“qaysi biri?”), 或者 — darak gapda (“bu ham, u ham boʻladi”).", "", "你可以坐地铁或者打车去学校。", "Maktabga metroda yoki taksida borishing mumkin."], ["声音", "shēngyīn", "n", "ovoz, tovush", "声 tovush + 音 ovoz (音乐 dagi 音): ikkalasi ham “tovush”.", "", "看见了，但是听不见声音。", "Koʻrinyapti, lekin ovoz eshitilmayapti."], ["看来", "kànlái", "v", "koʻrinishidan, shekilli", "看 koʻrmoq + 来: “koʻrinib turibdiki…”. 看起来 (1-mavzu) ga yaqin.", "", "看来我没办法解决这个问题。", "Koʻrinishidan, bu muammoni hal qila olmayman."], ["办法", "bànfǎ", "n", "chora, yoʻl", "办 qilmoq + 法 usul: “qilish yoʻli”. Farqi: 方法 (8-mavzu) — usul (oʻqish usuli), 办法 — muammodan chiqish yoʻli. 没办法 — iloji yoʻq.", "", "我也没有办法。", "Mening ham ilojim yoʻq."], ["解决", "jiějué", "v", "hal qilmoq", "解 = 角 shox + 刀 pichoq + 牛 hoʻkiz: hoʻkizni pichoq bilan boʻlaklarga “yechmoq”. 决 qaror qilmoq.", "", "他很快就解决了电脑的问题。", "U kompyuterdagi muammoni tezda hal qildi."], ["只能", "zhǐ néng", "phr", "faqat …ga majbur, …dan boshqa iloj yoʻq", "只 faqat + 能 qila olmoq: “faqat shuni qila olaman”.", "", "只能找别人来帮帮忙了。", "Boshqa birovni yordamga chaqirishdan oʻzga chora yoʻq."], ["别人", "biérén", "pron", "boshqalar, boshqa odam", "别 boshqa (别的 — 4-mavzu) + 人 odam.", "", "这件事你别告诉别人。", "Bu ishni boshqalarga aytma."], ["请假", "qǐngjià", "v", "javob soʻramoq (ishdan, darsdan)", "请 soʻramoq + 假 dam (假期 dagi 假): “dam soʻramoq”. Ajraladigan: 请了两天假.", "", "他说家里有点儿事，所以请假了。", "Uyida biroz ishi borligini aytib, javob soʻradi."], ["同事", "tóngshì", "n", "hamkasb", "同 bir xil (同学 dagi) + 事 ish: “bir ishdagi odam”. 同学 — sinfdosh, 同事 — hamkasb.", "", "好几个同事都休假了。", "Bir nechta hamkasb taʼtilga chiqqan."], ["休假", "xiūjià", "v", "taʼtilga chiqmoq", "休 = 亻 odam + 木 daraxt: odam daraxt tagida dam olyapti. 假 — dam.", "", "我们公司夏天可以休假两个星期。", "Kompaniyamizda yozda ikki hafta taʼtilga chiqish mumkin."], ["怕", "pà", "v", "qoʻrqmoq; …dan xavotir olmoq", "忄 yurak + 白 oq: qoʻrquvdan yurak “oqarib ketdi”. 我怕… — …mi deb qoʻrqaman.", "", "开会前这么多工作我怕干不完。", "Majlisgacha shuncha ishni tugatolmaymanmi deb qoʻrqaman."], ["邮箱", "yóuxiāng", "n", "pochta qutisi; email manzil", "邮 pochta (邮件 dagi) + 箱 quti (⺮).", "", "明天开会前要发到公司的邮箱里。", "Ertaga majlisdan oldin kompaniyaning pochtasiga yuborish kerak."], ["愿意", "yuànyì", "mod", "rozi boʻlmoq, xohlamoq", "愿 tilak (心 yurak) + 意 fikr: yurakdan xohlash.", "", "他们问我愿意不愿意也去上海。", "Ular mendan Shanxayga borishga rozimisan deb soʻrashdi."], ["城市", "chéngshì", "n", "shahar", "城 qalʼa devori (土 tuproq) + 市 bozor: devor va bozor — shahar.", "", "我去别的城市工作就要离开他们。", "Boshqa shaharga ishga borsam, ulardan ajralishim kerak boʻladi."], ["离开", "líkāi", "v", "tark etmoq, ketmoq", "离 uzoq (离…远 dagi) + 开 ochilmoq: “uzoqlashib ketmoq”.", "", "我不愿意离开家人。", "Oilamdan ajralishni xohlamayman."], ["机会", "jīhuì", "n", "imkoniyat", "机 mashina, payt + 会: “qulay payt”.", "", "去上海可能会有更好的机会。", "Shanxayga borsam, yaxshiroq imkoniyat boʻlishi mumkin."], ["生活", "shēnghuó", "n/v", "hayot; yashamoq", "生 tugʻilmoq + 活 tirik (氵 suv — hayot manbai).", "", "对我来说，生活也很重要。", "Men uchun hayot ham muhim."], ["为", "wèi", "prep", "…uchun", "为了 (9-mavzu) ning qisqasi. 为 ikki xil oʻqiladi: wèi (uchun) va wéi (boʻlmoq).", "为你", "我不愿意为工作离开家人。", "Ish uchun oilamni tashlab ketishni xohlamayman."], ["或", "huò", "conj", "yoki", "或者 ning qisqasi, koʻproq yozma tilda.", "", "我不愿意为工作或学习离开家人。", "Ish yoki oʻqish uchun oilamni tashlab ketishni xohlamayman."], ["老张", "Lǎo Zhāng", "prop", "Lao Chjan (murojaat)", "老 + familiya: yaqin tanish, kattaroq odamga hurmatli-samimiy murojaat.", "", "老张没来。", "Lao Chjan kelmadi."]], "grammar": [{"zh": "“还是”和“或者”", "uz": "还是 va 或者 — ikkalasi ham “yoki”", "f": ["A 还是 B？ — soʻroq, tanlov", "A 或者 B — darak gap"], "ex": "还是 odatda soʻroq gapda ishlatiladi: ikki yoki bir nechta variant aytilib, suhbatdoshdan bittasini tanlash soʻraladi. 或者 asosan darak gapda ishlatiladi, soʻroq gapda ishlatilmaydi.", "eg": [["我们用会议室的电脑还是自己的笔记本电脑？", "Majlis zalining kompyuteridan foydalanamizmi yoki oʻz noutbukimizdanmi?", "我们:S|用:P|会议室的电脑:O|还是:K|自己的笔记本电脑:O", 0], ["我们今天去、明天去还是后天去？", "Bugun boramizmi, ertagami yoki indinga?", "我们:S|今天去、:P|明天去:P|还是:K|后天去:P", 0], ["会议室的电脑或者自己的电脑都可以。", "Majlis zalining kompyuteri ham, oʻz kompyuteringiz ham boʻlaveradi.", "会议室的电脑:S|或者:K|自己的电脑:S|都:D|可以:P", 0], ["你可以坐地铁或者打车去学校。", "Maktabga metroda yoki taksida borishing mumkin.", "你:S|可以:D|坐地铁:D|或者:K|打车:D|去学校:P", 0], ["你想今天开会还是后天开会？", "Majlisni bugun qilmoqchimisan yoki indinga?", "你:S|想:D|今天:D|开会:P|还是:K|后天:D|开会:P", 1], ["你可以给我打电话或者发邮件。", "Menga qoʻngʻiroq qilishing yoki email yuborishing mumkin.", "你:S|可以:D|给我:D|打电话:P|或者:K|发邮件:P", 1]], "why": "Oʻzbekchada ikkalasi ham “yoki”. Farq — gap turida: 还是 soʻraydi (“qaysi birini tanlaysan?”), shuning uchun gap oxiriga 吗 qoʻyilmaydi; 或者 esa variantlarni shunchaki sanaydi: “bu ham, u ham boʻlaveradi”.", "mis": [["你喝茶或者喝咖啡？", "你喝茶还是喝咖啡？", "Tanlov soʻralsa — 还是."], ["你喝茶还是咖啡吗？", "你喝茶还是咖啡？", "还是 li gapning oʻzi soʻroq: oxiriga 吗 qoʻshilmaydi."]]}, {"zh": "固定短语“看来”", "uz": "Koʻrinishidan…, …shekilli", "f": ["(koʻrilgan holat，) 看来 + xulosa"], "ex": "看来 dan keyin xulosa keladi: soʻzlovchi kuzatib, oʻylab koʻrgach, hozirgi vaziyatni tahlil qiladi yoki taxmin qiladi.", "eg": [["看来我没办法解决这个问题。", "Koʻrinishidan, bu muammoni hal qila olmayman.", "看来:K|我:S|没办法:D|解决:P|这个问题:O", 0], ["这么晚了，看来他今天不会来了。", "Shuncha kech boʻldi, u bugun kelmasa kerak.", "这么晚了，:N|看来:K|他:S|今天:D|不会:D|来了:P", 0], ["电梯坏了，看来咱们只能走下去了。", "Lift buzilibdi, piyoda tushishdan boshqa ilojimiz yoʻq shekilli.", "电梯坏了，:N|看来:K|咱们:S|只能:D|走下去了:P", 0], ["他一直没接电话，看来他很忙。", "U hech telefonni koʻtarmayapti, koʻrinishidan, juda band.", "他:S|一直:D|没接电话，:P|看来:K|他:S|很忙:P", 1], ["这么多工作，看来我今天干不完了。", "Shuncha ish bor, bugun tugatolmasam kerak.", "这么多工作，:O|看来:K|我:S|今天:D|干:P|不完了:C", 1]], "why": "看来 = 看 koʻrmoq + 来: “koʻrinib turibdiki”. Oʻzbekchadagi “koʻrinishidan…, …shekilli” kabi. Avval koʻrgan narsang (这么晚了), keyin xulosa (看来…).", "mis": [["这么晚了，看来他今天来不了吗？", "这么晚了，看来他今天来不了了。", "看来 dan keyin xulosa — darak gap keladi, soʻroq emas."]]}, {"zh": "“把”字句（3）", "uz": "把 + natija toʻldiruvchisi", "f": ["ega + 把 + toʻldiruvchi + feʼl + natija toʻldiruvchisi"], "ex": "Bu 把 gap harakat aniq bir kishi yoki narsada qandaydir natija hosil qilganini bildiradi.", "eg": [["我跟您一起把这些工作做完。", "Siz bilan birga bu ishlarni qilib tugataman.", "我:S|跟您:D|一起:D|把这些工作:K|做:P|完:K", 0], ["妈妈把衣服洗干净了。", "Onam kiyimlarni yuvib, top-toza qildi.", "妈妈:S|把衣服:K|洗:P|干净了:K", 0], ["他还没把笔记本电脑接好呢。", "U hali noutbukni ulab boʻlmadi.", "他:S|还:D|没:D|把笔记本电脑:K|接:P|好呢:K", 0], ["我已经把邮件发完了。", "Emaillarni yuborib boʻldim.", "我:S|已经:D|把邮件:K|发:P|完了:K", 1], ["请你把这个问题解决好。", "Iltimos, bu muammoni hal qilib qoʻy.", "请:N|你:S|把这个问题:K|解决:P|好:K", 1]], "why": "Bu 把 gapda harakat aniq narsaga NATIJA beradi: 洗干净 — yuvib toza qildi, 做完 — qilib tugatdi. Oʻzbekchada ham natija feʼlga qoʻshiladi: “kiyimlarni yuvib tozaladi”.", "mis": [["妈妈把衣服洗。", "妈妈把衣服洗干净了。", "把 gapda feʼl yakka qolmaydi: natija (干净, 完, 好) qoʻshiladi."], ["他把电脑没接好。", "他没把电脑接好。", "没 把 dan OLDIN keladi."]]}, {"zh": "固定格式“对……来说”", "uz": "… uchun (kimning nuqtai nazaridan)", "f": ["对 + kishi + 来说，fikr / holat"], "ex": "对……来说 qolipi fikr, his yoki holat kimga tegishli ekanini koʻrsatadi.", "eg": [["对我来说，生活也很重要，我不愿意为工作或学习离开家人。", "Men uchun hayot ham muhim, ish yoki oʻqish uchun oilamni tashlab ketishni xohlamayman.", "对我来说，:K|生活:S|也:D|很重要，:P|我:S|不愿意:D|为工作或学习:D|离开:P|家人:O", 0], ["对她来说，学习汉语很有意思。", "U uchun xitoy tilini oʻrganish juda qiziq.", "对她来说，:K|学习汉语:S|很有意思:P", 0], ["对孩子来说，玩也是一种学习。", "Bola uchun oʻyin ham oʻqishning bir turi.", "对孩子来说，:K|玩:S|也:D|是:P|一种学习:O", 0], ["对我来说，这是一个很好的机会。", "Men uchun bu juda yaxshi imkoniyat.", "对我来说，:K|这:S|是:P|一个很好的机会:O", 1], ["对经理来说，这个会议非常重要。", "Menejer uchun bu majlis juda muhim.", "对经理来说，:K|这个会议:S|非常重要:P", 1]], "why": "Oʻzbekchadagi “… uchun” (“men uchun hayot ham muhim”) aynan shu. 对 kimga qaratilgan + 来说 “aytadigan boʻlsak”: gap kimning nuqtai nazaridan ekanini koʻrsatadi.", "mis": [["对我说，生活也很重要。", "对我来说，生活也很重要。", "对我说 — “menga dedi”; “men uchun” maʼnosida 来 kerak: 对我来说."]]}], "texts": [{"k": 1, "scene": "在办公室里，王一雪跟杨同乐在讨论工作。", "sceneuz": "Ofisda Van Isyue va Yan Tunle ish haqida gaplashyapti.", "lines": [["王一雪", "会议下午几点开始？", "Majlis tushdan keyin soat nechada boshlanadi?"], ["杨同乐", "今天下午经理不在，不开会了。", "Bugun tushdan keyin menejer yoʻq, majlis boʻlmaydi."], ["王一雪", "那什么时候开会？", "Unda majlis qachon boʻladi?"], ["杨同乐", "后天上午十点，会议地点换到第一会议室。我正要给大家发邮件。", "Indinga ertalab soat oʻnda, majlis joyi birinchi majlislar zaliga oʻzgardi. Hozir hammaga xat joʻnatmoqchi edim."], ["王一雪", "开会的时候，我们用会议室的电脑还是自己的笔记本电脑？", "Majlisda zaldagi kompyuterdan foydalanamizmi yoki oʻzimizning noutbukdanmi?"], ["杨同乐", "会议室的电脑或者自己的电脑都可以。", "Zaldagi kompyuter ham, oʻzingizniki ham boʻlaveradi."], ["王一雪", "那到时候咱们早点儿过去，你帮我把电脑接好吧。", "Unda oʻshanda ertaroq boraylik, kompyuterni ulab berasan-a."]]}, {"k": 2, "scene": "在会议室，王一雪跟杨同乐在做会前准备。", "sceneuz": "Majlislar zalida Van Isyue va Yan Tunle majlisga tayyorgarlik koʻryapti.", "lines": [["王一雪", "电脑接好了吗？", "Kompyuter ulandimi?"], ["杨同乐", "已经接好了，您开机看看有没有问题。", "Ulab boʻldim, yoqib koʻring-chi, muammo bormi."], ["王一雪", "现在什么都看不见。", "Hozir hech narsa koʻrinmayapti."], ["杨同乐", "我检查一下哪里出问题了……您再试一下。", "Qayerda muammo borligini tekshirib koʻray... Yana bir urinib koʻring."], ["王一雪", "看见了，但是听不见声音。", "Koʻrindi, lekin ovoz eshitilmayapti."], ["杨同乐", "现在呢？", "Hozir-chi?"], ["王一雪", "听得见声音，但是声音有点儿小，听不清楚。", "Ovoz eshitiladi, lekin biroz past, aniq eshitilmayapti."], ["杨同乐", "看来我没办法解决这个问题，只能找别人来帮帮忙了。", "Koʻrinib turibdiki, bu muammoni hal qila olmayman, boshqa birovni yordamga chaqirishdan boshqa iloj yoʻq."]]}, {"k": 3, "scene": "在办公室里，王一雪跟杨同乐在聊天儿。", "sceneuz": "Ofisda Van Isyue va Yan Tunle suhbatlashyapti.", "lines": [["王一雪", "同乐，你看见老张了吗？", "Tunle, Lao Chjanni koʻrdingmi?"], ["杨同乐", "老张没来。他说家里有点儿事，所以请假了。", "Lao Chjan kelmadi. Uyida biroz ishi borligini aytib, ruxsat soʻradi."], ["王一雪", "好几个同事都休假了，开会前这么多工作我怕干不完。", "Bir nechta hamkasb taʼtilda, majlisgacha shuncha ishni tugata olmayman deb qoʻrqaman."], ["杨同乐", "十二点多了，咱们先去吃饭吧。吃完饭，我跟您一起把这些工作做完。", "Soat oʻn ikkidan oʻtdi, avval ovqatlanib kelaylik. Ovqatdan keyin siz bilan birga bu ishlarni tugatamiz."], ["王一雪", "你先去吃，我想再干一会儿。明天开会前要发到公司的邮箱里。", "Sen borib ovqatlanaver, men yana biroz ishlay. Ertaga majlisgacha kompaniya pochtasiga joʻnatish kerak."], ["杨同乐", "您没看到邮件吗？经理还没回来呢，下周才能开会。", "Xatni koʻrmadingizmi? Menejer hali qaytmadi, majlis faqat kelasi haftada boʻladi."], ["王一雪", "那不着急了。走，吃饭去。", "Unda shoshilmasa ham boʻladi. Qani, ovqatlangani ketdik."]]}, {"k": 4, "scene": "在家里，王一雪在写日记。", "sceneuz": "Uyda Van Isyue kundalik yozyapti.", "lines": [["", "前几天，上海的同事来北京了。", "Bir necha kun oldin Shanxaydagi hamkasblar Pekinga kelishdi."], ["", "一起吃饭时，他们跟我说最近有不少同事去上海工作了，问我愿意不愿意也去上海。", "Birga ovqatlanayotganda, ular menga oxirgi paytda koʻp hamkasblar Shanxayga ishlashga ketganini aytib, men ham Shanxayga borishni xohlaysizmi, deb soʻrashdi."], ["", "我是这样想的：现在丈夫和孩子都在北京，刘明的工作很忙，小雪和小明也还小，我去别的城市工作就要离开他们。", "Men shunday oʻyladim: hozir erim ham, bolalarim ham Pekinda, Lyu Minning ishi juda koʻp, Syaosyue bilan Syaomin hali kichik, boshqa shaharga ishlagani borsam, ulardan ajralishim kerak boʻladi."], ["", "虽然去上海可能会有更好的机会，但是对我来说，生活也很重要，我不愿意为工作或学习离开家人。", "Garchi Shanxayda yaxshiroq imkoniyatlar boʻlishi mumkin boʻlsa ham, men uchun hayot ham juda muhim, ish yoki oʻqish uchun oilamdan ajralishni xohlamayman."]]}]}, {"n": 12, "zh": "这个季节天气变化很快", "py": "Zhège jìjié tiānqì biànhuà hěn kuài", "uz": "Bu faslda havo tez oʻzgaradi", "words": [["街", "jiē", "n", "koʻcha", "行 yoʻl ichida 圭: kesishgan yoʻllar — koʻcha.", "", "王老师，您看，这条街上的树都开花了。", "Van ustoz, qarang, bu koʻchadagi daraxtlarning hammasi gullabdi."], ["开花", "kāihuā", "v", "gullamoq", "开 ochilmoq + 花 gul: “gul ochildi”.", "", "春天到了，树都开花了。", "Bahor keldi, daraxtlarning hammasi gulladi."], ["公园", "gōngyuán", "n", "bogʻ, park", "公 jamoat + 园 bogʻ (校园 — 9-mavzu): “hammaning bogʻi”.", "", "上周我去公园坐船了。", "Oʻtgan hafta bogʻga borib qayiqda suzdim."], ["船", "chuán", "n", "qayiq, kema", "舟 qayiq radikali. 坐船 — qayiqda suzmoq.", "", "下午我也想去公园坐船。", "Tushdan keyin men ham bogʻga borib qayiqda suzmoqchiman."], ["工作日", "gōngzuòrì", "n", "ish kuni", "工作 ish + 日 kun. Teskarisi — 周末 dam olish kunlari.", "", "今天是工作日，人应该不多。", "Bugun ish kuni, odam koʻp boʻlmasa kerak."], ["地方", "dìfang", "n", "joy", "地 yer + 方 tomon. Farqi: 地点 (11-mavzu) — aniq bir ish boʻladigan joy, 地方 — umuman joy.", "", "我今天下午有课，不能去太远的地方。", "Bugun tushdan keyin darsim bor, juda uzoq joyga bora olmayman."], ["刚才", "gāngcái", "n", "hozirgina", "刚 endigina + 才: “endigina boʻldi”.", "", "刚才还是大晴天呢。", "Hozirgina havo ochiq edi-ku."], ["刮", "guā", "v", "(shamol) esmoq", "刂 pichoq: shamol yuzni pichoqdek qirib oʻtadi. 刮风 — shamol esmoq.", "", "怎么突然就刮起风来了？", "Nega birdan shamol turib qoldi?"], ["风", "fēng", "n", "shamol", "几 ichida 㐅: yelkan ichida aylanayotgan havo.", "", "冬天不但冷，而且风很大。", "Qish nafaqat sovuq, balki shamoli ham kuchli."], ["新闻", "xīnwén", "n", "yangiliklar", "新 yangi + 闻 eshitmoq (门 eshik + 耳 quloq: eshik ortidan eshitilgan gap).", "", "好像新闻里说今天有雨。", "Yangiliklarda bugun yomgʻir boʻlishini aytishgandek boʻldi."], ["伞", "sǎn", "n", "soyabon", "Ierogifning oʻzi ochilgan soyabon shaklida. 雨伞 — yomgʻir soyabon.", "", "我每天书包里都放着雨伞，就今天没带。", "Har kuni sumkamda soyabon boʻladi, faqat bugun olmabman."], ["借", "jiè", "v", "qarz bermoq; qarz olmoq", "亻 odam + 昔: odamdan vaqtincha olinadigan narsa. 借给你 — senga qarzga beraman.", "", "我可以借给你。", "Senga berib turaman."], ["把", "bǎ", "m", "(dastali narsalar uchun hisob soʻz)", "把 ning yangi maʼnosi (10-mavzuda — predlog): qoʻl bilan ushlanadigan narsa. 一把伞, 一把椅子.", "一把伞", "我车里有一把伞和一件雨衣。", "Mashinamda bitta soyabon va bitta yomgʻirpoʻsh bor."], ["雨衣", "yǔyī", "n", "yomgʻirpoʻsh", "雨 yomgʻir + 衣 kiyim: “yomgʻir kiyimi”.", "", "下雨了，你穿上雨衣吧。", "Yomgʻir yogʻyapti, yomgʻirpoʻshingni kiyib ol."], ["变", "biàn", "v", "oʻzgarmoq", "变好 — yaxshilanmoq, 变冷 — sovib ketmoq.", "", "希望下午天气能变好。", "Tushdan keyin havo yaxshilansa kerak."], ["季节", "jìjié", "n", "fasl", "季 (禾 ekin) + 节 boʻgʻim: yilning “boʻgʻimi”, ekin pishadigan payt.", "", "每个人都有自己最喜欢的季节。", "Har kimning oʻzi yaxshi koʻradigan fasli bor."], ["变化", "biànhuà", "v/n", "oʻzgarmoq; oʻzgarish", "变 oʻzgarmoq + 化 aylanmoq: boshqa narsaga aylanib qolmoq.", "", "这个季节天气变化很快。", "Bu faslda havo tez oʻzgaradi."], ["冬天", "dōngtiān", "n", "qish", "冬 + 天 (fasl). Qatori: 春天, 夏天, 秋天, 冬天.", "", "我觉得冬天太冷了。", "Menimcha, qish juda sovuq."], ["常常", "chángcháng", "adv", "tez-tez", "常 (8-mavzu) ni takrorlab: “tez-tez, koʻpincha”.", "", "北京常常下雪，但听说今年就下了一次。", "Pekinda tez-tez qor yogʻadi, lekin bu yil bor-yoʻgʻi bir marta yogʻibdi."], ["关注", "guānzhù", "v", "kuzatib bormoq, eʼtibor bermoq", "关 (关心 — 8-mavzu) + 注 (注意 — 8-mavzu): qiziqib, eʼtibor bilan kuzatmoq.", "", "我没关注过北京的天气。", "Pekin ob-havosini kuzatib bormaganman."], ["四季", "sìjì", "n", "toʻrt fasl", "四 toʻrt + 季 fasl.", "", "我还是更喜欢北京的四季。", "Baribir Pekinning toʻrt faslini koʻproq yoqtiraman."], ["春天", "chūntiān", "n", "bahor", "春 — quyosh 日 ostida oʻsayotgan koʻchatlar.", "", "北京的春天最舒服。", "Pekinning bahori eng yoqimli."], ["夏天", "xiàtiān", "n", "yoz", "夏 + 天 fasl.", "", "夏天白天很热，但是晚上比较凉快。", "Yozda kunduzi juda issiq, lekin kechqurun ancha salqin."], ["凉快", "liángkuai", "adj", "salqin", "凉 sovuq (冫 muz) + 快 yoqimli: yoqimli salqinlik.", "", "晚上比较凉快。", "Kechqurun ancha salqin."], ["秋天", "qiūtiān", "n", "kuz", "秋 = 禾 ekin + 火 olov: hosil yigʻilib, somon yoqiladigan payt.", "", "北京的秋天非常漂亮。", "Pekinning kuzi juda chiroyli."], ["叶子", "yèzi", "n", "barg", "叶 = 口 + 十: shoxchada oʻsgan barg.", "", "树上的叶子都黄了。", "Daraxtdagi barglarning hammasi sargʻaydi."], ["变成", "biànchéng", "v", "…ga aylanmoq", "变 oʻzgarmoq + 成 boʻlmoq: oʻzgarib, boshqa narsa boʻlib qolmoq.", "", "秋天树上的叶子都变成了红色、黄色。", "Kuzda daraxtdagi barglar qizil, sariq rangga kiradi."]], "grammar": [{"zh": "选择复句“或者……，或者……”", "uz": "Yo …, yo … (tanlov gapi)", "f": ["或者 + A，或者 + B（，或者 + C）"], "ex": "或者……，或者…… tanlov gapi ikki yoki bir nechta mumkin boʻlgan variantdan birini tanlashni bildiradi. Koʻproq ogʻzaki nutqda ishlatiladi.", "eg": [["或者明天去，或者后天去，我给你打电话。", "Yo ertaga, yo indinga boramiz, senga qoʻngʻiroq qilaman.", "或者:K|明天去，:P|或者:K|后天去，:P|我:S|给你:D|打电话:P", 0], ["我们或者今天去电影院看电影，或者明天在家看电影。", "Yo bugun kinoteatrga borib kino koʻramiz, yo ertaga uyda kino koʻramiz.", "我们:S|或者:K|今天:D|去电影院:P|看电影，:P|或者:K|明天:D|在家:L|看电影:P", 0], ["晚饭你自己选，或者吃中国菜，或者吃日本菜，或者吃泰国菜。", "Kechki ovqatni oʻzing tanla: yo xitoy taomi, yo yapon taomi, yo tay taomi.", "晚饭:O|你:S|自己:D|选，:P|或者:K|吃中国菜，:P|或者:K|吃日本菜，:P|或者:K|吃泰国菜:P", 0], ["周末我或者去公园坐船，或者在家看书。", "Dam olish kuni yo bogʻga borib qayiqda suzaman, yo uyda kitob oʻqiyman.", "周末:D|我:S|或者:K|去公园坐船，:P|或者:K|在家看书:P", 1], ["或者坐地铁，或者打车，我们得快点儿走。", "Yo metroda, yo taksida — tezroq yoʻlga chiqishimiz kerak.", "或者:K|坐地铁，:P|或者:K|打车，:P|我们:S|得:D|快点儿走:P", 1]], "why": "Bu 或者 (11-mavzu) ning kengaytmasi: har bir variant oldiga 或者 qoʻyiladi — oʻzbekchadagi “yo …, yo …” kabi. Asosan ogʻzaki nutqda, darak gapda: “Yo ertaga, yo indinga boramiz”.", "mis": [["或者明天去，或者后天去吗？", "或者明天去，或者后天去，我给你打电话。", "或者……，或者…… — soʻroq emas, darak gap: oxiriga 吗 qoʻyilmaydi. Soʻrasang — 还是."]]}, {"zh": "趋向补语的引申用法（2）", "uz": "…起来 — …a boshladi", "f": ["feʼl / sifat + 起来", "feʼl + 起 + toʻldiruvchi + 来"], "ex": "起来 yoʻnalish toʻldiruvchisi feʼl yoki sifatdan keyin kelib, harakat boshlanganini yoki yangi holatga oʻtilganini bildiradi. Feʼlning toʻldiruvchisi boʻlsa, u 起 va 来 ORASIGA qoʻyiladi.", "eg": [["雨已经下起来了。", "Yomgʻir allaqachon yogʻa boshladi.", "雨:S|已经:D|下:P|起来了:K", 0], ["最近天气热起来了。", "Oxirgi paytda havo isib ketdi.", "最近:D|天气:S|热:P|起来了:K", 0], ["怎么突然刮起风来了？", "Nega birdan shamol turib qoldi?", "怎么:D|突然:D|刮:P|起:K|风:O|来了:K", 0], ["天气慢慢凉快起来了。", "Havo asta-sekin salqinlasha boshladi.", "天气:S|慢慢:D|凉快:P|起来了:K", 1], ["大家都笑了起来。", "Hamma kulib yubordi.", "大家:S|都:D|笑:P|了起来:K", 1]], "why": "起来 soʻzma-soʻz “turib kelmoq”: oʻtirgan odam oʻrnidan turdi — harakat endi BOSHLANDI. Shuning uchun 下起来 — yogʻa boshladi, 热起来 — isib ketdi. Toʻldiruvchi 起 va 来 ORASIGA kiradi: 刮起风来.", "mis": [["怎么突然刮风起来了？", "怎么突然刮起风来了？", "Toʻldiruvchi (风) 起 bilan 来 orasiga qoʻyiladi."], ["最近天气热起来。", "最近天气热起来了。", "Yangi holat boshlangani uchun oxirida odatda 了 boʻladi."]]}, {"zh": "范围副词“就”", "uz": "就 — bor-yoʻgʻi, faqat", "f": ["就 + feʼl + son-hisob soʻz (oz deb hisoblash)", "就 + ot / ega (istisno)"], "ex": "就 son-hisob soʻzli feʼl oldida kelib, soʻzlovchi miqdorni oz, darajani past yoki vaqtni qisqa deb hisoblashini bildiradi. Ot yoki ot birikmali ega oldida kelsa, istisnoni bildiradi.", "eg": [["北京常常下雪，但听说今年就下了一次。", "Pekinda tez-tez qor yogʻadi, lekin bu yil bor-yoʻgʻi bir marta yogʻibdi.", "北京:S|常常:D|下雪，:P|但:N|听说:N|今年:D|就:K|下了:P|一次:C", 0], ["他昨天就看了十分钟书。", "U kecha bor-yoʻgʻi oʻn daqiqa kitob oʻqidi.", "他:S|昨天:D|就:K|看了:P|十分钟:C|书:O", 0], ["我每天书包里都放着雨伞，就今天没带。", "Har kuni sumkamda soyabon boʻladi, faqat bugun olmabman.", "我:S|每天:D|书包里:L|都:D|放着雨伞，:P|就:K|今天:D|没带:P", 0], ["你们点的菜都挺好吃的，就我点的这个菜不太好吃。", "Sizlar buyurtma qilgan taomlarning hammasi mazali, faqat men buyurtma qilgan taom unchalik mazali emas.", "你们点的菜:S|都:D|挺好吃的，:P|就:K|我点的这个菜:S|不太好吃:P", 0], ["这个季节就下了两次雨。", "Bu faslda bor-yoʻgʻi ikki marta yomgʻir yogʻdi.", "这个季节:D|就:K|下了:P|两次雨:O", 1], ["大家都带伞了，就我没带。", "Hamma soyabon olibdi, faqat men olmabman.", "大家:S|都:D|带伞了，:P|就:K|我:S|没带:P", 1]], "why": "Bu 就 oʻzbekchadagi “bor-yoʻgʻi”, “faqat” ga mos: 就下了一次 — bor-yoʻgʻi bir marta yogʻdi (soʻzlovchi buni kam deb biladi). Ot yoki ega oldida esa istisno: 就今天没带 — faqat bugun olmadim.", "mis": [["今年下了就一次雪。", "今年就下了一次雪。", "就 feʼl OLDIDA turadi, son-hisob soʻz oldida emas."]]}, {"zh": "趋向补语的引申用法（3）", "uz": "…下来 — …ib chiqdi (qiyin ishni oxiriga yetkazish)", "f": ["feʼl + 下来"], "ex": "下来 yoʻnalish toʻldiruvchisi feʼldan keyin kelib, koʻp vaqt va kuch talab qiladigan, qiyinchilikni yengish kerak boʻlgan harakat oxiriga yetkazilganini bildiradi.", "eg": [["这一年多住下来，我还是更喜欢北京的四季。", "Bir yildan koʻproq yashab koʻrib, baribir Pekinning toʻrt faslini koʻproq yoqtiraman.", "这一年多:D|住:P|下来，:K|我:S|还是:D|更喜欢:P|北京的四季:O", 0], ["这半年练下来，他画画的水平提高了不少。", "Yarim yil mashq qilib, uning rasm chizish darajasi ancha oshdi.", "这半年:D|练:P|下来，:K|他画画的水平:S|提高了:P|不少:C", 0], ["5000米的长跑比赛，没想到我跑下来了。", "5000 metrlik yugurish musobaqasini oxirigacha yugurib chiqaman deb oʻylamagandim.", "5000米的长跑比赛，:O|没想到:N|我:S|跑:P|下来了:K", 0], ["一年学下来，他的汉语提高了不少。", "Bir yil oʻqib chiqqach, uning xitoy tili ancha yaxshilandi.", "一年:D|学:P|下来，:K|他的汉语:S|提高了:P|不少:C", 1], ["这么难的考试，他也考下来了。", "Shunchalik qiyin imtihonni ham topshirib chiqdi.", "这么难的考试，:O|他:S|也:D|考:P|下来了:K", 1]], "why": "下来 — “yuqoridan pastga tushib keldi”: yoʻlning oxiriga yetib keldi. Shuning uchun uzoq, qiyin ishni oxirigacha yetkazishni bildiradi: 跑下来 — yugurib chiqdim (5000 metrni!). Oʻzbekchadagi “…ib chiqdi”: “bir yil yashab chiqdim”.", "mis": [["5000米的长跑比赛，我跑下去了。", "5000米的长跑比赛，我跑下来了。", "Oxiriga yetkazilgan qiyin ish — 下来. 下去 (8-mavzu) — davom etish, bundan keyin ham."]]}], "texts": [{"k": 1, "scene": "在街上，王一飞和白家月边走边聊。", "sceneuz": "Koʻchada Van Ifey va Bay Jiayue yurib ketib gaplashyapti.", "lines": [["白家月", "王老师，您看，这条街上的树都开花了。", "Van ustoz, qarang, bu koʻchadagi daraxtlarning hammasi gulladi."], ["王一飞", "上周我去公园坐船了，公园里的花也开了。", "Oʻtgan hafta parkka borib qayiqda suzdim, parkdagi gullar ham ochilibdi."], ["白家月", "天气这么好，下午我也想去公园坐船。", "Havo shunchalik yaxshi, tushdan keyin men ham parkka borib qayiqda suzgim keladi."], ["王一飞", "去吧！今天是工作日，人应该不多。", "Boraver! Bugun ish kuni, odam koʻp boʻlmasa kerak."], ["白家月", "您有时间吗？我想跟您一起去。", "Vaqtingiz bormi? Siz bilan birga borgim keladi."], ["王一飞", "我今天下午有课，不能去太远的地方。", "Bugun tushdan keyin darsim bor, juda uzoq joyga bora olmayman."], ["白家月", "那咱们换一天去？", "Unda boshqa kuni boramizmi?"], ["王一飞", "行。或者明天去，或者后天去，我给你打电话。", "Boʻpti. Yo ertaga, yo indinga boramiz, senga qoʻngʻiroq qilaman."]]}, {"k": 2, "scene": "在街上，王一飞和白家月一起散步。", "sceneuz": "Koʻchada Van Ifey va Bay Jiayue birga sayr qilyapti.", "lines": [["白家月", "刚才还是大晴天呢，怎么突然就刮起风来了？", "Hozirgina havo ochiq edi-ku, nega birdan shamol esib qoldi?"], ["王一飞", "好像新闻里说今天有雨。", "Yangiliklarda bugun yomgʻir boʻladi deyishgandek edi."], ["白家月", "啊？我每天书包里都放着雨伞，就今天没带。", "A? Har kuni sumkamda soyabon boʻladi, faqat bugun olmabman."], ["王一飞", "我可以借给你，我车里有一把伞和一件雨衣。", "Senga berib turaman, mashinamda bitta soyabon va bitta yomgʻirpoʻsh bor."], ["白家月", "谢谢，希望下午天气能变好。", "Rahmat, tushdan keyin havo yaxshilanar degan umiddaman."], ["王一飞", "这个季节天气变化很快。", "Bu faslda havo juda tez oʻzgaradi."], ["白家月", "雨已经下起来了，咱们快点儿走吧。", "Yomgʻir yogʻa boshladi, tezroq yuraylik."]]}, {"k": 3, "scene": "在教室里，王一飞和白家月躲雨。", "sceneuz": "Sinfxonada Van Ifey va Bay Jiayue yomgʻirdan panalashyapti.", "lines": [["白家月", "您来这里已经一年多了，习惯了吧？", "Bu yerga kelganingizga bir yildan oshdi, koʻnikdingiz-a?"], ["王一飞", "别的早就习惯了，就是天气我还不太习惯。", "Boshqa narsalarga allaqachon koʻnikdim, faqat havoga hali unchalik koʻnikmadim."], ["白家月", "为什么？您不喜欢这里的天气吗？", "Nega? Bu yerning havosi sizga yoqmaydimi?"], ["王一飞", "我觉得冬天太冷了。", "Menimcha qishi juda sovuq."], ["白家月", "冬天虽然冷，但是下雪的时候特别漂亮。", "Qish garchi sovuq boʻlsa ham, qor yoqqanda juda chiroyli boʻladi."], ["王一飞", "我也喜欢雪。北京常常下雪，但听说今年就下了一次。", "Men ham qorni yaxshi koʻraman. Pekinda tez-tez qor yogʻadi, lekin bu yil faqat bir marta yogʻibdi deb eshitdim."], ["白家月", "我没关注过北京的天气，但是新闻里说过，今年冬天很多地方雪下得都少了。", "Pekin havosiga eʼtibor bermagan ekanman, lekin yangiliklarda bu yil qishda koʻp joylarda qor kam yoqqanini aytishgan."]]}, {"k": 4, "scene": "在家里，王一飞在写日记。", "sceneuz": "Uyda Van Ifey kundalik yozyapti.", "lines": [["", "我离开北京到这里工作一年多了。", "Pekindan bu yerga ishlagani kelganimga bir yildan oshdi."], ["", "这一年多住下来，我还是更喜欢北京的四季。", "Bir yildan ortiq yashab koʻrib, baribir Pekinning toʻrt faslini koʻproq yoqtiraman."], ["", "北京的春天最舒服，天气不冷不热。", "Pekinning bahori eng yoqimli, havo na sovuq, na issiq."], ["", "夏天白天很热，但是晚上比较凉快。", "Yozda kunduzi juda issiq, lekin kechqurun ancha salqin."], ["", "秋天树上的叶子都变成了红色、黄色，非常漂亮。", "Kuzda daraxtlardagi barglar qizil, sariq rangga kiradi, juda chiroyli."], ["", "冬天不但冷，而且风很大，我最不喜欢冬天。", "Qish nafaqat sovuq, balki shamoli ham kuchli, men qishni eng yoqtirmayman."], ["", "每个人都有自己最喜欢的季节，你最喜欢哪个季节呢？", "Har kimning oʻzi eng yoqtirgan fasli bor, sen qaysi faslni eng yaxshi koʻrasan?"]]}]}, {"n": 13, "zh": "我的新邻居来自英国", "py": "Wǒ de xīn línjū láizì Yīngguó", "uz": "Yangi qoʻshnilarim Angliyadan kelgan", "words": [["请客", "qǐngkè", "v", "mehmon qilmoq (pulini oʻzi toʻlamoq)", "请 taklif qilmoq + 客 mehmon. 今天我请客 — bugun men toʻlayman.", "", "今天我请客，你们想吃什么就点什么！", "Bugun men mehmon qilaman, nima yegilaring kelsa, buyurtma qilinglar!"], ["南方", "nánfāng", "n", "janub", "南 janub + 方 tomon.", "", "听说南方的冬天不太冷。", "Eshitishimcha, janubda qish unchalik sovuq emas."], ["北方", "běifāng", "n", "shimol", "北 — orqa oʻgirib turgan ikki odam; 方 tomon.", "", "北方的冬天很冷。", "Shimolda qish juda sovuq."], ["做法", "zuòfǎ", "n", "tayyorlash usuli, qilish yoʻli", "做 qilmoq + 法 usul (方法 dagi): “qilish usuli”.", "", "这个菜的做法很简单。", "Bu taomni tayyorlash juda oson."], ["不同", "bù tóng", "adj", "har xil, farqli", "不 + 同 bir xil (同学, 同事 dagi): “bir xil emas”. Teskarisi — 一样.", "", "南方菜跟你们北方菜的做法不同。", "Janub taomlari sizlarning shimol taomlaringizdan boshqacha tayyorlanadi."], ["加", "jiā", "v", "qoʻshmoq", "力 kuch + 口: yana kuch qoʻshmoq. 参加 (9-mavzu) dagi 加.", "", "那再加一个鸡肉。", "Unda yana bitta tovuq goʻshti qoʻshamiz."], ["的话", "dehuà", "part", "(shart) …sa, agar", "Shartning oxiriga qoʻyiladi: 有时间的话 — vaqting boʻlsa.", "", "你们有时间的话，就来我家做客。", "Vaqtlaringiz boʻlsa, uyimga mehmonga kelinglar."], ["做客", "zuòkè", "v", "mehmonga bormoq", "做 boʻlmoq + 客 mehmon: “mehmon boʻlmoq”. 请客 — mehmon qilmoq, 做客 — mehmon boʻlmoq.", "", "上周我去他们家做客了。", "Oʻtgan hafta ularnikiga mehmonga bordim."], ["邻居", "línjū", "n", "qoʻshni", "邻 yonidagi (阝 qishloq) + 居 yashamoq: “yonida yashaydigan”.", "", "第一次请新邻居来做客，总是担心有什么没准备好。", "Yangi qoʻshnilarni birinchi marta mehmonga chaqiryapman, nimadir tayyor boʻlmay qolgandek xavotirdaman."], ["放心", "fàngxīn", "v", "xotirjam boʻlmoq", "放 qoʻymoq + 心 yurak: yurakni joyiga qoʻymoq. Teskarisi — 担心 (8-mavzu).", "", "放心吧，我帮你看了，都已经准备好了。", "Xotirjam boʻl, men ham qarab chiqdim, hammasi tayyor."], ["酒", "jiǔ", "n", "spirtli ichimlik, sharob", "氵 suyuqlik + 酉 koʻza: koʻzadagi ichimlik. 啤酒 — 9-mavzu.", "", "我把饮料和酒都放进冰箱里了。", "Ichimlik va sharobning hammasini muzlatgichga qoʻydim."], ["放", "fàng", "v", "qoʻymoq", "放假 (dam olish), 放心 dagi 放. 放在… — …ga qoʻymoq.", "", "你把盘子放在桌子上吧。", "Likopchalarni stolga qoʻy."], ["客人", "kèrén", "n", "mehmon", "客 mehmon (宀 tom ostiga kelgan) + 人.", "", "客人来了再拿出来。", "Mehmonlar kelganda olib chiqamiz."], ["晚会", "wǎnhuì", "n", "kechki bazm, kecha", "晚 kechqurun + 会 yigʻilish.", "", "谢谢你们来参加我儿子的生日晚会。", "Oʻgʻlimning tugʻilgan kun kechasiga kelganingiz uchun rahmat."], ["礼物", "lǐwù", "n", "sovgʻa", "礼 hurmat (礻) + 物 narsa: “hurmat belgisi boʻlgan narsa”.", "", "我准备了一个小礼物，希望你喜欢！", "Kichik sovgʻa tayyorladim, yoqadi degan umiddaman!"], ["画家", "huàjiā", "n", "rassom", "画 rasm + 家 usta: 家 biror sohaning ustasi (音乐家 — musiqachi).", "", "对，我想做一名画家。", "Ha, rassom boʻlmoqchiman."], ["盘子", "pánzi", "n", "likopcha, tarelka", "盘 (皿 idish) + 子.", "", "我去把盘子拿过来。", "Borib likopchalarni olib kelaman."], ["一边", "yìbiān", "adv", "bir vaqtda (…a turib)", "一 bir + 边 tomon: bir tomondan bunisi, bir tomondan unisi. 一边…一边… — bir vaqtda ikki ish.", "", "咱们一边吃蛋糕，一边聊天儿吧。", "Kek yeb turib suhbatlashaylik."], ["聊天儿", "liáotiānr", "v", "suhbatlashmoq, gaplashmoq", "聊 gaplashmoq + 天 (osmon, kun): “osmondagi hamma narsa haqida gaplashmoq”.", "", "我们在咖啡馆聊天儿。", "Biz kafeda gaplashib oʻtiribmiz."], ["来自", "láizì", "v", "…dan kelmoq", "来 kelmoq + 自 …dan: “…dan kelgan”.", "", "我的新邻居是来自英国的夫妻。", "Yangi qoʻshnilarim — Angliyadan kelgan er-xotin."], ["夫妻", "fūqī", "n", "er-xotin", "夫 er (丈夫 dagi) + 妻 xotin.", "", "他们是一对年轻的夫妻。", "Ular yosh er-xotin."], ["直到", "zhídào", "v", "…gacha (vaqt)", "直 toʻgʻri + 到 yetmoq: “toʻxtamay … gacha”.", "", "我们直到十二点多才回家。", "Biz soat oʻn ikkidan oʻtgandagina uyga qaytdik."], ["地图", "dìtú", "n", "xarita", "地 yer + 图 rasm (囗 ramka): “yer rasmi”.", "", "他家有一张世界地图。", "Ularning uyida dunyo xaritasi bor."], ["点", "diǎn", "n", "nuqta", "点 ning yangi maʼnosi (soat 点, 一点儿 dan tashqari): 红点 — qizil nuqta. 地点 (11-mavzu) dagi 点.", "红点", "上面每一个红点都是他们去过的地方。", "Undagi har bir qizil nuqta — ular borgan joy."], ["感到", "gǎndào", "v", "his qilmoq", "感 his (心 yurak) + 到: “his yetib keldi”. 感兴趣 dagi 感.", "", "他们感到东方的文化很特别。", "Ular Sharq madaniyatini juda oʻziga xos deb his qilishdi."], ["东方", "dōngfāng", "n", "Sharq", "东 = 日 quyosh 木 daraxt ortidan chiqmoqda + 方 tomon.", "", "太阳从东方出来。", "Quyosh sharqdan chiqadi."], ["文化", "wénhuà", "n", "madaniyat", "文 yozuv, bilim + 化 aylantirmoq: insonni bilim bilan oʻzgartirish.", "", "我对中国文化很感兴趣。", "Xitoy madaniyatiga juda qiziqaman."], ["英国", "Yīngguó", "prop", "Angliya (Buyuk Britaniya)", "英 + 国 davlat.", "", "我的新邻居来自英国。", "Yangi qoʻshnilarim Angliyadan kelgan."]], "grammar": [{"zh": "假设复句“……的话，就……”", "uz": "Agar …sa, … (shart gapi)", "f": ["shart + 的话，(ega) + 就 + natija"], "ex": "……的话，就…… shart gapida birinchi qism faraz qilingan holatni, ikkinchi qism undan kelib chiqadigan natija yoki xulosani bildiradi. Koʻproq ogʻzaki nutqda ishlatiladi.", "eg": [["你们有时间的话，就来我家做客。", "Vaqtlaringiz boʻlsa, uyimga mehmonga kelinglar.", "你们:S|有时间的话，:K|就:K|来我家:P|做客:P", 0], ["你觉得满意的话，咱们就买。", "Yoqsa, sotib olamiz.", "你:S|觉得满意的话，:K|咱们:S|就:K|买:P", 0], ["明天天气好的话，我就去爬山。", "Ertaga havo yaxshi boʻlsa, toqqa chiqaman.", "明天:D|天气好的话，:K|我:S|就:K|去爬山:P", 0], ["你不放心的话，就给我打电话。", "Xavotir olsang, menga qoʻngʻiroq qil.", "你:S|不放心的话，:K|就:K|给我:D|打电话:P", 1], ["客人来了的话，你就把酒拿出来。", "Mehmonlar kelsa, ichimlikni olib chiq.", "客人:S|来了的话，:K|你:S|就:K|把酒:O|拿出来:P", 1]], "why": "的话 — “(shunday) gap boʻlsa”: shartning OXIRIGA qoʻyiladi, oʻzbekchadagi “-sa” qoʻshimchasiga oʻxshaydi: 有时间的话 — vaqting boʻlsa. 就 esa natija oldida, egadan keyin turadi.", "mis": [["的话你们有时间，就来我家做客。", "你们有时间的话，就来我家做客。", "的话 shartning oxirida turadi."], ["明天天气好的话，就我去爬山。", "明天天气好的话，我就去爬山。", "就 egadan KEYIN, feʼldan oldin keladi."]]}, {"zh": "“把”字句（4）", "uz": "把 + yoʻnalish / holat toʻldiruvchisi", "f": ["ega + 把 + toʻldiruvchi + feʼl + yoʻnalish toʻldiruvchisi", "ega + 把 + toʻldiruvchi + feʼl + 得 + holat toʻldiruvchisi"], "ex": "把 gapda feʼldan keyin yoʻnalish yoki holat toʻldiruvchisi kelib, harakat aniq bir kishi yoki narsaning joyini yoki holatini oʻzgartirganini bildiradi.", "eg": [["你把声音开得太大了。", "Ovozni juda baland qoʻyib yuboribsan.", "你:S|把声音:K|开:P|得太大了:C", 0], ["他把球踢进去了吗？", "U toʻpni darvozaga kiritdimi?", "他:S|把球:K|踢:P|进去了:C|吗:N", 0], ["你把字写得太小了，我看不清楚。", "Harflarni juda mayda yozibsan, aniq koʻra olmayapman.", "你:S|把字:K|写:P|得太小了，:C|我:S|看不清楚:P", 0], ["我把饮料和酒都放进冰箱里了。", "Ichimlik va sharobning hammasini muzlatgichga qoʻydim.", "我:S|把饮料和酒:K|都:D|放:P|进冰箱里了:C", 1], ["我去把盘子拿过来。", "Borib likopchalarni olib kelaman.", "我:S|去:D|把盘子:K|拿:P|过来:C", 1]], "why": "Bu 把 gapda harakat narsani boshqa joyga olib boradi (踢进去 — tepib kiritdi) yoki uning holatini oʻzgartiradi (开得太大 — juda baland qoʻyding). Oʻzbekchada: “Ovozni juda baland qoʻyib yuboribsan”.", "mis": [["你把声音开太大了。", "你把声音开得太大了。", "Holat toʻldiruvchisi oldidan 得 kerak: 开得太大."], ["我把饮料放冰箱里了。", "我把饮料放进冰箱里了。", "Joydan oldin yoʻnalish toʻldiruvchisi (进) yoki 在 kerak: 放进冰箱里 / 放在冰箱里."]]}, {"zh": "并列复句“一边……，一边……”", "uz": "…a turib, … (ikki ish bir vaqtda)", "f": ["一边 + feʼl₁，一边 + feʼl₂", "边 + feʼl₁ + 边 + feʼl₂"], "ex": "一边……，一边…… ikki harakat bir vaqtda boʻlayotganini bildiradi. Qisqartirib 边……边…… deyish mumkin.", "eg": [["咱们一边吃蛋糕，一边聊天儿吧。", "Kek yeb turib suhbatlashaylik.", "咱们:S|一边:K|吃蛋糕，:P|一边:K|聊天儿吧:P", 0], ["我喜欢一边跑步，一边听音乐。", "Yugurib turib musiqa tinglashni yaxshi koʻraman.", "我:S|喜欢:P|一边:K|跑步，:O|一边:K|听音乐:O", 0], ["你不应该边开车边打电话。", "Mashina haydab turib telefonda gaplashmasliging kerak.", "你:S|不应该:D|边:K|开车:P|边:K|打电话:P", 0], ["我们一边喝红茶，一边聊天儿。", "Qora choy ichib turib suhbatlashdik.", "我们:S|一边:K|喝红茶，:P|一边:K|聊天儿:P", 1], ["他喜欢边听音乐边写作业。", "U musiqa tinglab turib uy vazifasini qilishni yaxshi koʻradi.", "他:S|喜欢:P|边:K|听音乐:O|边:K|写作业:O", 1]], "why": "一边 — “bir tomon”: bir tomondan buni, bir tomondan uni qilasan. Oʻzbekchadagi “…a turib”: kek yeb turib gaplashamiz. Ikkala harakat bir VAQTDA boʻladi.", "mis": [["我一边吃饭，看电视。", "我一边吃饭，一边看电视。", "一边 ikki marta, har bir feʼl oldida takrorlanadi."]]}], "texts": [{"k": 1, "scene": "在饭馆，杨同乐请同事吃饭。", "sceneuz": "Restoranda Yan Tunle hamkasblarini ovqatga mehmon qilyapti.", "lines": [["杨同乐", "今天我请客，你们想吃什么就点什么！", "Bugun men mehmon qilaman, nima yegilaring kelsa, oʻshani buyuringlar!"], ["王一雪", "那我就不客气了。听说这家饭馆的鱼做得很特别？", "Unda tortinmayman. Bu restoranda baliqni juda oʻziga xos pishirishar ekan-a?"], ["杨同乐", "对，南方菜跟你们北方菜的做法不同。除了鱼，你们还想吃什么？", "Ha, janub taomlari sizlarning shimol taomlaringizdan boshqacha pishiriladi. Baliqdan tashqari yana nima yegilaring keladi?"], ["同事", "我不常吃南方菜，还是你决定吧。", "Men janub taomlarini kam yeyman, yaxshisi oʻzing hal qil."], ["杨同乐", "好，那再加一个鸡肉，一个……", "Xoʻp, unda yana bitta tovuq goʻshti, bitta..."], ["王一雪", "咱们就三个人，别点那么多。", "Biz atigi uch kishimiz, unchalik koʻp buyurma."], ["杨同乐", "好，那先来这几个菜。", "Xoʻp, unda avval shu taomlar kelsin."], ["王一雪", "对了，下周我儿子过生日，你们有时间的话，就来我家做客，我给你们做北京菜。", "Aytgancha, kelasi hafta oʻgʻlimning tugʻilgan kuni, vaqtlaring boʻlsa, uyimga mehmonga kelinglar, sizlarga Pekin taomlarini pishirib beraman."]]}, {"k": 2, "scene": "在家里，王一雪和刘明为生日会做准备。", "sceneuz": "Uyda Van Isyue va Lyu Min tugʻilgan kun kechasiga tayyorgarlik koʻryapti.", "lines": [["王一雪", "第一次请新邻居来做客，总是担心有什么没准备好。", "Yangi qoʻshnilarni birinchi marta mehmonga chaqiryapmiz, nimadir tayyor boʻlmay qoladimi deb doim xavotirlanaman."], ["刘明", "放心吧，我帮你看了，都已经准备好了。", "Xotirjam boʻl, men koʻrib chiqdim, hammasi tayyor."], ["王一雪", "我记得刚才已经把饮料拿出来了，怎么不见了？", "Esimda, hozirgina ichimliklarni olib chiqqan edim, qani ular?"], ["刘明", "我把饮料和酒都放进冰箱里了，客人来了再拿出来。", "Ichimlik va vinoni muzlatkichga solib qoʻydim, mehmonlar kelganda olib chiqamiz."], ["王一雪", "音乐的声音合适吗？", "Musiqaning ovozi toʻgʻrimi?"], ["刘明", "你把声音开得太大了，我去关小一点儿。", "Ovozini juda baland qoʻyib yuboribsan, borib biroz pasaytiraman."], ["王一雪", "好，那我们就等客人来吧。", "Xoʻp, unda mehmonlarni kutamiz."]]}, {"k": 3, "scene": "在家里，王一雪和刘明办生日会。", "sceneuz": "Uyda Van Isyue va Lyu Min tugʻilgan kun kechasini oʻtkazyapti.", "lines": [["王一雪", "谢谢你们来参加我儿子的生日晚会，希望大家今晚玩得开心。", "Oʻgʻlimning tugʻilgan kun kechasiga kelganingiz uchun rahmat, bugun kechqurun hammangiz xursand dam olasiz degan umiddaman."], ["杨同乐", "小明，生日快乐！我准备了一个小礼物，希望你喜欢！", "Syaomin, tugʻilgan kuning bilan! Kichik sovgʻa tayyorladim, yoqar degan umiddaman!"], ["刘小明", "谢谢您，我可以打开吗？", "Rahmat, ochsam boʻladimi?"], ["杨同乐", "当然可以，你妈妈说你跟姐姐一样，都喜欢画画，对吗？", "Albatta boʻladi, onangning aytishicha, sen ham opangga oʻxshab rasm chizishni yaxshi koʻrar ekansan, toʻgʻrimi?"], ["刘小明", "对，我想做一名画家。啊！画板和画笔，这正是我需要的。我太喜欢了。", "Ha, rassom boʻlmoqchiman. Voy! Molbert va moʻyqalam — aynan menga kerak narsa. Juda yoqdi."], ["王一雪", "我去把盘子拿过来，咱们一边吃蛋糕，一边聊天儿吧。", "Men borib likopchalarni olib kelay, tort yeb turib gaplashamiz."]]}, {"k": 4, "scene": "在家里，王一雪在写日记。", "sceneuz": "Uyda Van Isyue kundalik yozyapti.", "lines": [["", "我的新邻居是来自英国的夫妻。", "Yangi qoʻshnilarim — Angliyadan kelgan er-xotin."], ["", "上周我去他们家做客了。", "Oʻtgan hafta ularnikiga mehmonga bordim."], ["", "他们做了很多好吃的，还准备了英国的红茶。", "Ular koʻp mazali taomlar pishirishdi, yana ingliz qora choyini ham tayyorlashdi."], ["", "那天我跟他们一边喝红茶，一边聊天儿，直到十二点多才回家。", "Oʻsha kuni ular bilan qora choy ichib turib suhbatlashdik, soat oʻn ikkidan oʻtgandagina uyga qaytdim."], ["", "他们年轻的时候喜欢旅游，他家有一张世界地图，上面每一个红点都是他们去过的地方。", "Ular yoshligida sayohatni yaxshi koʻrishgan, uylarida dunyo xaritasi bor, undagi har bir qizil nuqta — ular borgan joy."], ["", "后来，他们感到东方的文化很特别，就开始学习中文。", "Keyinchalik ular Sharq madaniyatini juda oʻziga xos deb his qilib, xitoy tilini oʻrgana boshlashdi."], ["", "今天是小明的生日，我请他们到我家玩，来看看中国人的家，也尝尝中国菜。", "Bugun Syaominning tugʻilgan kuni, ularni uyimga taklif qildim — xitoyliklarning uyini koʻrishsin, Xitoy taomlarini ham tatib koʻrishsin."]]}]}, {"n": 14, "zh": "这本书被别人借走了", "py": "Zhè běn shū bèi biérén jièzǒu le", "uz": "Bu kitobni boshqa birov olib ketibdi", "words": [["词典", "cídiǎn", "n", "lugʻat (kitob)", "词 soʻz (讠) + 典 qadimiy kitob: “soʻzlar kitobi”.", "", "我借的这本词典最好今天还。", "Olgan lugʻatimni bugun qaytarganim yaxshi."], ["最好", "zuìhǎo", "adv", "…gani maʼqul, eng yaxshisi", "最 eng + 好 yaxshi: “eng yaxshisi — …”.", "", "你最好早点儿去。", "Ertaroq borganing maʼqul."], ["节", "jié", "m", "(dars) soat, para", "季节 (12-mavzu) dagi 节 — boʻgʻim: kunning “boʻgʻimi”. 两节课 — ikki soat dars.", "两节课", "下午我只有两节课。", "Tushdan keyin bor-yoʻgʻi ikki soat darsim bor."], ["图书馆", "túshūguǎn", "n", "kutubxona", "图 rasm + 书 kitob + 馆 bino (体育馆 dagi): “rasm va kitoblar binosi”.", "", "我可以帮你去图书馆还书。", "Senga yordam berib, kitobni kutubxonaga qaytarib qoʻyishim mumkin."], ["被", "bèi", "prep", "(majhul nisbat) …tomonidan", "衤 kiyim + 皮 teri: ustingga yopilib tushgan narsa — oʻzing emas, boshqa birov qildi.", "", "这本书被别人借走了。", "Bu kitobni boshqa birov olib ketibdi."], ["名人", "míngrén", "n", "mashhur odam", "名 nom + 人: “nomi chiqqan odam”.", "", "《名人的故事》？我有这本书。", "“Mashhurlar hikoyasi”mi? Menda bu kitob bor."], ["故事", "gùshi", "n", "hikoya, ertak", "故 eski + 事 voqea: “eski voqea”.", "", "妈妈每天晚上给我讲故事。", "Onam har kecha menga ertak aytib beradi."], ["然后", "ránhòu", "conj", "keyin, soʻng", "然 shunday + 后 keyin: “shundan keyin”. 先……，然后…… — avval…, keyin….", "", "我要先去图书馆借书，然后去游泳。", "Avval kutubxonaga borib kitob olaman, keyin suzishga boraman."], ["报纸", "bàozhǐ", "n", "gazeta", "报 xabar + 纸 qogʻoz (纟): “xabar qogʻozi”.", "", "我想去图书馆看看中文报纸。", "Kutubxonaga borib xitoycha gazetalarni koʻrmoqchiman."], ["忘记", "wàngjì", "v", "unutmoq", "忘 = 亡 yoʻqolmoq + 心 yurak: yurakdan yoʻqoldi. Teskarisi — 记得.", "", "我忘记了，可能被我放在家里了。", "Esimdan chiqdi, uyda qoldirgan boʻlsam kerak."], ["电子书", "diànzǐshū", "n", "elektron kitob", "电子 elektron + 书 kitob.", "", "进不去图书馆也没关系，上网看看有没有电子书。", "Kutubxonaga kira olmasang ham mayli, internetda elektron kitobi bormi, qarab koʻr."], ["女生", "nǚshēng", "n", "qiz (talaba, oʻquvchi)", "女 ayol + 生 (学生 dagi). Teskarisi — 男生 (9-mavzu).", "", "我和几个女生要表演一个节目。", "Men bir nechta qizlar bilan bitta chiqish qilmoqchimiz."], ["表演", "biǎoyǎn", "v", "sahnada chiqish qilmoq, namoyish qilmoq", "表 koʻrsatmoq + 演 oʻynamoq (氵): “koʻrsatib oʻynamoq”.", "", "我想唱中文歌，但是还没找到人一起表演。", "Xitoycha qoʻshiq aytmoqchiman, lekin birga chiqish qiladigan odam topmadim."], ["节目", "jiémù", "n", "dastur, chiqish (raqam)", "节 boʻgʻim + 目 koʻz, band: dasturning har bir “bandi”.", "", "我最喜欢的节目是留学生们跳舞。", "Eng yoqqan chiqishim — chet ellik talabalarning raqsi."], ["怎么办", "zěnme bàn", "phr", "nima qilish kerak", "怎么 qanday + 办 qilmoq: “qanday qilay?”.", "", "我不知道怎么办。", "Nima qilishni bilmayman."], ["校长", "xiàozhǎng", "n", "direktor (maktab), rektor", "校 (学校) + 长 zhǎng boshliq. 长 bu yerda zhǎng, cháng emas!", "", "我们的校长是一位女老师。", "Direktorimiz ayol kishi."], ["面前", "miànqián", "n", "oldida, roʻparasida", "面 yuz + 前 old: “yuz oldida”.", "", "一想到要在校长、老师和那么多同学面前表演，我就有些紧张。", "Direktor, ustozlar va shuncha sinfdoshlar oldida chiqish qilishimni oʻylasam, biroz hayajonlanaman."], ["有些", "yǒuxiē", "adv", "biroz, sal", "有 bor + 些 biroz: 有点儿 ga yaqin.", "", "今天我有些累。", "Bugun biroz charchadim."], ["相信", "xiāngxìn", "v", "ishonmoq", "相 bir-biriga + 信 ishonch (亻 odam + 言 soʻz: odamning soʻzi).", "", "你要相信自己。", "Oʻzingga ishonishing kerak."], ["新年", "xīnnián", "n", "Yangi yil", "新 yangi + 年 yil.", "", "昨天是我们学校的新年晚会。", "Kecha maktabimizning Yangi yil kechasi boʻldi."], ["班级", "bānjí", "n", "sinf, guruh", "班 sinf + 级 bosqich (年级 — 10-mavzu).", "", "每个班级的同学都表演节目了。", "Har bir sinf oʻquvchilari chiqish qildi."], ["跳", "tiào", "v", "sakramoq; raqsga tushmoq", "𧾷 oyoq + 兆: oyoq bilan sakrash. 跳舞 — raqsga tushmoq.", "", "我一个晚上跟大家一起又唱又跳。", "Kechasi bilan hamma bilan birga qoʻshiq aytib, raqsga tushdim."], ["留学生", "liúxuéshēng", "n", "chet ellik talaba", "留 qolmoq + 学 oʻqish + 生: “chet elda qolib oʻqiydigan talaba”.", "", "我们学校有很多留学生。", "Maktabimizda chet ellik talabalar koʻp."], ["最后", "zuìhòu", "n", "oxirida, eng soʻngida", "最 eng + 后 keyin: “eng keyin”.", "", "最后老师和校长也被叫起来一块儿跳。", "Oxirida ustozlar va direktorni ham turgʻizib, birga raqsga tushishdi."], ["一块儿", "yíkuàir", "adv/n", "birga; bir joyda", "一 bir + 块 boʻlak: “bir boʻlak boʻlib”. 一起 ga yaqin, ogʻzaki.", "", "我们一块儿去吧。", "Birga boraylik."], ["网站", "wǎngzhàn", "n", "veb-sayt", "网 toʻr (internet) + 站 bekat: “internetdagi bekat”.", "", "过几天学校的网站上会有晚会的视频。", "Bir necha kundan keyin maktab saytida kechaning videosi boʻladi."], ["视频", "shìpín", "n", "video", "视 koʻrmoq (电视 dagi) + 频 chastota.", "", "我打算再看一遍晚会的视频。", "Kechaning videosini yana bir marta koʻrmoqchiman."]], "grammar": [{"zh": "被动句（1）", "uz": "被 — majhul nisbat (…ilibdi)", "f": ["ega + (ravish / modal) + 被 + (bajaruvchi) + feʼl + qoʻshimcha qism"], "ex": "被 li gaplar majhul maʼnoni bildiradi: ega qandaydir harakat taʼsiriga uchraganini taʼkidlaydi, koʻpincha majburiylik, ilojsizlik yoki salbiy ohang bilan. Ravish va modal feʼllar 被 dan OLDIN turadi, 被 dan keyingi bajaruvchini tushirib qoldirish mumkin.", "eg": [["这本书被别人借走了。", "Bu kitobni boshqa birov olib ketibdi.", "这本书:S|被别人:K|借:P|走了:C", 0], ["水果可能被弟弟吃了。", "Mevani ukam yeb qoʻygan boʻlsa kerak.", "水果:S|可能:D|被弟弟:K|吃了:P", 0], ["我们俩经常被叫错名字。", "Ikkimizning ismimizni tez-tez adashtirib aytishadi.", "我们俩:S|经常:D|被:K|叫错:P|名字:O", 0], ["我的校园卡可能被我放在家里了。", "Talaba kartamni uyda qoldirgan boʻlsam kerak.", "我的校园卡:S|可能:D|被我:K|放:P|在家里了:C", 1], ["老师和校长也被叫起来了。", "Ustozlar va direktorni ham turgʻizishdi.", "老师和校长:S|也:D|被:K|叫:P|起来了:C", 1]], "why": "被 — oʻzbekchadagi majhul nisbat (-il, -in): “kitob olib ketilibdi”. Lekin xitoychada 被 koʻpincha NOXUSH holat uchun: kitobni olib ketishibdi (endi men ololmayman), mevani ukam yeb qoʻyibdi. Bajaruvchi 被 dan keyin keladi; kim qilgani muhim boʻlmasa, tushib qoladi: 我们俩经常被叫错名字.", "mis": [["这本书被别人借了走。", "这本书被别人借走了。", "Natija (走) feʼlga yopishadi, 了 oxirida: 借走了."], ["水果被弟弟可能吃了。", "水果可能被弟弟吃了。", "Ravish va modal feʼllar (可能) 被 dan OLDIN turadi."]]}, {"zh": "承接复句“先……，再/然后……”", "uz": "Avval …, keyin …", "f": ["先 + harakat₁，再 / 然后 + harakat₂"], "ex": "先……，再/然后…… gapida ikki qism harakatlarning ketma-ketligini bildiradi.", "eg": [["我要先去图书馆借书，然后去游泳。", "Avval kutubxonaga borib kitob olaman, keyin suzishga boraman.", "我:S|要:D|先:K|去图书馆借书，:P|然后:K|去游泳:P", 0], ["你先去买门票，再来这里找我。", "Avval borib chipta ol, keyin shu yerga kelib meni top.", "你:S|先:K|去买门票，:P|再:K|来这里找我:P", 0], ["你们先回房间休息一会儿，然后再出来吃晚饭。", "Avval xonangizga qaytib biroz dam olinglar, keyin kechki ovqatga chiqinglar.", "你们:S|先:K|回房间休息一会儿，:P|然后:K|再:K|出来吃晚饭:P", 0], ["我们先吃饭，然后去看节目。", "Avval ovqatlanamiz, keyin chiqishlarni tomosha qilgani boramiz.", "我们:S|先:K|吃饭，:P|然后:K|去看节目:P", 1], ["你先看看词典，再问老师。", "Avval lugʻatga qarab koʻr, keyin ustozdan soʻra.", "你:S|先:K|看看词典，:P|再:K|问老师:P", 1]], "why": "Oʻzbekchadagi “avval …, keyin …” ning oʻzi. 再 va 然后 ikkalasi ham “keyin”: 然后 bogʻlovchi — ikkinchi qismning boshida turadi, 再 ravish — feʼl oldida. Ikkalasi birga ham keladi: 然后再出来吃晚饭.", "mis": [["我先去图书馆借书，去游泳然后。", "我先去图书馆借书，然后去游泳。", "然后 ikkinchi qismning BOSHIDA turadi."]]}, {"zh": "固定格式“×什么（啊）”", "uz": "Nimasiga …! (eʼtiroz, tinchlantirish)", "f": ["feʼl / sifat + 什么（啊）"], "ex": "×什么（啊） qolipi odatda suhbatdoshning xavotiri yoki shubhasini rad etish yoki biror faktni taʼkidlash uchun ishlatiladi; eʼtiroz yoki tinchlantirish ohangiga ega.", "eg": [["紧张什么啊，我们都喜欢听你唱歌，你要相信自己。", "Nimasiga hayajonlanasan, hammamiz qoʻshiq aytishingni yaxshi koʻramiz, oʻzingga ishon.", "紧张什么啊，:K|我们:S|都:D|喜欢:P|听你唱歌，:O|你:S|要:D|相信:P|自己:O", 0], ["胖什么啊，你看起来不胖也不瘦。", "Qayering semiz, sen na semiz, na ozgʻin koʻrinasan.", "胖什么啊，:K|你:S|看起来:D|不胖也不瘦:P", 0], ["急什么啊，马上就到了。", "Nimaga shoshasan, hozir yetib boramiz.", "急什么啊，:K|马上:D|就:D|到了:P", 0], ["怕什么啊，大家都会帮你的。", "Nimadan qoʻrqasan, hamma senga yordam beradi.", "怕什么啊，:K|大家:S|都:D|会帮你的:P", 1], ["忙什么啊，先吃饭吧。", "Nimaga shoshyapsan, avval ovqatlan.", "忙什么啊，:K|先:D|吃饭吧:P", 1]], "why": "Bu qolip soʻroq emas, eʼtiroz: “Nimasiga hayajonlanasan!”, “Qayering semiz!”. Oʻzbekchadagi “Qoʻysang-chi!” kabi suhbatdoshni tinchlantiradi. Avval feʼl yoki sifat, keyin 什么(啊), ortidan koʻpincha sabab aytiladi.", "mis": [["什么紧张啊，我们都相信你。", "紧张什么啊，我们都相信你。", "Feʼl yoki sifat 什么 dan OLDIN turadi: 紧张什么."]]}], "texts": [{"k": 1, "scene": "在校园餐厅，李文和白家月在聊天儿。", "sceneuz": "Universitet oshxonasida Li Ven va Bay Jiayue suhbatlashyapti.", "lines": [["李文", "我借的这本词典最好今天还，但是我没时间去。", "Olgan lugʻatimni bugun qaytarganim maʼqul, lekin borishga vaqtim yoʻq."], ["白家月", "下午我只有两节课，可以帮你去图书馆还书。", "Tushdan keyin faqat ikki soat darsim bor, kutubxonaga borib kitobingni qaytarib berishim mumkin."], ["李文", "那太谢谢了。你能再帮我借本书吗？", "Juda katta rahmat. Menga yana bitta kitob olib bera olasanmi?"], ["白家月", "行，你告诉我书名。", "Boʻpti, kitob nomini ayt."], ["李文", "我把名字写在纸上吧。我去了好几次图书馆，这本书都被别人借走了。", "Nomini qogʻozga yozib beray. Kutubxonaga bir necha marta bordim, bu kitobni har safar boshqalar olib ketgan boʻladi."], ["白家月", "《名人的故事》？我有这本书。明天我借给你吧。", "«Mashhur odamlar hikoyasi»mi? Menda bu kitob bor. Ertaga senga berib turaman."]]}, {"k": 2, "scene": "在校园里，白家月和安妮在聊天儿。", "sceneuz": "Universitet hududida Bay Jiayue va Anni suhbatlashyapti.", "lines": [["安妮", "今天下课早，你一会儿做什么？", "Bugun dars erta tugadi, birozdan keyin nima qilasan?"], ["白家月", "我今天忙得很，要先去图书馆借书，然后去游泳。", "Bugun juda bandman, avval kutubxonaga borib kitob olaman, keyin suzishga boraman."], ["安妮", "咱们一起走吧，我想去图书馆看看中文报纸。", "Birga boraylik, men kutubxonaga borib xitoycha gazeta oʻqimoqchiman."], ["白家月", "等等，我的校园卡不见了，没有卡进不去图书馆。", "Shoshma, talabalik kartam yoʻqolibdi, kartasiz kutubxonaga kirib boʻlmaydi."], ["安妮", "你想想上一次用是什么时候？", "Oxirgi marta qachon ishlatganingni eslab koʻr-chi?"], ["白家月", "我忘记了，可能被我放在家里了。", "Esimdan chiqibdi, uyda qoldirgan boʻlsam kerak."], ["安妮", "进不去图书馆也没关系，上网看看有没有电子书。", "Kutubxonaga kira olmasang ham mayli, internetda elektron kitobi bormi, qarab koʻr."], ["白家月", "不行，我必须去，我还得帮李文还书呢。", "Yoʻq, albatta borishim kerak, Li Venning kitobini ham qaytarib berishim kerak."]]}, {"k": 3, "scene": "在校园餐厅，李文和白家月边吃边聊。", "sceneuz": "Universitet oshxonasida Li Ven va Bay Jiayue ovqatlanib turib gaplashyapti.", "lines": [["李文", "下周学校有晚会，你知道吗？", "Kelasi hafta universitetda kecha boʻladi, bilasanmi?"], ["白家月", "知道，我和几个女生要表演一个节目。你也参加吗？", "Bilaman, men bir nechta qizlar bilan bitta chiqish qilamiz. Sen ham qatnashasanmi?"], ["李文", "我想唱中文歌，但是还没找到人一起表演，不知道怎么办。", "Xitoycha qoʻshiq aytmoqchiman, lekin birga chiqadigan odam topmadim, nima qilishni bilmayman."], ["白家月", "找不到人，你就一个人唱吧。", "Odam topolmasang, yolgʻiz oʻzing ayt."], ["李文", "一想到要在校长、老师和那么多同学面前表演，我就有些紧张。", "Rektor, ustozlar va shuncha talaba oldida chiqish qilishimni oʻylasam, biroz hayajonlanaman."], ["白家月", "紧张什么啊，我们都喜欢听你唱歌，你要相信自己。", "Nimasidan hayajonlanasan, hammamiz qoʻshigʻingni eshitishni yaxshi koʻramiz, oʻzingga ishon."]]}, {"k": 4, "scene": "在家里，白家月在写日记。", "sceneuz": "Uyda Bay Jiayue kundalik yozyapti.", "lines": [["", "昨天是我们学校的新年晚会，每个班级的同学都表演节目了。", "Kecha universitetimizning Yangi yil kechasi boʻldi, har bir guruh talabalari chiqish qilishdi."], ["", "晚会是八点开始的，差不多十二点才结束。", "Kecha soat sakkizda boshlandi, deyarli oʻn ikkidagina tugadi."], ["", "我一个晚上跟大家一起又唱又跳，开心极了，也累坏了。", "Butun kechqurun hamma bilan birga ham qoʻshiq aytdim, ham raqsga tushdim, juda xursand boʻldim, juda charchadim ham."], ["", "我最喜欢的节目是留学生们跳舞，最后老师和校长也被叫起来一块儿跳，特别有意思。", "Eng yoqqan chiqishim — chet ellik talabalarning raqsi, oxirida ustozlar va rektorni ham birga raqsga turgʻizishdi, juda qiziq boʻldi."], ["", "过几天学校的网站上会有晚会的视频，我打算再看一遍。", "Bir necha kundan keyin universitet saytida kechaning videosi chiqadi, yana bir marta koʻrmoqchiman."]]}]}, {"n": 15, "zh": "我是半个南京人", "py": "Wǒ shì bàn ge Nánjīng rén", "uz": "Men yarim nankinlikman", "words": [["蓝", "lán", "adj", "koʻk, zangori", "艹 oʻsimlik + 监: qadimda koʻk boʻyoq oʻsimlikdan olingan. 蓝天 — moviy osmon.", "", "今天的天很蓝。", "Bugun osmon juda moviy."], ["段", "duàn", "m", "(vaqt, masofa) boʻlak, davr", "一段时间 — bir muddat, 一段路 — yoʻlning bir qismi.", "一段", "您搬到蓝天小区一段时间了，觉得怎么样？", "Lantyan mavzesiga koʻchganingizga ancha boʻldi, qalay ekan?"], ["附近", "fùjìn", "n", "yaqin atrof", "附 yopishgan (阝) + 近 yaqin: “yonidagi, yaqindagi”.", "", "小区环境挺好的，附近买东西也很方便。", "Mavzening muhiti juda yaxshi, atrofda xarid qilish ham qulay."], ["马路", "mǎlù", "n", "katta koʻcha, yoʻl", "马 ot + 路 yoʻl: qadimda otlar yuradigan yoʻl. 过马路 — koʻchadan oʻtmoq.", "", "过马路就是超市。", "Koʻchadan oʻtsangiz, supermarket."], ["平时", "píngshí", "n", "odatda, oddiy kunlarda", "平 tekis, oddiy + 时 vaqt: “oddiy vaqt”.", "", "平时孩子们在哪儿玩？", "Odatda bolalar qayerda oʻynaydi?"], ["放学", "fàngxué", "v", "darsdan chiqmoq", "放 qoʻyib yubormoq + 学 maktab: maktab bolalarni “qoʻyib yubordi”. 放假 — taʼtilga chiqmoq.", "", "我每天下午四点放学。", "Har kuni soat toʻrtda darsdan chiqaman."], ["游戏", "yóuxì", "n", "oʻyin", "游 oʻynamoq, sayr + 戏 oʻyin, tomosha. 做游戏 — oʻyin oʻynamoq.", "", "孩子们放学后就在树下做游戏。", "Bolalar darsdan keyin daraxt tagida oʻyin oʻynashadi."], ["老人", "lǎorén", "n", "keksa odam, qariya", "老 qari + 人 odam.", "", "蓝天小区的老人挺多的。", "Lantyan mavzesida qariyalar koʻp."], ["根据", "gēnjù", "prep/v", "…ga koʻra, …asosida", "根 ildiz (木) + 据 asos (扌): harakatning “ildizi”, nimaga tayanib qilingani.", "", "这几年小区根据他们的需要，有了很多变化。", "Soʻnggi yillarda mavze ularning ehtiyojlariga qarab ancha oʻzgardi."], ["了解", "liǎojiě", "v", "yaxshi bilmoq, tushunmoq", "了 bu yerda liǎo (le emas!) — oxirigacha + 解 yechmoq (解决 — 11-mavzu): “oxirigacha yechib bilmoq”.", "", "假期我想去南京旅游，但是我不太了解那里。", "Taʼtilda Nankinga sayohatga bormoqchiman, lekin u yerni unchalik bilmayman."], ["可是", "kěshì", "conj", "lekin, ammo", "但是 ga yaqin, ogʻzaki nutqda koʻp ishlatiladi.", "", "我虽然不是南京人，可是我是在南京上的大学。", "Garchi nankinlik boʻlmasam ham, Nankinda universitetda oʻqiganman."], ["以上", "yǐshàng", "n", "…dan ortiq, …dan yuqori", "以 + 上 yuqori. Teskarisi — 以下 …dan kam.", "", "南京有两千年以上的历史。", "Nankinning ikki ming yildan ortiq tarixi bor."], ["有名", "yǒumíng", "adj", "mashhur", "有 bor + 名 nom: “nomi bor”. 名人 — 14-mavzu.", "", "这家饭馆在我们城市很有名。", "Bu restoran shahrimizda juda mashhur."], ["景点", "jǐngdiǎn", "n", "diqqatga sazovor joy", "景 manzara (日 quyosh) + 点 nuqta: “manzarali nuqta”.", "", "南京有很多有名的景点。", "Nankinda mashhur diqqatga sazovor joylar koʻp."], ["游客", "yóukè", "n", "sayyoh", "游 (旅游 dagi) + 客 mehmon: “sayohatdagi mehmon”.", "", "每年去旅游的游客特别多。", "Har yili u yerga sayohatga boradigan sayyohlar juda koʻp."], ["外地", "wàidì", "n", "boshqa joy (shahar, viloyat)", "外 tashqi + 地 yer: “boshqa yer”. 外地人 — boshqa shaharlik.", "", "你再告诉我一些外地人不知道的地方。", "Boshqa shaharliklar bilmaydigan yana bir nechta joyni aytib ber."], ["聊", "liáo", "v", "gaplashmoq, suhbatlashmoq", "聊天儿 (13-mavzu) ning qisqasi. 边吃边聊 — ovqatlanib turib gaplashmoq.", "", "行，下班后我请你吃晚饭，咱们边吃边聊。", "Xoʻp, ishdan keyin seni kechki ovqatga taklif qi
