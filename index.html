  return `<p class="rsub">${T.i+1} / ${T.q.length} · toʻgʻri: ${T.ok}</p>
    <div class="rq">${radGlyph(r,"xxl")}</div>
    <div class="ropts">${q.o.map(n => { const o = RADS.find(x=>x.n===n); const cls = T.a==null ? "" : n===q.n ? " ok" : n===T.a ? " bad" : ""; return `<button class="ropt${cls}" data-ropt="${n}" ${T.a!=null?"disabled":""}>${esc(o.uz)}</button>`; }).join("")}</div>
    ${T.a!=null ? `<button class="btn primary rstart" data-rnext="1">${T.i+1<T.q.length?"Keyingisi ›":"Natija"}</button>` : ""}`;
}
function radClick(e){
  const t = e.target;
  if (t.closest(".say")) return;
  const g = (a) => t.closest(`[${a}]`);
  let b;
  if (g("data-rclose")) { RK.open = null; renderRads(); return; }
  if ((b = g("data-rn"))) { hap("tap"); RK.open = +b.dataset.rn; renderRads(); say(RADS.find(r=>r.n===RK.open).c); return; }
  if ((b = g("data-rmode"))) { P.rmode = b.dataset.rmode; RK.flip = false; save(); renderRads(); return; }
  if ((b = g("data-rf"))) { P.rf = b.dataset.rf; RK.i = 0; RK.flip = false; RK.t = null; save(); renderRads(); return; }
  if ((b = g("data-rknow"))) { const n = +b.dataset.rknow; rkSet(n, !rkKnown(n)); hap("ok"); renderRads(); return; }
  if ((b = g("data-rstep"))) { const L = radList(), i = L.findIndex(r=>r.n===RK.open); const nx = L[(i + +b.dataset.rstep + L.length) % L.length]; RK.open = nx.n; renderRads(); say(nx.c); return; }
  if ((b = g("data-rgrade"))) { const deck = radList().filter(r=>!rkKnown(r.n)).concat(radList().filter(r=>rkKnown(r.n))), r = deck[RK.i % deck.length]; const ok = b.dataset.rgrade==="1"; rkSet(r.n, ok); hap(ok?"ok":"bad"); RK.flip = false; if (!ok) RK.i++; renderRads(); return; }
  if (g("data-rflip")) { RK.flip = !RK.flip; if (RK.flip) { const deck = radList().filter(r=>!rkKnown(r.n)).concat(radList().filter(r=>rkKnown(r.n))); say(deck[RK.i % deck.length].c); } renderRads(); return; }
  if (g("data-rtest")) { const L = radList(), pool = shuffle(L.slice()).slice(0,10); RK.t = {i:0, ok:0, a:null, q: pool.map(r => ({n:r.n, o: shuffle([r.n, ...shuffle(RADS.filter(x=>x.n!==r.n && x.uz!==r.uz).map(x=>x.n)).slice(0,3)])}))}; renderRads(); return; }
  if ((b = g("data-ropt"))) { const T = RK.t, q = T.q[T.i]; T.a = +b.dataset.ropt; const ok = T.a===q.n; if (ok) { T.ok++; rkSet(q.n, true); } hap(ok?"ok":"bad"); renderRads(); return; }
  if (g("data-rnext")) { const T = RK.t; T.i++; T.a = null; if (T.i>=T.q.length) T.done = true; renderRads(); return; }
}

/* ================= YOZILISHI (so'zlar qanday yoziladi) ================= */
const SPF = {all:[0,99], easy:[0,6], mid:[7,10], hard:[11,99]};
function spellLessons(){ return LESS.filter(L => (L.book||"new")===P.book && D.chars && L.words.every(w => hanzi(w[0]).every(c => D.chars[c]))); }
function renderSpell(){
  const v = $("#v-spell"), Ls = spellLessons();
  if (!Ls.length) { v.innerHTML = `<p class="intro">Bu kitob uchun “Yozilishi” maʼlumoti hozircha yoʻq: hozircha faqat 新HSK 8-mavzu tayyor. Soʻzlarni “Yodlash” boʻlimida 5 qadam bilan oʻrganishing mumkin.</p>`; return; }
  if (!Ls.some(L=>L.n===P.spellL)) P.spellL = Ls[Ls.length-1].n;
  const L = Ls.find(x=>x.n===P.spellL), f = SPF[P.spellF||"all"] || SPF.all;
  const words = WORDS.filter(w => w.L===L.n);
  const chars = [...new Set(words.flatMap(w => hanzi(w.hz)))];
  const avg = Math.round(chars.reduce((a,c)=>a+D.chars[c][0],0)/chars.length*10)/10;
  const top = chars.slice().sort((a,b)=>D.chars[b][0]-D.chars[a][0]).slice(0,4);
  const list = words.filter(w => { const m = Math.max(...hanzi(w.hz).map(c=>D.chars[c][0])); return m>=f[0] && m<=f[1]; });
  v.innerHTML = `<div style="--lc:${lc(L.n)}">
    <h2 class="h2"><span class="zh">写法</span>${lname(L.n)}: soʻzlar qanday yoziladi</h2>
    ${Ls.length>1?`<div class="row"><span class="lbl">Mavzu</span><div class="seg" data-p="spellL">${Ls.map(x=>`<button data-v="${x.n}" aria-pressed="${x.n===L.n}">${x.n}</button>`).join("")}</div></div>`:""}
    <div class="tiles"><div><b>${words.length}</b>soʻz</div><div><b>${chars.length}</b>ierogif</div><div><b>${avg}</b>oʻrtacha chiziq</div><div><b lang="zh">${top.join("")}</b>eng murakkablari</div></div>
    <div class="row"><span class="lbl">Saralash</span><div class="seg" data-p="spellF">${[["all","Hammasi"],["easy","Oson (≤6)"],["mid","Oʻrta (7–10)"],["hard","Murakkab (11+)"]].map(([k,t])=>`<button data-v="${k}" aria-pressed="${(P.spellF||"all")===k}">${t}</button>`).join("")}</div></div>
    ${list.map(w => `<article class="sp">
      <div class="sph">${tzg(w.hz,"")}<div><div class="py">${esc(w.py)}</div><div class="uz">${esc(w.uz)}</div></div>${sayBtn(w.tts)}<button class="btn sm" data-spr="${w.id}">Mashq</button></div>
      <div class="spc">${hanzi(w.hz).map(c => { const d = D.chars[c]; return `<div class="cx"><span class="tzg"><span class="c"><span>${esc(c)}</span></span></span><div><b>${d[0]} ta chiziq</b> <span class="sub" style="display:inline">${esc(d[1])}</span><p class="fm" lang="zh">${esc(d[2])}</p><p><span class="lbl">Tartib:</span> ${esc(d[3])}</p><p class="tp">${esc(d[4])}</p></div></div>`; }).join("")}</div>
      ${w.hook?`<p class="spx"><span class="lbl">Ilmoq:</span> ${esc(w.hook)}</p>`:""}
      ${w.ex?`<p class="spx"><span lang="zh">${hl(w.ex,w.hz)}</span><br>${esc(w.exu)}</p>`:""}
    </article>`).join("") || `<p class="empty">Bu guruhda soʻz yoʻq.</p>`}
  </div>`;
}

function renderTips(){

  const rads = D.radicals.map(r => {
    const ws = []; const seen = new Set();
    [...r[3]].forEach(c => (vocabChars.get(c)||[]).forEach(w => { if (!seen.has(w.id)) { seen.add(w.id); ws.push(w); } }));
    return {r, ws};
  }).filter(x => x.ws.length).sort((a,b)=>b.ws.length-a.ws.length);

    <article class="tip"><h3>Soʻz oilalari: bitta ierogif — koʻp soʻz</h3><p>HSK 5 soʻzlarining koʻpi tanish ierogiflardan tuzilgan. Bitta ierogifning maʼnosini bilsang, butun oilani bir vaqtda eslab qolasan.</p>
      <div class="fams">${fam.map(([c, ws]) => `<div class="fam"><span class="fc1" lang="zh">${esc(c)}</span><div>${ws.slice(0,8).map(w=>`<span class="fw"><span lang="zh">${esc(w.hz)}</span> ${esc(w.uz)}</span>`).join("")}${ws.length>8?`<span class="fw sub">+${ws.length-8}</span>`:""}</div></div>`).join("")}</div>
      <p class="sub">Tanlangan toʻplamlardagi soʻzlar asosida. Barcha 22 toʻplamni tanlasang, eng katta oilalar chiqadi.</p></article>` : "";
  $("#v-tips").innerHTML = h5html + `
    <h2 class="h2">Ierogifni yodlash metodikasi: 5 qadam</h2>
    <p class="intro">“Yodlash” boʻlimidagi “5 qadam” rejimi aynan shu tartibda ishlaydi. Har bir yangi soʻzga 3–5 daqiqa ket, kuniga 8–10 ta yangi soʻz yetarli.</p>
    <ol class="guide">
      <li><div><b>Koʻr va eshit</b>Ierogifga, pinyinga va maʼnoga birga qara, soʻzni 3 marta ovoz chiqarib ayt, tonni qoʻl bilan havoda chiz. Koʻz, quloq va qoʻl birga ishlasa, xotira kuchliroq boʻladi.</div></li>
      <li><div><b>Boʻlaklarga ajrat</b>Ierogifni radikallarga boʻl (氵 suv, 扌 qoʻl…) va ulardan qisqa hikoya toʻqi: 饿 = 饣 ovqat + 我 men, “men ovqat istayman”. Maʼnosiz chiziqlar emas, hikoya eslab qolinadi.</div></li>
      <li><div><b>Ustidan yoz</b>Namuna ustidan 3 marta yoz, chiziqlarni tartib bilan va nomi bilan ayt. Bu qoʻlga toʻgʻri harakatni oʻrgatadi.</div></li>
      <li><div><b>Xotiradan yoz va tekshir</b>Namunani yop, xotiradan yoz, keyin solishtir. Aynan shu “qiynalib eslash” soʻzni mustahkamlaydi. Xato boʻlsa — yana bir marta ustidan, keyin yana xotiradan.</div></li>
      <li><div><b>Gapda ishlat va vaqtida takrorla</b>Soʻzni misol gap bilan oʻqi va oʻzing gap tuz. Keyin soʻz kartalarga tushadi: 1, 3, 7, 14, 30 kundan keyin takrorlanadi.</div></li>
    </ol>
    <h2 class="h2">Qoʻshimcha usullar</h2>
    <ol class="guide">
      <li><div><b>Juftlarni birga oʻrgan</b>Chalkash soʻzlarni (迟到/晚点, 就/才, 矮/短) alohida emas, birga, farqini aytib oʻrgan. Pastdagi “Adashtirma!” roʻyxati shu uchun.</div></li>
      <li><div><b>Kechqurun takror, ertalab tekshir</b>Uyqu oldidan qilingan takror tunda mustahkamlanadi; ertalab kartalarda tekshirib koʻr.</div></li>
      <li><div><b>Xatolaringdan boshla</b>“Statistika”dagi eng qiyin soʻzlarni har kuni birinchi boʻlib yoz va kartalarda takrorla.</div></li>
      <li><div><b>Oʻzing haqingda gap tuz</b>Yangi soʻzni oʻz hayoting bilan bogʻla: 我每天骑自行车去学校。 Shaxsiy gap darslikdagisidan yaxshiroq eslab qolinadi.</div></li>
    </ol>
    <h2 class="h2">Kunlik 15 daqiqalik reja</h2>
    <ol class="guide">
      <li><div><b>Kartalar, 5 daqiqa</b>“Takrorni boshlash”: faqat vaqti kelgan kartalar chiqadi.</div></li>
      <li><div><b>Yodlash, 5 daqiqa</b>“5 qadam” bilan 1–2 ta yangi soʻz.</div></li>
      <li><div><b>Mashqlar, 5 daqiqa</b>Bitta soʻz mashqi va bitta grammatika mashqi (“Gap tuz”).</div></li>
      <li><div><b>Chatga tashla</b>“Statistika”dagi eng qiyin soʻzlarni nusxalab Claude'ga yubor: ular bilan gap tuzish va tarjima mashqlari qilamiz.</div></li>
    </ol>
    <h2 class="h2"><span class="zh">部首</span>Radikallar: 1–8-mavzulardagi qismlar</h2>
    <p class="intro">Har bir qism maʼnoga ishora qiladi. Pastda shu qism uchraydigan, sen oʻrgangan soʻzlar.</p>
    <div>${rads.map(({r,ws})=>`<div class="rad"><span class="rg" lang="zh">${esc(r[0])}</span><div><div class="rn">${esc(r[2])}<small>${esc(r[1])}</small></div><div class="rw">${ws.slice(0,14).map(w=>`<span style="--lc:${lc(w.L)}"><span lang="zh">${esc(w.hz)}</span>${esc(w.uz.split(/[;,(]/)[0])}</span>`).join("")}</div></div></div>`).join("")}</div>

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea")) return;
  if (P.tab==="cards" && session && !session.finished) {
    if ((e.key===" "||e.key==="Enter") && !session.revealed) { e.preventDefault(); reveal(); }
    else if (session.revealed && ["1","2","3"].includes(e.key)) { e.preventDefault(); grade({"1":"again","2":"hard","3":"good"}[e.key]); }
    else if (e.key==="Escape") { session=null; renderSetup(); }
  } else if (P.tab==="ex" && X && !X.done && ["mean","hanzi","tone","listen","fill"].includes(X.type)) {
    if (!X.answered && ["1","2","3","4"].includes(e.key)) { const b = document.querySelector(`[data-opt="${+e.key-1}"]`); if (b) b.click(); }
    else if (X.answered && (e.key==="Enter"||e.key===" ")) { e.preventDefault(); const b = document.querySelector('[data-act="exNext"]'); if (b) b.click(); }
  }
});

/* ---------- statistika: kim kirdi, qancha vaqt (server/worker.js) ---------- */
(function(){
  if (!STATS_URL || !TG) return;
  const sid = (Math.random().toString(36).slice(2) + Date.now().toString(36)).slice(0, 30);
  let vis = document.visibilityState === "visible", t0 = Date.now(), acc = 0;
  function send(beacon){
    const n = Date.now(); if (vis) acc += n - t0; t0 = n;
    const d = Math.round(acc / 1000); acc -= d * 1000;
    const body = JSON.stringify({init: TG.initData, sid, d, p: TG.platform || ""});
    try { if (beacon && navigator.sendBeacon) navigator.sendBeacon(STATS_URL + "/ping", body); else fetch(STATS_URL + "/ping", {method:"POST", body, keepalive:true}).catch(()=>{}); } catch(_) {}
  }
  send(false);
  setInterval(() => { if (vis) send(false); }, 60000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { send(true); vis = false; } else { vis = true; t0 = Date.now(); } });
})();
</script>
