 "zhòngyào", "adj", "muhim", "重 ogʻir + 要 kerak: ogʻir va kerak narsa muhim boʻladi.", "", "这件事很重要。", "Bu ish juda muhim."], ["着急", "zháojí", "adj", "xavotirlanmoq, asabiylashmoq", "急 pastida 心 yurak: yurak tez-tez urayapti.", "", "别着急，慢慢说。", "Xavotir olma, sekin gapir."], ["护照", "hùzhào", "n", "pasport", "护 himoya + 照 rasm: rasmli himoya hujjati. 照 5-mavzuda yana chiqadi.", "", "我的护照不见了。", "Pasportim yoʻqolib qoldi."], ["服务台", "fúwùtái", "n", "maʼlumot (xizmat) stoykasi", "服务 xizmat (2-mavzu) + 台 stol, peshtaxta.", "", "我们去服务台问问吧。", "Maʼlumot stoykasiga borib soʻraylik."], ["应该", "yīnggāi", "mod", "kerak, lozim", "你应该休息。 — Dam olishing kerak.", "", "你应该多休息。", "Koʻproq dam olishing kerak."], ["站", "zhàn", "v", "turmoq (tik)", "立 — tik turgan odam. 车站 — avtobus “turadigan” joy, bekat.", "", "他站在门口。", "U eshik oldida turibdi."], ["中间", "zhōngjiān", "n", "oʻrta, oʻrtasi", "中 oʻrta + 间 oraliq.", "", "站在中间的是我哥哥。", "Oʻrtada turgan — mening akam."], ["短", "duǎn", "adj", "qisqa", "矢 oʻq: oʻq qisqa narsa. Teskarisi — 长 cháng.", "", "她的头发很短。", "Uning sochi juda kalta."], ["头发", "tóufa", "n", "soch", "头 bosh + 发: boshdan oʻsib chiqadigan narsa.", "", "你的头发真漂亮。", "Sochlaring juda chiroyli."], ["年轻", "niánqīng", "adj", "yosh (yigit, qiz)", "年 yil + 轻 yengil: yillari hali yengil.", "", "那个老师很年轻。", "Oʻsha oʻqituvchi juda yosh."], ["发现", "fāxiàn", "v", "payqamoq, topmoq", "我发现我的护照不见了。 — Pasportim yoʻqolganini payqadim.", "", "我发现我的护照不见了。", "Pasportim yoʻqolganini payqadim."], ["不见", "bújiàn", "v", "yoʻqolib qolmoq", "“Koʻrinmay qoldi”, yaʼni yoʻqoldi. Odatda 了 bilan: 不见了。", "", "我的手机不见了。", "Telefonim yoʻqolib qoldi."], ["带", "dài", "v", "olib yurmoq, oʻzi bilan olmoq", "你带护照了吗？ — Pasportni oldingmi?", "", "你带护照了吗？", "Pasportni olib oldingmi?"], ["帮助", "bāngzhù", "v", "yordam bermoq", "助 ichida 力 kuch: kuch berish.", "", "他常常帮助我。", "U menga tez-tez yordam beradi."], ["照片", "zhàopiàn", "n", "fotosurat", "照 + 片 varaq: rasm tushirilgan varaq.", "", "这是我家人的照片。", "Bu oilamning rasmi."]], "grammar": [{"zh": "看上去 / 看起来", "uz": "…koʻrinadi", "f": ["ega + 看上去 / 看起来 + sifat"], "ex": "Odam yoki narsaning tashqi koʻrinishi, holati haqidagi taassurot: “koʻrinishidan…”, “…ga oʻxshab koʻrinadi”.", "eg": [["他们看上去有点儿像。", "Ular bir-biriga biroz oʻxshab koʻrinadi.", "他们:S|看上去:K|有点儿:D|像:P", 0], ["这些菜看起来都很好吃。", "Bu taomlarning hammasi mazali koʻrinadi.", "这些菜:S|看起来:K|都:D|很好吃:P", 0], ["那个新来的老师看上去很年轻。", "Yangi kelgan oʻqituvchi juda yosh koʻrinadi.", "那个:A|新来的:A|老师:S|看上去:K|很年轻:P", 0], ["你看起来有点儿着急。", "Sen biroz xavotirdagidek koʻrinasan.", "你:S|看起来:K|有点儿:D|着急:P", 1], ["他看上去比我年轻。", "U mendan yoshroq koʻrinadi.", "他:S|看上去:K|比我:D|年轻:P", 1]], "why": "看 — koʻrmoq, 上去/起来 esa bu yerda “qaraganda” degan maʼnoni beradi. Shuning uchun gap aniq faktni emas, soʻzlovchining taassurotini bildiradi. Tartib doim: ega → 看上去/看起来 → sifat.", "mis": []}, {"zh": "疑问代词的非疑问用法（1）", "uz": "Soʻroq olmoshlari noaniq maʼnoda", "f": ["哪儿 / 什么 / 谁 / 哪 = qayerdadir / nimadir / kimdir / qaysidir"], "ex": "Soʻroq olmoshi darak gapda kelsa, soʻroq emas, noaniq joy, narsa yoki odamni bildiradi.", "eg": [["我好像在哪儿看到过这个箱子。", "Bu chamadonni qayerdadir koʻrgandekman.", "我:S|好像:D|在哪儿:K|看到过:P|这个箱子:O", 0], ["你吃点儿什么再走吧。", "Biror narsa yeb, keyin ket.", "你:S|吃点儿什么:K|再:D|走吧:P", 0], ["我们哪天一起去踢足球吧。", "Qaysidir kuni birga futbol oʻynagani boraylik.", "我们:S|哪天:K|一起:D|去踢足球吧:P", 0], ["我好像在哪儿见过你。", "Seni qayerdadir koʻrgandekman.", "我:S|好像:D|在哪儿:K|见过:P|你:O", 1]], "why": "Gapda soʻroq ohangi va 吗 boʻlmasa, soʻroq olmoshi “noaniq” maʼnoga oʻtadi: 什么 — nimadir, 哪儿 — qayerdadir. Oʻzbekchada “kim” → “kimdir” boʻlish uchun qoʻshimcha kerak; xitoychada soʻz oʻzgarmaydi, maʼnoni kontekst beradi.", "mis": []}, {"zh": "多项定语", "uz": "Bir nechta aniqlovchi", "f": ["vaqt / joy → harakat / holat → xususiyat + 的 + ot"], "ex": "Otdan oldin bir nechta aniqlovchi kelsa, tartibi odatda shunday: avval vaqt yoki joy, keyin harakat yoki holat, oxirida xususiyat. Son + hisob soʻz (两个, 那件) harakat-holatdan oldin ham, keyin ham kelaveradi.", "eg": [["李文是那个穿着黑衣服的短头发的年轻人吗？", "Li Ven oʻsha qora kiyimli, qisqa sochli yigitmi?", "李文:S|是:P|那个:A|穿着黑衣服的:A|短头发的:A|年轻人吗:O", 0], ["昨天和家月一起看电影的两个人是我的朋友。", "Kecha Jiayue bilan kino koʻrgan ikki kishi mening doʻstlarim.", "昨天:A|和家月一起:A|看电影的:A|两个人:S|是我的朋友:P", 0], ["我那件新买的白色的衣服在哪儿？", "Mening oʻsha yangi olgan oq kiyimim qayerda?", "我:A|那件:A|新买的:A|白色的:A|衣服:S|在哪儿:P", 0], ["那个站在中间的短头发的人是我哥哥。", "Oʻrtada turgan, qisqa sochli oʻsha odam — mening akam.", "那个:A|站在中间的:A|短头发的:A|人:S|是我哥哥:P", 1]], "why": "Otga qanchalik yaqin tursa, belgi shunchalik “doimiy” boʻladi: rang, xususiyat otning yonida; vaqt va “kim, nima qilgani” esa uzoqroqda. Har bir aniqlovchi guruhini 的 ajratib turadi.", "mis": [["我那件白色的新买的衣服", "我那件新买的白色的衣服", "Harakat-holat (新买的) xususiyatdan (白色的) oldin keladi."]]}], "texts": [{"k": 1, "scene": "在家里，刘明和王一雪在沙发上聊天儿。", "sceneuz": "Uyda Lyu Min va Van Isyue divanda suhbatlashyapti.", "lines": [["刘明", "这是杨同乐吗？他怎么跟白家月在一起？", "Bu Yan Tunlemi? U nega Bay Jiayue bilan birga?"], ["王一雪", "他不是杨同乐，他叫李文，是白家月的好朋友。", "U Yan Tunle emas, uning ismi Li Ven, Bay Jiayuening yaqin doʻsti."], ["刘明", "我还以为是同乐呢，他们看上去有点儿像。", "Men Tunle deb oʻylabman, ular bir-biriga biroz oʻxshar ekan."], ["王一雪", "是长得有点儿像，但是他比同乐高，身高有一米八。", "Ha, biroz oʻxshaydi, lekin u Tunledan baland, boʻyi bir metr sakson."], ["刘明", "看起来也比同乐瘦一点儿。", "Tunledan biroz ozgʻinroq ham koʻrinadi."], ["王一雪", "下个星期家月和李文要来北京，我去机场接他们。", "Kelasi hafta Jiayue va Li Ven Pekinga kelishadi, men aeroportga borib ularni kutib olaman."], ["刘明", "他们哪天到北京？我跟你一起去机场接他们吧。", "Ular qaysi kuni Pekinga yetib kelishadi? Sen bilan birga aeroportga borib kutib olay."]]}, {"k": 2, "scene": "在机场，李文和白家月在行李领取处。", "sceneuz": "Aeroportda Li Ven va Bay Jiayue yuk olish joyida turibdi.", "lines": [["白家月", "我的行李怎么还没出来？是不是丢了？", "Yukim nega hali chiqmadi? Yoʻqolib qoldimikan?"], ["李文", "你的行李箱是什么样的？", "Chamadoning qanaqa?"], ["白家月", "是一个黑色的箱子，上面写着我的名字和电话号码。", "Qora rangli chamadon, ustiga ismim va telefon raqamim yozilgan."], ["李文", "我好像在哪儿看到过这个箱子，是不是有人拿错了？", "Bu chamadonni qayerdadir koʻrgandek boʻldim, birov adashib olib ketmadimikan?"], ["白家月", "我们快找谁问一下吧，箱子里有不少重要的东西。", "Tezroq birortasidan soʻraylik, chamadonda muhim narsalar koʻp."], ["李文", "别着急，我们拿着护照和机票，去服务台问问吧。", "Xavotir olma, pasport va chiptani olib, xizmat koʻrsatish boʻlimidan soʻraylik."]]}, {"k": 3, "scene": "在机场大厅，刘明和王一雪接机。", "sceneuz": "Aeroport zalida Lyu Min va Van Isyue mehmonlarni kutib turibdi.", "lines": [["刘明", "飞机早就到了，你看见白家月他们了吗？", "Samolyot allaqachon qoʻngan, Bay Jiayuelarni koʻrdingmi?"], ["王一雪", "没有，他们应该快出来了。", "Yoʻq, hozir chiqib qolishsa kerak."], ["刘明", "我们站到中间去吧，这样他们好找一些。", "Oʻrtaga borib turaylik, shunda bizni osonroq topishadi."], ["王一雪", "你看那个高个子的人是李文吗？", "Qara, anavi baland boʻyli odam Li Ven emasmi?"], ["刘明", "你说的是哪个？那个穿着黑衣服的短头发的年轻人？", "Qaysi birini aytyapsan? Anavi qora kiyimli, kalta sochli yigitnimi?"], ["王一雪", "对，那个人就是李文！你看，家月在他后面呢。", "Ha, oʻsha odam Li Ven! Qara, Jiayue uning orqasida."]]}, {"k": 4, "scene": "在宾馆房间，李文在写日记。", "sceneuz": "Mehmonxona xonasida Li Ven kundalik yozyapti.", "lines": [["", "昨天我到北京了。", "Kecha Pekinga yetib keldim."], ["", "虽然路上花了十几个小时，但是跟家月坐在一起，我觉得时间过得很快。", "Yoʻlda oʻn necha soat ketgan boʻlsa ham, Jiayue bilan birga oʻtirganim uchun vaqt tez oʻtgandek tuyuldi."], ["", "到机场的时候，家月发现行李箱不见了，我带她去服务台，帮助她找到了行李箱。", "Aeroportga yetganda Jiayue chamadoni yoʻqligini payqadi, men uni xizmat boʻlimiga olib borib, chamadonini topishga yordam berdim."], ["", "走出机场的时候，已经八点多了，我们一出来就看见了王老师的姐姐，她看起来比照片上年轻。", "Aeroportdan chiqqanimizda soat sakkizdan oshgan edi, chiqishimiz bilan Van ustozning opasini koʻrdik, u suratdagidan yoshroq koʻrinardi."], ["", "晚上，一雪姐带我们去吃了一家很好吃的中国菜。", "Kechqurun Isyue opa bizni juda mazali xitoy taomlari restoraniga olib bordi."]]}]}, {"n": 2, "zh": "你们想吃什么就点什么", "py": "Nǐmen xiǎng chī shénme jiù diǎn shénme", "uz": "Nima yegingiz kelsa, oʻshani buyurtma qiling", "words": [["菜单", "càidān", "n", "menyu", "菜 taom + 单 roʻyxat.", "", "服务员，请给我们菜单。", "Ofitsiant, bizga menyu bering."], ["又", "yòu", "adv", "ham (又……又……)", "又饿又渴 — ham och, ham chanqagan.", "", "这个菜又好吃又便宜。", "Bu taom ham mazali, ham arzon."], ["饿", "è", "adj", "och (qorni)", "饣 ovqat + 我 men: “men ovqat istayman” — ochman!", "", "我饿了，我们去吃饭吧。", "Qornim ochdi, ovqatlangani boraylik."], ["渴", "kě", "adj", "chanqagan", "氵 suv belgisi: suv kerak.", "", "我很渴，想喝水。", "Juda chanqadim, suv ichgim keladi."], ["客气", "kèqi", "v/adj", "xushmuomala; tortinmoq", "不客气 — arzimaydi. 别客气 — tortinma.", "", "别客气，多吃点儿。", "Tortinma, koʻproq ye."], ["饮料", "yǐnliào", "n", "ichimlik", "饮 — ichmoq (饣 ovqat-ichimlik belgisi bor).", "", "你想喝什么饮料？", "Qanday ichimlik ichasan?"], ["好久", "hǎojiǔ", "adj", "uzoq vaqt", "好久不见 — koʻrishmaganimizga ancha boʻldi. 久 4-mavzuda yana chiqadi.", "", "好久不见！", "Koʻrishmaganimizga ancha boʻldi!"], ["服务", "fúwù", "v", "xizmat qilmoq", "服务员 — ofitsiant, 服务台 — xizmat stoykasi (1-mavzu).", "", "这家饭馆的服务很好。", "Bu restoranning xizmati juda yaxshi."], ["员", "yuán", "suf", "…chi (shaxs qoʻshimchasi)", "Oʻzbekchadagi “-chi”ga oʻxshaydi: 服务员 — xizmatchi, ofitsiant.", "服务员", "他是这家饭馆的服务员。", "U shu restoranning ofitsianti."], ["双", "shuāng", "m", "juft (hisob soʻz)", "又 + 又: ikkita qoʻl yonma-yon — juft. 一双筷子, 一双鞋。", "一双筷子", "请给我一双筷子。", "Iltimos, menga bir juft choʻp bering."], ["筷子", "kuàizi", "n", "choʻp tayoqchalar", "⺮ bambuk + 快 tez: tez yeyish uchun bambuk.", "", "你会用筷子吗？", "Choʻp bilan ovqatlana olasanmi?"], ["勺子", "sháozi", "n", "qoshiq", "勺 shaklining oʻzi qoshiq, ichida bitta tomchi.", "", "我不会用筷子，给我一个勺子吧。", "Choʻp ishlata olmayman, menga qoshiq bering."], ["碗", "wǎn", "n", "kosa", "石 tosh: tosh yoki sopol idish.", "", "我想要一碗米饭。", "Bir kosa guruch istayman."], ["马上", "mǎshàng", "adv", "darhol", "“Ot ustida”: otliq odam tez yetib keladi. 马 4-mavzuda alohida chiqadi.", "", "我马上就来。", "Hozir kelaman."], ["热情", "rèqíng", "adj", "samimiy, mehmondoʻst", "热 issiq + 情 his: issiq munosabat.", "", "这里的人都很热情。", "Bu yerdagi odamlar juda samimiy."], ["尝", "cháng", "v", "tatib koʻrmoq", "Koʻpincha takrorlanadi: 尝尝 — tatib koʻr.", "", "你尝尝这个菜。", "Shu taomni tatib koʻr."], ["记", "jì", "v", "eslab qolmoq", "讠 soʻz belgisi: soʻzni yozib qoʻyish. Sen hozir aynan shu ishni qilyapsan: 记生词!", "", "你要记好这些生词。", "Bu yangi soʻzlarni yaxshilab eslab qolishing kerak."], ["用", "yòng", "v", "ishlatmoq; (hurmat bilan) tanovul qilmoq", "请用 — marhamat, oling (ovqat).", "", "我可以用一下你的手机吗？", "Telefoningni bir ishlatsam boʻladimi?"], ["鸡", "jī", "n", "tovuq", "鸟 qush belgisi.", "", "我喜欢吃鸡。", "Tovuq goʻshtini yaxshi koʻraman."], ["张", "zhāng", "m", "varaqsimon narsalar hisob soʻzi", "弓 kamon + 长 uzun: tortib yoyilgan yassi narsa. 一张纸, 一张照片。", "一张照片", "我买了两张电影票。", "Ikkita kino chiptasi oldim."], ["不用", "búyòng", "adv", "kerak emas, hojati yoʻq", "不用谢 — rahmatga hojat yoʻq.", "", "明天不用去学校。", "Ertaga maktabga borish shart emas."], ["选", "xuǎn", "v", "tanlamoq", "辶 yurish + 先 avval (4-mavzu): avval yurib koʻr, keyin tanla.", "", "你选一个吧。", "Bittasini tanla."], ["外卖", "wàimài", "n/v", "yetkaziladigan ovqat; ovqat yetkazmoq", "外 tashqari + 卖 sotmoq: tashqariga sotiladigan ovqat.", "", "我们今天点外卖吧。", "Bugun ovqatni uyga buyurtma qilaylik."], ["方便", "fāngbiàn", "adj", "qulay", "方便面 shundan: “qulay lagʻmon”.", "", "坐地铁很方便。", "Metroda yurish juda qulay."], ["蛋糕", "dàngāo", "n", "tort", "蛋 tuxum + 糕 pishiriq (ichida 米 bor).", "", "这是你的生日蛋糕。", "Bu sening tugʻilgan kun tortingdir."], ["只", "zhǐ", "adv", "faqat", "我只有一个箱子。 — Faqat bitta chamadonim bor.", "只有", "我只有一百块钱。", "Menda faqat yuz yuan bor."], ["方便面", "fāngbiànmiàn", "n", "tez tayyorlanadigan lagʻmon", "“Qulay lagʻmon”: 方便 + 面.", "", "他每天只吃方便面。", "U har kuni faqat tez tayyorlanadigan lagʻmon yeydi."], ["简单", "jiǎndān", "adj", "oddiy, oson", "", "", "这个问题很简单。", "Bu savol juda oson."]], "grammar": [{"zh": "又……又……", "uz": "Ham…, ham…", "f": ["又 + sifat₁ + 又 + sifat₂"], "ex": "Odam yoki narsada bir vaqtda ikkita xususiyat borligini bildiradi.", "eg": [["我现在还真是又饿又渴。", "Hozir rostdan ham ochman, ham chanqaganman.", "我:S|现在:D|还真是:D|又饿:K|又渴:K", 0], ["那个女孩儿又高又漂亮。", "U qizning boʻyi ham baland, oʻzi ham chiroyli.", "那个女孩儿:S|又高:K|又漂亮:K", 0], ["这个房子又大又干净。", "Bu uy ham katta, ham toza.", "这个房子:S|又大:K|又干净:K", 1]], "why": "又 — “yana”: “yana bu, yana u” deb bitta narsaga ikki xususiyatni qoʻshadi. Shuning uchun ikkala sifat bir yoʻnalishda boʻlishi kerak: ikkalasi ham yaxshi yoki ikkalasi ham yomon.", "mis": [["这个菜又好吃又贵。", "这个菜又好吃又便宜。", "Ikkala sifat bir ohangda boʻlishi kerak. Qarama-qarshi boʻlsa 但是 ishlatiladi: 好吃，但是有点儿贵。"]]}, {"zh": "疑问代词的非疑问用法（2）", "uz": "Soʻroq olmoshi + 都 = “har qanday”", "f": ["哪 / 哪儿 / 什么 / 谁 / 怎么 … + 都"], "ex": "Bu yerda 谁 — har kim, 什么 — har narsa, 哪儿 — har qayer degani. Gapda koʻpincha 都 bilan keladi.", "eg": [["哪个菜都好吃。", "Qaysi taom boʻlsa ham mazali.", "哪个:K|菜:S|都:K|好吃:P", 0], ["这次旅游，我去哪儿都可以。", "Bu safar qayerga borsam ham boʻlaveradi.", "这次旅游，:D|我:S|去哪儿:K|都:K|可以:P", 0], ["我下午有时间，你想什么时候来都没问题。", "Tushdan keyin vaqtim bor, qachon kelsang ham muammo yoʻq.", "我下午有时间，:N|你想:S|什么时候:K|来:P|都没问题:K", 0], ["你什么时候来都行。", "Qachon kelsang ham boʻlaveradi.", "你:S|什么时候:K|来:P|都:K|行:P", 1]], "why": "Bu yerda soʻroq olmoshi “har qanday”ni ochadi, 都 esa “hammasi” deb yopadi: “qaysi boʻlsa ham — hammasi”. Inkorda ham ishlaydi: 什么都不想吃 — hech narsa yegim kelmayapti.", "mis": [["我都去哪儿可以。", "我去哪儿都可以。", "都 doim soʻroq olmoshidan KEYIN, kesimdan oldin turadi."]]}, {"zh": "疑问代词的非疑问用法（3）", "uz": "Ikki bir xil soʻroq olmoshi: “qaysi…, oʻsha…”", "f": ["…什么…，(ega) 就…什么"], "ex": "Bir xil soʻroq olmoshi ikki marta kelib, bitta narsaga ishora qiladi. Ikkala qismning egasi bir xil boʻlsa, ikkinchisi tushib qoladi; har xil boʻlsa, ikkinchi ega 就 dan oldin turadi.", "eg": [["你们想吃什么就点什么。", "Nima yegingiz kelsa, oʻshani buyurtma qiling.", "你们:S|想吃:P|什么:K|就点:K|什么:K", 0], ["你觉得哪个好看就买哪个。", "Qaysi biri chiroyli tuyulsa, oʻshani ol.", "你觉得:S|哪个:K|好看:P|就买:K|哪个:K", 0], ["你想去哪儿，我们就去哪儿。", "Qayerga borging kelsa, oʻsha yerga boramiz.", "你:S|想去:P|哪儿，:K|我们:S|就去:K|哪儿:K", 0], ["你想选哪个就选哪个。", "Qaysi birini tanlaging kelsa, oʻshani tanla.", "你:S|想选:P|哪个:K|就选:K|哪个:K", 1]], "why": "Ikkala soʻroq olmoshi bitta narsaga ishora qiladi: “nimani xohlasang — oʻshani”. 就 ikki qismni “shunday boʻlsa — mana bunday” deb bogʻlaydi.", "mis": [["你想吃什么就点哪个。", "你想吃什么就点什么。", "Ikkala qismda aynan bir xil soʻroq olmoshi boʻlishi kerak."]]}], "texts": [{"k": 1, "scene": "在饭馆，王一雪、刘明、白家月和李文在点菜。", "sceneuz": "Restoranda Van Isyue, Lyu Min, Bay Jiayue va Li Ven taom buyurtma qilyapti.", "lines": [["王一雪", "家月、李文，你们看看菜单，想吃点儿什么？", "Jiayue, Li Ven, menyuni koʻringlar, nima yegilaring keladi?"], ["李文", "谢谢一雪姐，我都可以，你们点吧。", "Rahmat, Isyue opa, menga hammasi boʻlaveradi, sizlar buyurtma qilinglar."], ["白家月", "飞了这么远，现在还真是又饿又渴。", "Shuncha uzoqdan uchib keldik, hozir chindan ham qornim och, chanqaganman ham."], ["王一雪", "那多点点儿，别客气。你们喝什么饮料？", "Unda koʻproq buyurtma qilinglar, tortinmanglar. Qanday ichimlik ichasizlar?"], ["白家月", "好久没喝中国茶，也好久没吃饺子了。我想喝绿茶、吃饺子，可以吗？", "Ancha vaqtdan beri xitoy choyi ichmadim, chuchvara ham yemadim. Koʻk choy ichib, chuchvara yesam boʻladimi?"], ["王一雪", "没问题。你们看看还想吃什么。", "Muammo yoʻq. Yana nima yegilaring kelishini koʻringlar."]]}, {"k": 2, "scene": "在饭馆，王一雪、刘明、白家月和李文一起吃饭。", "sceneuz": "Restoranda Van Isyue, Lyu Min, Bay Jiayue va Li Ven birga ovqatlanyapti.", "lines": [["王一雪", "服务员，再给我们拿一双筷子、一个勺子和一个碗。", "Ofitsiant, bizga yana bitta juft choʻp, bitta qoshiq va bitta kosa olib keling."], ["服务员", "好的，请等一下，我马上去拿。", "Xoʻp, biroz kuting, hozir olib kelaman."], ["王一雪", "这家饭馆的服务很热情，菜也都做得很好吃。你们尝尝，看喜不喜欢这些菜。", "Bu restoranning xizmati juda samimiy, taomlari ham mazali. Tatib koʻringlar, bu taomlar yoqadimi."], ["白家月", "哪个菜都好吃。您点的这些菜真不错。", "Hamma taom mazali. Siz buyurtma qilgan taomlar juda zoʻr."], ["王一雪", "这里的饭菜又便宜又好吃，我们经常来，服务员都记住我们爱吃的菜了。", "Bu yerning taomlari ham arzon, ham mazali, biz tez-tez kelamiz, ofitsiantlar biz yaxshi koʻradigan taomlarni eslab qolishgan."], ["服务员", "王姐，您经常来吃饭，今天送您一些水果，请慢用。", "Van opa, siz tez-tez ovqatlangani kelasiz, bugun sizga meva sovgʻa qilamiz, yoqimli ishtaha."]]}, {"k": 3, "scene": "在饭馆，王一雪、刘明、白家月和李文继续边吃边聊。", "sceneuz": "Restoranda Van Isyue, Lyu Min, Bay Jiayue va Li Ven ovqatlanib turib suhbatni davom ettiryapti.", "lines": [["白家月", "这个鸡肉饭太好吃了，我要再来吃一次。", "Bu tovuqli palov juda mazali ekan, yana bir marta yegani kelaman."], ["李文", "你可以拿走这张菜单，看看下次还吃点儿什么。", "Bu menyuni olib ketishing mumkin, keyingi safar yana nima yeyishni koʻrib qoʻyasan."], ["王一雪", "不用拿菜单，在手机上就能看到，也可以选好了让他们给你送。", "Menyuni olish shart emas, telefonda ham koʻrsa boʻladi, tanlab qoʻysang, oʻzlari olib kelib berishadi."], ["白家月", "他们家还能送外卖？", "Ular uyga yetkazib berishadimi?"], ["王一雪", "对，现在很多饭馆都能送外卖，想吃什么就点什么。", "Ha, hozir koʻp restoranlar yetkazib beradi, nima yeging kelsa, oʻshani buyurtma qilasan."], ["白家月", "那真是太方便了！", "Bu juda qulay-ku!"]]}, {"k": 4, "scene": "在李文家，李文在写日记。", "sceneuz": "Li Ven uyida kundalik yozyapti.", "lines": [["", "这些年在国外，我很少自己做饭。", "Shu yillarda chet elda oʻzim kam ovqat qildim."], ["", "早饭我吃一个面包，有时候吃一块蛋糕，再喝一杯咖啡。", "Nonushtada bitta non, baʼzan bir boʻlak tort yeb, bir piyola qahva ichardim."], ["", "午饭和晚饭也都在外面吃。", "Tushlik va kechki ovqatni ham tashqarida yerdim."], ["", "快要考试的时候又忙又累，没时间出去吃饭，家里又什么吃的都没有，我可能好几天只吃方便面。", "Imtihon yaqinlashganda ham band, ham charchagan boʻlardim, ovqatlangani chiqishga vaqt yoʻq, uyda ham yeydigan hech narsa yoʻq, bir necha kun faqat tez tayyor lagʻmon yegan boʻlsam kerak."], ["", "现在回到中国了，每天能吃到妈妈做的饭，我真是太高兴了！", "Endi Xitoyga qaytdim, har kuni onam pishirgan ovqatni yeyman, juda xursandman!"], ["", "有时候妈妈只做几个简单的菜，我也非常爱吃，因为什么都没有妈妈做的饭好吃。", "Baʼzan onam bir nechta oddiy taom qiladi, ularni ham juda yaxshi koʻraman, chunki hech narsa onam pishirgan ovqatdek mazali emas."]]}]}, {"n": 3, "zh": "这个小区挺好的", "py": "Zhège xiǎoqū tǐng hǎo de", "uz": "Bu mavze ancha yaxshi", "words": [["初中", "chūzhōng", "n", "oʻrta maktab (7–9-sinflar)", "初 boshlangʻich + 中 oʻrta. 高中 — yuqori sinflar.", "", "我弟弟上初中了。", "Ukam oʻrta maktabga chiqdi."], ["咱们", "zánmen", "pron", "biz (suhbatdosh bilan birga)", "我们 suhbatdoshsiz ham boʻlishi mumkin, 咱们 esa doim “sen ham ichidasan” degani.", "", "咱们一起去吧。", "Birga boraylik."], ["换", "huàn", "v", "almashtirmoq", "扌 qoʻl: qoʻldan qoʻlga almashtirish. 换房子 — uy almashtirmoq.", "", "我想换一个大一点儿的房子。", "Kattaroq uyga almashtirmoqchiman."], ["房子", "fángzi", "n", "uy", "户 eshik belgisi: eshigi bor joy.", "", "他们的房子很大。", "Ularning uyi juda katta."], ["小区", "xiǎoqū", "n", "turar-joy majmuasi, mavze", "小 kichik + 区 hudud.", "", "我们小区里有一个花园。", "Bizning mavzeda bogʻ bor."], ["环境", "huánjìng", "n", "muhit, atrof", "", "", "这里的环境很好。", "Bu yerning muhiti yaxshi."], ["挺", "tǐng", "adv", "ancha, juda", "挺……的: 挺好的 — ancha yaxshi (ogʻzaki).", "", "这个房子挺好的。", "Bu uy ancha yaxshi."], ["空调", "kōngtiáo", "n", "konditsioner", "空(气) havo + 调 sozlash: havoni sozlovchi.", "", "太热了，开空调吧。", "Juda issiq, konditsionerni yoq."], ["洗衣机", "xǐyījī", "n", "kir yuvish mashinasi", "Soʻzma-soʻz: 洗 yuvmoq + 衣 kiyim + 机 mashina.", "", "家里的洗衣机坏了。", "Uydagi kir yuvish mashinasi buzildi."], ["层", "céng", "m", "qavat", "尸 bino tomi + 云 bulut: bulutgacha qavatma-qavat.", "", "我住在五层。", "Men beshinchi qavatda yashayman."], ["花园", "huāyuán", "n", "bogʻ", "花 gul + 园 (囗 devor bilan oʻralgan): gulli hovli.", "", "楼下有一个小花园。", "Pastda kichik bogʻ bor."], ["灯", "dēng", "n", "chiroq", "火 olov: qadimgi chiroq olov edi.", "", "房间里的灯很亮。", "Xonadagi chiroq juda yorugʻ."], ["关", "guān", "v", "oʻchirmoq, yopmoq", "关灯 — chiroqni oʻchirmoq, 关门 — eshikni yopmoq.", "", "出门的时候别忘了关灯。", "Chiqayotganda chiroqni oʻchirishni unutma."], ["冰箱", "bīngxiāng", "n", "muzlatkich", "冰 (冫 muz + 水 suv) + 箱 quti (1-mavzu): “muz qutisi”.", "", "冰箱里有水果。", "Muzlatkichda meva bor."], ["卫生间", "wèishēngjiān", "n", "hojatxona, vannaxona", "卫生 gigiyena + 间 xona.", "", "卫生间在哪儿？", "Hojatxona qayerda?"], ["打扫", "dǎsǎo", "v", "tozalamoq, supurmoq", "扫 — 扌 qoʻl + supurgi.", "", "我每天打扫房间。", "Har kuni xonani tozalayman."], ["搬家", "bānjiā", "v", "koʻchib oʻtmoq", "搬 tashimoq + 家 uy: uyni tashib ketish.", "", "我们下个月搬家。", "Kelasi oy koʻchib oʻtamiz."], ["办", "bàn", "v", "rasmiylashtirmoq, hal qilmoq", "力 kuch + ikki tomchi ter. 办信用卡 — kredit karta ochmoq.", "", "我想去银行办一张信用卡。", "Bankka borib kredit karta ochmoqchiman."], ["信用卡", "xìnyòngkǎ", "n", "kredit karta", "信用 ishonch + 卡 karta. 卡 = 上 + 下: kartani tiqasan, chiqarasan.", "", "这里可以用信用卡吗？", "Bu yerda kredit karta ishlatsa boʻladimi?"], ["还", "huán", "v", "qaytarmoq", "Ikki oʻqilishi: hái — hali, yana; huán — qaytarmoq. 还钱 — pulni qaytarmoq.", "还钱", "明天我还你钱。", "Ertaga pulingni qaytaraman."], ["听说", "tīngshuō", "v", "eshitishimcha, …ekan", "“Eshitib aytaman”: 听说他搬家了。", "", "听说你要搬家了？", "Eshitishimcha, koʻchib oʻtayotgan ekansan?"], ["银行", "yínháng", "n", "bank", "银 kumush (钅 metall) + 行 — bu yerda háng oʻqiladi, xíng emas!", "", "银行几点开门？", "Bank soat nechada ochiladi?"], ["才", "cái", "adv", "faqat …da (kech), endigina", "就 — erta, tez; 才 — kech, sekin. Grammatikaga qara.", "", "他十点才起床。", "U faqat soat oʻnda turdi."], ["纸", "zhǐ", "n", "qogʻoz", "纟 ip, tola: qogʻoz tolalardan qilinadi.", "", "请给我一张纸。", "Iltimos, menga bitta qogʻoz bering."], ["搬", "bān", "v", "tashimoq, koʻchirmoq", "扌 qoʻl bilan koʻtarib tashish.", "", "你能帮我搬一下桌子吗？", "Stolni koʻchirishga yordam bera olasanmi?"], ["需要", "xūyào", "v/n", "kerak boʻlmoq; ehtiyoj", "我需要一张纸。 — Menga bitta qogʻoz kerak.", "", "你需要帮助吗？", "Yordam kerakmi?"]], "grammar": [{"zh": "程度副词“挺”", "uz": "挺 — ancha, juda", "f": ["挺 + sifat / his-tuygʻu feʼli + 的"], "ex": "Darajaning ancha yuqoriligini bildiradi, asosan ogʻzaki nutqda. Oxiridagi 的 ni unutma.", "eg": [["这个小区环境挺好的。", "Bu mavzening muhiti ancha yaxshi.", "这个小区:A|环境:S|挺:K|好的:P", 0], ["这家饭馆的菜挺好吃的。", "Bu restoranning taomlari ancha mazali.", "这家饭馆的:A|菜:S|挺:K|好吃的:P", 0], ["买这个吧，我挺喜欢这个颜色的。", "Shuni ol, bu rang menga ancha yoqadi.", "买这个吧，:N|我:S|挺:K|喜欢:P|这个颜色的:O", 0], ["这个房子挺干净的。", "Bu uy ancha toza.", "这个房子:S|挺:K|干净的:P", 1]], "why": "挺 ogʻzaki nutqqa xos, 很 dan yumshoqroq va samimiyroq eshitiladi. Oxiridagi 的 gapga tasdiq ohangini beradi.", "mis": [["这个小区挺好。", "这个小区挺好的。", "挺 bilan gap oxiriga odatda 的 qoʻyiladi."]]}, {"zh": "程度补语（1）", "uz": "…坏了 — haddan tashqari", "f": ["sifat + 坏了"], "ex": "Darajaning juda yuqoriligini mubolagʻa bilan bildiradi, odatda yoqimsiz holatlarda: charchash, ochlik, bandlik.", "eg": [["我这几天忙坏了。", "Shu kunlarda band boʻlib ado boʻldim.", "我:S|这几天:D|忙:P|坏了:K", 0], ["我渴坏了，哪里能买水？", "Chanqab oʻlyapman, qayerdan suv olsa boʻladi?", "我:S|渴坏了，:K|哪里:D|能买水:P", 0], ["这几天非常忙，大家都累坏了。", "Shu kunlar juda band, hamma charchab ado boʻldi.", "这几天:D|非常忙，:P|大家:S|都:D|累坏了:K", 0], ["今天搬家，我累坏了。", "Bugun koʻchib oʻtdik, charchab ado boʻldim.", "今天搬家，:N|我:S|累:P|坏了:K", 1]], "why": "坏 — “buzilmoq”: holat shunchalik kuchliki, odam “buzilib” qolgandek. Shuning uchun asosan yoqimsiz holatlarda ishlatiladi: 累坏了, 饿坏了, 渴坏了.", "mis": [["今天天气好坏了。", "今天天气好极了。", "Yoqimli holat uchun 坏了 emas, 极了 yoki 得很 ishlatiladi."]]}, {"zh": "“就”和“才”", "uz": "就 va 才 farqi", "f": ["就 — erta, tez, oson", "才 — kech, sekin, qiyin"], "ex": "Ikkalasi ham feʼldan oldin keladi. 就 — gapiruvchiga ish erta yoki tez boʻlgandek tuyuladi; 才 — kech, sekin yoki qiyinchilik bilan boʻlgandek. 就 bilan gap oxirida koʻpincha 了 keladi, 才 bilan esa 了 qoʻyilmaydi.", "eg": [["中国银行很近，走路几分钟就能到。", "Bank yaqin, piyoda bir necha daqiqada yetib borasan.", "中国银行:S|很近，:P|走路:D|几分钟:D|就:K|能到:P", 0], ["我下午要去医院，很晚才能回来。", "Tushdan keyin kasalxonaga boraman, ancha kech qaytaman.", "我:S|下午:D|要去医院，:P|很晚:D|才:K|能回来:P", 0], ["我早上五点就起床了。", "Ertalab soat beshdayoq turdim.", "我:S|早上五点:D|就:K|起床了:P", 0], ["坐火车去北京，五个小时才能到。", "Poyezdda Pekinga besh soatda zoʻrgʻa yetib borasan.", "坐火车:D|去北京，:P|五个小时:D|才:K|能到:P", 0], ["飞机晚点了，十二点才起飞。", "Samolyot kechikdi, faqat soat oʻn ikkida uchdi.", "飞机晚点了，:N|十二点:D|才:K|起飞:P", 1], ["银行九点才开门。", "Bank faqat soat toʻqqizda ochiladi.", "银行:S|九点:D|才:K|开门:P", 1]], "why": "Fakt bir xil boʻlishi mumkin, farq soʻzlovchining nuqtai nazarida: 就 — “kutganimdan erta, tez”, 才 — “kutganimdan kech, sekin”.", "mis": [["他十点才起床了。", "他十点才起床。", "才 bilan gap oxirida 了 qoʻyilmaydi."]]}], "texts": [{"k": 1, "scene": "在家里，刘明和王一雪在聊天儿。", "sceneuz": "Uyda Lyu Min va Van Isyue suhbatlashyapti.", "lines": [["王一雪", "小雪的初中离家有点儿远，咱们换一个近点儿的房子吧。", "Syaosyuening maktabi uydan biroz uzoq, yaqinroq uyga koʻchaylik."], ["刘明", "好啊，我上网看看。你觉得这个小区怎么样？", "Mayli, internetdan qarab koʻraman. Bu mavze senga qanday tuyuladi?"], ["王一雪", "环境挺好的，离地铁站还不远。", "Muhiti juda yaxshi, metro bekatidan ham uzoq emas."], ["刘明", "房子里面也不错，空调和洗衣机都是新的。", "Uyning ichi ham yaxshi, konditsioner va kir yuvish mashinasi yangi."], ["王一雪", "是不错，但是我不喜欢住一层。", "Yaxshi-ku, lekin birinchi qavatda yashashni yoqtirmayman."], ["刘明", "这个一层带一个小花园，我觉得咱们可以去看看。", "Bu birinchi qavatning kichkina bogʻchasi bor, menimcha borib koʻrsak boʻladi."]]}, {"k": 2, "scene": "在新家，王一雪在收拾房间，刘明进来了。", "sceneuz": "Yangi uyda Van Isyue xonani yigʻishtiryapti, Lyu Min kirib keldi.", "lines": [["王一雪", "我今天早上来的时候，灯还开着。", "Bugun ertalab kelganimda chiroq yonib turgan edi."], ["刘明", "我这几天忙坏了，可能走的时候忘关了。", "Shu kunlarda juda band boʻlib ketdim, ketayotganda oʻchirishni unutgan boʻlsam kerak."], ["王一雪", "冰箱不能用，这些吃的东西放在哪儿？", "Muzlatgich ishlamayapti, bu yeguliklarni qayerga qoʻyay?"], ["刘明", "不可能吧？冰箱是新买的，我来看看。", "Boʻlishi mumkin emas-ku? Muzlatgich yangi olingan, kel, koʻraychi."], ["王一雪", "洗衣机也坏了吗？", "Kir yuvish mashinasi ham buzildimi?"], ["刘明", "没坏，但是卫生间没打扫好，还不能洗衣服。", "Buzilmagan, lekin hammom hali tozalanmagan, kir yuvib boʻlmaydi."], ["王一雪", "星期天我们真的能搬家吗？", "Yakshanba kuni rostdan koʻcha olamizmi?"]]}, {"k": 3, "scene": "在家里，刘明和王一雪在客厅聊天儿。", "sceneuz": "Uyda Lyu Min va Van Isyue mehmonxonada suhbatlashyapti.", "lines": [["王一雪", "这个月花了不少钱。", "Bu oy ancha pul sarfladik."], ["刘明", "是的，我们买了很多搬家时要用的东西。", "Ha, koʻchish uchun kerak boʻladigan koʻp narsa sotib oldik."], ["王一雪", "咱们办张信用卡吧，花的钱可以慢慢还。听说中国银行的服务不错，办了信用卡买东西还能便宜。", "Kredit karta ochtiraylik, sarflagan pulni asta-sekin qaytarsa boʻladi. Eshitishimcha, Xitoy bankining xizmati yaxshi, kredit karta bilan xarid qilsang chegirma ham boʻladi."], ["刘明", "好啊！中国银行很近，走路几分钟就能到。咱们什么时候去？", "Yaxshi! Xitoy banki juda yaqin, piyoda bir necha daqiqada yetib boriladi. Qachon boramiz?"], ["王一雪", "今天下午？", "Bugun tushdan keyin?"], ["刘明", "我下午要去医院，很晚才能回来。", "Tushdan keyin kasalxonaga borishim kerak, ancha kech qaytaman."], ["王一雪", "那我下午自己去吧。", "Unda tushdan keyin oʻzim boraman."]]}, {"k": 4, "scene": "在家里，刘明和王一雪讨论搬家计划。", "sceneuz": "Uyda Lyu Min va Van Isyue koʻchish rejasini muhokama qilyapti.", "lines": [["刘明", "我觉得这个星期就能搬家。我明天去买一些纸箱，很快就能准备好。搬家那天，我想请几位朋友来帮忙，最多一天就能搬完。", "Menimcha, shu haftaning oʻzida koʻchsa boʻladi. Ertaga borib bir nechta karton quti olaman, tezda tayyorlab qoʻyamiz. Koʻchadigan kuni bir nechta doʻstimni yordamga chaqiraman, koʻpi bilan bir kunda koʻchib boʻlamiz."], ["王一雪", "我觉得下个月才能搬家。这周开始准备，下周去打扫新家，这么多事情最少需要两个星期才能做完。搬家那天，我们应该找一家搬家公司。", "Menimcha, kelasi oydagina koʻcha olamiz. Bu hafta tayyorgarlik boshlaymiz, kelasi hafta yangi uyni tozalaymiz, shuncha ishga kamida ikki hafta kerak. Koʻchadigan kuni koʻchirish kompaniyasini chaqirishimiz kerak."]]}]}, {"n": 4, "zh": "这家宾馆跟别的都不一样", "py": "Zhè jiā bīnguǎn gēn biéde dōu bù yíyàng", "uz": "Bu mehmonxona boshqalariga oʻxshamaydi", "words": [["假期", "jiàqī", "n", "taʼtil", "假 dam olish + 期 davr.", "", "你假期想去哪儿？", "Taʼtilda qayerga borging keladi?"], ["海", "hǎi", "n", "dengiz", "氵 suv + 每 har: har tomonda suv.", "", "我想去海边玩儿。", "Dengiz boʻyiga dam olgani borgim keladi."], ["草原", "cǎoyuán", "n", "dasht, yaylov", "草 oʻt (艹) + 原 tekislik.", "", "草原很大，也很漂亮。", "Dasht juda katta va chiroyli."], ["主意", "zhǔyi", "n", "gʻoya, fikr", "好主意！ — Zoʻr fikr! (5-mavzuda ham bor.)", "", "这是个好主意！", "Bu zoʻr fikr!"], ["骑", "qí", "v", "minmoq (ot, velosiped)", "马 ot belgisi: otga minish. 骑自行车 ham shu.", "", "我会骑马。", "Men ot minishni bilaman."], ["马", "mǎ", "n", "ot", "马上 (2-mavzu) — “ot ustida”, yaʼni darhol.", "", "马跑得很快。", "Ot juda tez yuguradi."], ["羊", "yáng", "n", "qoʻy, echki", "Tepadagi 丷 — ikkita shox.", "", "草原上有很多羊。", "Dashtda qoʻylar koʻp."], ["月亮", "yuèliang", "n", "oy (osmondagi)", "月 oy + 亮 yorugʻ: yorugʻ oy.", "", "今天的月亮又大又圆。", "Bugun oy katta va toʻlin."], ["一定", "yídìng", "adv", "albatta", "你一定要来！ — Albatta kel!", "", "你一定要来！", "Albatta kel!"], ["刻", "kè", "m", "chorak soat (15 daqiqa)", "三点一刻 — soat 3:15.", "三点一刻", "现在三点一刻。", "Hozir soat 3:15."], ["起飞", "qǐfēi", "v", "uchib koʻtarilmoq (samolyot)", "起 koʻtarilmoq + 飞 uchmoq.", "", "飞机几点起飞？", "Samolyot soat nechada uchadi?"], ["宾馆", "bīnguǎn", "n", "mehmonxona", "宾 mehmon (宀 tom ostida) + 馆 (饣 ovqat): mehmon yashab, ovqatlanadigan joy.", "", "我们住在这家宾馆。", "Biz shu mehmonxonada turamiz."], ["特别", "tèbié", "adj/adv", "maxsus; ayniqsa, juda", "", "", "今天特别热。", "Bugun ayniqsa issiq."], ["别的", "biéde", "pron", "boshqa", "别的东西 — boshqa narsa.", "", "你还要别的吗？", "Yana boshqa narsa kerakmi?"], ["一样", "yíyàng", "adj", "bir xil", "A 跟 B 一样 — grammatikaga qara.", "", "我的手机跟你的一样。", "Mening telefonim seniki bilan bir xil."], ["牛", "niú", "n", "sigir, mol", "Yuqoridagi chiziq — bitta shox. 牛奶 — sut.", "", "我喜欢喝牛奶。", "Sut ichishni yaxshi koʻraman."], ["相机", "xiàngjī", "n", "fotoapparat", "照相 (5-mavzu) + 机 mashina → 照相机 → 相机.", "", "这个相机是新买的。", "Bu fotoapparat yangi olingan."], ["欢迎", "huānyíng", "v", "xush kelibsiz; kutib olmoq", "欢迎你们！ — Xush kelibsizlar!", "", "欢迎来中国！", "Xitoyga xush kelibsiz!"], ["司机", "sījī", "n", "haydovchi", "司 boshqarmoq + 机 mashina: mashinani boshqaruvchi.", "", "出租车司机很热情。", "Taksi haydovchisi juda samimiy."], ["晚点", "wǎndiǎn", "v", "kechikmoq (poyezd, samolyot)", "晚 kech + 点 vaqt: 飞机晚点了。", "", "飞机晚点了两个小时。", "Samolyot ikki soat kechikdi."], ["久", "jiǔ", "adj", "uzoq (vaqt)", "好久不见 (2-mavzu).", "", "你等了多久？", "Qancha kutding?"], ["除了", "chúle", "prep", "…dan tashqari", "除了……以外 — grammatikaga qara.", "", "除了我，大家都去了。", "Mendan boshqa hamma ketdi."], ["以外", "yǐwài", "n", "…dan tashqari, boshqa", "以 + 外 tashqari.", "", "除了汉语以外，他还会说英语。", "U xitoychadan tashqari inglizcha ham gapira oladi."], ["先", "xiān", "adv", "avval", "先……再…… — avval…, keyin….", "", "你先走吧。", "Sen avval ketaver."], ["一直", "yìzhí", "adv", "doim, toʻxtovsiz", "直 toʻgʻri: toʻgʻri chiziqdek uzilmasdan.", "", "我一直在等你。", "Seni shu paytgacha kutib turdim."], ["干净", "gānjìng", "adj", "toza", "Bu yerda 干 — gān (quruq)! 5-mavzudagi 干 gàn — qilmoq. Quruq va toza.", "", "房间很干净。", "Xona juda toza."], ["满意", "mǎnyì", "v", "mamnun boʻlmoq", "满 toʻla (氵) + 意 koʻngil: koʻngli toʻla.", "", "你对这个房间满意吗？", "Bu xonadan mamnunmisan?"]], "grammar": [{"zh": "一……也/都 + 不/没……", "uz": "Birorta ham… emas (toʻliq inkor)", "f": ["一 + hisob soʻz + ot + 也/都 + 不/没 + feʼl"], "ex": "Toʻliq inkor: “birorta ham…”, “umuman…”. 一 + hisob soʻz oʻrniga 一点儿 ham kelaveradi. Sifat bilan esa: 一点儿也/都 + 不/没 + sifat.", "eg": [["她一件衣服都不想买。", "U birorta ham kiyim olishni xohlamaydi.", "她:S|一件衣服:K|都:K|不想买:P", 0], ["我一个中国电影也没看过。", "Birorta ham xitoy filmini koʻrmaganman.", "我:S|一个中国电影:K|也:K|没看过:P", 0], ["我一点儿东西也不想吃。", "Hech narsa yegim kelmayapti.", "我:S|一点儿东西:K|也:K|不想吃:P", 0], ["他对打球一点儿兴趣都没有。", "Uning toʻp oʻyinlariga zarracha ham qiziqishi yoʻq.", "他:S|对打球:D|一点儿兴趣:K|都:K|没有:P", 0], ["草原一点儿也不冷。", "Dasht umuman sovuq emas.", "草原:S|一点儿:K|也:K|不冷:P", 0], ["他们一点儿也没着急。", "Ular umuman xavotirlanmadi.", "他们:S|一点儿:K|也:K|没:P|着急:P", 0], ["我一点儿也不饿。", "Qornim umuman och emas.", "我:S|一点儿:K|也:K|不饿:P", 1], ["他一张照片都没照。", "U birorta ham rasm olmadi.", "他:S|一张照片:K|都:K|没照:P", 1]], "why": "Eng kichik miqdorni (“bitta ham”) inkor qilsang, umuman yoʻqligini bildirasan. Oʻzbekchadagi “birorta ham … yoʻq” xuddi shunday quriladi.", "mis": [["我一个朋友也有。", "我一个朋友也没有。", "Bu qolip faqat inkor bilan ishlaydi: 也/都 dan keyin 不 yoki 没 shart."]]}, {"zh": "比较句（9）", "uz": "A 跟 B 一样 — bir xil", "f": ["A 跟 B (不) 一样 (+ sifat)"], "ex": "Solishtirganda A va B bir xilligini bildiradi. 一样 dan keyin qaysi jihatdan bir xilligini koʻrsatuvchi sifat kelishi mumkin. Inkorda 不 一样 dan oldin turadi.", "eg": [["这家宾馆跟别的都不一样。", "Bu mehmonxona boshqalarning hech biriga oʻxshamaydi.", "这家宾馆:S|跟别的:K|都:D|不一样:K", 0], ["他买的新手机跟我的一样。", "U olgan yangi telefon meniki bilan bir xil.", "他买的:A|新手机:S|跟我的:K|一样:K", 0], ["他跟我一样高。", "Uning boʻyi men bilan bir xil.", "他:S|跟我:K|一样:K|高:P", 0], ["这家宾馆跟那家一样干净。", "Bu mehmonxona oʻshanisi bilan bir xil toza.", "这家宾馆:S|跟那家:K|一样:K|干净:P", 1]], "why": "跟 — “bilan”: “A B bilan bir xil”. Tartib oʻzbekchaga juda oʻxshaydi: A + B bilan + bir xil (+ qaysi jihatdan).", "mis": [["这个跟那个很一样。", "这个跟那个一样。", "一样 oldiga 很 qoʻyilmaydi."]]}, {"zh": "除了……（以外），……都/还/也……", "uz": "…dan tashqari", "f": ["除了 A (以外)，… 都 … = A dan boshqa hammasi", "除了 A (以外)，… 还/也 … = A dan tashqari yana"], "ex": "都 bilan — A chiqarib tashlanadi, qolganlarning hammasi bir xil holatda. 还/也 bilan — A ga yana nimadir qoʻshiladi. 以外 ni tushirib qoldirsa ham boʻladi.", "eg": [["除了我以外，大家都在玩手机。", "Mendan boshqa hamma telefon oʻynayapti.", "除了我:K|以外，:K|大家:S|都在:K|玩手机:P", 0], ["除了这个汉字，别的汉字我都会写。", "Shu ierogifdan boshqa hammasini yoza olaman.", "除了:K|这个汉字，:O|别的汉字:O|我:S|都会写:K", 0], ["除了这个行李箱以外，还有别的东西吗？", "Bu chamadondan tashqari yana boshqa narsa bormi?", "除了:K|这个行李箱:O|以外，:K|还有:K|别的东西吗:O", 0], ["除了马以外，草原上还有很多羊。", "Dashtda otlardan tashqari yana koʻp qoʻylar ham bor.", "除了马:K|以外，:K|草原上:L|还有:K|很多羊:O", 1]], "why": "除了 — “chiqarib qoʻyganda”. Keyin 都 kelsa — qolganlarning hammasi bir xil (istisno); 还/也 kelsa — roʻyxatga yana qoʻshiladi.", "mis": [["除了汉语，他都会说英语。", "除了汉语，他还会说英语。", "“Yana” maʼnosi uchun 还/也; 都 — “qolganlarning hammasi”."]]}], "texts": [{"k": 1, "scene": "在王一飞家客厅，杨同乐和王一飞在聊天儿。", "sceneuz": "Van Ifeyning mehmonxonasida Yan Tunle va Van Ifey suhbatlashyapti.", "lines": [["杨同乐", "这个假期咱们去哪儿玩玩吧。", "Bu taʼtilda biror joyga borib dam olaylik."], ["王一飞", "好啊，你想去哪儿，咱们就去哪儿。", "Mayli, qayerga borging kelsa, oʻsha yerga boramiz."], ["杨同乐", "你喜欢海，找个海边住几天，怎么样？", "Sen dengizni yaxshi koʻrasan, dengiz boʻyida bir necha kun yashasak-chi?"], ["王一飞", "现在去海边有点儿冷。", "Hozir dengiz boʻyiga borish biroz sovuq."], ["杨同乐", "那去草原吧？草原一点儿也不冷。", "Unda dashtga boramizmi? Dashtda umuman sovuq emas."], ["王一飞", "这个主意好！我好久没骑马了。", "Zoʻr fikr! Ancha vaqtdan beri ot minmadim."], ["杨同乐", "对，在草原上骑马、吃羊肉、看月亮，一定很有意思。", "Ha, dashtda ot minish, qoʻy goʻshti yeyish, oyni tomosha qilish albatta juda qiziq boʻladi."]]}, {"k": 2, "scene": "在王一飞家客厅，杨同乐和王一飞在聊天儿。", "sceneuz": "Van Ifeyning mehmonxonasida Yan Tunle va Van Ifey suhbatlashyapti.", "lines": [["杨同乐", "出去玩的机票买好了吗？", "Sayohat uchun samolyot chiptalari olindimi?"], ["王一飞", "买好了。星期六上午十点一刻起飞。", "Olindi. Shanba kuni ertalab soat oʻndan oʻn besh daqiqa oʻtganda uchadi."], ["杨同乐", "宾馆也选好了吗？", "Mehmonxona ham tanlandimi?"], ["王一飞", "是的，这家宾馆很特别，跟别的都不一样，一出门就能看见牛和羊！", "Ha, bu mehmonxona juda oʻziga xos, boshqalarga sira oʻxshamaydi, eshikdan chiqishing bilan sigir va qoʻylarni koʻrasan!"], ["杨同乐", "太好了！你看看要带什么东西？", "Juda zoʻr! Qara-chi, nimalarni olishimiz kerak?"], ["王一飞", "我们不用带太多东西，别忘了拿上新买的相机。", "Koʻp narsa olish shart emas, yangi olingan fotoapparatni olishni unutma."], ["杨同乐", "一定不会忘带的。我现在就去准备行李。", "Albatta unutmayman. Hozirning oʻzida borib yukni tayyorlayman."]]}, {"k": 3, "scene": "在机场，杨同乐和王一飞走出来，跟他们预约的司机兼导游见面。", "sceneuz": "Aeroportda Yan Tunle va Van Ifey chiqib, oldindan kelishilgan haydovchi-gid bilan uchrashdi.", "lines": [["小李", "欢迎你们！我是你们的司机，我姓李，叫我小李就可以。", "Xush kelibsizlar! Men haydovchingizman, familiyam Li, Syao Li deb chaqiravering."], ["杨同乐", "您好！不好意思，飞机晚点了，让您久等了。", "Assalomu alaykum! Kechirasiz, samolyot kechikdi, sizni uzoq kuttirib qoʻydik."], ["小李", "没关系。除了这个行李箱以外，还有别的东西吗？", "Hechqisi yoʻq. Bu chamadondan tashqari yana narsalaringiz bormi?"], ["杨同乐", "还有一个包，我自己拿就可以。", "Yana bitta sumka bor, uni oʻzim koʻtarib olaman."], ["小李", "车在一层，请跟我来。", "Mashina birinchi qavatda, orqamdan yuring."], ["杨同乐", "我们住的宾馆离机场远吗？", "Biz turadigan mehmonxona aeroportdan uzoqmi?"], ["小李", "不远，三十分钟就能到。两位到了可以先休息休息，晚饭的时候我叫你们。", "Uzoq emas, oʻttiz daqiqada yetib boramiz. Yetib borgach avval dam olinglar, kechki ovqat vaqtida sizlarni chaqiraman."]]}, {"k": 4, "scene": "在宾馆房间，王一飞在写日记。", "sceneuz": "Mehmonxona xonasida Van Ifey kundalik yozyapti.", "lines": [["", "今天是我们旅游的第一天。", "Bugun sayohatimizning birinchi kuni."], ["", "我们很早就起床去机场了，没想到飞机晚点了。", "Juda erta turib aeroportga bordik, samolyot kechikadi deb oʻylamagan edik."], ["", "我们到的时候，天已经黑了，但是司机小李一直在机场等我们，一点儿也没着急。", "Yetib kelganimizda qorongʻi tushib qolgan edi, lekin haydovchi Syao Li aeroportda bizni toʻxtovsiz kutib turgan, sira asabiylashmagan edi."], ["", "他特别热情，路上给我们介绍了很多东西，还准备了水果。", "U juda samimiy, yoʻlda bizga koʻp narsalarni tanishtirdi, meva ham tayyorlab qoʻygan ekan."], ["", "宾馆的房间跟我想的一样漂亮，又大又干净，我非常满意。", "Mehmonxona xonasi men oʻylagandek chiroyli, ham katta, ham toza, juda mamnunman."]]}]}, {"n": 5, "zh": "这样的照片才好看", "py": "Zhèyàng de zhàopiàn cái hǎokàn", "uz": "Mana shunday rasmlar chiroyli", "words": [["总是", "zǒngshì", "adv", "doim", "总是 bilan 终于 bitta gapda: 这个星期总是阴天，今天终于晴了。", "", "这个星期总是阴天。", "Bu hafta doim bulutli boʻldi."], ["终于", "zhōngyú", "adv", "nihoyat", "终 = 纟 ip + 冬 qish (yil oxiri): oxiriga yetdi, nihoyat.", "", "今天终于晴了。", "Bugun nihoyat havo ochildi."], ["爬", "pá", "v", "tirmashib chiqmoq", "爪 panja: panjalar bilan tirmashish. 爬山 — toqqa chiqmoq.", "", "我们去爬山怎么样？", "Toqqa chiqsak-chi?"], ["山", "shān", "n", "togʻ", "Shaklining oʻzi: uchta choʻqqi.", "", "爬山的时候我给您照几张照片吧。", "Toqqa chiqqanimizda sizni bir nechta rasmga olib qoʻyay."], ["锻炼", "duànliàn", "v", "chiniqmoq, mashq qilmoq", "Ikkalasida 钅 metall, 炼 da 火 olov: temirni olovda toblash — tanani chiniqtirish.", "", "又能锻炼身体，又能照好看的照片。", "Ham badanni chiniqtirsa boʻladi, ham chiroyli rasmlar olsa boʻladi."], ["照", "zhào", "v", "rasmga olmoq", "Pastdagi 灬 — olov, yorugʻlik: yorugʻliksiz rasm chiqmaydi. 护照, 照片 (1-mavzu).", "", "我给你照一张吧。", "Seni bitta rasmga olib qoʻyay."], ["鞋", "xié", "n", "poyabzal", "Chapdagi 革 — teri: charm poyabzal. 运动鞋 — krossovka.", "", "我回去穿上运动鞋。", "Uyga borib krossovkamni kiyib kelaman."], ["大衣", "dàyī", "n", "palto", "“Katta kiyim”.", "", "我回去拿上大衣。", "Uyga borib paltomni olib kelaman."], ["拍照", "pāizhào", "v", "suratga olmoq", "拍 da 扌 qoʻl: tugmani bosish.", "", "我也喜欢拍照。", "Men ham rasmga olishni yaxshi koʻraman."], ["感兴趣", "gǎn xìngqù", "v", "qiziqmoq", "感 his qilmoq + 兴趣 qiziqish. Tuzilma: 对……感兴趣。", "", "她对拍照一直很感兴趣。", "U doim rasmga olishga qiziqqan."], ["照相", "zhàoxiàng", "v", "suratga olmoq", "照相机 → 相机 (4-mavzu).", "", "她经常给我照相。", "U meni tez-tez rasmga oladi."], ["难看", "nánkàn", "adj", "xunuk", "“Qarash qiyin” — xunuk. Juftligi: 难过.", "", "我觉得这张有点儿难看。", "Menimcha, bu rasm biroz xunuk chiqqan."], ["比较", "bǐjiào", "v/adv", "solishtirmoq; nisbatan, ancha", "比较一下 — solishtirib koʻrmoq; 比较贵 — ancha qimmat.", "", "我可以比较一下你们两个谁的水平高。", "Ikkalangizdan kimning darajasi balandroq ekanini solishtirib koʻraman."], ["水平", "shuǐpíng", "n", "daraja", "Soʻzma-soʻz “suv sathi”, maʼnosi daraja. Inglizchada ham level.", "", "你的拍照水平比她高。", "Rasmga olish darajang undan baland."], ["太阳", "tàiyáng", "n", "quyosh", "阳 — yang, quyosh tomoni.", "", "这边没有太阳，咱们去那边吧。", "Bu tomonda quyosh yoʻq, u tomonga boraylik."], ["树", "shù", "n", "daraxt", "木 daraxt belgisi.", "", "你觉得我站在这些树中间怎么样？", "Shu daraxtlar orasida tursam qalay?"], ["干", "gàn", "v", "qilmoq (ogʻzaki)", "你想干什么？ Diqqat: 干净 dagi 干 — gān (quruq).", "干什么", "你想干什么都可以。", "Nima qilging kelsa, qilaver."], ["电", "diàn", "n", "elektr, zaryad", "Chaqmoq shakli. 手机没电了 — telefonning zaryadi tugadi.", "", "啊，手机没电了。", "Voy, telefonning zaryadi tugadi."], ["收到", "shōudào", "v", "olmoq (xat, posilka)", "收 olmoq + 到 yetib keldi: qoʻlimga tegdi.", "", "我收到了你的那封邮件。", "Sening oʻsha emailingni oldim."], ["封", "fēng", "m", "xat, email hisob soʻzi", "一封邮件 — bitta email.", "一封邮件", "他给我写了一封信。", "U menga bitta xat yozdi."], ["邮件", "yóujiàn", "n", "elektron xat, email", "邮 pochta + 件 narsa.", "", "我每天都看邮件。", "Har kuni emailimni koʻrib chiqaman."], ["难过", "nánguò", "adj", "xafa, gʻamgin", "“Oʻtkazish qiyin” — xafa. Juftligi: 难看.", "", "她难过得很。", "U juda xafa boʻldi."], ["哈哈", "hāhā", "onom", "ha-ha (kulgi)", "", "", "哈哈，你说得对！", "Ha-ha, toʻgʻri aytding!"], ["音乐", "yīnyuè", "n", "musiqa", "音乐会 — konsert.", "", "你对中国的音乐有没有兴趣？", "Xitoy musiqasiga qiziqasanmi?"], ["兴趣", "xìngqù", "n", "qiziqish", "有兴趣 / 感兴趣 — qiziqmoq.", "", "他对打球一点儿兴趣都没有。", "Uning toʻp oʻyinlariga umuman qiziqishi yoʻq."], ["会", "huì", "n", "yigʻilish, kecha", "Yangi maʼno! 音乐会 — “musiqa yigʻilishi”, yaʼni konsert.", "音乐会", "我送你一张明天下午音乐会的门票。", "Senga ertangi tushdan keyingi konsertga chipta sovgʻa qilaman."], ["结束", "jiéshù", "v", "tugamoq, tugatmoq", "结 tugun (纟) + 束 bogʻlam: tugunni bogʻlab qoʻydi — tugadi.", "", "音乐会七点多结束。", "Konsert soat yettidan oʻtganda tugaydi."]], "grammar": [{"zh": "程度补语（2）", "uz": "…得很 — juda", "f": ["sifat + 得很"], "ex": "Darajaning yuqoriligini bildiradi, asosan ogʻzaki nutqda. 很 + sifat dan kuchliroq eshitiladi.", "eg": [["现在天气好得很。", "Hozir havo juda zoʻr.", "现在:D|天气:S|好:P|得很:K", 0], ["房间里面热得很。", "Xona ichi juda issiq.", "房间:S|里面:S|热:P|得很:K", 0], ["我觉得爬山累得很。", "Menimcha, toqqa chiqish juda charchatadi.", "我觉得:N|爬山:S|累:P|得很:K", 0], ["这个西瓜甜得很。", "Bu tarvuz juda shirin.", "这个西瓜:S|甜:P|得很:K", 1]], "why": "得 — daraja toʻldiruvchisi belgisi, “qanchalik?” degan savolga javob beradi. 很 sifatdan keyin kelganda kuchliroq eshitiladi: 好得很 > 很好.", "mis": [["今天很热得很。", "今天热得很。", "得很 bilan sifat oldiga 很 qoʻyilmaydi."]]}, {"zh": "量词重叠", "uz": "Hisob soʻzi takrori — “har bir”", "f": ["hisob soʻz + hisob soʻz + 都"], "ex": "Hisob soʻzini takrorlasang, guruhdagi har bir narsada shu xususiyat borligi taʼkidlanadi. Ortidan odatda 都 keladi.", "eg": [["这些照片张张都非常好看。", "Bu rasmlarning har biri juda chiroyli.", "这些照片:S|张张:K|都:K|非常好看:P", 0], ["这些苹果个个都很大。", "Bu olmalarning har biri katta.", "这些苹果:S|个个:K|都:K|很大:P", 0], ["我想出去拍照，但是天天下雨。", "Tashqariga rasmga chiqqim keladi, lekin har kuni yomgʻir.", "我:S|想出去拍照，:P|但是:N|天天:K|下雨:P", 0], ["这里的人个个都很热情。", "Bu yerdagi odamlarning har biri juda samimiy.", "这里的人:S|个个:K|都:K|很热情:P", 1], ["他天天都锻炼身体。", "U har kuni badanini chiniqtiradi.", "他:S|天天:K|都:K|锻炼身体:P", 1]], "why": "Takror “har biri, istisnosiz” degan maʼnoni beradi: 张张 = 每张. Shuning uchun ortidan “hammasi” degan 都 keladi.", "mis": [["这些照片张张很好看。", "这些照片张张都很好看。", "Takrorlangan hisob soʻzdan keyin deyarli doim 都 qoʻyiladi."]]}, {"zh": "存现句（3）", "uz": "Paydo boʻlish, gʻoyib boʻlish gapi", "f": ["joy + feʼl + yoʻnalish/natija toʻldiruvchisi (+了) + son-hisob soʻz + kishi/narsa"], "ex": "Biror joyda kimdir yoki nimadir paydo boʻlganini, kelganini yoki ketganini aytish uchun. Diqqat: joy gap boshida, kishi yoki narsa esa oxirida turadi!", "eg": [["后边走过去两个人。", "Orqadan ikki kishi oʻtib ketdi.", "后边:L|走过去:P|两个人:O", 0], ["前面开过来很多车。", "Oldindan koʻp mashina kelyapti.", "前面:L|开过来:P|很多车:O", 0], ["楼上下来了几个人。", "Yuqori qavatdan bir necha kishi tushib keldi.", "楼上:L|下来了:P|几个人:O", 0], ["树上飞来了几只鸟。", "Daraxtga bir nechta qush uchib keldi.", "树上:L|飞来了:P|几只鸟:O", 0], ["前面骑过来一辆自行车。", "Oldindan bitta velosiped kelyapti.", "前面:L|骑过来:P|一辆自行车:O", 1]], "why": "Xitoy tilida tanish maʼlumot gap boshida, yangi maʼlumot oxirida turadi. Bu gaplarda joy tanish, paydo boʻlgan kishi yoki narsa esa yangi va noaniq (“ikki kishi”, “bir nechta qush”), shuning uchun oxirga suriladi.", "mis": [["那两个人后边走过去。", "后边走过去两个人。", "Joy gap boshida, noaniq kishilar oxirida. Aniq kishilar (那两个人) bilan bu qolip ishlatilmaydi."]]}, {"zh": "紧缩复句“……了……就……”", "uz": "…ishi bilan darhol…", "f": ["feʼl₁ + 了 … 就 + feʼl₂ (+了)"], "ex": "Ikki harakat ketma-ket, darhol sodir boʻlishini bildiradi. Agar ikkinchi harakat ham tugagan boʻlsa, gap oxiriga yana 了 qoʻyiladi.", "eg": [["你听完了音乐会就来我家吃饭。", "Konsertni tinglab boʻlishing bilan menikiga ovqatga kel.", "你:S|听完了:K|音乐会:O|就来:K|我家吃饭:P", 0], ["我吃了早饭就去学校了。", "Nonushta qildim-u, darhol maktabga ketdim.", "我:S|吃了:K|早饭:O|就去:K|学校了:O", 0], ["昨天我们下了课就回家了。", "Kecha darsdan chiqdik-u, darrov uyga ketdik.", "昨天:D|我们:S|下了课:K|就:K|回家了:P", 0], ["你收到了邮件就给我打电话。", "Emailni olishing bilan menga qoʻngʻiroq qil.", "你:S|收到了:K|邮件:O|就:K|给我打电话:P", 1]], "why": "了 birinchi ish tugaganini, 就 esa “darrov, kechiktirmay” degan maʼnoni beradi. Shuning uchun ikkinchi ish birinchisi tugashi bilan boshlanadi.", "mis": [["我吃早饭了就去学校。", "我吃了早饭就去学校。", "了 feʼldan keyin, toʻldiruvchidan oldin turadi: 吃了早饭."]]}], "texts": [{"k": 1, "scene": "在街上，白家月和李文边散步边聊天儿。", "sceneuz": "Koʻchada Bay Jiayue va Li Ven sayr qilib turib suhbatlashyapti.", "lines": [["白家月", "这个星期总是阴天，今天终于晴了。", "Bu hafta doim bulutli edi, bugun nihoyat havo ochildi."], ["李文", "现在天气好得很！我们去爬山怎么样？", "Hozir havo juda zoʻr! Toqqa chiqsak-chi?"], ["白家月", "好啊！又能锻炼身体，又能照好看的照片。", "Mayli! Ham badantarbiya qilamiz, ham chiroyli suratga tushamiz."], ["李文", "那我带点儿水和吃的，咱们现在就去？", "Unda men biroz suv va yegulik olaman, hozir ketamizmi?"], ["白家月", "我回去穿上运动鞋，拿上大衣。要不要叫一雪姐一起去？", "Men borib sport oyoq kiyimimni kiyib, paltomni olaman. Isyue opani ham birga chaqiraylikmi?"], ["李文", "好主意。给她打个电话吧。", "Zoʻr fikr. Unga qoʻngʻiroq qil."]]}, {"k": 2, "scene": "在出租车上，王一雪和白家月在聊天儿。", "sceneuz": "Taksida Van Isyue va Bay Jiayue suhbatlashyapti.", "lines": [["白家月", "这些照片是谁给您照的？张张都非常好看。", "Bu suratlarni sizga kim olgan? Har biri juda chiroyli."], ["王一雪", "一飞。她对拍照一直很感兴趣，经常给我照相。", "Ifey. U doim suratga olishga qiziqadi, meni tez-tez suratga oladi."], ["白家月", "我喜欢您大笑的这张，看起来很漂亮。", "Siz qah-qah urib kulayotgan mana bu surat menga yoqdi, juda chiroyli koʻrinyapsiz."], ["王一雪", "我觉得这张有点儿难看，那时候我不知道她在给我照相。", "Menimcha bu biroz xunuk chiqqan, oʻshanda u meni suratga olayotganini bilmagandim."], ["白家月", "这样的照片才好看。我也喜欢拍照，爬山的时候我给您照几张照片吧。", "Aynan shunday suratlar chiroyli boʻladi. Men ham suratga olishni yaxshi koʻraman, toqqa chiqqanimizda sizni bir nechta suratga olay."], ["王一雪", "好，我可以比较一下你们两个谁的水平高。", "Mayli, ikkalangizdan kimning mahorati yuqoriligini solishtirib koʻraman."]]}, {"k": 3, "scene": "在山上，王一雪和白家月边走边聊。", "sceneuz": "Togʻda Van Isyue va Bay Jiayue yurib turib gaplashyapti.", "lines": [["王一雪", "家月，这里挺漂亮的，咱们在这里拍照吧。", "Jiayue, bu yer juda chiroyli ekan, shu yerda suratga tushaylik."], ["白家月", "这边没有太阳，咱们去那边吧。", "Bu tomonda quyosh yoʻq, u tomonga oʻtaylik."], ["王一雪", "好。你觉得我站在这些树中间怎么样？", "Xoʻp. Shu daraxtlar orasida tursam qalay?"], ["白家月", "挺好的。等一下，后边走过去两个人。", "Juda yaxshi. Biroz toʻxtang, orqadan ikki kishi oʻtib ketyapti."], ["王一雪", "我准备好了，你照的时候告诉我。", "Men tayyorman, suratga olayotganingda ayt."], ["白家月", "你不用看着我，想干什么都可以。", "Menga qarab turishingiz shart emas, nima qilgingiz kelsa, qilavering."], ["王一雪", "树上飞来了几只鸟，我就看它们吧。", "Daraxtga bir nechta qush uchib keldi, men ularga qarab turaman."], ["白家月", "啊，手机没电了。", "Voy, telefonning quvvati tugadi."]]}, {"k": 4, "scene": "在咖啡厅里，王一雪给白家月发短信。", "sceneuz": "Kafeda Van Isyue Bay Jiayuega xabar yozyapti.", "lines": [["", "家月，我收到了你的那封邮件，也看到了你给我照的照片，张张都很漂亮。", "Jiayue, oʻsha xatingni oldim, men uchun olgan suratlaringni ham koʻrdim, har biri juda chiroyli."], ["", "我已经告诉了一飞，你的拍照水平比她高，她难过得很，哈哈。", "Ifeyga suratga olish mahoratingni undan yuqori ekanini aytdim, u juda xafa boʻldi, ha-ha."], ["", "不知道你对中国的音乐有没有兴趣？", "Xitoy musiqasiga qiziqishing bormi-yoʻqmi, bilmayman."], ["", "我送你一张明天下午音乐会的门票。", "Senga ertaga tushdan keyingi konsertga bitta chipta sovgʻa qilaman."], ["", "音乐会七点多结束，你听完了音乐会就来我家吃饭，尝尝我做的中国菜。你觉得怎么样？", "Konsert soat yettidan keyin tugaydi, konsertni tinglab boʻlgach toʻgʻri biznikiga kel, men pishirgan xitoy taomlarini tatib koʻr. Qalay?"]]}]}, {"n": 6, "zh": "高铁上还可以点外卖", "py": "Gāotiě shang hái kěyǐ diǎn wàimài", "uz": "Tezyurar poyezdda ham ovqat buyurtma qilsa boʻladi", "words": [["该", "gāi", "mod", "kerak; …vaqti keldi", "1-mavzudagi 应该 ning ikkinchi yarmi: 该 = 应该. Tuzilmasi: 该……了 — “…vaqti keldi”.", "该走了", "咱们该买去上海的票了。", "Shanxayga chipta oladigan vaqt keldi."], ["打算", "dǎsuàn", "v/n", "rejalashtirmoq; reja", "算 — hisoblamoq: oldindan hisob-kitob qilish, yaʼni reja tuzish.", "", "你打算怎么去上海？", "Shanxayga qanday borishni rejalashtiryapsan?"], ["高铁", "gāotiě", "n", "tezyurar poyezd", "高(速) tez + 铁(路) temir yoʻl. Bizdagi “Afrosiyob” xuddi shunday 高铁.", "", "我还没坐过高铁。", "Men hali tezyurar poyezdda yurmaganman."], ["行", "xíng", "v/adj", "boʻladi, mayli; uddalaydi", "Asl maʼnosi “yurmoq”: oʻzbekchada ham “bu variant yuradi” — boʻladi. 你真行！ — Qoyil, zoʻrsan!", "行吗", "行！怎么买高铁票？", "Boʻladi! Tezyurar poyezd chiptasini qanday olamiz?"], ["路口", "lùkǒu", "n", "chorraha", "路 yoʻl + 口 ogʻiz: “yoʻlning ogʻzi”.", "", "过了前面的路口就到高铁站了。", "Oldindagi chorrahadan oʻtsak, vokzalga yetib kelamiz."], ["小心", "xiǎoxīn", "v/adj", "ehtiyot boʻlmoq; ehtiyotkor", "“Kichik yurak”: yuragi kichik odam doim ehtiyot boʻladi. 小心！ — Ehtiyot boʻl!", "", "这条路车很多，您小心点儿。", "Bu yoʻlda mashina koʻp, ehtiyot boʻling."], ["迟到", "chídào", "v", "kechikmoq (odam)", "迟 kech + 到 yetib kelmoq. Farqi: 迟到 — odam darsga, ishga kechikadi; 晚点 (4-mavzu) — poyezd yoki samolyot.", "", "你们还有一个小时，应该不会迟到的。", "Sizlarda yana bir soat bor, kechikmasangiz kerak."], ["红绿灯", "hónglǜdēng", "n", "svetofor", "Soʻzma-soʻz: 红 qizil + 绿 yashil + 灯 chiroq (3-mavzu).", "", "我发现这条路车多，红绿灯也多。", "Qarasam, bu yoʻlda mashina ham, svetofor ham koʻp ekan."], ["后来", "hòulái", "n", "keyin, keyinchalik (oʻtgan voqeada)", "Diqqat: 后来 faqat oʻtgan voqealar uchun. Kelajak haqida 以后 ishlatiladi.", "", "这条路我走过一次，后来再也不走了。", "Bu yoʻldan bir marta yurganman, keyin boshqa hech yurmadim."], ["急", "jí", "adj/v", "shoshilinch; shoshilmoq, hovliqmoq", "着急 (1-mavzu) dagi 急: pastida 心 yurak, yurak tez uradi.", "", "我一急就走错了。", "Hovliqib, adashib ketdim."], ["如果", "rúguǒ", "conj", "agar", "Tuzilmasi: 如果……，就…… — grammatikaga qara.", "", "如果没走错，二十分钟以前就到了。", "Adashmaganimizda, 20 daqiqa oldin yetib kelgan boʻlardik."], ["以前", "yǐqián", "n", "oldin, ilgari", "Bir oila: 以前 oldin, 以后 keyin, 以外 tashqari (4-mavzu).", "", "二十分钟以前就到了。", "20 daqiqa oldin yetib kelardik."], ["耳机", "ěrjī", "n", "quloqchin", "耳 quloq + 机 qurilma. 机 oilasi: 相机, 司机, 洗衣机, 耳机.", "", "我的耳机没电了。", "Quloqchinimning zaryadi tugadi."], ["充电宝", "chōngdiànbǎo", "n", "powerbank", "充电 zaryadlamoq (电 — 5-mavzu) + 宝 xazina: “zaryad xazinasi”.", "", "你有充电宝吗？", "Powerbanking bormi?"], ["常用", "cháng yòng", "phr", "koʻp ishlatiladigan", "常 tez-tez (经常) + 用 ishlatmoq (2-mavzu).", "", "这些常用的东西我都放在包里了。", "Koʻp ishlatiladigan narsalarning hammasini sumkaga solib qoʻyganman."], ["越", "yuè", "adv", "qancha…, shuncha…; tobora", "Ichida 走 yurmoq bor: oldinga yurgan sari koʻpayib boradi. 越来越 — tobora.", "越来越", "前面的人越来越多。", "Oldinda odam tobora koʻpayyapti."], ["分开", "fēnkāi", "v", "ajralmoq, ajratmoq", "分 boʻlmoq + 开 ochmoq: boʻlinib, ochilib ketish.", "", "咱们一起走，别分开。", "Birga yuraylik, ajralib qolmaylik."], ["检查", "jiǎnchá", "v", "tekshirmoq", "Shifokor ham shunday deydi: 身体检查 — tibbiy koʻrik.", "", "你检查一下，高铁票都拿好了吗？", "Bir tekshirib koʻr, chiptalarni hammasini oldingmi?"], ["刷", "shuā", "v", "skanerlamoq (karta, pasport); choʻtkalamoq", "刷牙 — tish choʻtkalamoq. Kartani ham turniketdan xuddi choʻtkalagandek “chirt” etib oʻtkazasan.", "", "不用拿票，刷护照就能检票进站。", "Chipta kerak emas, pasportni skanerlab kiraverasan."], ["检票", "jiǎnpiào", "v", "chiptani tekshirmoq", "检(查) tekshirmoq + 票 chipta.", "", "去哪里检票？", "Chiptani qayerda tekshirtiramiz?"], ["电梯", "diàntī", "n", "lift, eskalator", "电 elektr + 梯 narvon: “elektr narvon”.", "", "我们一会儿坐电梯上去。", "Birozdan keyin liftda yuqoriga chiqamiz."], ["放假", "fàngjià", "v", "taʼtilga chiqmoq", "放 qoʻyib yubormoq + 假 dam olish (假期 — 4-mavzu): dam olishga qoʻyib yuborishdi.", "", "这次放假，我去了北京，还去了上海。", "Bu taʼtilda Pekinga, yana Shanxayga ham bordim."], ["沙发", "shāfā", "n", "divan", "Ovozi “sofa”ning oʻzi!", "", "跟坐在家里的沙发上一样。", "Uydagi divanda oʻtirgandek."], ["安静", "ānjìng", "adj", "tinch, sokin", "安 — 宀 tom ostida 女 ayol: xotirjam uy. 静 — jim.", "", "又安静又舒服。", "Ham sokin, ham qulay."], ["选择", "xuǎnzé", "v", "tanlamoq", "选 (2-mavzu) + 择 (扌 qoʻl): ikkalasi ham “tanlamoq”, birga kuchliroq.", "", "只需要选择好车站和想吃的东西。", "Faqat bekatni va nima yeyishni tanlasang kifoya."], ["必须", "bìxū", "adv", "albatta …kerak, shart", "必 — 心 yurakdan oʻtgan chiziq: yurakka qadalgan narsa, shart.", "", "我爸妈来中国旅游的时候，必须带他们也坐一次高铁。", "Ota-onam Xitoyga sayohatga kelganda, ularni ham albatta bir marta tezyurar poyezdga mindirishim kerak."], ["北京南站", "Běijīng Nán Zhàn", "prop", "Pekin Janubiy vokzali", "北京 + 南 janub + 站 bekat (1-mavzu).", "", "我是从北京南站坐高铁去的上海。", "Shanxayga Pekin Janubiy vokzalidan tezyurar poyezdda borganman."]], "grammar": [{"zh": "固定格式“该……了”", "uz": "…vaqti keldi", "f": ["(ega) + 该 + feʼl + 了"], "ex": "Biror ishni qilish vaqti kelganini bildiradi. Asosan ogʻzaki nutqda ishlatiladi.", "eg": [["咱们该买去上海的票了。", "Shanxayga chipta oladigan vaqt keldi.", "咱们:S|该:K|买:P|去上海的票:O|了:K", 0], ["八点了，该上课了。", "Soat sakkiz boʻldi, darsga kiradigan vaqt.", "八点了，:N|该:K|上课:P|了:K", 0], ["已经很晚了，我该睡觉了。", "Ancha kech boʻldi, uxlashim kerak.", "已经很晚了，:N|我:S|该:K|睡觉:P|了:K", 0], ["十二点了，我们该吃饭了。", "Soat oʻn ikki boʻldi, ovqatlanish vaqti keldi.", "十二点了，:N|我们:S|该:K|吃饭:P|了:K", 1], ["假期结束了，我该回学校了。", "Taʼtil tugadi, maktabga qaytish vaqti keldi.", "假期结束了，:N|我:S|该:K|回学校:P|了:K", 1]], "why": "该 = 应该 (kerak), oxiridagi 了 esa “holat oʻzgardi” degani: “endi … qilish kerak boʻlib qoldi”, yaʼni vaqti keldi.", "mis": [["咱们该走。", "咱们该走了。", "“Vaqti keldi” maʼnosi uchun oxiridagi 了 shart."]]}, {"zh": "假设复句“如果……，就……”", "uz": "Agar…, (unda)…", "f": ["如果 + shart，(ega) + 就 + natija"], "ex": "如果 dan keyingi qism — taxmin yoki shart, 就 dan keyingisi — shu shartdagi natija. Diqqat: ikkinchi qismning egasi 就 dan oldin turadi (我就去, 就我去 emas).", "eg": [["如果没走错，二十分钟以前就到了。", "Adashmaganimizda, 20 daqiqa oldin yetib kelgan boʻlardik.", "如果:K|没走错，:P|二十分钟:D|以前:D|就到了:K", 0], ["如果你需要帮忙，就给我打电话。", "Yordam kerak boʻlsa, menga qoʻngʻiroq qil.", "如果:K|你:S|需要帮忙，:P|就:K|给我:D|打电话:P", 0], ["如果有时间，我就去上海玩儿几天。", "Vaqtim boʻlsa, Shanxayga bir necha kunga dam olgani boraman.", "如果:K|有时间，:P|我:S|就去:K|上海:O|玩儿几天:P", 0], ["如果明天不下雨，我们就去爬山。", "Ertaga yomgʻir yogʻmasa, toqqa chiqamiz.", "如果:K|明天:D|不下雨，:P|我们:S|就去:K|爬山:P", 1], ["如果你迟到了，就给我打电话。", "Agar kechiksang, menga qoʻngʻiroq qil.", "如果:K|你:S|迟到了，:P|就:K|给我:D|打电话:P", 1]], "why": "如果 shartni ochadi, 就 natijani bogʻlaydi. Shart doim birinchi, natija ikkinchi turadi: oʻzbekchadagi “…sa, …” tartibi xuddi shunday.", "mis": [["如果明天下雨，就我不去。", "如果明天下雨，我就不去。", "Ikkinchi qismning egasi 就 dan OLDIN turadi."]]}, {"zh": "固定短语“越来越”", "uz": "Tobora, borgan sari", "f": ["越来越 + sifat / his-tuygʻu feʼli"], "ex": "Vaqt oʻtishi bilan darajaning oʻzgarib borishini bildiradi. Diqqat: sifatdan oldin 很, 非常 kabi daraja ravishlari qoʻyilmaydi — 越来越很好 xato!", "eg": [["前面的人越来越多。", "Oldinda odam tobora koʻpayyapti.", "前面的人:S|越来越:K|多:P", 0], ["我越来越喜欢这里的生活了。", "Bu yerdagi hayot menga borgan sari koʻproq yoqyapti.", "我:S|越来越:K|喜欢:P|这里的生活了:O", 0], ["她越来越高，也越来越漂亮了。", "U tobora boʻy choʻzib, chiroyli boʻlib boryapti.", "她:S|越来越高，:K|也:D|越来越:K|漂亮了:P", 0], ["坐高铁的人越来越多。", "Tezyurar poyezdda yuradiganlar tobora koʻpayyapti.", "坐高铁的人:S|越来越:K|多:P", 1], ["我的汉语越来越好了。", "Xitoy tilim borgan sari yaxshilanyapti.", "我的汉语:S|越来越:K|好了:P", 1]], "why": "越 — “oshib bormoq”: 越来越 = “kelgan sari koʻproq”, yaʼni vaqt oʻtishi bilan oʻzgarish. 越来越 oʻzi daraja bildirgani uchun oldiga 很 qoʻyilmaydi.", "mis": [["天气越来越很冷。", "天气越来越冷了。", "越来越 + sifat; 很, 非常 qoʻshilmaydi. Oxirida koʻpincha 了 keladi."]]}], "texts": [{"k": 1, "scene": "在咖啡厅里，李文和白家月在聊天儿。", "sceneuz": "Kafeda Li Ven va Bay Jiayue suhbatlashyapti.", "lines": [["李文", "家月，咱们该买去上海的票了。你打算怎么去上海？", "Jiayue, Shanxayga chipta olish vaqti keldi. Shanxayga qanday bormoqchisan?"], ["白家月", "我还没坐过高铁，咱们坐高铁去，怎么样？", "Men hali tezyurar poyezdda yurmaganman, tezyurar poyezdda boraylik, qalay?"], ["李文", "没问题，从北京到上海的高铁很多，非常方便。", "Muammo yoʻq, Pekindan Shanxayga tezyurar poyezdlar koʻp, juda qulay."], ["白家月", "行！怎么买高铁票？", "Boʻpti! Tezyurar poyezd chiptasini qanday olinadi?"], ["李文", "用手机App就能买。给我你的护照，我帮你买。", "Telefondagi ilova orqali olsa boʻladi. Pasportingni ber, senga olib beraman."], ["白家月", "早就听说过高铁，终于可以坐上了。", "Tezyurar poyezd haqida ancha oldin eshitgandim, nihoyat unda yuradigan boʻldim."], ["李文", "高铁又快又舒服，你一定会喜欢的。", "Tezyurar poyezd ham tez, ham qulay, senga albatta yoqadi."]]}, {"k": 2, "scene": "在车上，刘明开车送白家月和李文去高铁站。", "sceneuz": "Mashinada Lyu Min Bay Jiayue va Li Venni tezyurar poyezd bekatiga olib ketyapti.", "lines": [["刘明", "过了前面的路口就到高铁站了。", "Oldindagi chorrahadan oʻtsak, tezyurar poyezd bekati."], ["白家月", "我看见了。马上就到了，这条路车很多，您小心点儿。", "Koʻrdim. Hozir yetib boramiz, bu yoʻlda mashina koʻp, ehtiyot boʻling."], ["刘明", "好，你们还有一个小时，应该不会迟到的。", "Xoʻp, sizlarda yana bir soat bor, kechikmasangiz kerak."], ["白家月", "我发现这条路车多，红绿灯也多。", "Bu yoʻlda mashina ham, svetofor ham koʻp ekan."], ["刘明", "是啊，这条路我走过一次，后来再也不走了。", "Ha, bu yoʻldan bir marta yurganman, keyin boshqa yurmadim."], ["白家月", "那您今天为什么走了这条路？", "Unda bugun nega shu yoʻldan yurdingiz?"], ["刘明", "我一急就走错了。如果没走错，二十分钟以前就到了。", "Shoshib, adashib ketdim. Agar adashmaganimda, yigirma daqiqa oldin yetib kelgan boʻlardik."]]}, {"k": 3, "scene": "在高铁站，李文和白家月排队安检、检票。", "sceneuz": "Tezyurar poyezd bekatida Li Ven va Bay Jiayue xavfsizlik tekshiruvi va chipta tekshiruvi uchun navbatda turibdi.", "lines": [["白家月", "李文，我的耳机没电了，你有充电宝吗？", "Li Ven, quloqchinimning quvvati tugadi, senda powerbank bormi?"], ["李文", "有，这些常用的东西我都放在包里了，我给你拿。", "Bor, koʻp ishlatiladigan narsalarning hammasini sumkaga solib qoʻyganman, olib beraman."], ["白家月", "前面的人越来越多。", "Oldinda odam tobora koʻpayyapti."], ["李文", "对，马上就进高铁站了。咱们一起走，别分开。", "Ha, hozir bekatga kiramiz. Birga yuraylik, ajralib qolmaylik."], ["白家月", "好，你检查一下，高铁票都拿好了吗？", "Xoʻp, tekshirib koʻr-chi, poyezd chiptalari olindimi?"], ["李文", "不用拿票，刷护照就能检票进站。", "Chipta kerak emas, pasportni skaner qilsang, tekshiruvdan oʻtib kirasan."], ["白家月", "去哪里检票？", "Chipta qayerda tekshiriladi?"], ["李文", "检票口在二层，我们一会儿坐电梯上去。", "Chipta tekshirish joyi ikkinchi qavatda, hozir eskalatorda chiqamiz."]]}, {"k": 4, "scene": "在家里，白家月给安妮打电话介绍自己的旅行。", "sceneuz": "Uyda Bay Jiayue Anniga qoʻngʻiroq qilib, sayohati haqida gapirib beryapti.", "lines": [["", "这次放假，我去了北京，还去了上海。", "Bu taʼtilda Pekinga bordim, Shanxayga ham bordim."], ["", "我是从北京南站坐高铁去的上海。", "Shanxayga Pekin Janubiy bekatidan tezyurar poyezdda bordim."], ["", "我觉得坐在高铁上跟坐在家里的沙发上一样，又安静又舒服。", "Tezyurar poyezdda oʻtirish uydagi divanda oʻtirishdek, ham sokin, ham qulay ekan."], ["", "坐累了就站一会儿，饿了就点外卖。", "Oʻtirib charchasang biroz turasan, qorning ochsa ovqat buyurtma qilasan."], ["", "对，你没听错，高铁上可以点外卖，只需要选择好车站和想吃的东西，到站时不用下车，服务员就会给你拿过来。", "Ha, toʻgʻri eshitding, tezyurar poyezdda ovqat buyurtma qilsa boʻladi, faqat bekat va yeging kelgan narsani tanlaysan, bekatga yetganda tushish shart emas, xodim oʻzi olib keladi."], ["", "现在喜欢坐高铁的人越来越多。", "Hozir tezyurar poyezdda yurishni yoqtiradiganlar tobora koʻpayyapti."], ["", "我爸妈来中国旅游的时候，必须带他们也坐一次高铁。", "Ota-onam Xitoyga sayohatga kelganda, ularni ham albatta bir marta tezyurar poyezdga olib chiqishim kerak."]]}]}, {"n": 7, "zh": "那条裙子比短裤更好看", "py": "Nà tiáo qúnzi bǐ duǎnkù gèng hǎokàn", "uz": "Oʻsha yubka shortikdan ham chiroyliroq", "words": [["辆", "liàng", "m", "transport uchun hisob soʻz (mashina, velosiped, avtobus)", "Chapda 车 — mashina belgisi: faqat transportni sanaydi. 一辆车, 一辆自行车.", "一辆自行车", "这辆自行车是小雪八岁的时候买的。", "Bu velosiped Xiaoxue sakkiz yoshligida olingan."], ["自行车", "zìxíngchē", "n", "velosiped", "自 oʻzi + 行 yurmoq (6-mavzu) + 车 arava: “oʻzi yuradigan arava”. Minish feʼli — 骑 (4-mavzu): 骑自行车.", "", "商场里开了一家自行车店。", "Savdo markazida velosiped doʻkoni ochilibdi."], ["旧", "jiù", "adj", "eski (narsa)", "Ichida 日 kun: koʻp kunlarni koʻrgan narsa. Diqqat: eski narsa — 旧, keksa odam — 老. Teskarisi — 新.", "", "看起来有点儿旧了。", "Biroz eskirib qolganga oʻxshaydi."], ["矮", "ǎi", "adj", "past (boʻyi), pakana", "Chapda 矢 oʻq — 短 (1-mavzu) da ham bor. Farqi: 矮 — boʻy balandligi past (odam, stol), 短 — uzunligi qisqa (soch, shim). Teskarisi — 高.", "", "她现在长高了，这辆车已经太矮了。", "U hozir boʻy choʻzib qoldi, bu velosiped unga juda past boʻlib qolgan."], ["试", "shì", "v", "sinab koʻrmoq; kiyib (minib) koʻrmoq", "讠 soʻz + 式 usul. Koʻpincha 试一下 yoki 试试. 考试 — imtihon, yaʼni “sinov”.", "", "咱们带小雪一起去，让她试一下。", "Xiaoxueni ham olib boraylik, bir minib koʻrsin."], ["黄色", "huángsè", "n", "sariq rang", "色 — rang: 红色 qizil, 绿色 yashil, 白色 oq, 黑色 qora, 黄色 sariq.", "", "你看我穿这条黄色的短裤好看吗？", "Qara, shu sariq shortik menga yarashyaptimi?"], ["短裤", "duǎnkù", "n", "shortik, kalta shim", "短 qisqa (1-mavzu) + 裤(子) shim, chapida 衤 — kiyim belgisi. Sanalishi: 一条短裤.", "", "裙子比短裤贵一点儿。", "Yubka shortikdan biroz qimmatroq."], ["大小", "dàxiǎo", "n", "oʻlcham, razmer", "大 katta + 小 kichik = “qanchalik katta-kichik”, yaʼni oʻlcham. Juft soʻzdan ot yasaladi: 长短 — uzunlik.", "", "大小合适。", "Oʻlchami toʻgʻri keladi."], ["合适", "héshì", "adj", "mos, toʻgʻri keladigan", "合 mos tushmoq + 适 toʻgʻri kelmoq. Oʻlcham, vaqt, narx uchun: 时间合适 — vaqt mos.", "", "大小合适，但我觉得那条裙子比短裤更好看。", "Oʻlchami mos, lekin menimcha oʻsha yubka shortikdan ham chiroyliroq."], ["裙子", "qúnzi", "n", "yubka", "Chapida 衤 — kiyim belgisi. Sanalishi: 一条裙子.", "", "还是买裙子吧，你穿裙子更好看。", "Yaxshisi yubkani ol, senga yubka koʻproq yarashadi."], ["更", "gèng", "adv", "yanada, bundan ham (…roq)", "Solishtirishda: A 比 B 更 + sifat. 更 oʻrniga 还 ham boʻladi, lekin 很, 非常 — mumkin emas! 比他很高 xato.", "", "我觉得那条裙子比短裤更好看。", "Menimcha, oʻsha yubka shortikdan ham chiroyliroq."], ["决定", "juédìng", "v/n", "qaror qilmoq; qaror", "定 — 一定 (4-mavzu) dagi “aniq belgilamoq”: aniq hal qilish, yaʼni qaror.", "", "我多看看再决定。", "Yana biroz koʻrib, keyin qaror qilaman."], ["西瓜", "xīguā", "n", "tarvuz", "西 gʻarb + 瓜 qovun: “gʻarb qovuni”. Tarvuz Xitoyga gʻarbdan, bizning tomonlardan borgan.", "", "西瓜又大又新鲜，不甜不要钱！", "Tarvuz ham katta, ham yangi: shirin boʻlmasa, pulini olmayman!"], ["新鲜", "xīnxiān", "adj", "yangi, toza (meva, havo)", "鲜 = 鱼 baliq + 羊 qoʻy: eng yangi, mazali narsalar. 新鲜空气 — toza havo.", "", "西瓜又大又新鲜。", "Tarvuz ham katta, ham yangi."], ["甜", "tián", "adj", "shirin", "舌 til + 甘 shirin: tilga shirin tegadigan.", "", "是挺甜的！", "Rostdan ham ancha shirin ekan!"], ["公斤", "gōngjīn", "m", "kilogramm", "公 + 斤 (yarim kilo): 1 公斤 = 2 斤.", "一公斤", "五块钱一公斤。", "Kilosi besh yuan."], ["冰", "bīng", "v/n", "muz; muzlatmoq, muzdek qilmoq", "冫 muz + 水 suv. 冰箱 (3-mavzu) — muzlatkich. 冰西瓜 — muzdek tarvuz.", "", "您先尝尝这块冰西瓜，甜极了！", "Avval mana bu muzdek tarvuzdan tatib koʻring, juda shirin!"], ["极", "jí", "adv", "nihoyatda, juda", "…极了 — “eng chekkasiga yetdi”. 极 — qutb ham: 北极 — Shimoliy qutb.", "极了", "甜极了！", "Juda-juda shirin!"], ["斤", "jīn", "m", "jin (yarim kilo, 500 g)", "Xitoy bozorida koʻpincha 斤 bilan sotishadi: 1 斤 = 0,5 kg, 2 斤 = 1 kg.", "两斤", "再来两斤香蕉。", "Yana ikki jin (bir kilo) banan bering."], ["香蕉", "xiāngjiāo", "n", "banan", "香 xushboʻy + 蕉 (艹 oʻsimlik belgisi).", "", "帮我选个大点儿的，再来两斤香蕉。", "Kattarogʻini tanlab bering, yana ikki jin banan ham."], ["一共", "yígòng", "adv", "jami, hammasi boʻlib", "共 — birga: hammasini birga qoʻshganda.", "", "一共五十八块五毛。", "Hammasi boʻlib 58 yuanu 5 mao (58,5 yuan)."], ["毛", "máo", "m", "mao (yuanning oʻndan biri)", "Ogʻzaki pul: 块 = 1 yuan, 毛 = 0,1 yuan. 五十八块五毛 = 58,5 yuan. Asl maʼnosi — jun, tuk.", "五毛", "一共五十八块五毛。", "Hammasi boʻlib 58,5 yuan."], ["结婚", "jiéhūn", "v", "turmush qurmoq, uylanmoq, erga tegmoq", "结 tugun (5-mavzudagi 结束) + 婚 nikoh (女 ayol belgisi): “nikoh tugunini bogʻlamoq”.", "", "这个电视是我们结婚时买的。", "Bu televizorni turmush qurganimizda olganmiz."], ["不但", "búdàn", "conj", "nafaqat", "Doim juft: 不但……，而且…… — “nafaqat…, balki…”. Grammatikaga qara.", "", "现在的电视不但便宜，而且用着非常方便。", "Hozirgi televizorlar nafaqat arzon, balki ishlatishga ham juda qulay."], ["而且", "érqiě", "conj", "balki, yana, ustiga", "不但 bilan juft keladi, lekin yakka oʻzi ham “ustiga-ustak” maʼnosida ishlatiladi.", "", "不但便宜，而且用着非常方便。", "Nafaqat arzon, balki ishlatishga ham juda qulay."], ["声", "shēng", "m/n", "ovoz; (ovozlar uchun hisob soʻz)", "叫一声 — bir marta chaqirmoq; 笑声 — kulgi ovozi.", "一声", "有的电视叫它一声就能开机。", "Baʼzi televizorlarni bir marta chaqirsang, oʻzi yonadi."], ["开机", "kāijī", "v", "(qurilmani) yoqmoq", "开 ochmoq + 机 qurilma. Teskarisi — 关机 oʻchirmoq (关 — 3-mavzu).", "", "叫它一声就能开机。", "Bir chaqirsang, yonadi."]], "grammar": [{"zh": "连动句（2）", "uz": "…ib turib (harakat qanday holatda bajariladi)", "f": ["feʼl₁ + 着 + (toʻldiruvchi₁) + feʼl₂ + (toʻldiruvchi₂)"], "ex": "着 birinchi feʼldan keyin kelib, ikkinchi harakat qanday holatda yoki usulda bajarilishini koʻrsatadi. Oʻzbekchada koʻpincha “-ib” bilan tarjima qilinadi: “yurib borish”, “oʻtirib koʻrish”.", "eg": [["咱们可以走着去。", "Piyoda borsak boʻladi.", "咱们:S|可以:D|走着:K|去:P", 0], ["弟弟吃着苹果写作业。", "Ukam olma yeb turib uy vazifasini yozyapti.", "弟弟:S|吃着苹果:K|写:P|作业:O", 0], ["他们坐着看电视。", "Ular oʻtirib televizor koʻryapti.", "他们:S|坐着:K|看:P|电视:O", 0], ["我每天骑着自行车去学校。", "Men har kuni velosipedda maktabga boraman.", "我:S|每天:D|骑着自行车:K|去学校:P", 1]], "why": "着 davom etayotgan holatni bildiradi. Birinchi feʼl + 着 ikkinchi ish QANDAY bajarilishini koʻrsatadi: 走着去 — yurgan holda, yaʼni piyoda borish.", "mis": [["咱们去走着。", "咱们走着去。", "Usul (走着) asosiy harakatdan (去) oldin keladi."]]}, {"zh": "比较句（10）", "uz": "A 不比 B — A B dan ortiq emas (deyarli bir xil)", "f": ["A + 不比 + B + sifat"], "ex": "Maʼnosi: A va B deyarli bir xil. Koʻpincha ikkalasining yaqinligini taʼkidlash yoki birovning gapini rad etish uchun ishlatiladi. Diqqat: 没有 bilan adashtirma. 他没有你高 — u sen chalik baland emas (sen balandroqsan); 他不比你高 — u sendan baland emas (taxminan bir xilsizlar).", "eg": [["裙子不比短裤贵多少。", "Yubka shortikdan unchalik qimmat emas.", "裙子:S|不比:K|短裤:O|贵多少:P", 0], ["他的中文不比你好。", "Uning xitoychasi senikidan yaxshi emas.", "他的中文:S|不比:K|你:O|好:P", 0], ["他跑得不比我快多少。", "U mendan unchalik tez yugurmaydi.", "他跑得:S|不比:K|我:O|快多少:P", 0], ["这辆自行车不比那辆贵。", "Bu velosiped oʻshanisidan qimmat emas.", "这辆自行车:S|不比:K|那辆:O|贵:P", 1], ["我的水平不比他高多少。", "Mening darajam unikidan unchalik baland emas.", "我的水平:S|不比:K|他:O|高多少:P", 1]], "why": "不比 — “…dan ortiq emas”: soʻzlovchi farq yoʻqligini yoki juda kichikligini aytadi. Koʻpincha suhbatdoshning “A B dan zoʻr” degan fikriga qarshi javob sifatida keladi.", "mis": [["他不比我很高。", "他不比我高。", "比 gaplarda sifat oldiga 很 qoʻyilmaydi."]]}, {"zh": "程度补语（3）", "uz": "…极了 — nihoyatda", "f": ["sifat / his-tuygʻu feʼli + 极了"], "ex": "Xususiyat, holat yoki his juda yuqori darajaga yetganini bildiradi. Yaxshi holatda ham, yomon holatda ham ishlatiladi. Shu oila: 坏了 (3-mavzu), 得很 (5-mavzu), 极了.", "eg": [["这块冰西瓜甜极了。", "Bu muzdek tarvuz nihoyatda shirin.", "这块:A|冰西瓜:S|甜:P|极了:K", 0], ["今年夏天热极了。", "Bu yil yoz juda issiq.", "今年:A|夏天:S|热:P|极了:K", 0], ["这本书我喜欢极了。", "Bu kitob menga juda-juda yoqadi.", "这本书:O|我:S|喜欢:P|极了:K", 0], ["高铁上安静极了。", "Tezyurar poyezdda juda-juda sokin.", "高铁上:L|安静:P|极了:K", 1], ["这件大衣好看极了。", "Bu palto juda-juda chiroyli.", "这件大衣:S|好看:P|极了:K", 1]], "why": "极 — “chegara, qutb”: 甜极了 — “shirinlikning chegarasi”. Shuning uchun bu eng kuchli daraja shakllaridan biri.", "mis": [["这个西瓜很甜极了。", "这个西瓜甜极了。", "极了 bilan sifat oldiga 很 qoʻyilmaydi."]]}, {"zh": "递进复句“不但……，而且……”", "uz": "Nafaqat…, balki…", "f": ["ega + 不但 …，而且 …  (ega bir xil)", "不但 + ega₁ …，而且 + ega₂ (也) …  (ega har xil)"], "ex": "Ikkinchi qism birinchisiga yana kuchliroq maʼlumot qoʻshadi. Ikkala qismning egasi bir xil boʻlsa, 不但 egadan keyin turadi; har xil boʻlsa, 不但 birinchi egadan oldin turadi.", "eg": [["现在的电视不但便宜，而且用着非常方便。", "Hozirgi televizorlar nafaqat arzon, balki ishlatishga ham juda qulay.", "现在的电视:S|不但:K|便宜，:P|而且:K|用着:D|非常方便:P", 0], ["家月不但喜欢唱歌，而且唱得很好听。", "Jiayue nafaqat qoʻshiq aytishni yaxshi koʻradi, balki juda chiroyli ham aytadi.", "家月:S|不但:K|喜欢唱歌，:P|而且:K|唱得:P|很好听:C", 0], ["不但家月会说汉语，而且天中也会说汉语。", "Nafaqat Jiayue, balki Tianzhong ham xitoycha gapira oladi.", "不但:K|家月:S|会说汉语，:P|而且:K|天中:S|也会说汉语:P", 0], ["这个宾馆不但干净，而且很安静。", "Bu mehmonxona nafaqat toza, balki juda sokin ham.", "这个宾馆:S|不但:K|干净，:P|而且:K|很安静:P", 1], ["高铁不但快，而且很舒服。", "Tezyurar poyezd nafaqat tez, balki juda qulay ham.", "高铁:S|不但:K|快，:P|而且:K|很舒服:P", 1]], "why": "不但 — “faqat … emas”, 而且 — “balki yana”: ikkinchi qism kuchliroq maʼlumot qoʻshadi.", "mis": [["不但他喜欢唱歌，而且唱得很好。", "他不但喜欢唱歌，而且唱得很好。", "Ega bir xil boʻlsa, 不但 egadan KEYIN turadi."]]}], "texts": [{"k": 1, "scene": "在家里，王一雪和刘明商量去买东西。", "sceneuz": "Uyda Van Isyue va Lyu Min xarid qilishga borishni maslahatlashyapti.", "lines": [["王一雪", "这辆自行车是小雪八岁的时候买的，看起来有点儿旧了。", "Bu velosiped Syaosyue sakkiz yoshligida olingan, biroz eskirib qolganga oʻxshaydi."], ["刘明", "是啊，她现在长高了，这辆车已经太矮了。", "Ha, u endi boʻyi choʻzildi, bu velosiped unga juda past boʻlib qoldi."], ["王一雪", "商场里开了一家自行车店，咱们给她买辆新的吧。", "Savdo markazida velosiped doʻkoni ochilibdi, unga yangisini olib beraylik."], ["刘明", "好，咱们带小雪一起去，让她试一下。", "Xoʻp, Syaosyueni ham olib boraylik, oʻzi minib koʻrsin."], ["王一雪", "那今天就去吧！我也想再看看衣服。咱们怎么去？", "Unda bugunoq boraylik! Men ham kiyimlarga yana bir qarab chiqmoqchiman. Qanday boramiz?"], ["刘明", "商场不远，咱们可以走着去。", "Savdo markazi uzoq emas, piyoda borsak boʻladi."]]}, {"k": 2, "scene": "在商场，刘明和王一雪买完自行车，又来挑选衣服。", "sceneuz": "Savdo markazida Lyu Min va Van Isyue velosiped olib boʻlib, kiyim tanlashga keldi.", "lines": [["王一雪", "你看我穿这条黄色的短裤好看吗？", "Qara-chi, bu sariq shortikda chiroyli koʻrinyapmanmi?"], ["刘明", "大小合适，但我觉得那条裙子比短裤更好看。", "Oʻlchami toʻgʻri keladi, lekin menimcha anavi yubka shortikdan ham chiroyliroq."], ["王一雪", "裙子比短裤贵一点儿。", "Yubka shortikdan biroz qimmatroq."], ["刘明", "贵多少？", "Qanchaga qimmat?"], ["王一雪", "裙子480，短裤400。", "Yubka 480, shortik 400."], ["刘明", "裙子不比短裤贵多少，还是买裙子吧，你穿裙子更好看。", "Yubka shortikdan unchalik qimmat emas, yaxshisi yubkani ol, yubkada chiroyliroq koʻrinasan."], ["王一雪", "我多看看再决定。你看，那边有买二送一！", "Yana koʻrib, keyin qaror qilaman. Qara, u yerda ikkitasini olsang, bittasi sovgʻa!"]]}, {"k": 3, "scene": "在商店，王一雪在买东西。", "sceneuz": "Doʻkonda Van Isyue xarid qilyapti.", "lines": [["店员", "西瓜又大又新鲜，不甜不要钱！", "Tarvuz ham katta, ham yangi, shirin boʻlmasa pul olmaymiz!"], ["王一雪", "西瓜看起来不错，怎么卖？", "Tarvuz yaxshiga oʻxshaydi, qanchadan?"], ["店员", "五块钱一公斤。来，您先尝尝这块冰西瓜，甜极了！", "Kilosi besh yuan. Mana, avval bu muzdek tarvuzdan tatib koʻring, juda shirin!"], ["王一雪", "是挺甜的！帮我选个大点儿的，再来两斤香蕉。", "Rostdan shirin ekan! Menga kattaroq birini tanlab bering, yana bir kilo banan."], ["店员", "一共五十八块五毛。", "Hammasi boʻlib ellik sakkiz yuan-u ellik fen."], ["王一雪", "我买了这么多，便宜点儿吧。", "Shuncha koʻp oldim, biroz arzonroq qiling."], ["店员", "您给我五十五吧，不能再便宜了。", "Ellik besh bering, bundan arzon qilolmayman."]]}, {"k": 4, "scene": "在家里，刘明在看电视。", "sceneuz": "Uyda Lyu Min televizor koʻryapti.", "lines": [["", "这几天我们在新家坐着看电视的时候，又发现了新问题。", "Shu kunlarda yangi uyda oʻtirib televizor koʻrayotganimizda yana bir yangi muammoni payqadik."], ["", "房子大了，电视看起来就有点儿小。", "Uy kattalashgan, televizor esa kichikroq koʻrinib qoldi."], ["", "这个电视是我们结婚时买的，是时候换个新电视了。", "Bu televizorni turmush qurganimizda olgan edik, yangisiga almashtirish vaqti keldi."], ["", "今天我一直在网上选电视，没想到，现在的电视不但便宜，而且用着非常方便，有的电视叫它一声就能开机。", "Bugun kun boʻyi internetda televizor tanladim, kutmagandim: hozirgi televizorlar nafaqat arzon, balki ishlatish ham juda qulay, baʼzilari bir chaqirsang, oʻzi yonadi."], ["", "我看了好几个，都很满意，晚上让一雪来决定吧。", "Bir nechtasini koʻrdim, hammasi yoqdi, kechqurun Isyue oʻzi tanlasin."]]}]}, {"n": 8, "zh": "今天我出院了", "py": "Jīntiān wǒ chūyuàn le", "uz": "Bugun kasalxonadan chiqdim", "words": [["最近", "zuìjìn", "n", "oxirgi paytda, yaqinda", "最 eng + 近 yaqin: “eng yaqin vaqt”.", "", "天中，最近常看见你来体育馆。", "Tianzhong, oxirgi paytda seni sport zalida tez-tez koʻryapman."], ["常", "cháng", "adv", "tez-tez", "经常 ning qisqasi. 常用 (6-mavzu) dagi 常 ham shu.", "常常", "我下课以后常去打羽毛球。", "Darsdan keyin tez-tez badminton oʻynagani boraman."], ["体育馆", "tǐyùguǎn", "n", "sport zali", "体育 sport + 馆 bino (宾馆, 饭馆 dagi 馆).", "", "我每天下午都去体育馆跑步。", "Har kuni tushdan keyin sport zaliga yugurgani boraman."], ["习惯", "xíguàn", "n/v", "odat; oʻrganib qolmoq", "习 (学习 dagi) + 惯 (忄 yurak): yurak oʻrganib qolgan narsa.", "", "你的运动习惯真不错。", "Sport bilan shugʻullanish odating juda yaxshi."], ["胖", "pàng", "adj", "semiz", "月 tana belgisi + 半 yarim: tanada “yarimta” ortiqcha. Teskarisi — 瘦 (1-mavzu).", "", "我今年胖了十多斤。", "Bu yil oʻn jindan koʻproq semirib ketdim."], ["健康", "jiànkāng", "adj", "sogʻlom", "健 (亻 odam) + 康: odamning sogʻligi.", "", "不能再胖下去了，有点儿不健康。", "Bundan ortiq semirmasligim kerak, bu sogʻliqqa yaxshi emas."], ["以后", "yǐhòu", "n", "…dan keyin; kelajakda", "以前 (6-mavzu) ning teskarisi. Farqi: 以后 kelajak uchun ham, 后来 faqat oʻtgan voqea uchun.", "", "考完试以后，咱们一起去旅游吧。", "Imtihonni topshirib boʻlgach, birga sayohatga boraylik."], ["羽毛球", "yǔmáoqiú", "n", "badminton", "羽毛 pat + 球 toʻp: “patli toʻp”. Oʻynash feʼli — 打: 打羽毛球.", "", "你也来打羽毛球吧。", "Sen ham badminton oʻynagani kel."], ["耳朵", "ěrduo", "n", "quloq", "耳 quloq (耳机 — 6-mavzu).", "", "昨天游完泳以后，耳朵一直有点儿疼。", "Kecha suzib boʻlgandan beri qulogʻim biroz ogʻrib turibdi."], ["感冒", "gǎnmào", "v/n", "shamollamoq; shamollash", "感 his qilmoq (感兴趣 dagi) + 冒: sovuqni “his qilib qoldi”.", "", "是不是感冒了？", "Shamollab qolmadingmi?"], ["发烧", "fāshāo", "v", "isitmalamoq", "发 chiqarmoq + 烧 yonmoq (火 olov): tanadan “olov” chiqyapti.", "", "他发烧了，今天不能去上课。", "Uning isitmasi chiqdi, bugun darsga bora olmaydi."], ["低", "dī", "adj", "past (daraja, harorat, ovoz)", "Teskarisi — 高. Farqi: boʻy past — 矮 (7-mavzu); daraja, harorat, ovoz past — 低. 低烧 — past isitma.", "", "他的声音很低。", "Uning ovozi past."], ["关心", "guānxīn", "v", "gʻamxoʻrlik qilmoq, qaygʻurmoq", "关 + 心 yurak: kimgadir yurak bilan bogʻlanish.", "", "谢谢关心，我会注意的。", "Gʻamxoʻrliging uchun rahmat, ehtiyot boʻlaman."], ["注意", "zhùyì", "v", "eʼtibor bermoq, ehtiyot boʻlmoq", "注 (氵) quymoq + 意 fikr: fikrni bir narsaga “quymoq”.", "", "回家以后一定会多注意。", "Uyga qaytgach, albatta koʻproq ehtiyot boʻlaman."], ["突然", "tūrán", "adj", "toʻsatdan, kutilmaganda", "突 = 穴 gʻor + 犬 it: it gʻordan toʻsatdan otilib chiqdi.", "", "你怎么突然住院了？", "Nega toʻsatdan kasalxonaga yotib qolding?"], ["住院", "zhùyuàn", "v", "kasalxonaga yotmoq", "住 yashamoq + 院 (医院): kasalxonada “yashamoq”. Teskarisi — 出院.", "", "医生说需要住院做检查。", "Shifokor tekshiruv uchun kasalxonada yotish kerakligini aytdi."], ["担心", "dānxīn", "v", "xavotirlanmoq", "担 (扌) koʻtarmoq + 心: yurakda yuk koʻtarish. Farqi: 着急 — shoshilish, sabrsizlik; 担心 — yomon narsa boʻlishidan qoʻrqish.", "", "大家都很担心你。", "Hamma sendan xavotirda."], ["腿", "tuǐ", "n", "oyoq (son va boldir)", "月 tana belgisi + 退 orqaga: yurganda oldinga-orqaga harakatlanadigan aʼzo.", "", "我的腿疼了几个星期了。", "Oyogʻim bir necha haftadan beri ogʻriyapti."], ["病人", "bìngrén", "n", "bemor", "病 kasallik (疒) + 人 odam.", "", "你看起来一点儿也不像病人。", "Sen umuman bemorga oʻxshamaysan."], ["差不多", "chàbuduō", "adv/adj", "deyarli; taxminan bir xil", "差 farq + 不多 koʻp emas: “farqi koʻp emas”.", "", "我上次来医院已经过去差不多两年了。", "Oxirgi marta kasalxonaga kelganimga deyarli ikki yil boʻldi."], ["得", "děi", "mod", "…ishi kerak, majbur", "Uch xil oʻqiladi: de (跑得快), dé (得到 — olmoq), děi (kerak). 我得走了 — ketishim kerak.", "我得走了", "还得做完检查才能知道。", "Lekin tekshiruvni oxirigacha qilish kerak, shundagina bilinadi."], ["开心", "kāixīn", "adj", "xursand", "开 ochmoq + 心 yurak: “yuragi ochildi”.", "", "有人来看我，我就开心多了。", "Kimdir koʻrgani kelsa, ancha xursand boʻlib ketaman."], ["出院", "chūyuàn", "v", "kasalxonadan chiqmoq", "出 chiqmoq + 院: 住院 ning teskarisi.", "", "今天我出院了。", "Bugun kasalxonadan chiqdim."], ["开", "kāi", "v", "(dori) yozib bermoq", "开 ning yangi maʼnosi: 开药 — dori yozib bermoq. Oldingi maʼnolari: ochmoq, yoqmoq (开机 — 7-mavzu).", "开药", "医生给我开了几种药。", "Shifokor menga bir necha xil dori yozib berdi."], ["种", "zhǒng", "m", "tur, xil", "禾 ekin + 中: turli xil ekinlar — “tur”. 这种药 — bu xil dori.", "这种", "有一种药需要每天睡前吃一次。", "Bitta dorini har kuni uxlashdan oldin bir marta ichish kerak."], ["方法", "fāngfǎ", "n", "usul", "方 yoʻnalish + 法 qoida (氵): ishning qoidasi, usuli.", "", "医生告诉了我吃药的方法。", "Shifokor menga dorini qanday ichishni aytdi."], ["其他", "qítā", "pron", "boshqa, qolgan", "别的 (4-mavzu) ga yaqin; 其他 koʻpincha “qolganlari” maʼnosida keladi.", "", "其他几种每天吃三次，饭后吃。", "Qolgan bir necha xilini kuniga uch marta, ovqatdan keyin ichish kerak."], ["心里", "xīnlǐ", "n", "koʻngil, dil (ichi)", "心 yurak + 里 ichi. 记在心里 — yodda saqlamoq.", "", "我都记在心里了。", "Hammasini yodimda saqlab qoldim."]], "grammar": [{"zh": "趋向补语的引申用法（1）", "uz": "…下去 — davom etmoq", "f": ["feʼl / sifat + 下去"], "ex": "下去 feʼl yoki sifatdan keyin kelib, allaqachon boshlangan harakat yoki holat bundan keyin ham davom etishini bildiradi.", "eg": [["我今年胖了十多斤，不能再胖下去了。", "Bu yil oʻn jindan koʻproq semirdim, bundan ortiq semirib ketmasligim kerak.", "我:S|今年:D|胖了十多斤，:P|不能:D|再:D|胖:P|下去了:K", 0], ["她读完了第一个问题，后面的你读下去。", "U birinchi savolni oʻqib boʻldi, qolganini sen oʻqishda davom et.", "她:S|读完了第一个问题，:P|后面的:O|你:S|读:P|下去:K", 0], ["这几天太热了，如果再热下去就不能出门了。", "Shu kunlar juda issiq, yana shunday davom etsa, koʻchaga chiqib boʻlmaydi.", "这几天:D|太热了，:P|如果:N|再:D|热:P|下去:K|就不能出门了:P", 0], ["你不能再胖下去了。", "Bundan ortiq semirib ketmasliging kerak.", "你:S|不能:D|再:D|胖:P|下去:K|了:N", 1], ["我要一直学下去。", "Oʻqishni toʻxtatmay davom ettiraman.", "我:S|要:D|一直:D|学:P|下去:K", 1]], "why": "下去 soʻzma-soʻz “pastga tushib ketmoq”: harakat toʻxtamasdan oldinga qarab davom etadi. Shuning uchun “davom etmoq” maʼnosi chiqadi: 说下去 — gapirishda davom et.", "mis": [["我想学汉语下去。", "汉语我想一直学下去。", "Toʻldiruvchi (汉语) feʼl bilan 下去 orasiga qoʻyilmaydi: uni gap boshiga chiqar."]]}, {"zh": "离合词（2）", "uz": "Ajraladigan soʻzlar", "f": ["feʼl qism + (natija / miqdor / 了) + ot qism", "跟 + kishi + 结婚 / 见面"], "ex": "Ajraladigan soʻzlar (游泳, 下雨, 结婚, 睡觉, 见面) toʻgʻridan-toʻgʻri toʻldiruvchi qabul qilmaydi. Gapda toʻldiruvchi (natija, miqdor) boʻlsa, u odatda soʻzning oʻrtasiga qoʻyiladi.", "eg": [["昨天游完泳以后，我的耳朵一直有点儿疼。", "Kecha suzib boʻlgandan beri qulogʻim biroz ogʻrib turibdi.", "昨天:D|游完泳以后，:K|我的耳朵:S|一直:D|有点儿疼:P", 0], ["今年夏天只下了两次雨。", "Bu yil yozda faqat ikki marta yomgʻir yogʻdi.", "今年夏天:D|只:D|下了:K|两次:K|雨:K", 0], ["小张下个月跟他女朋友结婚。", "Syao Chjan kelasi oy qiz doʻstiga uylanadi.", "小张:S|下个月:D|跟他女朋友:K|结婚:P", 0], ["我昨天睡了八个小时觉。", "Kecha sakkiz soat uxladim.", "我:S|昨天:D|睡了:K|八个小时:K|觉:K", 1], ["他们见过两次面。", "Ular ikki marta koʻrishgan.", "他们:S|见过:K|两次:K|面:K", 1]], "why": "Bu soʻzlar aslida ikki qismdan iborat: 游泳 = 游 suzmoq + 泳 suzish, 睡觉 = 睡 uxlamoq + 觉 uyqu. Ikkinchi qism allaqachon “toʻldiruvchi” boʻlgani uchun yana bitta toʻldiruvchi qoʻshib boʻlmaydi: qoʻshimcha maʼlumot oʻrtaga kiradi.", "mis": [["小张结婚他女朋友。", "小张跟他女朋友结婚。", "结婚 dan keyin kishi qoʻyilmaydi: 跟 + kishi + 结婚."], ["我游泳完了。", "我游完泳了。", "Natija (完) feʼl qismidan keyin, 泳 dan oldin keladi."]]}, {"zh": "时量补语（2）", "uz": "…ganiga … boʻldi", "f": ["feʼl (+ toʻldiruvchi) + vaqt miqdori + 了"], "ex": "Vaqt miqdori feʼldan keyin kelib, harakat yoki holat qancha davom etganini bildiradi. Davom etmaydigan feʼllar bilan (kelmoq, ketmoq, turmush qurmoq) esa harakat tugaganidan beri qancha vaqt oʻtganini bildiradi.", "eg": [["我上次来医院已经过去差不多两年了。", "Oxirgi marta kasalxonaga kelganimga deyarli ikki yil boʻldi.", "我上次来医院:S|已经:D|过去:P|差不多两年了:K", 0], ["她回家两个月了。", "U uyiga ketganiga ikki oy boʻldi.", "她:S|回家:P|两个月了:K", 0], ["开学已经三个多星期了。", "Oʻqish boshlanganiga uch haftadan oshdi.", "开学:S|已经:D|三个多星期了:K", 0], ["我来中国三个月了。", "Xitoyga kelganimga uch oy boʻldi.", "我:S|来中国:P|三个月了:K", 1], ["他们结婚两年了。", "Ular turmush qurganiga ikki yil boʻldi.", "他们:S|结婚:P|两年了:K", 1]], "why": "Kelmoq, ketmoq, turmush qurmoq bir zumda boʻladigan ish: ularni “ikki oy davomida” qilib boʻlmaydi. Shuning uchun vaqt miqdori “shundan beri qancha oʻtdi”ni bildiradi; oʻzbekchadagi “…ganiga ikki oy boʻldi” xuddi shunday.", "mis": [["她两个月回家了。", "她回家两个月了。", "Vaqt miqdori feʼldan KEYIN keladi."]]}, {"zh": "固定格式“……以前/以后/前/后”", "uz": "…dan oldin / …dan keyin", "f": ["vaqt / voqea + 以前 (前) = …dan oldin", "vaqt / voqea + 以后 (后) = …dan keyin"], "ex": "Vaqt yoki voqeadan keyin 以前/前 kelsa — undan oldin, 以后/后 kelsa — undan keyin degani. Qisqa shakllar (前, 后) koʻpincha qisqa soʻz bilan keladi: 睡前, 饭后, 下班后.", "eg": [["这种药需要每天睡前吃一次。", "Bu dorini har kuni uxlashdan oldin bir marta ichish kerak.", "这种药:S|需要:D|每天:D|睡前:K|吃一次:P", 0], ["我们决定下班后一起去看个电影。", "Ishdan keyin birga kino koʻrgani borishga qaror qildik.", "我们:S|决定:P|下班后:K|一起:D|去看个电影:O", 0], ["考完试以后，咱们一起去旅游吧。", "Imtihonni topshirib boʻlgach, birga sayohatga boraylik.", "考完试以后，:K|咱们:S|一起:D|去旅游吧:P", 0], ["饭后一定要吃药。", "Ovqatdan keyin albatta dori ichish kerak.", "饭后:K|一定:D|要:D|吃药:P", 1], ["出院以后，我得多休息。", "Kasalxonadan chiqqandan keyin koʻproq dam olishim kerak.", "出院以后，:K|我:S|得:D|多休息:P", 1]], "why": "Oʻzbekchadagi “…dan oldin / …dan keyin” kabi: 以前/以后 soʻzdan KEYIN keladi. Diqqat: 以后 yakka oʻzi “kelajakda” ham boʻladi (以后我想去中国), 后来 esa faqat oʻtgan voqeada (6-mavzu).", "mis": [["以后下课，我去打球。", "下课以后，我去打球。", "以后 voqeadan KEYIN qoʻyiladi: 下课以后."]]}], "texts": [{"k": 1, "scene": "在学校的体育馆，李文遇到了陈天中。", "sceneuz": "Maktab sport zalida Li Ven Chen Tyanchjunni uchratib qoldi.", "lines": [["李文", "天中，最近常看见你来体育馆。", "Tyanchjun, oxirgi
