laman, ovqatlanib turib gaplashamiz."], ["南京", "Nánjīng", "prop", "Nankin (shahar)", "南 janub + 京 poytaxt: “janubiy poytaxt” (北京 — shimoliy poytaxt).", "", "我是半个南京人。", "Men yarim nankinlikman."], ["河", "hé", "n", "daryo", "氵 suv + 可 (tovush).", "", "中国有一条大河，它的名字跟颜色有关系。", "Xitoyda bir katta daryo bor, uning nomi rang bilan bogʻliq."], ["关系", "guānxì", "n", "aloqa, munosabat", "关 bogʻlamoq + 系 ip (糸): “bogʻlab turgan ip”. 没关系 — “aloqasi yoʻq” → hechqisi yoʻq.", "", "这件事跟我没有关系。", "Bu ishning menga aloqasi yoʻq."], ["养", "yǎng", "v", "boqmoq, oʻstirmoq", "羊 qoʻy (yuqori qismi): qadimda qoʻy boqish — “boqmoq”. 养花 — gul oʻstirmoq.", "", "黄河像妈妈一样，养了我们几千年。", "Sariq daryo onadek bizni necha ming yillardan beri boqib keladi."], ["黄河", "Huáng Hé", "prop", "Sariq daryo (Xuanxe)", "黄 sariq + 河 daryo: suvi sargʻish koʻrinadi.", "", "你知道它为什么叫黄河吗？", "Bilasanmi, nega uni Sariq daryo deyishadi?"], ["西北", "xīběi", "n", "shimoli-gʻarb", "西 gʻarb + 北 shimol. Xitoychada gʻarb/sharq oldin aytiladi: 西北, 东南.", "", "我小时候住在北京的西北边。", "Bolaligimda Pekinning shimoli-gʻarbida yashaganman."], ["经过", "jīngguò", "v/n", "orqali oʻtmoq; jarayon", "经 oʻtmoq + 过 oʻtmoq: “yonidan oʻtib ketmoq”.", "", "有一条非常有名的河经过那里。", "U yerdan juda mashhur bir daryo oqib oʻtadi."], ["草地", "cǎodì", "n", "maysazor", "草 oʻt (艹) + 地 yer: “oʻtli yer”.", "", "那里有高高的大树和绿绿的草地。", "U yerda baland-baland daraxtlar va yam-yashil maysazor bor."], ["遇见", "yùjiàn", "v", "uchratib qolmoq", "遇 uchramoq (遇到 — 10-mavzu) + 见 koʻrmoq: tasodifan koʻrib qolmoq.", "", "昨天我在公园遇见了一位老朋友。", "Kecha bogʻda bir eski doʻstimni uchratib qoldim."]], "grammar": [{"zh": "介词“根据”", "uz": "…ga koʻra, …asosida", "f": ["根据 + asos，harakat", "ega + 根据 + asos + harakat"], "ex": "根据 predlogi gapda ish-harakatning asosi yoki sababini kiritadi.", "eg": [["这几年小区根据他们的需要，有了很多变化。", "Soʻnggi yillarda mavze ularning ehtiyojlariga qarab ancha oʻzgardi.", "这几年:D|小区:S|根据他们的需要，:K|有了:P|很多变化:O", 0], ["根据要求，我们必须参加明天的会议。", "Talabga koʻra, ertangi majlisda qatnashishimiz shart.", "根据要求，:K|我们:S|必须:D|参加:P|明天的会议:O", 0], ["老师根据每个学生的兴趣，选择了不一样的书。", "Ustoz har bir oʻquvchining qiziqishiga qarab har xil kitob tanladi.", "老师:S|根据每个学生的兴趣，:K|选择了:P|不一样的书:O", 0], ["根据天气，我们决定明天去爬山。", "Ob-havoga qarab, ertaga toqqa chiqishga qaror qildik.", "根据天气，:K|我们:S|决定:P|明天去爬山:O", 1], ["你应该根据季节选择合适的衣服。", "Faslga qarab mos kiyim tanlashing kerak.", "你:S|应该:D|根据季节:K|选择:P|合适的衣服:O", 1]], "why": "根据 = 根 ildiz + 据 asos: harakatning “ildizi”, nimaga tayanib qilinganini koʻrsatadi. Oʻzbekchadagi “…ga koʻra”, “…ga qarab”: 根据他们的需要 — ularning ehtiyojiga qarab.", "mis": [["根据我，这个办法很好。", "我觉得这个办法很好。", "根据 dan keyin shaxs emas, asos (要求, 需要, 兴趣) keladi. Shaxsiy fikr uchun — 我觉得 yoki 在我看来."]]}, {"zh": "数量重叠“数词+量词+数词+量词”", "uz": "Takrorlangan son-hisob soʻz: birma-bir, kundan-kunga", "f": ["son + hisob soʻz + son + hisob soʻz + (地) + feʼl"], "ex": "Son-hisob soʻz birikmasini takrorlash mumkin; takrorlangach u hol vazifasida kelib, odatda harakatning qanday bajarilishini bildiradi va tasvirni jonli qiladi.", "eg": [["我得一点儿一点儿给您讲。", "Sizga oz-ozdan tushuntirib berishim kerak.", "我:S|得:D|一点儿一点儿:K|给您:D|讲:P", 0], ["学生们的汉语水平一天一天地提高了。", "Oʻquvchilarning xitoy tili darajasi kundan-kunga oshib bordi.", "学生们的汉语水平:S|一天一天地:K|提高了:P", 0], ["他们两个两个地走进去了。", "Ular ikkitadan-ikkitadan boʻlib ichkariga kirishdi.", "他们:S|两个两个地:K|走:P|进去了:C", 0], ["她一本一本地看完了这些外语书。", "U bu chet tilidagi kitoblarni birma-bir oʻqib chiqdi.", "她:S|一本一本地:K|看完了:P|这些外语书:O", 1], ["这些照片我要一张一张地选。", "Bu suratlarni bittalab tanlayman.", "这些照片:O|我:S|要:D|一张一张地:K|选:P", 1]], "why": "Takrorlangan son-hisob soʻz harakat qanday boʻlayotganini “koʻrsatib” beradi: 一点儿一点儿 — oz-ozdan, 一天一天 — kundan-kunga, 两个两个 — ikkitadan-ikkitadan. Oʻzbekchada ham shunday takror bor: “birma-bir”, “kundan-kunga”.", "mis": [["我得一点儿给您讲一点儿。", "我得一点儿一点儿给您讲。", "Takrorlangan qism yaxlit holda feʼl oldida turadi."]]}, {"zh": "固定短语“在……看来”", "uz": "…ning nazarida, …ning fikricha", "f": ["在 + kishi / guruh + 看来，fikr"], "ex": "在……看来 bir kishi yoki guruhning nuqtai nazarini bildiradi.", "eg": [["在我们中国人看来，黄河像妈妈一样，养了我们几千年。", "Biz xitoyliklarning nazarida, Sariq daryo onadek bizni necha ming yillardan beri boqib keladi.", "在我们中国人看来，:K|黄河:S|像妈妈一样，:P|养了:P|我们:O|几千年:C", 0], ["在同事们看来，她工作非常认真。", "Hamkasblarining fikricha, u juda astoydil ishlaydi.", "在同事们看来，:K|她工作:S|非常认真:P", 0], ["在我看来，每天读书是一种很好的习惯。", "Mening nazarimda, har kuni kitob oʻqish juda yaxshi odat.", "在我看来，:K|每天读书:S|是:P|一种很好的习惯:O", 0], ["在我看来，南京是一个很有意思的城市。", "Mening nazarimda, Nankin juda qiziq shahar.", "在我看来，:K|南京:S|是:P|一个很有意思的城市:O", 1], ["在老人们看来，这个小区非常方便。", "Qariyalarning fikricha, bu mavze juda qulay.", "在老人们看来，:K|这个小区:S|非常方便:P", 1]], "why": "在……看来 — “…ning koʻzi bilan qaraganda”. 看来 (11-mavzu) kabi, lekin bu yerda fikr kimniki ekani aniq aytiladi: 在我看来 — mening nazarimda. 对……来说 (11-mavzu) “kim uchun”ni, 在……看来 esa “kim shunday oʻylaydi”ni bildiradi.", "mis": [["在我看，每天读书是一种很好的习惯。", "在我看来，每天读书是一种很好的习惯。", "来 tushib qolmasin: 在我看来."]]}, {"zh": "固定短语“不一会儿”", "uz": "Koʻp oʻtmay, birpasda", "f": ["不一会儿 (+ ega) + 就 + feʼl"], "ex": "不一会儿 juda qisqa vaqtni bildiradi, gapda hol vazifasida keladi, koʻproq ogʻzaki nutqda ishlatiladi.", "eg": [["难过的事情不一会儿就忘了。", "Xafa boʻlgan narsalarim birpasda esimdan chiqib ketadi.", "难过的事情:S|不一会儿:K|就:D|忘了:P", 0], ["不一会儿，张校长就来了。", "Koʻp oʻtmay direktor Chjan keldi.", "不一会儿，:K|张校长:S|就:D|来了:P", 0], ["两个小时看起来长，但是不一会儿就过去了。", "Ikki soat uzoq koʻrinadi, lekin birpasda oʻtib ketdi.", "两个小时:S|看起来:D|长，:P|但是:N|不一会儿:K|就:D|过去了:P", 0], ["我们聊着天儿，不一会儿就到了。", "Gaplashib ketib, birpasda yetib keldik.", "我们:S|聊着天儿，:P|不一会儿:K|就:D|到了:P", 1], ["雨不一会儿就停了。", "Yomgʻir koʻp oʻtmay tindi.", "雨:S|不一会儿:K|就:D|停了:P", 1]], "why": "不一会儿 — “bir oz ham emas”: shunchalik qisqa vaqt. Oʻzbekchadagi “koʻp oʻtmay”, “birpasda”. Ortidan odatda 就 keladi: 不一会儿就忘了 — birpasda unutib yuboraman.", "mis": [["不一会儿，张校长来了就。", "不一会儿，张校长就来了。", "就 egadan keyin, feʼl OLDIDA turadi."]]}], "texts": [{"k": 1, "scene": "在办公室里，王一雪和杨同乐在聊天儿。", "sceneuz": "Ofisda Van Isyue va Yan Tunle suhbatlashyapti.", "lines": [["杨同乐", "您搬到蓝天小区一段时间了，觉得怎么样？", "Lantyan mavzesiga koʻchganingizga ancha boʻldi, qanday ekan?"], ["王一雪", "小区环境挺好的，附近买东西也很方便，过马路就是超市。", "Mavzening muhiti ancha yaxshi, yaqin atrofda xarid qilish ham qulay, yoʻlni kesib oʻtsang — supermarket."], ["杨同乐", "平时孩子们在哪儿玩？", "Odatda bolalar qayerda oʻynaydi?"], ["王一雪", "小区里有很多树，孩子们放学后就在树下做游戏。你想买房子吗？", "Mavzeda daraxt koʻp, bolalar darsdan keyin daraxtlar tagida oʻynashadi. Uy sotib olmoqchimisan?"], ["杨同乐", "是。我想买一个大房子，让我爸妈过来跟我一起住。", "Ha. Katta uy olib, ota-onamni oʻzim bilan birga yashashga olib kelmoqchiman."], ["王一雪", "蓝天小区的老人挺多的，这几年小区根据他们的需要，有了很多变化。", "Lantyan mavzesida keksalar ancha koʻp, soʻnggi yillarda mavze ularning ehtiyojlariga qarab koʻp oʻzgardi."], ["杨同乐", "真不错！过几天我去蓝天小区看看。", "Juda yaxshi! Bir necha kundan keyin Lantyan mavzesiga borib koʻraman."]]}, {"k": 2, "scene": "在办公室里，王一雪和杨同乐在聊天儿。", "sceneuz": "Ofisda Van Isyue va Yan Tunle suhbatlashyapti.", "lines": [["王一雪", "假期我想去南京旅游，但是我不太了解那里。", "Taʼtilda Nankinga sayohatga bormoqchiman, lekin u yerni unchalik bilmayman."], ["杨同乐", "我虽然不是南京人，可是我是在南京上的大学，可以说是半个南京人。", "Garchi nankinlik boʻlmasam ham, universitetni Nankinda oʻqiganman, yarim nankinlik desa boʻladi."], ["王一雪", "太好了！你快给我介绍一下南京吧。", "Zoʻr! Tezroq menga Nankin haqida aytib ber."], ["杨同乐", "南京有两千年以上的历史，有老城、老街，还有很多有名的景点，每年去旅游的游客特别多。", "Nankinning ikki ming yildan ortiq tarixi bor, eski shahar, eski koʻchalar, yana koʻplab mashhur diqqatga sazovor joylar bor, har yili sayyohlar juda koʻp boradi."], ["王一雪", "除了这些以外，你再告诉我一些外地人不知道的地方。", "Bulardan tashqari, menga boshqa joylik odamlar bilmaydigan joylarni ham ayt."], ["杨同乐", "那太多了，我得一点儿一点儿给您讲。", "Ular juda koʻp, sizga oz-ozdan aytib berishim kerak."], ["王一雪", "行，下班后我请你吃晚饭，咱们边吃边聊。", "Boʻpti, ishdan keyin seni kechki ovqatga mehmon qilaman, ovqatlanib turib gaplashamiz."]]}, {"k": 3, "scene": "在家里，王一雪和刘小明在聊天儿。", "sceneuz": "Uyda Van Isyue va Lyu Syaomin suhbatlashyapti.", "lines": [["王一雪", "小明，中国有一条大河，它的名字跟颜色有关系，你知道是什么河吗？", "Syaomin, Xitoyda bir katta daryo bor, uning nomi rang bilan bogʻliq, qaysi daryo ekanini bilasanmi?"], ["刘小明", "我知道，是黄河！", "Bilaman, Xuanxe (Sariq daryo)!"], ["王一雪", "你说对了。我再问问你，你知道它为什么叫黄河吗？", "Toʻgʻri aytding. Yana bir savol: nega uni Sariq daryo deyishini bilasanmi?"], ["刘小明", "因为河水看起来是黄色的，所以叫这个名字。黄河是中国最长的河吗？", "Chunki daryo suvi sariq koʻrinadi, shuning uchun shunday atalgan. Xuanxe Xitoyning eng uzun daryosimi?"], ["王一雪", "不是。黄河虽然不是最长的河，可是在历史上很重要。", "Yoʻq. Xuanxe garchi eng uzun daryo boʻlmasa ham, tarixda juda muhim."], ["刘小明", "这个我知道。很久以前，很多中国人都住在黄河边上。", "Buni bilaman. Juda qadim zamonlarda koʻp xitoyliklar Xuanxe boʻyida yashagan."], ["王一雪", "对。在我们中国人看来，黄河像妈妈一样，养了我们几千年。", "Toʻgʻri. Biz xitoyliklarning nazarida Xuanxe ona kabi, bizni ming yillar davomida boqib kelgan."]]}, {"k": 4, "scene": "在家里，王一雪在写日记。", "sceneuz": "Uyda Van Isyue kundalik yozyapti.", "lines": [["", "我小时候住在北京的西北边，有一条非常有名的河经过那里。", "Bolaligimda Pekinning shimoli-gʻarbida yashardim, u yerdan juda mashhur bir daryo oqib oʻtardi."], ["", "我家就住在河边。", "Uyimiz aynan daryo boʻyida edi."], ["", "那里有高高的大树和绿绿的草地。", "U yerda baland-baland daraxtlar va yam-yashil oʻtloqlar bor edi."], ["", "春天，河边的花都开了，看起来特别漂亮。", "Bahorda daryo boʻyidagi gullar ochilib, juda chiroyli koʻrinardi."], ["", "还记得小时候，一到夏天我就去河里游泳。", "Hali ham esimda, bolaligimda yoz kelishi bilan daryoga suzgani borardim."], ["", "长大以后，遇到什么不开心的事情，我就去河边的树下坐着，听听鸟叫，看看河水，跟遇见的朋友聊聊天儿，难过的事情不一会儿就忘了。", "Katta boʻlgach, biror koʻngilsiz ishga duch kelsam, daryo boʻyidagi daraxt tagiga borib oʻtirardim, qushlar sayrashini tinglab, daryo suviga qarab, uchragan doʻstlar bilan gaplashardim — xafa boʻlgan narsam bir zumda esimdan chiqib ketardi."], ["", "那是我最喜欢的地方。", "U mening eng sevimli joyim."]]}]}, {"n": 16, "zh": "我听说有的熊猫出国了", "py": "Wǒ tīngshuō yǒude xióngmāo chūguó le", "uz": "Eshitishimcha, baʼzi pandalar chet elga ketibdi", "words": [["脏", "zāng", "adj", "iflos, kir", "月 tana + 庄: tanadagi kir. Teskarisi — 干净.", "很脏", "第一天看见它的时候，它又脏又小。", "Uni birinchi kuni koʻrganimda, ham iflos, ham kichkina edi."], ["可爱", "kěʼài", "adj", "yoqimtoy, shirin", "可 arziydigan + 爱 sevmoq: “sevishga arziydigan”.", "", "它还特别可爱。", "U yana juda yoqimtoy."], ["一会儿", "yíhuìr", "adv", "goh … (goh …)", "一会儿 — bir pas. 一会儿……，一会儿…… — goh …, goh …. 不一会儿 — 15-mavzu.", "", "它一会儿在你脚边睡觉，一会儿在你身上爬。", "U goh oyogʻing yonida uxlaydi, goh ustingga tirmashib chiqadi."], ["脚", "jiǎo", "n", "oyoq panjasi", "月 tana + 却. Farqi: 腿 (8-mavzu) — son va boldir, 脚 — panja.", "", "我的脚有点儿疼。", "Oyogʻim biroz ogʻriyapti."], ["照顾", "zhàogù", "v", "gʻamxoʻrlik qilmoq, qaramoq", "照 yoritmoq + 顾 qaramoq: doim koʻz ostida tutmoq.", "", "你们把它照顾得真好。", "Unga juda yaxshi qarabsizlar."], ["好像", "hǎoxiàng", "v", "xuddi … kabi, …ga oʻxshamoq", "1-mavzudagi 好像 (shekilli) ning feʼl maʼnosi: 好像我们的孩子 — xuddi bolamizdek.", "", "它就好像我们的孩子。", "U xuddi bizning bolamizdek."], ["认得", "rènde", "v", "tanimoq", "认 tanimoq (认识 dagi) + 得: “tanib olgan”.", "", "我们照顾它，它也认得我们了。", "Biz unga qaraymiz, u ham bizni taniydigan boʻldi."], ["周末", "zhōumò", "n", "dam olish kunlari (hafta oxiri)", "周 hafta + 末 uchi, oxiri.", "", "这个周末你有什么打算？", "Bu dam olish kunlari nima rejang bor?"], ["动物园", "dòngwùyuán", "n", "hayvonot bogʻi", "动物 hayvon + 园 bogʻ (公园 dagi).", "", "我周末带你们去北京动物园看动物吧。", "Dam olish kuni sizlarni Pekin hayvonot bogʻiga olib boraman."], ["动物", "dòngwù", "n", "hayvon", "动 harakat + 物 narsa: “harakatlanadigan narsa”.", "", "北京动物园里面有非常多的动物。", "Pekin hayvonot bogʻida juda koʻp hayvon bor."], ["大熊猫", "dàxióngmāo", "n", "katta panda", "大 katta + 熊 ayiq + 猫 mushuk: “katta ayiq-mushuk”. Aslida ayiqqa yaqin.", "", "大熊猫为什么只吃竹子不吃肉？", "Nega panda faqat bambuk yeydi, goʻsht yemaydi?"], ["奇怪", "qíguài", "adj", "gʻalati", "奇 gʻayrioddiy + 怪 gʻalati (忄 yurak): yurakka gʻalati tuyulgan.", "", "妈妈，大熊猫这个名字很奇怪。", "Ona, “panda” degan nom juda gʻalati."], ["其实", "qíshí", "adv", "aslida", "其 uning + 实 haqiqat: “uning haqiqati”.", "", "它们跟猫没什么关系，其实应该叫大猫熊。", "Ularning mushukka hech aloqasi yoʻq, aslida “katta mushuk-ayiq” deyish kerak."], ["竹子", "zhúzi", "n", "bambuk", "竹 — ikki bambuk poyasi shakli (⺮ radikali shundan).", "", "熊猫很喜欢吃竹子。", "Panda bambuk yeyishni juda yaxshi koʻradi."], ["国宝", "guóbǎo", "n", "milliy boylik", "国 davlat + 宝 xazina (宀 tom ostidagi 玉 nefrit): “davlat xazinasi”.", "", "大熊猫是中国的国宝。", "Panda — Xitoyning milliy boyligi."], ["全", "quán", "adj", "butun, hamma", "人 + 王: hamma narsa joyida, toʻliq. 全世界 — butun dunyo.", "", "全世界只有中国有野生大熊猫。", "Butun dunyoda yovvoyi panda faqat Xitoyda bor."], ["野生", "yěshēng", "adj", "yovvoyi", "野 dala, yovvoyi + 生 yashamoq: “dalada yashaydigan”.", "", "这里有很多野生动物。", "Bu yerda yovvoyi hayvonlar koʻp."], ["关于", "guānyú", "prep", "… haqida", "关 bogʻliq + 于: “…ga bogʻliq”. 关系 (15-mavzu) dagi 关.", "", "关于这个问题，我得慢慢给你讲。", "Bu savol haqida senga sekin-asta tushuntirib berishim kerak."], ["饱", "bǎo", "adj", "toʻq", "饣 ovqat + 包 oʻramoq: ovqat bilan “oʻralgan” — toʻq. 吃饱 — toʻyib yemoq.", "", "它好像还没吃饱。", "U hali toʻymaganga oʻxshaydi."], ["张", "zhāng", "v", "ochmoq (ogʻiz)", "张 ning yangi maʼnosi (1-mavzuda — hisob soʻz): 弓 kamonni tortib yoymoq → ochmoq.", "张嘴", "它站起来张着嘴找吃的呢。", "U oʻrnidan turib, ogʻzini ochib yegulik qidiryapti."], ["嘴", "zuǐ", "n", "ogʻiz", "口 ogʻiz + 觜.", "", "你张开嘴，我看看。", "Ogʻzingni och, koʻraychi."], ["身边", "shēnbiān", "n", "yonida", "身 tana + 边 tomon: “tananing yonida”.", "", "它身边那只熊猫半天没动。", "Uning yonidagi panda ancha vaqtdan beri qimirlamayapti."], ["半天", "bàntiān", "num-m", "ancha vaqt, uzoq", "半 yarim + 天 kun: “yarim kun” — juda uzoq tuyulgan vaqt.", "", "我等了你半天了。", "Seni ancha kutdim."], ["脸", "liǎn", "n", "yuz, bet", "月 tana + 佥.", "", "我看不见它的脸，可能是吧。", "Uning yuzini koʻra olmayapman, shunday boʻlsa kerak."], ["大人", "dàren", "n", "kattalar", "大 katta + 人 odam. Teskarisi — 孩子.", "", "大人和孩子最喜爱的还是大熊猫。", "Kattalar ham, bolalar ham eng koʻp yaxshi koʻradigani baribir panda."], ["喜爱", "xǐʼài", "v", "yaxshi koʻrmoq", "喜 (喜欢) + 爱: 喜欢 ga yaqin, yozma tilda.", "", "这是我最喜爱的动物。", "Bu mening eng yaxshi koʻradigan hayvonim."]], "grammar": [{"zh": "并列复句“一会儿……，一会儿……”", "uz": "Goh …, goh …", "f": ["一会儿 + A，一会儿 + B"], "ex": "一会儿……，一会儿…… qisqa vaqt ichida boʻladigan har xil harakatlarni yoki almashinib turadigan qarama-qarshi holatlarni bildiradi.", "eg": [["它一会儿在你脚边睡觉，一会儿在你身上爬。", "U goh oyogʻing yonida uxlaydi, goh ustingga tirmashib chiqadi.", "它:S|一会儿:K|在你脚边:L|睡觉，:P|一会儿:K|在你身上:L|爬:P", 0], ["他一会儿进来，一会儿出去，忙得很。", "U goh kiradi, goh chiqadi, juda band.", "他:S|一会儿:K|进来，:P|一会儿:K|出去，:P|忙得很:P", 0], ["最近天气变化很快，一会儿冷，一会儿热。", "Oxirgi paytda havo tez oʻzgaryapti: goh sovuq, goh issiq.", "最近:D|天气:S|变化很快，:P|一会儿:K|冷，:P|一会儿:K|热:P", 0], ["孩子们一会儿唱歌，一会儿跳舞。", "Bolalar goh qoʻshiq aytadi, goh raqsga tushadi.", "孩子们:S|一会儿:K|唱歌，:P|一会儿:K|跳舞:P", 1], ["这只大熊猫一会儿爬上去，一会儿跳下来。", "Bu panda goh yuqoriga chiqadi, goh pastga sakraydi.", "这只大熊猫:S|一会儿:K|爬上去，:P|一会儿:K|跳下来:P", 1]], "why": "一会儿 — “bir pas”: bir pas bunisi, bir pas unisi. Oʻzbekchadagi “goh …, goh …” ning aynan oʻzi: goh oyogʻing yonida uxlaydi, goh ustingga chiqadi. Qisqa vaqt ichida almashinib turadigan harakat yoki holat.", "mis": [["天气一会儿冷，热一会儿。", "天气一会儿冷，一会儿热。", "一会儿 har bir qismning BOSHIDA, feʼl yoki sifat oldida turadi."]]}, {"zh": "介词“关于”", "uz": "… haqida", "f": ["关于 + ot / ot birikmasi，…"], "ex": "关于 predlogidan keyin ot keladi va gap qaysi narsa haqida ekanini kiritadi.", "eg": [["关于这个问题，我得慢慢给你讲。", "Bu savol haqida senga sekin-asta tushuntirib berishim kerak.", "关于这个问题，:K|我:S|得:D|慢慢:D|给你:D|讲:P", 0], ["关于他的要求，我们还要开会以后再决定。", "Uning talabi haqida majlisdan keyin qaror qilamiz.", "关于他的要求，:K|我们:S|还要:D|开会以后:D|再:D|决定:P", 0], ["关于比赛的时间，我明天一定告诉大家。", "Musobaqa vaqti haqida ertaga hammaga albatta aytaman.", "关于比赛的时间，:K|我:S|明天:D|一定:D|告诉:P|大家:O", 0], ["关于大熊猫，我知道很多故事。", "Panda haqida koʻp hikoya bilaman.", "关于大熊猫，:K|我:S|知道:P|很多故事:O", 1], ["关于晚会的节目，我们明天再聊。", "Kechaning dasturi haqida ertaga gaplashamiz.", "关于晚会的节目，:K|我们:S|明天:D|再:D|聊:P", 1]], "why": "关于 — “…ga tegishli”: gap nima HAQIDA ekanini oldindan aytib qoʻyadi. Oʻzbekchadagi “… haqida”, “…ga kelsak”: 关于这个问题 — bu savolga kelsak. Odatda gap boshida turadi.", "mis": [["我关于这个问题有很多想法。", "关于这个问题，我有很多想法。", "关于 birikmasi odatda gap BOSHIDA, egadan oldin turadi."]]}, {"zh": "固定短语“一般来说”", "uz": "Odatda, umuman olganda", "f": ["一般来说，…"], "ex": "一般来说 turgʻun birikma boʻlib, “koʻp hollarda shunday” degan maʼnoni bildiradi. Koʻpincha gap boshida ishlatiladi.", "eg": [["一般来说，熊猫每天要睡很多次觉。", "Odatda panda kuniga koʻp marta uxlaydi.", "一般来说，:K|熊猫:S|每天:D|要:D|睡:P|很多次:C|觉:O", 0], ["一般来说，这种树每年开一次花。", "Odatda bu daraxt yiliga bir marta gullaydi.", "一般来说，:K|这种树:S|每年:D|开:P|一次:C|花:O", 0], ["一般来说，学习外语需要多练习。", "Umuman olganda, chet tilini oʻrganish uchun koʻp mashq qilish kerak.", "一般来说，:K|学习外语:S|需要:P|多练习:O", 0], ["一般来说，南方的冬天不太冷。", "Odatda janubda qish unchalik sovuq boʻlmaydi.", "一般来说，:K|南方的冬天:S|不太冷:P", 1], ["一般来说，周末动物园里的游客比较多。", "Odatda dam olish kunlari hayvonot bogʻida sayyohlar koʻproq boʻladi.", "一般来说，:K|周末:D|动物园里的游客:S|比较多:P", 1]], "why": "一般来说 — “umuman aytganda”: 一般 (10-mavzu) odatdagi + 来说 aytsak. Koʻp hollarda shunday ekanini bildiradi, istisno boʻlishi ham mumkin. Oʻzbekchadagi “odatda”, “umuman olganda”.", "mis": [["一般来说，熊猫每天要睡很多次觉了。", "一般来说，熊猫每天要睡很多次觉。", "Odatiy holat aytilyapti, yangi oʻzgarish yoʻq — oxiriga 了 qoʻyilmaydi."]]}, {"zh": "比较句（11）", "uz": "A B dan … erta / kech / koʻp / kam + feʼl + miqdor", "f": ["A + 比 + B + 多 / 少 / 早 / 晚 + feʼl + son-hisob soʻz"], "ex": "比 li qiyosiy gapda kesim oddiy feʼl boʻlsa, uning oldiga 多, 少, 早, 晚 qoʻyilib, ikki narsa oʻrtasidagi miqdor yoki vaqt farqi koʻrsatiladi.", "eg": [["冬天比夏天早关门一个小时。", "Qishda yozdagidan bir soat erta yopiladi.", "冬天:S|比夏天:K|早:K|关门:P|一个小时:C", 0], ["哥哥比弟弟多吃了三个饺子。", "Akasi ukasidan uchta chuchvara koʻp yedi.", "哥哥:S|比弟弟:K|多:K|吃了:P|三个饺子:O", 0], ["我比他晚到了十分钟。", "Men undan oʻn daqiqa kech keldim.", "我:S|比他:K|晚:K|到了:P|十分钟:C", 0], ["今天我比平时早起床半个小时。", "Bugun odatdagidan yarim soat erta turdim.", "今天:D|我:S|比平时:K|早:K|起床:P|半个小时:C", 1], ["他比我多做了两个练习。", "U mendan ikkita mashq koʻp bajardi.", "他:S|比我:K|多:K|做了:P|两个练习:O", 1]], "why": "Oʻzbekchada “qishda yozdagidan bir soat ERTA yopiladi” — xitoychada ham 早/晚/多/少 feʼl OLDIGA, farq miqdori esa feʼldan KEYIN keladi: 早关门一个小时.", "mis": [["冬天比夏天关门早一个小时。", "冬天比夏天早关门一个小时。", "早/晚/多/少 feʼl OLDIDA turadi."], ["哥哥比弟弟吃了三个饺子多。", "哥哥比弟弟多吃了三个饺子。", "Farq miqdori (三个饺子) feʼldan keyin, 多 esa feʼldan oldin keladi."]]}], "texts": [{"k": 1, "scene": "在一家宠物领养店，王一雪和孩子们在看动物。", "sceneuz": "Uy hayvonlarini asrab olish markazida Van Isyue bolalari bilan hayvonlarni koʻryapti.", "lines": [["刘小雪", "这只小猫你们养了多久了？", "Bu mushukchani qancha vaqtdan beri boqyapsizlar?"], ["服务员", "已经一年多了。第一天看见它的时候，它又脏又小。", "Bir yildan oshdi. Birinchi kuni koʻrganimda, u ham iflos, ham kichkina edi."], ["刘小雪", "现在它变得又干净又漂亮了。", "Endi u ham toza, ham chiroyli boʻlib qolibdi."], ["服务员", "是啊。它还特别可爱，一会儿在你脚边睡觉，一会儿在你身上爬。", "Ha. U yana juda yoqimtoy, goh oyogʻing yonida uxlaydi, goh ustingga tirmashib chiqadi."], ["刘小雪", "你们把它照顾得真好。", "Unga juda yaxshi qarabsizlar."], ["服务员", "它就好像我们的孩子，我们照顾它，它也认得我们了。", "U xuddi bizning bolamizdek, biz unga qaraymiz, u ham bizni taniydigan boʻlib qoldi."], ["刘小雪", "妈妈，我们家也养一只小猫吧。", "Oyi, biz ham uyda bitta mushukcha boqaylik."], ["王一雪", "咱们没时间照顾，还是别养了，我周末带你们去北京动物园看动物吧。", "Qarashga vaqtimiz yoʻq, yaxshisi boqmaylik, dam olish kuni sizlarni Pekin hayvonot bogʻiga hayvonlarni koʻrgani olib boraman."]]}, {"k": 2, "scene": "在动物园，王一雪和孩子们边走边聊。", "sceneuz": "Hayvonot bogʻida Van Isyue bolalari bilan yurib ketib gaplashyapti.", "lines": [["刘小明", "妈妈，大熊猫这个名字很奇怪，它们跟猫有什么关系？", "Oyi, “katta ayiq-mushuk” degan nom juda gʻalati, ularning mushukka nima aloqasi bor?"], ["王一雪", "这个问题问得好，它们跟猫没什么关系，其实应该叫大猫熊。", "Yaxshi savol, ularning mushukka hech qanday aloqasi yoʻq, aslida “katta mushuk-ayiq” deyish kerak edi."], ["刘小明", "大熊猫为什么只吃竹子不吃肉？", "Pandalar nega faqat bambuk yeydi, goʻsht yemaydi?"], ["王一雪", "它们跟人一样，也可以吃肉，但是对肉不感兴趣。", "Ular ham odamlarga oʻxshab goʻsht yeyishi mumkin, lekin goʻshtga qiziqishmaydi."], ["刘小明", "大熊猫为什么是中国的国宝？", "Panda nega Xitoyning milliy boyligi?"], ["王一雪", "全世界只有中国有野生大熊猫，中国是大熊猫的家。", "Butun dunyoda faqat Xitoyda yovvoyi panda bor, Xitoy — pandalarning uyi."], ["刘小明", "我听说有的熊猫出国了，他们去哪儿了？", "Baʼzi pandalar chet elga ketganini eshitdim, ular qayerga ketishdi?"], ["王一雪", "关于这个问题，我得慢慢给你讲。", "Bu savol haqida senga sekin-asta tushuntirib berishim kerak."], ["刘小雪", "弟弟，你真是“十万个为什么”。", "Uka, sen haqiqiy “yuz ming nega”san."]]}, {"k": 3, "scene": "在熊猫馆，王一雪和孩子们在看大熊猫。", "sceneuz": "Pandalar uyida Van Isyue bolalari bilan pandalarni tomosha qilyapti.", "lines": [["刘小雪", "这只大熊猫一会儿爬上去，一会儿跳下来，可爱极了！", "Bu panda goh tepaga tirmashadi, goh pastga sakraydi, juda yoqimtoy!"], ["王一雪", "它好像还没吃饱，站起来张着嘴找吃的呢。", "U hali toʻymaganga oʻxshaydi, oʻrnidan turib, ogʻzini ochib yegulik qidiryapti."], ["刘小雪", "它身边那只熊猫半天没动，是不是在睡觉呢？", "Uning yonidagi panda ancha vaqtdan beri qimirlamayapti, uxlayaptimikan?"], ["王一雪", "我看不见它的脸，可能是吧。一般来说，熊猫每天要睡很多次觉。", "Yuzini koʻra olmayapman, shunday boʻlsa kerak. Odatda pandalar har kuni koʻp marta uxlaydi."], ["刘小雪", "对，除了睡觉以外，很多时间都在吃东西。", "Ha, uyqudan tashqari koʻp vaqti ovqat yeyish bilan oʻtadi."], ["刘小明", "大熊猫的生活真舒服啊！", "Pandalarning hayoti naqadar rohat-a!"], ["刘小雪", "妈妈，您帮我和这两只大熊猫照一张照片吧。", "Oyi, meni shu ikki panda bilan bitta suratga olib qoʻying."]]}, {"k": 4, "scene": "在家里，王一雪在写日记。", "sceneuz": "Uyda Van Isyue kundalik yozyapti.", "lines": [["", "今天我带小雪和小明去动物园玩了。", "Bugun Syaosyue va Syaominni hayvonot bogʻiga sayrga olib bordim."], ["", "北京动物园是中国很有名的动物园，里面有非常多的动物，当然，大人和孩子最喜爱的还是大熊猫。", "Pekin hayvonot bogʻi — Xitoydagi juda mashhur hayvonot bogʻi, unda juda koʻp hayvonlar bor, albatta, kattalar ham, bolalar ham eng yaxshi koʻradigani baribir panda."], ["", "每天有很多游客去熊猫馆，他们带着相机去给可爱的大熊猫拍照。", "Har kuni koʻp sayyohlar pandalar uyiga borib, fotoapparat bilan yoqimtoy pandalarni suratga olishadi."], ["", "动物园早上七点半开门，晚上七点关门，冬天比夏天游客少，所以也比平时早关门一个小时。", "Hayvonot bogʻi ertalab yetti yarimda ochilib, kechqurun yettida yopiladi, qishda sayyohlar yozdagidan kam, shuning uchun odatdagidan bir soat erta yopiladi."], ["", "如果第一次来北京旅游，跟家人一起去北京动物园是个不错的选择。", "Agar Pekinga birinchi marta sayohatga kelsangiz, oila bilan Pekin hayvonot bogʻiga borish — yaxshi tanlov."]]}]}, {"n": 17, "zh": "我要多向认真的人学习", "py": "Wǒ yào duō xiàng rènzhēn de rén xuéxí", "uz": "Men astoydil odamlardan koʻproq oʻrganishim kerak", "words": [["向", "xiàng", "prep", "…ga (qarab), …dan (oʻrganmoq)", "Harakat yoʻnalishi yoki kimga qaratilgani: 向前走 — oldinga yurmoq, 向他学习 — undan oʻrganmoq.", "", "别再向前走了，李老师的办公室已经到了。", "Endi oldinga yurma, Li ustozning xonasiga yetib keldik."], ["楼梯", "lóutī", "n", "zinapoya", "楼 bino + 梯 narvon (木 yogʻoch): “binodagi narvon”.", "", "我在楼梯那儿等你。", "Seni zinapoya oldida kutaman."], ["害怕", "hàipà", "v", "qoʻrqmoq", "害 zarar + 怕 qoʻrqmoq (忄 yurak): “zarardan yurak qoʻrqadi”. 怕 ning kuchliroq shakli.", "", "我害怕见李老师。", "Li ustozni koʻrishdan qoʻrqaman."], ["生气", "shēngqì", "v", "jahli chiqmoq", "生 paydo boʻlmoq + 气 havo, gʻazab: “ichida gʻazab paydo boʻldi”.", "", "最近我做错了好几件事，我怕李老师生气。", "Oxirgi paytda bir nechta ishni xato qildim, Li ustozning jahli chiqishidan qoʻrqaman."], ["常见", "cháng jiàn", "adj", "koʻp uchraydigan, odatiy", "常 tez-tez + 见 koʻrmoq: “tez-tez koʻriladigan”.", "", "你想多了，做错事情是很常见的。", "Koʻp oʻylab yuboribsan, ishni xato qilish juda odatiy hol."], ["聪明", "cōngming", "adj", "aqlli", "聪 (耳 quloq) + 明 (日 quyosh, 月 oy): yaxshi eshitadi, ravshan koʻradi — aqlli.", "", "有的人虽然很聪明，但是会在简单的事情中出错。", "Baʼzi odamlar garchi aqlli boʻlsa ham, oddiy ishlarda xato qiladi."], ["错", "cuò", "n", "xato", "钅 metall + 昔: 做错 dagi 错 (sifat) endi ot ham: 出错 — xato qilmoq.", "", "这次考试我只出了一个错。", "Bu imtihonda faqat bitta xato qildim."], ["认为", "rènwéi", "v", "deb hisoblamoq, fikricha", "认 tan olmoq + 为 deb: “… deb tan olmoq”. 觉得 dan rasmiyroq.", "", "因为他们认为事情简单，就不会认真去做了。", "Ular ishni oddiy deb hisoblagani uchun, astoydil qilmay qoʻyadi."], ["到处", "dàochù", "adv", "hamma yerda, har yerda", "到 yetmoq + 处 joy: “har bir joyga yetib”.", "", "同学们都在到处找工作呢。", "Sinfdoshlar hamma yerda ish qidirib yurishibdi."], ["继续", "jìxù", "v", "davom ettirmoq", "继 + 续 — ikkalasida ham 纟 ip: uzilgan ipni ulab davom ettirmoq.", "", "我不想现在就工作，还想继续学习。", "Hozirning oʻzida ishlashni xohlamayman, oʻqishni davom ettirmoqchiman."], ["同意", "tóngyì", "v", "rozi boʻlmoq", "同 bir xil + 意 fikr: “fikri bir xil”.", "", "我想继续学习，我爸妈也同意。", "Oʻqishni davom ettirmoqchiman, ota-onam ham rozi."], ["可", "kě", "conj", "lekin, ammo", "可是 ning qisqasi, ogʻzaki nutqda.", "", "可我还没想好学什么。", "Lekin nima oʻqishni hali oʻylab koʻrmadim."], ["屋子", "wūzi", "n", "xona", "屋 (尸 tom + 至 yetmoq): tom ostidagi joy. 房间 ga yaqin, ogʻzaki.", "", "我记得那个屋子里有些跟电脑有关的书。", "Esimda, oʻsha xonada kompyuterga oid kitoblar bor edi."], ["有关", "yǒuguān", "v/prep", "aloqador boʻlmoq; …ga oid", "有 bor + 关 (关系 dagi): “aloqasi bor”. 跟……有关 — … bilan bogʻliq.", "", "你可以去看看跟电脑有关的书。", "Kompyuterga oid kitoblarni koʻrib chiqishing mumkin."], ["关机", "guānjī", "v", "(telefonni) oʻchirmoq", "关 yopmoq, oʻchirmoq + 机 (手机 dagi). Teskarisi — 开机.", "", "天中，你的手机怎么关机了？", "Tyanchjun, telefoning nega oʻchiq?"], ["前天", "qiántiān", "n", "oʻtgan kuni (kechadan oldingi kun)", "前 oldin + 天 kun. Qatori: 前天, 昨天, 今天, 明天, 后天.", "", "前天我看见家月了。", "Oʻtgan kuni Jiayueni koʻrdim."], ["留学", "liúxué", "v", "chet elda oʻqimoq", "留 qolmoq + 学 oʻqimoq. 留学生 — 14-mavzu.", "", "她告诉我你打算继续留学？", "U menga chet elda oʻqishni davom ettirmoqchisan deb aytdi-ku?"], ["国家", "guójiā", "n", "mamlakat, davlat", "国 davlat + 家 uy: “xalqning katta uyi”.", "", "我还没想好学什么，更没想好去哪个国家。", "Nima oʻqishni hali oʻylamadim, qaysi mamlakatga borishni esa undan ham oʻylamadim."], ["比如", "bǐrú", "v", "masalan", "比 qiyoslamoq + 如 kabi: “qiyoslasak, … kabi”.", "", "比如可以去北京、上海这样的大城市。", "Masalan, Pekin, Shanxay kabi katta shaharlarga borish mumkin."], ["查", "chá", "v", "qidirib koʻrmoq, tekshirmoq", "木 daraxt + 旦: daraxtni tekshirib koʻrmoq. 上网查 — internetdan qidirmoq.", "", "好，那我上网查一查。", "Xoʻp, unda internetdan qidirib koʻraman."], ["有用", "yǒuyòng", "adj", "foydali", "有 bor + 用 foyda: “foydasi bor”. Teskarisi — 没用.", "", "我给你介绍几个有用的网站。", "Senga bir nechta foydali sayt tavsiya qilaman."], ["容易", "róngyì", "adj", "oson", "容 sigʻmoq + 易 oson: “oson sigʻadi”. Teskarisi — 难.", "", "这个问题真不容易回答。", "Bu savolga javob berish chindan oson emas."], ["回答", "huídá", "v", "javob bermoq", "回 qaytarmoq + 答 javob (⺮): “javob qaytarmoq”. Teskarisi — 问.", "", "你回答一下这个问题。", "Bu savolga javob berib koʻr."], ["方向", "fāngxiàng", "n", "yoʻnalish", "方 tomon + 向 yoʻnalish (bu darsdagi predlog 向).", "", "大家选择的方向都不同。", "Hammaning tanlagan yoʻnalishi har xil."], ["只有", "zhǐyǒu", "conj", "faqat …gina (shart)", "只 faqat + 有 bor: “faqat shu boʻlsa”. 只有……，才…… — faqat …sagina, ….", "", "只有想清楚自己真正喜欢什么，才能做出最合适的选择。", "Faqat oʻzing chindan nimani yoqtirishingni aniq bilsanggina, eng toʻgʻri tanlovni qila olasan."], ["真正", "zhēnzhèng", "adv", "chindan, haqiqatan", "真 haqiqiy + 正 toʻgʻri: “chinakam”.", "", "我还不知道自己真正喜欢什么。", "Oʻzim chindan nimani yoqtirishimni hali bilmayman."], ["难题", "nántí", "n", "qiyin masala", "难 qiyin + 题 savol, masala (问题 dagi).", "", "对我来说，想清楚“真正喜欢什么”是个难题。", "Men uchun “chindan nimani yoqtirishimni” aniqlash qiyin masala."]], "grammar": [{"zh": "介词“向”", "uz": "…ga (qarab), …dan (oʻrganmoq)", "f": ["向 + ot / olmosh + feʼl"], "ex": "向 predlogidan keyin olmosh, ot yoki ot birikmasi kelib, harakatning yoʻnalishi yoki kimga qaratilganini bildiradi.", "eg": [["别再向前走了。", "Endi oldinga yurma.", "别:D|再:D|向前:K|走了:P", 0], ["以后我要多向认真的人学习。", "Bundan keyin astoydil odamlardan koʻproq oʻrganishim kerak.", "以后:D|我:S|要:D|多:D|向认真的人:K|学习:P", 0], ["孩子一看见妈妈，就向她跑过去了。", "Bola onasini koʻrishi bilan unga qarab yugurib ketdi.", "孩子:S|一看见妈妈，:N|就:D|向她:K|跑过去了:P", 0], ["你应该向老师问这个问题。", "Bu savolni ustozdan soʻrashing kerak.", "你:S|应该:D|向老师:K|问:P|这个问题:O", 1], ["我们向东走了半天。", "Sharqqa qarab ancha yurdik.", "我们:S|向东:K|走了:P|半天:C", 1]], "why": "向 harakat qaysi tomonga yoki kimga qaratilganini koʻrsatadi: oʻzbekchada “…ga qarab” yoki “…dan (oʻrganmoq)”. 向 birikmasi doim feʼldan OLDIN turadi.", "mis": [["我要多学习向认真的人。", "我要多向认真的人学习。", "向 + kishi feʼldan OLDIN keladi."], ["他跑过去向妈妈。", "他向妈妈跑过去。", "Yoʻnalish (向妈妈) feʼl oldiga qoʻyiladi."]]}, {"zh": "反问句“不是……吗？”", "uz": "…-ku? (ritorik soʻroq)", "f": ["ega + 不是 + … + 吗？"], "ex": "不是……吗？ ritorik soʻrogʻi odatda soʻzlovchining tushunmasligi yoki noroziligini, baʼzan eslatish yoki tasdiqlashni bildiradi. Shakli inkor, maʼnosi esa tasdiq.", "eg": [["你不是喜欢玩电脑吗？你可以去看看跟电脑有关系的书。", "Sen kompyuterni yaxshi koʻrasan-ku? Kompyuterga oid kitoblarni koʻrib chiqishing mumkin.", "你:S|不是:K|喜欢:P|玩电脑:O|吗？:K|你:S|可以:D|去看看:P|跟电脑有关系的:A|书:O", 0], ["你不是说今天有事吗？为什么来了？", "Bugun ishim bor degan eding-ku? Nega kelding?", "你:S|不是:K|说:P|今天有事:O|吗？:K|为什么:D|来了:P", 0], ["考试不是下个月吗？你怎么今天就开始复习了？", "Imtihon kelasi oyda-ku? Nega bugundan takrorlashni boshlading?", "考试:S|不是:K|下个月:P|吗？:K|你:S|怎么:D|今天:D|就:D|开始复习了:P", 0], ["你不是同意了吗？怎么又不去了？", "Rozi boʻlgan eding-ku? Nega yana bormaydigan boʻlding?", "你:S|不是:K|同意了:P|吗？:K|怎么:D|又:D|不去了:P", 1], ["这不是你的书吗？", "Bu sening kitobing-ku?", "这:S|不是:K|你的书:P|吗:K", 1]], "why": "不是……吗？ — inkor shaklidagi soʻroq, lekin javob kutmaydi: soʻzlovchi “axir shunday-ku” deb eslatadi yoki hayron boʻladi. Oʻzbekchadagi “…-ku?” ga toʻgʻri keladi.", "mis": [["你不喜欢玩电脑吗？你可以看这本书。", "你不是喜欢玩电脑吗？你可以看这本书。", "Eslatish uchun 不是 kerak; 不喜欢……吗 — oddiy soʻroq (“yoqtirmaysanmi?”)."], ["你不是说今天有事？", "你不是说今天有事吗？", "Oxirida 吗 boʻlishi shart."]]}, {"zh": "递进复句“……，更……”", "uz": "…, undan ham … (kuchayib boruvchi gap)", "f": ["birinchi qism，更 + ikkinchi qism"], "ex": "……，更…… gapida ikkinchi qism daraja jihatidan bir pogʻona chuqurroq maʼnoni bildiradi.", "eg": [["我还没想好学什么，更没想好去哪个国家。", "Nima oʻqishni hali oʻylamadim, qaysi mamlakatga borishni esa undan ham oʻylamadim.", "我:S|还没:D|想好:P|学什么，:O|更:K|没:D|想好:P|去哪个国家:O", 0], ["想提高中文水平要多听多看，更要多说多练。", "Xitoy tili darajasini oshirish uchun koʻp tinglash va oʻqish, undan ham koʻproq gapirish va mashq qilish kerak.", "想提高中文水平:D|要:D|多听多看，:P|更:K|要:D|多说多练:P", 0], ["来中国学习，我学会了中文，更了解了中国文化。", "Xitoyga oʻqishga kelib, xitoy tilini oʻrgandim, undan ham koʻproq Xitoy madaniyatini tushundim.", "来中国学习，:D|我:S|学会了:P|中文，:O|更:K|了解了:P|中国文化:O", 0], ["他很聪明，更很认真。", "U aqlli, undan ham muhimi — astoydil.", "他:S|很:D|聪明，:P|更:K|很:D|认真:P", 1], ["找工作需要别人的帮助，更需要自己的努力。", "Ish topish uchun boshqalarning yordami kerak, undan ham koʻproq oʻzingning harakating kerak.", "找工作:S|需要:P|别人的帮助，:O|更:K|需要:P|自己的努力:O", 1]], "why": "更 ikkinchi qismni “undan ham kuchliroq” qilib koʻrsatadi: birinchi gap — oddiy holat, ikkinchisi — yanada muhimi yoki yanada chuquri.", "mis": [["我还没想好学什么，没更想好去哪个国家。", "我还没想好学什么，更没想好去哪个国家。", "更 inkor soʻzidan (没/不) OLDIN keladi."]]}, {"zh": "条件复句“只有……，才……”", "uz": "Faqat …sagina, … (yagona shart)", "f": ["只有 + shart，(ega) + 才 + natija"], "ex": "只有……，才…… gapida 只有 dan keyingi qism natijaga erishishning yagona sharti; bu shart boʻlmasa, 才 dan keyingi natija ham boʻlmaydi.", "eg": [["只有想清楚自己真正喜欢什么，才能做出最合适的选择。", "Faqat oʻzing chindan nimani yoqtirishingni aniq bilsanggina, eng toʻgʻri tanlovni qila olasan.", "只有:K|想清楚自己真正喜欢什么，:N|才:K|能:D|做出:P|最合适的:A|选择:O", 0], ["只有每天锻炼身体，才会越来越健康。", "Faqat har kuni badantarbiya qilsanggina, tobora sogʻlom boʻlasan.", "只有:K|每天锻炼身体，:N|才:K|会:D|越来越:D|健康:P", 0], ["只有多听、多说、多看，你的中文水平才能提高。", "Faqat koʻp tinglab, koʻp gapirib, koʻp oʻqisanggina, xitoy tili darajang oshadi.", "只有:K|多听、多说、多看，:N|你的:A|中文水平:S|才:K|能:D|提高:P", 0], ["只有认真回答问题，老师才会同意。", "Faqat savollarga astoydil javob bersanggina, ustoz rozi boʻladi.", "只有:K|认真回答问题，:N|老师:S|才:K|会:D|同意:P", 1], ["只有继续努力，才能找到有用的方法。", "Faqat harakatni davom ettirsanggina, foydali usul topa olasan.", "只有:K|继续努力，:N|才:K|能:D|找到:P|有用的:A|方法:O", 1]], "why": "只有 — yagona shart: “faqat shu boʻlsagina”. Shuning uchun natija qismida 就 emas, 才 keladi (就 — 只要 bilan, 18-mavzu).", "mis": [["只有每天练习，就能提高。", "只有每天练习，才能提高。", "只有 bilan 才 juft keladi."], ["只有多听多说，你的中文水平能才提高。", "只有多听多说，你的中文水平才能提高。", "才 modal feʼldan (能/会) OLDIN, egadan KEYIN turadi."]]}], "texts": [{"k": 1, "scene": "在教学楼里，刘小雪和同学边走边聊。", "sceneuz": "Oʻquv binosida Lyu Syaosyue sinfdoshi bilan yurib ketib gaplashyapti.", "lines": [["刘小雪", "别再向前走了，李老师的办公室已经到了。", "Endi oldinga yurma, Li ustozning xonasiga yetib keldik."], ["同学", "你进去吧，我在楼梯那儿等你。我害怕见李老师。", "Sen kiraver, men seni zinapoya oldida kutaman. Li ustozni koʻrishdan qoʻrqaman."], ["刘小雪", "怎么回事？", "Nima gap?"], ["同学", "最近我做错了好几件事，我怕李老师生气。", "Oxirgi paytda bir nechta ishni xato qildim, Li ustozning jahli chiqishidan qoʻrqaman."], ["刘小雪", "你想多了，做错事情是很常见的。", "Koʻp oʻylab yuboribsan, ishni xato qilish juda odatiy hol."], ["同学", "我把简单的事情做错了，李老师一定觉得我不认真。", "Oddiy ishni xato qildim, Li ustoz meni albatta beparvo deb oʻylaydi."], ["刘小雪", "有的人虽然很聪明，但是会在简单的事情中出错，因为他们认为事情简单，就不会认真去做了。", "Baʼzi odamlar garchi aqlli boʻlsa ham, oddiy ishlarda xato qiladi, chunki ishni oddiy deb hisoblab, astoydil qilmay qoʻyadi."], ["同学", "你说的就是我，以后我要多向认真的人学习。", "Sen aynan meni aytyapsan, bundan keyin astoydil odamlardan koʻproq oʻrganishim kerak."]]}, {"k": 2, "scene": "在阅览室门口，白家月碰到了陈天中。", "sceneuz": "Oʻqish zali eshigi oldida Bay Jiayue Chen Tyanchjunni uchratib qoldi.", "lines": [["白家月", "太阳从西边出来了？这几天怎么总是在图书馆看见你？", "Quyosh gʻarbdan chiqdimi? Shu kunlarda nega doim seni kutubxonada koʻryapman?"], ["陈天中", "这有什么奇怪的？我是来学习的。", "Buning nimasi gʻalati? Men oʻqigani kelganman."], ["白家月", "你怎么还来图书馆学习？同学们都在到处找工作呢。", "Nega hali ham kutubxonaga oʻqigani kelyapsan? Sinfdoshlar hamma yerda ish qidirib yurishibdi."], ["陈天中", "我不想现在就工作，还想继续学习，我爸妈也同意。可我还没想好学什么，所以来图书馆看看。", "Hozirning oʻzida ishlashni xohlamayman, oʻqishni davom ettirmoqchiman, ota-onam ham rozi. Lekin nima oʻqishni hali oʻylab koʻrmadim, shuning uchun kutubxonaga qarab ketay dedim."], ["白家月", "你不是喜欢玩电脑吗？你可以去看看跟电脑有关系的书。", "Sen kompyuterni yaxshi koʻrasan-ku? Kompyuterga oid kitoblarni koʻrib chiqishing mumkin."], ["陈天中", "你说得对，我记得那个屋子里有些跟电脑有关的书，我去找找。", "Toʻgʻri aytding, esimda, oʻsha xonada kompyuterga oid kitoblar bor edi, borib qidirib koʻraman."]]}, {"k": 3, "scene": "在校园里，李文和陈天中在聊天儿。", "sceneuz": "Universitet hududida Li Ven va Chen Tyanchjun suhbatlashyapti.", "lines": [["李文", "天中，你的手机怎么关机了？", "Tyanchjun, telefoning nega oʻchiq?"], ["陈天中", "我的手机没电了。你找我有事吗？", "Telefonimning quvvati tugadi. Menda ishing bormidi?"], ["李文", "前天我看见家月了，她告诉我你打算继续留学？", "Oʻtgan kuni Jiayueni koʻrdim, u menga chet elda oʻqishni davom ettirmoqchisan deb aytdi-ku?"], ["陈天中", "是，可是我还没想好学什么，更没想好去哪个国家。", "Ha, lekin nima oʻqishni hali oʻylamadim, qaysi mamlakatga borishni esa undan ham oʻylamadim."], ["李文", "你可以去中国学中文啊。比如可以去北京、上海这样的大城市，那里有很多好大学，也有很多留学生。", "Xitoyga borib xitoy tilini oʻqishing mumkin-ku. Masalan, Pekin, Shanxay kabi katta shaharlarga, u yerda yaxshi universitetlar ham, chet ellik talabalar ham koʻp."], ["陈天中", "好，那我上网查一查。", "Xoʻp, unda internetdan qidirib koʻraman."], ["李文", "我给你介绍几个有用的网站。", "Senga bir nechta foydali sayt tavsiya qilaman."]]}, {"k": 4, "scene": "在家里，陈天中在写日记。", "sceneuz": "Uyda Chen Tyanchjun kundalik yozyapti.", "lines": [["", "大学生活马上就要结束了，我最近经常被问到一个问题——“你以后想做什么”，这个问题真不容易回答。", "Talabalik hayoti tez orada tugaydi, oxirgi paytda menga tez-tez bitta savol beriladi — “kelajakda nima qilmoqchisan?” Bu savolga javob berish chindan oson emas."], ["", "我也问了几个同学，大家选择的方向都不同。", "Bir nechta sinfdoshlarimdan ham soʻradim, hammaning tanlagan yoʻnalishi har xil."], ["", "有的想继续在学校学习，有的打算出国留学，还有的决定先找工作。", "Baʼzilari oʻqishni davom ettirmoqchi, baʼzilari chet elga oʻqishga bormoqchi, yana baʼzilari avval ish topishga qaror qilgan."], ["", "我认为只有想清楚自己真正喜欢什么，才能做出最合适的选择。", "Menimcha, faqat oʻzing chindan nimani yoqtirishingni aniq bilsanggina, eng toʻgʻri tanlovni qila olasan."], ["", "对我来说，想清楚“真正喜欢什么”是个难题。", "Men uchun “chindan nimani yoqtirishimni” aniqlash qiyin masala."]]}]}, {"n": 18, "zh": "我学会了包饺子", "py": "Wǒ xuéhuì le bāo jiǎozi", "uz": "Chuchvara tugishni oʻrganib oldim", "words": [["怎样", "zěnyàng", "pron", "qanday, qay tarzda", "怎么样 ning qisqasi: 怎 qanday + 样 koʻrinish.", "", "你们怎样过节？", "Bayramni qanday oʻtkazasizlar?"], ["过节", "guòjié", "v", "bayramni nishonlamoq", "过 oʻtkazmoq + 节 bayram. 过年 — Yangi yilni nishonlamoq.", "", "我们一般会回家，跟家人一起过节。", "Odatda uyga qaytib, oila bilan birga bayram qilamiz."], ["节", "jié", "n", "bayram", "节 ning yangi maʼnosi (14-mavzuda — dars soati): yilning “boʻgʻimi” — bayram. 春节 — Bahor bayrami.", "", "你最喜欢哪个节？", "Qaysi bayramni eng yaxshi koʻrasan?"], ["节日", "jiérì", "n", "bayram (kuni)", "节 bayram + 日 kun: “bayram kuni”.", "", "春节是中国最重要的节日。", "Bahor bayrami — Xitoyning eng muhim bayrami."], ["联欢", "liánhuān", "v", "birga bayram qilmoq, kecha oʻtkazmoq", "联 birlashmoq + 欢 quvonch (喜欢 dagi): “birga quvonmoq”. 联欢晚会 — bayram kechasi.", "", "我们一边包饺子，一边看春节联欢晚会。", "Chuchvara tugib turib, Bahor bayrami kechasini tomosha qilamiz."], ["大概", "dàgài", "adv/adj", "taxminan, chamasi", "大 katta + 概 umumiy: “katta-katta qilib aytganda”.", "", "春节大概放七八天假。", "Bahor bayramida taxminan yetti-sakkiz kun dam olinadi."], ["阿姨", "āyí", "n", "xola (kattalarga murojaat)", "阿 (murojaat old qoʻshimchasi) + 姨 xola (女 ayol).", "", "张阿姨，过年好！", "Chjan xola, bayramingiz bilan!"], ["叔叔", "shūshu", "n", "amaki (kattalarga murojaat)", "叔 amaki — takrorlab murojaat qilinadi: 叔叔.", "", "谢谢您和叔叔请我来家里做客。", "Siz va amakim meni uyingizga mehmonga chaqirganingiz uchun rahmat."], ["收", "shōu", "v", "qabul qilmoq, olmoq", "攵 qoʻl harakati: qoʻl bilan yigʻib olmoq. 收下 — qabul qilib olmoq.", "", "这是我准备的礼物，请收下。", "Bu men tayyorlagan sovgʻa, qabul qilib oling."], ["总", "zǒng", "adv", "doim, hamisha", "总是 ning qisqasi.", "", "总听小文说起你，今天终于有机会见面了。", "Doim Syaovendan siz haqingizda eshitardim, bugun nihoyat koʻrishish imkoni boʻldi."], ["起", "qǐ", "v", "(feʼldan keyin: kim yoki nima haqida)", "起 — koʻtarmoq: gapga “koʻtarib chiqmoq”. 说起 — haqida gapirmoq, 想起 — esga olmoq.", "说起", "他常常说起他的老家。", "U tez-tez qishlogʻi haqida gapirib turadi."], ["见面", "jiànmiàn", "v", "koʻrishmoq, uchrashmoq", "见 koʻrmoq + 面 yuz: “yuzma-yuz koʻrishmoq”. 跟……见面.", "", "我们明天在学校门口见面吧。", "Ertaga maktab darvozasi oldida koʻrisharmiz."], ["矿泉水", "kuàngquánshuǐ", "n", "mineral suv", "矿 kon (石 tosh) + 泉 buloq + 水 suv: “tosh orasidagi buloq suvi”.", "", "桌子上有饮料，还有矿泉水。", "Stol ustida ichimlik ham, mineral suv ham bor."], ["刚刚", "gānggāng", "adv", "yaqinda, endigina", "刚 ni takrorlab: “endigina”. 刚才 dan farqi — kunlar, oylar oldin ham boʻlishi mumkin.", "", "我刚刚看视频学会了包饺子。", "Endigina videodan chuchvara tugishni oʻrgandim."], ["出发", "chūfā", "v", "yoʻlga chiqmoq", "出 chiqmoq + 发 joʻnamoq: “chiqib joʻnamoq”.", "", "这是他从北京出发时，我们全家在机场照的。", "Buni u Pekindan joʻnayotganda butun oilamiz bilan aeroportda tushganmiz."], ["不久", "bùjiǔ", "adj", "yaqinda, koʻp oʻtmay", "不 + 久 uzoq: “uzoq emas”.", "", "好像是不久前发生的一样。", "Xuddi yaqinda boʻlgandek."], ["发生", "fāshēng", "v", "yuz bermoq, sodir boʻlmoq", "发 chiqmoq + 生 paydo boʻlmoq: “chiqib paydo boʻlmoq”.", "", "这里发生了什么事？", "Bu yerda nima boʻldi?"], ["刚", "gāng", "adv", "endigina, hozirgina", "刂 pichoq: “kesib” oʻtgan zahoti. 刚……就…… — …shi bilan.", "", "他刚离开家时，我很不习惯。", "U uydan endigina ketganda, juda koʻnikolmadim."], ["只要", "zhǐyào", "conj", "…sa bas, faqat …sa", "只 faqat + 要 kerak: “faqat shu kerak”. 只要……，就…… — …sa bas, … boʻladi.", "", "只要几天不跟他视频，就很想他。", "Bir necha kun u bilan video orqali gaplashmasam, uni juda sogʻinaman."], ["学期", "xuéqī", "n", "semestr", "学 oʻqish + 期 davr (假期 dagi).", "", "还有最后一个学期就要毕业了。", "Oxirgi bitta semestr qoldi, keyin bitiradi."], ["毕业", "bìyè", "v", "(oʻqishni) bitirmoq", "毕 tugatmoq + 业 kasb, oʻqish: “oʻqishni tugatmoq”.", "", "他明年大学毕业。", "U kelasi yili universitetni bitiradi."], ["出生", "chūshēng", "v", "tugʻilmoq", "出 chiqmoq + 生 tugʻilmoq: “dunyoga chiqmoq”.", "", "他们给我看了李文出生时的照片。", "Ular menga Li Ven tugʻilgandagi suratlarni koʻrsatishdi."], ["过去", "guòqù", "n", "oʻtmish", "过 oʻtmoq + 去 ketmoq: “oʻtib ketgan” (feʼl sifatida: oʻtib ketmoq).", "", "他们还给我讲了很多他过去的故事。", "Ular yana menga uning oʻtmishi haqida koʻp hikoya aytib berishdi."], ["懂得", "dǒngde", "v", "anglamoq, tushunib yetmoq", "懂 tushunmoq (忄 yurak) + 得: “yurakdan tushunib yetmoq”.", "", "在他身上，我懂得了，只要一直坚持，就能完成自己的目标。", "Uning misolida tushunib yetdim: toʻxtamay harakat qilsang bas, maqsadingga erishasan."], ["坚持", "jiānchí", "v", "qatʼiyat bilan davom ettirmoq", "坚 mustahkam + 持 ushlamoq (扌): “mahkam ushlab turmoq”.", "", "只要你坚持每天早睡，身体就一定会好起来。", "Har kuni erta yotishni davom ettirsang bas, sogʻligʻing albatta yaxshilanadi."], ["完成", "wánchéng", "v", "bajarmoq, tugatmoq", "完 tugatmoq + 成 boʻlmoq: “tugatib boʻldi”.", "", "我已经完成今天的作业了。", "Bugungi uy vazifamni allaqachon bajarib boʻldim."], ["目标", "mùbiāo", "n", "maqsad", "目 koʻz + 标 belgi: “koʻz tikilgan belgi”.", "", "你今年的目标是什么？", "Bu yilgi maqsading nima?"], ["发展", "fāzhǎn", "v", "rivojlanmoq", "发 chiqmoq + 展 yoyilmoq: “oʻsib yoyilmoq”.", "", "我相信，他以后一定会发展得更好。", "Ishonaman, u kelajakda albatta yanada yaxshi rivojlanadi."], ["春节", "Chūnjié", "prop", "Bahor bayrami (Xitoy Yangi yili)", "春 bahor + 节 bayram: “bahor bayrami”.", "", "我要在中国过春节，真开心。", "Bahor bayramini Xitoyda oʻtkazaman, juda xursandman."]], "grammar": [{"zh": "概数表达法", "uz": "Taxminiy son: yetti-sakkiz, uch-toʻrt", "f": ["qoʻshni ikki son + hisob soʻz + ot"], "ex": "Xitoy tilida yonma-yon kelgan ikki son birga ishlatilib, aniq boʻlmagan, taxminiy miqdorni bildiradi.", "eg": [["春节大概放七八天假。", "Bahor bayramida taxminan yetti-sakkiz kun dam olinadi.", "春节:S|大概:D|放:P|七八天:K|假:O", 0], ["教室里来了五六个学生。", "Sinfga besh-oltita oʻquvchi keldi.", "教室里:L|来了:P|五六个:K|学生:O", 0], ["这些照片是三四年前照的吧？", "Bu suratlar uch-toʻrt yil oldin tushirilgan boʻlsa kerak?", "这些照片:S|是:N|三四年:K|前:N|照的:P|吧:N", 0], ["我每天学习两三个小时汉语。", "Har kuni ikki-uch soat xitoy tili oʻqiyman.", "我:S|每天:D|学习:P|两三个小时:K|汉语:O", 1], ["他喝了三四瓶矿泉水。", "U uch-toʻrt shisha mineral suv ichdi.", "他:S|喝了:P|三四瓶:K|矿泉水:O", 1]], "why": "Oʻzbekchada ham “yetti-sakkiz kun”, “uch-toʻrt yil” deymiz — xitoychada xuddi shunday: yonma-yon ikki son, hech qanday bogʻlovchisiz, keyin hisob soʻz.", "mis": [["五和六个学生", "五六个学生", "Ikki son orasiga 和 yoki vergul qoʻyilmaydi."], ["春节大概放七八天假吗？", "春节大概放七八天假。", "Taxminiy son — darak; aniq soʻrasang 几天."]]}, {"zh": "“刚才”和“刚刚”", "uz": "刚才 va 刚刚 farqi", "f": ["刚才 + ega + feʼl", "ega + 刚才 + feʼl", "ega + 刚刚 + feʼl"], "ex": "刚才 — vaqt oti, juda qisqa vaqt oldinni (odatda bir necha daqiqa) bildiradi; gap boshida yoki egadan keyin, feʼl oldida turadi. 刚刚 — vaqt ravishi, soʻzlovchi uchun voqea yaqinda boʻlganini bildiradi (daqiqalar, kunlar, hatto oylar); faqat egadan keyin, feʼl oldida turadi.", "eg": [["刚才的电话是我妈妈打来的。", "Hozirgi qoʻngʻiroq onamdan edi.", "刚才:K|的:N|电话:S|是:N|我妈妈:S|打来的:P", 0], ["我刚才看过一遍，不想再看了。", "Hozirgina bir marta koʻrdim, yana koʻrgim kelmayapti.", "我:S|刚才:K|看过:P|一遍，:C|不想:D|再:D|看了:P", 0], ["我刚刚看视频学会了包饺子。", "Endigina videodan chuchvara tugishni oʻrgandim.", "我:S|刚刚:K|看视频:D|学会了:P|包饺子:O", 0], ["他刚刚来北京两个月。", "U Pekinga kelganiga endigina ikki oy boʻldi.", "他:S|刚刚:K|来:P|北京:O|两个月:C", 0], ["刚才你说什么？", "Hozir nima deding?", "刚才:K|你:S|说:P|什么:O", 1], ["我们刚刚见面就聊起来了。", "Endigina koʻrishgan zahoti gaplashib ketdik.", "我们:S|刚刚:K|见面:P|就:D|聊起来了:P", 1]], "why": "刚才 — “hozirgina, bir necha daqiqa oldin” (vaqt oti, 的 bilan ham keladi: 刚才的电话). 刚刚 — “soʻzlovchi uchun yaqinda” (ravish), bir necha oy oldin ham boʻlishi mumkin va faqat egadan keyin turadi.", "mis": [["刚刚的电话是我妈妈打来的。", "刚才的电话是我妈妈打来的。", "刚刚 ravish — 的 bilan ot oldida kelmaydi."], ["刚刚我来北京两个月。", "我刚刚来北京两个月。", "刚刚 egadan KEYIN, feʼl OLDIDA turadi."], ["他刚才来北京两个月。", "他刚刚来北京两个月。", "Ikki oy — “hozirgina” emas, shuning uchun 刚刚."]]}, {"zh": "条件复句“只要……，就……”", "uz": "…sa bas, … (yetarli shart)", "f": ["(ega) + 只要 + shart，(ega₂) + 就 + natija"], "ex": "只要……，就…… gapida 只要 dan keyingi qism yetarli shart: shu shart boʻlsa, 就 dan keyingi natija albatta boʻladi. Ega 只要 dan oldin ham, keyin ham turishi mumkin; ikkinchi ega boʻlsa, u 就 dan OLDIN turadi.", "eg": [["我只要几天不跟他视频，就很想他。", "Bir necha kun u bilan video orqali gaplashmasam bas, uni juda sogʻinaman.", "我:S|只要:K|几天不跟他视频，:N|就:K|很:D|想:P|他:O", 0], ["只要你同意，我们就这么决定了。", "Sen rozi boʻlsang bas, shunday qaror qilamiz.", "只要:K|你:S|同意，:P|我们:S|就:K|这么:D|决定了:P", 0], ["只要你坚持每天早睡，身体就一定会好起来。", "Har kuni erta yotishni davom ettirsang bas, sogʻligʻing albatta yaxshilanadi.", "只要:K|你:S|坚持:P|每天早睡，:O|身体:S|就:K|一定:D|会:D|好起来:P", 0], ["只要你坚持，就一定能完成目标。", "Davom ettirsang bas, albatta maqsadga erishasan.", "只要:K|你:S|坚持，:P|就:K|一定:D|能:D|完成:P|目标:O", 1], ["只要有时间，我就去看阿姨。", "Vaqtim boʻlsa bas, xolamni koʻrgani boraman.", "只要:K|有时间，:N|我:S|就:K|去:P|看:P|阿姨:O", 1]], "why": "只要 — yetarli shart: “shu boʻlsa bas”, boshqa yoʻllar ham boʻlishi mumkin. 只有 (17-mavzu) esa yagona shart. Shuning uchun: 只要……就……, 只有……才…….", "mis": [["只要你同意，我们才这么决定。", "只要你同意，我们就这么决定了。", "只要 bilan 就 juft keladi (才 — 只有 bilan)."], ["只要你同意，就我们这么决定了。", "只要你同意，我们就这么决定了。", "Ikkinchi ega (我们) 就 dan OLDIN turadi."]]}, {"zh": "固定格式“从……起”", "uz": "…dan boshlab", "f": ["从 + vaqt / voqea + 起，…"], "ex": "从……起 “从……开始” maʼnosini beradi, koʻpincha vaqtni bildiradi. Odatda gap boshida hol vazifasida keladi.", "eg": [["他从那时起就努力学习。", "U oʻsha paytdan boshlab astoydil oʻqidi.", "他:S|从那时起:K|就:D|努力:D|学习:P", 0], ["从那天起，我们就变成了好朋友。", "Oʻsha kundan boshlab yaxshi doʻst boʻlib qoldik.", "从那天起，:K|我们:S|就:D|变成了:P|好朋友:O", 0], ["从那次旅游起，我对中国文化更有兴趣了。", "Oʻsha sayohatdan boshlab Xitoy madaniyatiga yanada qiziqib qoldim.", "从那次旅游起，:K|我:S|对中国文化:D|更:D|有兴趣了:P", 0], ["从下个学期起，我要住在学校。", "Kelasi semestrdan boshlab maktabda yashayman.", "从下个学期起，:K|我:S|要:D|住:P|在学校:L", 1], ["从明天起，我每天锻炼半个小时。", "Ertadan boshlab har kuni yarim soat badantarbiya qilaman.", "从明天起，:K|我:S|每天:D|锻炼:P|半个小时:C", 1]], "why": "从……起 — “…dan boshlab”: biror vaqt yoki voqeadan keyin hamon davom etayotgan holat. Koʻpincha keyingi qismda 就 keladi.", "mis": [["我起从那天就努力学习。", "我从那天起就努力学习。", "从 vaqt oldida, 起 vaqtdan keyin keladi."]]}], "texts": [{"k": 1, "scene": "在飞机上，白家月和李文在聊天儿。", "sceneuz": "Samolyotda Bay Jiayue va Li Ven suhbatlashyapti.", "lines": [["白家月", "我要在中国过年，真开心。", "Yangi yilni Xitoyda oʻtkazaman, juda xursandman."], ["李文", "第一次请外国朋友来家里过春节，我也很高兴。", "Birinchi marta chet ellik doʻstimni uyga Bahor bayramiga taklif qilyapman, men ham juda xursandman."], ["白家月", "你们怎样过节？", "Bayramni qanday oʻtkazasizlar?"], ["李文", "春节是中国最重要的节日，我们一般会回家，跟家人一起过。", "Bahor bayrami — Xitoyning eng muhim bayrami, odatda uyga qaytib, oila bilan birga oʻtkazamiz."], ["白家月", "那你跟家人会一起做什么？", "Unda oilang bilan birga nima qilasizlar?"], ["李文", "我们家会一边包饺子，一边看春节联欢晚会，一直到十二点以后才睡觉。", "Oilamiz chuchvara tugib turib, Bahor bayrami kechasini tomosha qiladi, soat oʻn ikkidan keyingina uxlaymiz."], ["白家月", "听起来很有意思。春节放几天假？", "Juda qiziq eshitiladi. Bahor bayramida necha kun dam olinadi?"], ["李文", "大概七八天。", "Taxminan yetti-sakkiz kun."]]}, {"k": 2, "scene": "在李文家，白家月给李文的父母拜年。", "sceneuz": "Li Venning uyida Bay Jiayue Li Venning ota-onasini bayram bilan tabriklayapti.", "lines": [["白家月", "张阿姨，李叔叔。过年好！这是我准备的礼物，请收下。", "Chjan xola, Li amaki, bayramingiz bilan! Bu men tayyorlagan sovgʻa, qabul qilib oling."], ["李叔叔", "谢谢家月，你太客气了！", "Rahmat, Jiayue, ovora boʻlibsan-da!"], ["张阿姨", "总听小文说起你，今天终于有机会见面了。", "Doim Syaovendan sen haqingda eshitardim, bugun nihoyat koʻrishish imkoni boʻldi."], ["白家月", "谢谢您和叔叔请我来家里做客。", "Siz va amakim meni uyingizga mehmonga chaqirganingiz uchun rahmat."], ["李叔叔", "桌子上有饮料，还有矿泉水，你想喝什么就自己拿。", "Stol ustida ichimlik ham, mineral suv ham bor, nima ichging kelsa oʻzing olaver."], ["张阿姨", "你先坐着看会儿电视，饺子很快就包好了。", "Sen avval oʻtirib biroz televizor koʻrib tur, chuchvara tez orada tugib boʻlinadi."], ["白家月", "我刚刚看视频学会了包饺子，我跟你们一起包吧。", "Endigina videodan chuchvara tugishni oʻrgandim, sizlar bilan birga tugay."]]}, {"k": 3, "scene": "在李文家，李文妈妈和白家月在聊天儿。", "sceneuz": "Li Venning uyida uning onasi va Bay Jiayue suhbatlashyapti.", "lines": [["白家月", "这张照片是李文出国前照的吗？", "Bu surat Li Ven chet elga ketishidan oldin tushirilganmi?"], ["张阿姨", "对，这是他从北京出发时，我们全家在机场照的。", "Ha, buni u Pekindan joʻnayotganda butun oilamiz bilan aeroportda tushganmiz."], ["白家月", "那是三四年前吧？", "Bu uch-toʻrt yil oldin boʻlsa kerak?"], ["张阿姨", "是啊，时间过得真快，好像是不久前发生的一样。", "Ha, vaqt juda tez oʻtadi, xuddi yaqinda boʻlgandek."], ["白家月", "您一定特别想李文吧？", "Li Venni juda sogʻingandirsiz?"], ["张阿姨", "他刚离开家时，我很不习惯，只要几天不跟他视频，就很想他。", "U uydan endigina ketganda, juda koʻnikolmadim, bir necha kun u bilan video orqali gaplashmasam bas, uni juda sogʻinardim."], ["白家月", "还有最后一个学期就要毕业了，他很快就会回来了。", "Bitirishiga oxirgi bitta semestr qoldi, u tez orada qaytib keladi."]]}, {"k": 4, "scene": "在家里，白家月在写日记。", "sceneuz": "Uyda Bay Jiayue kundalik yozyapti.", "lines": [["", "这次来中国，我最高兴的是认识了李文的父母。", "Bu safar Xitoyga kelib, eng xursand boʻlganim — Li Venning ota-onasi bilan tanishganim boʻldi."], ["", "他们给我看了李文出生时的照片，还给我讲了很多他过去的故事。", "Ular menga Li Ven tugʻilgandagi suratlarni koʻrsatishdi, yana uning oʻtmishi haqida koʻp hikoya aytib berishdi."], ["", "李文高中的时候想学医，从那时起就努力学习。", "Li Ven litseyda oʻqiyotganda shifokorlikni oʻqimoqchi boʻlgan, oʻsha paytdan boshlab astoydil oʻqigan."], ["", "高三的时候，因为成绩特别好，他得到了出国留学的机会。", "Litseyning uchinchi yilida baholari juda yaxshi boʻlgani uchun chet elda oʻqish imkoniyatini qoʻlga kiritgan."], ["", "在他身上，我懂得了，只要一直坚持，就能完成自己的目标。", "Uning misolida tushunib yetdim: toʻxtamay harakat qilsang bas, maqsadingga erishasan."], ["", "我相信，他以后一定会发展得更好。", "Ishonaman, u kelajakda albatta yanada yaxshi rivojlanadi."]]}]}, {"n": 101, "d": 1, "book": "old", "color": "#117A65", "zh": "周末你有什么打算", "py": "Zhōumò nǐ yǒu shénme dǎsuàn", "uz": "Dam olish kunlariga qanday rejang bor?", "extra": {"hz": ["指事字 — belgili ierogiflar", "一 二 三 — chiziqlar soni; 上 — chiziq ustidagi belgi, 下 — chiziq ostidagi belgi; 本 — 木 daraxtning ildiziga qoʻyilgan belgi (ildiz → asos); 末 — daraxtning uchiga qoʻyilgan belgi (uch → oxir). 周末 dagi 末 aynan shu: “haftaning uchi”."], "words": [["游客", "yóukè", "sayyoh: 游 sayr + 客 mehmon"], ["外地", "wàidì", "boshqa shahar: 外 tashqari + 地 joy"], ["北门", "běimén", "shimoliy darvoza: 北 shimol + 门 eshik"]], "saying": ["不到长城非好汉", "bú dào Chángchéng fēi hǎohàn", "Buyuk Xitoy devoriga chiqmagan — haqiqiy yigit emas."]}, "words": [["周末", "zhōumò", "n", "dam olish kunlari (hafta oxiri)", "周 hafta + 末 uchi, oxiri: “haftaning oxiri”. 末 — daraxt 木 ning uchiga belgi qoʻyilgan ierogif.", "", "周末你有什么打算？", "Dam olish kunlari nima rejang bor?"], ["打算", "dǎsuàn", "n/v", "reja; rejalashtirmoq", "算 — hisoblamoq: oldindan hisob-kitob qilish, yaʼni reja.", "", "我们打算去旅行。", "Sayohatga borishni rejalashtiryapmiz."], ["啊", "a", "onom", "-da, -ku (gap oxiridagi tasdiq yuklamasi)", "Gap oxirida ohangni yumshatadi yoki tasdiqlaydi: 是啊 — ha-da.", "", "是啊，我已经找好饭馆了。", "Ha-da, restoranni allaqachon topib qoʻydim."], ["跟", "gēn", "prep", "bilan", "足 oyoq + 艮: kimningdir “oyogʻi ortidan” ergashish — birga. 跟……一起 — …bilan birga.", "", "我还没想好要不要跟你去呢。", "Sen bilan borish-bormasligimni hali oʻylab koʻrmadim."], ["一直", "yìzhí", "adv", "doim, toʻxtovsiz", "直 toʻgʻri: toʻgʻri chiziqdek uzilmasdan.", "", "你一直玩儿电脑游戏，作业写完了吗？", "Doim kompyuter oʻyini oʻynaysan, uy vazifasini yozib boʻldingmi?"], ["游戏", "yóuxì", "n", "oʻyin", "游 sayr qilmoq + 戏 oʻyin, tomosha.", "", "他每天玩儿游戏。", "U har kuni oʻyin oʻynaydi."], ["作业", "zuòyè", "n", "uy vazifasi", "作 qilmoq + 业 ish: “qilinadigan ish”. Feʼli — 写: 写作业.", "", "作业写完了吗？", "Uy vazifasini yozib boʻldingmi?"], ["着急", "zháojí", "adj", "xavotirlanmoq, asabiylashmoq", "急 pastida 心 yurak: yurak tez-tez urayapti.", "", "你怎么一点儿也不着急？", "Nega umuman xavotirlanmayapsan?"], ["复习", "fùxí", "v", "takrorlamoq (darsni)", "复 qayta + 习 oʻrganmoq: “qayta oʻrganish”. Bu ilovadagi kartalar aynan 复习!", "", "我早就复习好了。", "Allaqachon takrorlab boʻlganman."], ["南方", "nánfāng", "n", "janub", "方 tomon (方法 dagi 方). 南 — janub.", "", "南方啊，我们去年就是这个时候去的。", "Janubga, oʻtgan yili aynan shu paytda borgan edik."], ["北方", "běifāng", "n", "shimol", "北 — ikki odam orqa oʻgirib turgan shakl (asl maʼnosi “orqa”).", "", "北方好一些，不冷也不热。", "Shimol yaxshiroq: na sovuq, na issiq."], ["面包", "miànbāo", "n", "non", "面 un + 包 oʻram: “undan qilingan narsa”.", "", "水果、面包、茶都准备好了。", "Meva, non, choy — hammasi tayyor."], ["带", "dài", "v", "olib yurmoq, oʻzi bilan olmoq", "Shu soʻz 新HSK 1-mavzuda ham bor.", "", "我们还带什么？", "Yana nima olib boramiz?"], ["地图", "dìtú", "n", "xarita", "地 yer + 图 rasm (囗 ramka ichida): “yer rasmi”.", "", "手机、电脑、地图，一个也不能少。", "Telefon, kompyuter, xarita — birortasi ham qolmasin."], ["搬", "bān", "v", "koʻchirmoq, tashimoq", "扌 qoʻl bilan koʻtarib tashish. 搬家 — koʻchib oʻtmoq.", "", "我们是去旅游，不是搬家。", "Biz sayohatga boryapmiz, koʻchib emas."]], "grammar": [{"zh": "结果补语“好”", "uz": "…ib boʻlmoq (koʻngildagidek)", "f": ["feʼl + 好"], "ex": "好 feʼldan keyin kelib, harakat tugagani va natija koʻngildagidek boʻlganini bildiradi. 我吃完了 — faqat tugatdim; 我吃好了 — tugatdim va toʻydim.", "eg": [["今晚的电影小刚已经买好票了。", "Bugungi kechki kinoga Syaogan chiptani olib qoʻydi.", "今晚的电影:A|小刚:S|已经:D|买好:K|票了:O", 0], ["饭还没做好，请你等一会儿。", "Ovqat hali tayyor emas, biroz kut.", "饭:S|还没:D|做好，:K|请你:N|等一会儿:P", 0], ["去旅游的东西准备好了吗？", "Sayohat uchun narsalar tayyormi?", "去旅游的:A|东西:S|准备好了吗:K", 0], ["我还没想好要不要跟你去呢。", "Sen bilan borish-bormasligimni hali oʻylab koʻrmadim.", "我:S|还没:D|想好:K|要不要跟你去呢:O", 0], ["我已经复习好了。", "Allaqachon takrorlab boʻldim.", "我:S|已经:D|复习:P|好了:K", 1], ["地图你带好了吗？", "Xaritani olib qoʻydingmi?", "地图:O|你:S|带:P|好了吗:K", 1]], "why": "好 — “yaxshi”: ish shunchaki tugamadi, balki kerakli, koʻngildagi holatga keldi. Shuning uchun tayyorgarlik feʼllari bilan koʻp keladi: 准备好, 想好, 做好, 买好.", "mis": [["我想好了没有。", "我还没想好。", "Inkorda 没 feʼldan oldin turadi, 好 esa feʼldan keyin qoladi: 没想好."]]}, {"zh": "“一……也/都 + 不/没……”表示否定", "uz": "Birorta ham… emas", "f": ["一 + hisob soʻz + ot + 也/都 + 不/没 + feʼl", "一点儿 + 也/都 + 不 + sifat"], "ex": "Toʻliq inkor: “birorta ham…”. 一 + hisob soʻz oʻrniga 一点儿 ham keladi. Kesim sifat boʻlsa: 一点儿也/都 + 不 + sifat.", "eg": [["我一个苹果也不想吃。", "Birorta ham olma yegim kelmayapti.", "我:S|一个苹果:K|也:K|不想吃:P", 0], ["昨天他一件衣服都没买。", "Kecha u birorta ham kiyim olmadi.", "昨天:D|他:S|一件衣服:K|都:K|没买:P", 0], ["小丽一杯茶也没喝。", "Syaoli bir piyola ham choy ichmadi.", "小丽:S|一杯茶:K|也:K|没喝:P", 0], ["手机、电脑、地图，一个也不能少。", "Telefon, kompyuter, xarita — birortasi ham qolmasligi kerak.", "手机、电脑、地图，:O|一个:K|也:K|不能少:P", 0], ["这个星期我很忙，一点儿时间也没有。", "Bu hafta juda bandman, zarracha ham vaqtim yoʻq.", "这个星期:D|我:S|很忙，:P|一点儿时间:K|也:K|没有:P", 0], ["他一点儿也不累。", "U umuman charchamagan.", "他:S|一点儿:K|也:K|不累:P", 0], ["你怎么一点儿也不着急？", "Nega umuman xavotirlanmayapsan?", "你:S|怎么:D|一点儿:K|也:K|不着急:P", 0], ["我一张地图也没带。", "Birorta ham xarita olmadim.", "我:S|一张地图:K|也:K|没带:P", 1]], "why": "Eng kichik miqdorni — “bitta”ni inkor qilsang, umuman yoʻqligini bildirasan. Bu qolip 新HSK 4-mavzuda ham bor: ikkala kitobda bir xil.", "mis": [["我一个苹果也想吃。", "我一个苹果也不想吃。", "Bu qolip faqat inkor bilan ishlaydi: 也/都 dan keyin 不 yoki 没 shart."]]}, {"zh": "连词“那”", "uz": "Unda, unday boʻlsa", "f": ["那 + … (oldingi gapdan xulosa)"], "ex": "那 gap boshida kelib, oldin aytilgan gapdan kelib chiqadigan xulosani bildiradi: “unday boʻlsa”.", "eg": [["那我也不去了。", "(— Kinoga borgim kelmayapti.) — Unday boʻlsa, men ham bormayman.", "那:K|我:S|也:D|不去了:P", 0], ["那也不能一直玩儿啊。", "(— Imtihonga allaqachon tayyorlanib boʻldim.) — Baribir doim oʻynab oʻtirsang boʻlmaydi-da.", "那:K|也:D|不能:D|一直:D|玩儿啊:P", 0], ["那我们明天去吧。", "(— Bugun yomgʻir yogʻyapti.) — Unda ertaga boraylik.", "那:K|我们:S|明天:D|去吧:P", 1], ["那你先复习吧。", "(— Ertaga imtihon bor.) — Unday boʻlsa, avval takrorla.", "那:K|你:S|先:D|复习:P|吧:N", 1]], "why": "那 aslida “u, oʻsha” degani: “oʻsha holatda boʻlsa” — suhbatdoshning gapiga tayangan xulosa. Oʻzbekchadagi “unda”, “unday boʻlsa” ga toʻgʻri keladi.", "mis": []}]}, {"n": 102, "d": 2, "book": "old", "color": "#A93F55", "zh": "他什么时候回来", "py": "Tā shénme shíhou huílai", "uz": "U qachon qaytadi?", "extra": {"hz": [], "words": [["办公楼", "bàngōnglóu", "ofis binosi: 办公 + 楼 bino"], ["外出", "wàichū", "tashqariga chiqmoq: 外 tashqari + 出 chiqmoq"], ["午觉", "wǔjiào", "tushki uyqu: 午 tush + 觉 uyqu"]], "saying": ["饭后百步走，活到九十九", "fàn hòu bǎi bù zǒu, huó dào jiǔshíjiǔ", "Ovqatdan keyin yuz qadam yursang, toʻqson toʻqqizga kirasan."]}, "words": [["腿", "tuǐ", "n", "oyoq (son va boldir)", "月 tana + 退 orqaga: yurganda oldinga-orqaga harakatlanadigan aʼzo. Farqi: 脚 — oyoq panjasi.", "", "我现在腿也疼，脚也疼。", "Hozir oyogʻim ham, oyoq panjam ham ogʻriyapti."], ["疼", "téng", "adj", "ogʻrimoq, ogʻriq", "疒 kasallik + 冬 qish: “qishdagidek achishtiruvchi” ogʻriq.", "", "我的头很疼。", "Boshim juda ogʻriyapti."], ["脚", "jiǎo", "n", "oyoq panjasi", "月 tana belgisi. Farqi: 腿 — son va boldir, 脚 — poyabzal kiyiladigan qism.", "", "我的脚有点儿疼。", "Oyoq panjam biroz ogʻriyapti."], ["树", "shù", "n", "daraxt", "木 daraxt belgisi.", "", "那边树多，我们过去坐一下吧。", "U yerda daraxt koʻp, borib bir oʻtiraylik."], ["容易", "róngyì", "adj", "oson", "容 sigʻdirmoq + 易 oson. Teskarisi — 难.", "", "上山容易下山难。", "Toqqa chiqish oson, tushish qiyin."], ["难", "nán", "adj", "qiyin", "难看, 难过 (新HSK 5) dagi 难.", "", "这个问题很难。", "Bu savol juda qiyin."], ["太太", "tàitai", "n", "xonim; rafiqa", "Familiyadan keyin: 周太太 — Chjou xonim.", "", "周太太，您好！", "Assalomu alaykum, Chjou xonim!"], ["秘书", "mìshū", "n", "kotib, kotiba", "秘 sir (禾) + 书 hujjat: “sir hujjatlarni saqlovchi”.", "", "秘书说周经理出去了。", "Kotiba Chjou boshliq tashqariga chiqqanini aytdi."], ["经理", "jīnglǐ", "n", "menejer, boshliq", "经 boshqarmoq + 理 tartibga solmoq.", "", "周经理出去了，不在办公室。", "Chjou boshliq tashqariga chiqqan, ofisda yoʻq."], ["办公室", "bàngōngshì", "n", "ofis, idora", "办公 ish yuritmoq (办 — 新HSK 3) + 室 xona (宀 tom).", "", "他到了办公室我就告诉他。", "U ofisga kelishi bilan aytaman."], ["辆", "liàng", "m", "transport uchun hisob soʻz", "Chapda 车 — mashina belgisi.", "一辆车", "我出去叫辆出租车就行了。", "Chiqib bitta taksi chaqirsam boʻldi."], ["楼", "lóu", "n", "bino; qavat", "木 yogʻoch: qadimgi binolar yogʻochdan qurilgan. 上楼 — yuqoriga chiqmoq.", "", "我上楼去给你拿把伞。", "Yuqoriga chiqib, senga soyabon olib kelaman."], ["拿", "ná", "v", "olmoq (qoʻlga), olib kelmoq", "合 birlashtirmoq + 手 qoʻl: qoʻlni yumib ushlamoq.", "", "我拿了伞就下来。", "Soyabonni olishim bilan pastga tushaman."], ["把", "bǎ", "m", "dastali narsalar hisob soʻzi (soyabon, stul)", "扌 qoʻl: qoʻl bilan ushlanadigan dastasi bor narsa. 一把伞, 一把椅子.", "一把伞", "你等等，我给你拿把伞。", "Biroz kut, senga bitta soyabon olib kelaman."], ["伞", "sǎn", "n", "soyabon", "Shaklining oʻzi: tepasi ochilgan soyabon, ostida dastasi.", "", "雨下得真大，你带伞了吗？", "Yomgʻir juda qattiq yogʻyapti, soyabon oldingmi?"], ["胖", "pàng", "adj", "semiz", "月 tana + 半 yarim. Teskarisi — 瘦.", "", "你看，我这么胖，怎么办呢？", "Qara, men shunaqa semizman, nima qilay?"], ["其实", "qíshí", "adv", "aslida", "其 uning + 实 haqiqat: “uning haqiqati — aslida”.", "", "其实我每天都运动。", "Aslida men har kuni sport bilan shugʻullanaman."], ["瘦", "shòu", "adj", "oriq, ozgʻin", "疒 kasallik belgisi: kasal odam ozib ketadi.", "", "但是你一点儿也没瘦！", "Lekin umuman ozmabsan-ku!"]], "grammar": [{"zh": "简单趋向补语", "uz": "…ib kelmoq / …ib ketmoq (来/去)", "f": ["feʼl + 来 (soʻzlovchi tomon) / 去 (soʻzlovchidan uzoqqa)", "feʼl + joy + 来/去"], "ex": "来 — soʻzlovchi tomonga, 去 — soʻzlovchidan uzoqqa harakat. Koʻp ishlatiladigan feʼllar: 上, 下, 进, 出, 回, 过, 起, shuningdek 买, 带, 搬. Toʻldiruvchi joy boʻlsa, 来/去 dan oldin keladi; narsa boʻlsa, oldin ham, keyin ham kelaveradi.", "eg": [["我们在楼上等你呢，你上来吧。", "Biz yuqorida seni kutyapmiz, chiqib kel.", "我们:S|在楼上:L|等你呢，:P|你:S|上:P|来吧:K", 0], ["谁在外边？你出去看看吧。", "Tashqarida kim bor? Chiqib bir qara.", "谁:S|在外边？:P|你:S|出:P|去:K|看看吧:P", 0], ["那边树多，我们过去坐一下吧。", "U yerda daraxt koʻp, oʻsha tomonga borib bir oʻtiraylik.", "那边:L|树多，:P|我们:S|过:P|去:K|坐一下吧:P", 0], ["小狗下楼来吃东西。", "Kuchukcha ovqat yegani pastga tushib keldi.", "小狗:S|下:P|楼:L|来:K|吃东西:P", 0], ["老师进教室来上课。", "Oʻqituvchi dars oʻtish uchun sinfga kirib keldi.", "老师:S|进:P|教室:L|来:K|上课:P", 0], ["我上楼去。", "Men yuqoriga chiqaman.", "我:S|上:P|楼:L|去:K", 0], ["明天要带作业来。", "Ertaga uy vazifasini olib kelish kerak.", "明天:D|要:D|带:P|作业:O|来:K", 0], ["这次旅游，我想带去这本书。", "Bu safarga shu kitobni olib ketmoqchiman.", "这次旅游，:D|我:S|想:D|带:P|去:K|这本书:O", 0], ["你快下来吧。", "Tezroq pastga tush (bu yerga).", "你:S|快:D|下:P|来:K|吧:N", 1], ["他回家去了。", "U uyiga ketdi.", "他:S|回:P|家:L|去了:K", 1]], "why": "来 va 去 doim soʻzlovchiga nisbatan: men yuqoridaman, sen pastdasan — 上来 (yuqoriga, menga qarab). Joy 来/去 dan oldin turadi: avval “qayerga”, keyin “qaysi tomonga” aytiladi — 上楼去.", "mis": [["我上去楼。", "我上楼去。", "Joy (楼) 来/去 dan OLDIN keladi."]]}, {"zh": "两个动作连续发生", "uz": "…ishi bilan darhol…", "f": ["feʼl₁ + 了 … 就 + feʼl₂", "feʼl₁ + 了 … + ega₂ + 就 + feʼl₂"], "ex": "Ikki harakat ketma-ket sodir boʻladi: ikkinchisi birinchisidan keyin darhol boshlanadi. Gapda ikki ega boʻlsa, ikkinchi ega 就 dan oldin turadi.", "eg": [["我下了课就吃饭。", "Darsdan chiqishim bilan ovqatlanaman.", "我:S|下了课:K|就:K|吃饭:P", 0], ["妈妈起了床就做早饭。", "Onam turishi bilan nonushta tayyorlaydi.", "妈妈:S|起了床:K|就:K|做早饭:P", 0], ["小刚拿了伞就下来。", "Syaogan soyabonni olishi bilan pastga tushadi.", "小刚:S|拿了伞:K|就:K|下来:P", 0], ["你每天晚上吃了饭就睡觉。", "Sen har kuni kechqurun ovqatlanishing bilan uxlaysan.", "你:S|每天晚上:D|吃了饭:K|就:K|睡觉:P", 0], ["你下了课我们就去书店。", "Sen darsdan chiqishing bilan kitob doʻkoniga boramiz.", "你:S|下了课:K|我们:S|就:K|去书店:P", 0], ["爸爸回来了我们就吃饭。", "Dadam qaytishi bilan ovqatlanamiz.", "爸爸:S|回来了:K|我们:S|就:K|吃饭:P", 0], ["他到了办公室我就告诉他。", "U ofisga kelishi bilan aytaman.", "他:S|到了办公室:K|我:S|就:K|告诉他:P", 0], ["我复习了生词就睡觉。", "Yangi soʻzlarni takrorlab boʻlishim bilan uxlayman.", "我:S|复习了:K|生词:O|就:K|睡觉:P", 1]], "why": "了 birinchi ish tugaganini, 就 esa “darrov” ekanini bildiradi. Bu qolip 新HSK 5-mavzuda ham bor. Ikki ega boʻlsa, ikkinchisi 就 dan oldin turadi — 如果……就 (新HSK 6) dagi kabi.", "mis": [["他到了办公室就我告诉他。", "他到了办公室我就告诉他。", "Ikkinchi ega (我) 就 dan OLDIN keladi."]]}, {"zh": "反问的表达：能……吗？", "uz": "…boʻlarmidi? (ritorik savol)", "f": ["能 + tasdiq + 吗？ = mumkin emas", "能 + 不 + … + 吗？ = albatta …"], "ex": "能……吗 ritorik savol boʻlib keladi: ichida tasdiq shakli boʻlsa — inkor maʼno, inkor shakli boʻlsa — tasdiq maʼno.", "eg": [["你不做作业，也不练习，能学好吗？", "Uy vazifasini qilmasang, mashq ham qilmasang, yaxshi oʻrganib boʻlarmidi? (boʻlmaydi)", "你:S|不做作业，:P|也不练习，:P|能:K|学好:P|吗:K", 0], ["你每天晚上吃了饭就睡觉，也不出去走走，能不胖吗？", "Har kuni kechqurun ovqatdan keyin darrov uxlaysan, tashqariga chiqib yurmaysan — semirmay boʻlarmidi? (albatta semirasan)", "你:S|每天晚上:D|吃了饭就睡觉，:P|也不出去走走，:P|能:K|不胖:P|吗:K", 0], ["你不复习，能记住生词吗？", "Takrorlamasang, yangi soʻzlarni eslab qola olarmiding? (yoʻq)", "你:S|不复习，:P|能:K|记住:P|生词:O|吗:K", 1], ["他天天锻炼，能不健康吗？", "U har kuni chiniqadi — sogʻlom boʻlmay qolarmidi? (albatta sogʻlom)", "他:S|天天:D|锻炼，:P|能:K|不健康:P|吗:K", 1]], "why": "Oʻzbekchada ham shunday: “Shunday qilsang, oʻrganib boʻlarmidi?” — aslida “boʻlmaydi” degani. Savol shaklida, lekin javob kutilmaydi: soʻzlovchi oʻz fikrini kuchli ifodalaydi.", "mis": []}]}, {"n": 103, "d": 3, "book": "old", "color": "#3B5BA9", "zh": "桌子上放着很多饮料", "py": "Zhuōzi shang fàngzhe hěn duō yǐnliào", "uz": "Stol ustida koʻp ichimlik turibdi", "extra": {"hz": [], "words": [["鲜奶", "xiānnǎi", "yangi sut: 鲜 (新鲜) + 奶 sut"], ["冷饮", "lěngyǐn", "sovuq ichimlik: 冷 sovuq + 饮 ichmoq"], ["上面", "shàngmian", "ustida: 上 yuqori + 面 tomon"]], "saying": ["茶好客常来", "chá hǎo kè cháng lái", "Choyi yaxshi boʻlsa, mehmon tez-tez keladi."]}, "words": [["还是", "háishi", "conj", "yoki (savol gapda)", "Farqi: savolda — 还是, darak gapda — 或者.", "", "明天是晴天还是阴天？", "Ertaga havo ochiqmi yoki bulutli?"], ["爬山", "pá shān", "v", "toqqa chiqmoq", "爬 tirmashmoq (爪 panja) + 山 togʻ.", "", "我们明天要去爬山。", "Ertaga toqqa chiqmoqchimiz."], ["小心", "xiǎoxīn", "adj", "ehtiyotkor; ehtiyot boʻlmoq", "“Kichik yurak”: yuragi kichik odam doim ehtiyot boʻladi.", "", "爬山的时候要小心点儿。", "Toqqa chiqayotganda ehtiyot boʻl."], ["条", "tiáo", "m", "uzun narsalar hisob soʻzi (shim, yubka, koʻcha)", "Pastida 木 — uzun tayoqdek narsa. 一条裤子, 一条裙子.", "一条裤子", "你觉得这条裤子怎么样？", "Bu shim senga qanday tuyuladi?"], ["裤子", "kùzi", "n", "shim", "衤 kiyim belgisi. 短裤 (新HSK 7) — kalta shim.", "", "我记得你已经有两条这样的裤子了。", "Esimda, senda bunaqa shimdan allaqachon ikkitasi bor."], ["记得", "jìde", "v", "esida boʻlmoq, eslamoq", "记 eslab qolmoq (新HSK 2) + 得: “eslab qolgan”.", "", "我记得他的名字。", "Uning ismi esimda."], ["衬衫", "chènshān", "n", "koʻylak (yoqali)", "Ikkalasida 衤 — kiyim belgisi.", "", "这件衬衫怎么样？", "Bu koʻylak qanday?"], ["元", "yuán", "m", "yuan (pul birligi)", "Ogʻzaki nutqda 块, yozuvda 元.", "", "这上面写着320元。", "Bunda 320 yuan deb yozilgan."], ["新鲜", "xīnxiān", "adj", "yangi, toza (meva, havo)", "鲜 = 鱼 baliq + 羊 qoʻy: eng yangi, mazali narsalar.", "", "这些水果真新鲜。", "Bu mevalar juda yangi."], ["甜", "tián", "adj", "shirin", "舌 til + 甘 shirin.", "", "西瓜不甜不要钱。", "Tarvuz shirin boʻlmasa, pul olinmaydi."], ["只", "zhǐ", "adv", "faqat", "只 + feʼl: 只吃水果 — faqat meva yemoq.", "只有", "今天晚上只吃水果不吃饭！", "Bugun kechqurun faqat meva yeymiz, ovqat yemaymiz!"], ["放", "fàng", "v", "qoʻymoq", "放假 (新HSK 6) dagi 放: qoʻyib yubormoq, qoʻymoq.", "", "桌子上放着很多饮料。", "Stol ustida koʻp ichimlik turibdi."], ["饮料", "yǐnliào", "n", "ichimlik", "饮 — ichmoq (饣 ovqat belgisi).", "", "你喝什么饮料？", "Qanday ichimlik ichasan?"], ["或者", "huòzhě", "conj", "yoki (darak gapda)", "还是 bilan juft: savol boʻlmasa — 或者.", "", "茶或者咖啡都可以。", "Choy yoki qahva — ikkalasi ham boʻlaveradi."], ["舒服", "shūfu", "adj", "qulay, rohat", "不舒服 — oʻzini yomon his qilmoq.", "", "喝杯热茶会很舒服。", "Bir piyola issiq choy ichsang, rohat boʻladi."], ["花", "huā", "n", "gul", "艹 oʻt + 化 oʻzgarmoq: oʻsimlik “oʻzgarib” gulga aylanadi. 花园 (新HSK 3), 花茶 — gul choy.", "", "我喜欢花茶。", "Gul choyni yaxshi koʻraman."], ["绿", "lǜ", "adj", "yashil", "纟 ip: yashilga boʻyalgan ip. 红绿灯 (新HSK 6).", "", "花茶、绿茶、红茶，我都喜欢。", "Gul choy, koʻk choy, qora choy — hammasini yaxshi koʻraman."]], "grammar": [{"zh": "“还是”和“或者”", "uz": "Yoki: savolda 还是, darak gapda 或者", "f": ["A 还是 B？ (savol)", "A 或者 B (darak gap)"], "ex": "Ikkalasi ham tanlovni bildiradi. Odatda 还是 savol gapda, 或者 darak gapda keladi. Gap ichida savol shaklidagi boʻlak boʻlsa (bilmayman, qaysi biri), unda faqat 还是 ishlatiladi.", "eg": [["你要喝咖啡还是喝茶？", "Qahva ichasanmi yoki choy?", "你:S|要:D|喝咖啡:P|还是:K|喝茶:P", 0], ["明天是晴天还是阴天？", "Ertaga havo ochiqmi yoki bulutli?", "明天:D|是:P|晴天:O|还是:K|阴天:O", 0], ["今天晚上吃米饭或者面条都可以。", "Bugun kechqurun guruch yoki lagʻmon yesak ham boʻladi.", "今天晚上:D|吃米饭:P|或者:K|面条:O|都可以:P", 0], ["天冷了或者工作累了的时候，喝杯热茶很舒服。", "Havo soviganda yoki ishdan charchaganda, bir piyola issiq choy ichish rohat.", "天冷了:P|或者:K|工作累了的时候，:P|喝杯热茶:P|很舒服:P", 0], ["周太太40岁还是50岁，我们不知道。", "Chjou xonim 40 yoshdami yoki 50 da — bilmaymiz.", "周太太:S|40岁:P|还是:K|50岁，:P|我们:S|不知道:P", 0], ["小丽还没想好周末去爬山还是去看电影。", "Syaoli dam olish kuni toqqa chiqishmi yoki kinoga borishmi — hali oʻylab koʻrmagan.", "小丽:S|还没想好:P|周末:D|去爬山:O|还是:K|去看电影:O", 0],   const out = new Set(); let tries = 0;
  while (out.size < 3 && tries < 80) {
    tries++; const c = chars.slice(); const k = idx.length>1 && Math.random()<0.35 ? 2 : 1;
    shuffle(idx.slice()).slice(0,k).forEach(i => { const [b,t] = T2B[c[i]]; let nt; do { nt = Math.floor(Math.random()*4); } while (nt===t); c[i] = TONES[b][nt]; });
    const v = c.join(""); if (v !== py) out.add(v);
  }
  return [...out];
}
function distract(w, n, key){
  const same = shuffle(WORDS.filter(x=>x!==w && x.L===w.L)), sel = shuffle(WORDS.filter(x=>x!==w && x.L!==w.L && P.lessons.includes(x.L))), rest = shuffle(WORDS.filter(x=>x!==w && x.L!==w.L && !P.lessons.includes(x.L)));

    const k = key(x); if (seen.has(k) || syn(w,x) || x.hz.includes(w.hz) || w.hz.includes(x.hz)) continue;
    seen.add(k); out.push(x);
  }

}
function choiceQ(w, type){
  let opts;
  if (type==="mean") opts = [w, ...distract(w,3,x=>x.uz)].map(x=>({label:x.uz, ok:x===w}));
  else if (type==="tone") opts = [{label:w.py, ok:true}, ...toneVariants(w.py).map(v=>({label:v, ok:false}))];
  else opts = [w, ...distract(w,3,x=>x.hz)].map(x=>({label:x.hz, ok:x===w}));

}
function buildEx(type, gk){
  const N = +P.exn, words = shuffle(wpool());
  if (type==="order") { const src = gk ? SENTS.filter(s=>s.gk===gk) : spool(); return shuffle(src.filter(s=>s.tag)).slice(0, gk ? 50 : N).map(s => ({s, chunks: shuffle(chunksOf(s.tag).map((c,i)=>({t:c.t,i,used:false}))), picked:[]})); }
  if (type==="match") {
    const rounds = [], pool = words.slice(); const R = Math.max(1, Math.ceil(N/5));
    for (let r=0; r<R && pool.length; r++) {
      const ws = [];
      for (let j=0; j<pool.length && ws.length<5; j++) { const x = pool[j]; if (ws.some(y=>y.uz===x.uz || y.hz===x.hz || syn(x,y))) continue; ws.push(x); pool.splice(j,1); j--; }

    }
    return rounds;
  }

  if (type==="hanzi" || type==="mean" || type==="listen") { const ec = errMap(); list = list.slice().sort((a,b)=>(ec[b.id]||0)-(ec[a.id]||0) || Math.random()-0.5); list = shuffle(list.slice(0, N)); }

}

function h5opts(w){

/* ---------- test ---------- */
function testBuild(){
  const ws = shuffle(h5words(DS.set).slice()).slice(0, DS.n), types = Object.keys(DS.ty).filter(k => DS.ty[k]);
  if (!types.length) { toast("Kamida bitta savol turini tanla."); return false; }
  DS.qs = ws.map(w => { const t = types[Math.floor(Math.random()*types.length)];
    if (t==="mc") return {t, id:w.id, dir:Math.random()<.5?"hz":"uz", opts:h5opts(w)};
    if (t==="tf") { const right = Math.random() < .5; const o = right ? w : WMAP[h5opts(w).find(id => id!==w.id)]; return {t, id:w.id, show:o.id}; }
    return {t, id:w.id}; });
  DS.ans = {}; DS.setup = false; DS.sub = false; return true;
}
function rTest(v){
  if (DS.setup) {
    const ws = h5words(DS.set), ns = [10,20,30,50].filter(n => n < ws.length).concat([ws.length]);
    v.innerHTML = mtop("Test", 0, 0) + `<div class="qcard"><h2 style="margin:0 0 6px">Testni sozla</h2><p class="sub">${h5setName(DS.set)} · ${ws.length} soʻz</p>
      <p class="ql">Savollar soni</p><div class="seg" data-dtn>${[...new Set(ns)].map(n => `<button data-v="${n}" aria-pressed="${DS.n===n}">${n===ws.length?`Hammasi (${n})`:n}</button>`).join("")}</div>
      <p class="ql">Savol turlari</p><div class="dtys">${[["mc","Tanlash (4 variant)"],["tf","Toʻgʻri / Notoʻgʻri"],["wr","Yozma (pinyin)"]].map(([k,t]) => `<button class="tg" data-dty="${k}" aria-pressed="${!!DS.ty[k]}">${t}</button>`).join("")}</div>
      <div class="actions"><button class="btn primary" data-d="testGo">Testni boshlash</button></div></div>`;
    return;
  }
  const res = DS.sub ? DS.res : null, n = DS.qs.length, answered = Object.keys(DS.ans).length;
  const head = DS.sub ? `<div class="dscore"><div class="dsc-big">${Math.round(DS.score/n*100)}%</div><div><b>${DS.score} / ${n} toʻgʻri</b><span class="sub">${DS.score/n>=.9 ? "Ajoyib! Bu toʻplam deyarli tayyor." : DS.score/n>=.7 ? "Yaxshi natija. Xatolarni koʻrib chiq." : "Hali mashq kerak: “Oʻrganish” rejimini qil."}</span></div></div>` : "";
  v.innerHTML = mtop("Test", DS.sub ? n : answered, n) + head + `<ol class="tlist">${DS.qs.map((q,i) => { const w = WMAP[q.id], a = DS.ans[i], r = res ? res[i] : null, mark = r===null ? "" : r ? "ok" : "bad";
    let body = "";
    if (q.t==="mc") body = `<p class="ql">${q.dir==="hz"?"Maʼnosi qaysi?":"Ierogifi qaysi?"}</p>${q.dir==="hz" ? `<div class="qhz sm" lang="zh">${esc(w.hz)}</div>` : `<div class="quz sm">${esc(w.uz)}</div>`}<div class="dopts sm">${q.opts.map(id => { const o = WMAP[id]; const cls = res ? (id===w.id ? "ok" : id===a ? "bad" : "dim") : id===a ? "sel" : ""; return `<button class="dopt ${cls}" data-ta="${i}" data-v="${id}" ${res?"disabled":""}>${q.dir==="hz" ? esc(o.uz) : `<span lang="zh" class="ohz">${esc(o.hz)}</span>`}</button>`; }).join("")}</div>`;
    else if (q.t==="tf") { const o = WMAP[q.show], truth = q.show===q.id; body = `<p class="ql">Toʻgʻrimi?</p><div class="tfp"><span class="qhz sm" lang="zh">${esc(w.hz)}</span><span>=</span><span class="quz sm">${esc(o.uz)}</span></div><div class="dopts two">${[["1","Toʻgʻri"],["0","Notoʻgʻri"]].map(([vv,t]) => { const cls = res ? ((vv==="1")===truth ? "ok" : vv===a ? "bad" : "dim") : vv===a ? "sel" : ""; return `<button class="dopt ${cls}" data-ta="${i}" data-v="${vv}" ${res?"disabled":""}>${t}</button>`; }).join("")}</div>${res && !truth ? `<p class="sub">${esc(w.hz)} = ${esc(w.uz)}</p>` : ""}`; }
    else body = `<p class="ql">Pinyinini yoz</p><div class="quz sm">${esc(w.uz)}</div><input class="tin ${mark}" data-tw="${i}" value="${esc(a||"")}" ${res?"disabled":""} autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="pinyin">${res && !r ? `<p class="sub">Toʻgʻri javob: <b>${esc(w.py)}</b> (${esc(w.hz)})</p>` : ""}`;
    return `<li class="tq ${mark}"><span class="tn">${i+1}</span>${body}</li>`; }).join("")}</ol>
    <div class="actions">${DS.sub ? `<button class="btn primary" data-d="testNew">Yangi test</button><button class="btn" data-dm="learn">Xatolarni oʻrganish</button><button class="btn" data-d="finish">Chiqish</button>` : `<button class="btn primary" data-d="testSub">Testni topshirish (${answered}/${n})</button>`}</div>`;
}
function testSubmit(){
  const res = DS.qs.map((q,i) => { const w = WMAP[q.id], a = DS.ans[i]; let ok;
    if (q.t==="mc") ok = a === w.id; else if (q.t==="tf") ok = a === (q.show===q.id ? "1" : "0"); else ok = pyOk(a, w.py);
    h5mark(w, ok, q.t==="wr" ? "type" : "mc", "test"); return ok; });
  DS.res = res; DS.score = res.filter(Boolean).length; DS.sub = true;
  S.h5.tests.unshift({t:Date.now(), set:DS.set, score:DS.score, total:DS.qs.length}); S.h5.tests = S.h5.tests.slice(0,30);
  hap(DS.score/DS.qs.length >= .7 ? "ok" : "bad"); h5save(); rTest($("#v-home")); window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------- match ---------- */
function matchNew(){
  const ws = shuffle(h5words(DS.set).slice()).slice(0,6);
  M = {tiles:shuffle(ws.flatMap(w => [{id:w.id, s:"h"}, {id:w.id, s:"u"}])), sel:null, done:[], start:0, pen:0, end:0};
  DS.run = false;
}
function rMatch5(v){
  clearInterval(mTimer);
  if (!M) matchNew();
  const key = String(DS.set), best = S.h5.best[key];
  if (M.end) {
    const tm = M.end - M.start + M.pen, rec = !best || tm <= best;
    v.innerHTML = mtop("Juftlash", 6, 6) + `<div class="dend">${rec ? `<div class="dend-big gold" lang="zh">冠军</div><h2>Yangi rekord!</h2>` : `<div class="dend-big" lang="zh">快</div><h2>Tayyor!</h2>`}
      <div class="dendst"><div class="g"><b>${mtime(tm)}</b>Vaqting</div><div><b>${mtime(Math.min(best||tm, tm))}</b>Rekord</div></div>${M.pen ? `<p class="sub dcenter">Xatolar uchun +${M.pen/1000} s qoʻshildi</p>` : ""}
      <div class="actions"><button class="btn primary" data-d="mAgain">Yana oʻynash</button><button class="btn" data-d="finish">Chiqish</button></div></div>`;
    return;
  }
  v.innerHTML = mtop("Juftlash", M.done.length/2, 6) + `<div class="mhead"><span class="mclock" id="mclock">${M.start ? mtime(Date.now()-M.start+M.pen) : "0,0 s"}</span><span class="sub">${best ? `Rekord: ${mtime(best)}` : "Hali rekord yoʻq"}</span></div>
    ${M.start ? "" : `<p class="sub dcenter">Ierogifni oʻz maʼnosiga bos. Xato uchun +1 soniya. Vaqt birinchi bosishda boshlanadi.</p>`}
    <div class="mgrid">${M.tiles.map((t,i) => { const w = WMAP[t.id], gone = M.done.includes(i); return `<button class="mtile ${t.s==="h"?"h":""} ${gone?"gone":""} ${M.sel===i?"sel":""}" data-mt="${i}" ${gone?"disabled":""}>${t.s==="h" ? `<span lang="zh">${esc(w.hz)}</span>` : esc(w.uz)}</button>`; }).join("")}</div>`;
  if (M.start) mTimer = setInterval(() => { const c = $("#mclock"); if (c && M && M.start && !M.end) c.textContent = mtime(Date.now()-M.start+M.pen); else clearInterval(mTimer); }, 100);
}
function matchTap(i){
  if (!M || M.done.includes(i)) return;
  if (!M.start) M.start = Date.now();
  if (M.sel === null) { M.sel = i; hap("tap"); rMatch5($("#v-home")); return; }
  if (M.sel === i) { M.sel = null; rMatch5($("#v-home")); return; }
  const a = M.tiles[M.sel], b = M.tiles[i];
  if (a.id === b.id && a.s !== b.s) {
    M.done.push(M.sel, i); M.sel = null; hap("ok"); h5log("match", true);
    if (M.done.length === M.tiles.length) { M.end = Date.now(); const tm = M.end - M.start + M.pen, key = String(DS.set); if (!S.h5.best[key] || tm < S.h5.best[key]) S.h5.best[key] = tm; h5save(); }
    rMatch5($("#v-home"));
  } else {
    M.pen += 1000; hap("bad"); h5log("match", false); const wrongW = WMAP[a.id]; S.h5.wr[wrongW.id] = (S.h5.wr[wrongW.id]||0) + 1;
    const els = [document.querySelector(`[data-mt="${M.sel}"]`), document.querySelector(`[data-mt="${i}"]`)];
    els.forEach(el => el && el.classList.add("shake")); M.sel = null;
    setTimeout(() => rMatch5($("#v-home")), 380);
  }
}

/* ---------- events ---------- */
$("#v-home").addEventListener("click", e => {
  if (P.book !== "hsk5") return;
  const t = e.target;
  const st = t.closest("[data-star]"); if (st) { e.stopPropagation(); const id = st.dataset.star, on = !isStar(id); S.h5.star[id] = [on?1:0, Date.now()]; st.setAttribute("aria-pressed", String(on)); hap("tap"); h5save(); return; }
  const ds = t.closest("[data-dset]"); if (ds) { const s = ds.dataset.dset; if (ds.dataset.dgo) { DS = null; } setDil(/^\d+$/.test(s) ? +s : s); return; }
  const dm = t.closest("[data-dm]"); if (dm) { h5start(dm.dataset.dm); return; }
  const fr = t.closest("[data-dfront] button"); if (fr) { S.h5.front = fr.dataset.v; DS.fl = false; h5save(); rFc($("#v-home")); return; }
  const tn = t.closest("[data-dtn] button"); if (tn) { DS.n = +tn.dataset.v; h5save(); rTest($("#v-home")); return; }
  const ty = t.closest("[data-dty]"); if (ty) { DS.ty[ty.dataset.dty] = DS.ty[ty.dataset.dty] ? 0 : 1; h5save(); rTest($("#v-home")); return; }
  const lo = t.closest("[data-lo]"); if (lo && DS && DS.mode==="learn" && !DS.a) { learnAns(lo.dataset.lo); return; }
  const ta = t.closest("[data-ta]"); if (ta && DS && DS.mode==="test" && !DS.sub) { DS.ans[ta.dataset.ta] = ta.dataset.v; hap("tap"); h5save(); const y = window.scrollY; rTest($("#v-home")); window.scrollTo({top:y}); return; }
  const mt = t.closest("[data-mt]"); if (mt) { matchTap(+mt.dataset.mt); return; }
  const b = t.closest("[data-d]"); if (!b) return; const a = b.dataset.d;
  if (a==="resume") { DS = JSON.parse(JSON.stringify(S.h5.cur)); if (DS.mode==="match") matchNew(); dilShow(); return; }
  if (a==="close") { dilClose(false); return; }
  if (a==="finish") { dilClose(true); return; }
  if (a==="fcYes" || a==="fcNo") { fcGrade(a==="fcYes"); return; }

  if (a==="fcAgain") { DS.q = shuffle(h5words(DS.set).map(w=>w.id)); DS.i = 0; DS.know = []; DS.learn = []; h5save(); rFc($("#v-home")); return; }
  if (a==="fcAgainLearn") { DS.q = shuffle(DS.learn.slice()); DS.i = 0; DS.know = []; DS.learn = []; h5save(); rFc($("#v-home")); return; }
  if (a==="lCheck") { const i = $("#dIn"); if (i && i.value.trim()) learnAns(i.value.trim()); return; }
  if (a==="lSkip") { learnAns(""); return; }
  if (a==="lGo") { learnNext(); return; }
  if (a==="lOver") { const q = DS.round[DS.ri]; h5override(WMAP[q.id], DS.a.prev, "learn"); DS.a.ok = true; learnNext(); return; }
  if (a==="lNext") { learnRound(); h5save(); rLearn($("#v-home")); window.scrollTo({top:0}); return; }
  if (a==="tCheck") { const i = $("#dIn"); if (i && i.value.trim()) typeAns(i.value.trim()); return; }
  if (a==="tSkip") { typeAns(""); return; }
  if (a==="tHint") { DS.hint = DS.q[DS.i]; rType($("#v-home")); return; }
  if (a==="tGo") { typeNext(); return; }
  if (a==="tOver") { h5override(WMAP[DS.q[DS.i]], DS.a.prev, DS.mode); DS.a.ok = true; typeNext(); return; }
  if (a==="tAgainBad") { DS.q = shuffle(DS.bad.slice()); DS.i = 0; DS.ok = []; DS.bad = []; h5save(); rType($("#v-home")); return; }
  if (a==="tAgain") { DS.q = shuffle(h5words(DS.set).map(w=>w.id)); DS.i = 0; DS.ok = []; DS.bad = []; h5save(); rType($("#v-home")); return; }
  if (a==="testGo") { if (testBuild()) { h5save(); rTest($("#v-home")); } return; }
  if (a==="testSub") { const n = DS.qs.length, k = Object.keys(DS.ans).filter(i => String(DS.ans[i]).trim()).length; if (k < n && !b.dataset.sure) { b.dataset.sure = "1"; b.textContent = `${n-k} ta savol javobsiz. Baribir topshirish`; return; } testSubmit(); return; }

});
