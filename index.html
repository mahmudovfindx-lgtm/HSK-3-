<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HSK 3 ilovam: 1–18-mavzular</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HSK 3">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Ma+Shan+Zheng&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  color-scheme: light;
  --paper:#F4F6F1; --surface:#FFFFFF; --ink:#1C221E; --ink-2:#56605A; --ink-3:#8A938D; --line:#DCE2DA;
  --grid:#CF6A58; --grid-soft:rgba(207,106,88,.42); --grid-fill:rgba(207,106,88,.06);
  --primary:#2B6A51; --primary-ink:#FFFFFF;
  --again:#A7412C; --again-soft:#F7E5E0; --hard:#946410; --hard-soft:#F6EDDA; --good:#2B6A51; --good-soft:#E2EFE7;
  --mask:#E4E9E2; --lc:#CF6A58;
  --kai:"KaiTi","STKaiti","Kaiti SC","楷体","Ma Shan Zheng";
  --hei:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei";
  --hz:var(--kai);
  --ui:"Noto Sans",var(--hz),system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#121613; --surface:#1A1F1B; --ink:#E6EBE5; --ink-2:#A9B3AC; --ink-3:#78827B; --line:#2B332D;
    --grid:#C8695B; --grid-soft:rgba(200,105,91,.45); --grid-fill:rgba(200,105,91,.07);
    --primary:#66B890; --primary-ink:#0E1912;
    --again:#E58069; --again-soft:#3A221C; --hard:#DBAA4E; --hard-soft:#342A16; --good:#66B890; --good-soft:#1D3227;
    --mask:#272E29;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#121613; --surface:#1A1F1B; --ink:#E6EBE5; --ink-2:#A9B3AC; --ink-3:#78827B; --line:#2B332D;
  --grid:#C8695B; --grid-soft:rgba(200,105,91,.45); --grid-fill:rgba(200,105,91,.07);
  --primary:#66B890; --primary-ink:#0E1912;
  --again:#E58069; --again-soft:#3A221C; --hard:#DBAA4E; --hard-soft:#342A16; --good:#66B890; --good-soft:#1D3227;
  --mask:#272E29;
}
:root.hei{--hz:var(--hei);}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);}
button{font:inherit;color:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.wrap{max-width:780px;margin:0 auto;padding:0 16px;}
[hidden]{display:none !important;}
[lang="zh"],.zh{font-family:var(--hz);}
:root:not(.hei) [lang="zh"], :root:not(.hei) .tzg .c, :root:not(.hei) .hzi, :root:not(.hei) .zh{font-weight:400;}
mark{background:color-mix(in srgb,var(--lc) 24%,transparent);color:inherit;border-radius:3px;padding:0 1px;}

/* tianzige */
.tzg{display:inline-flex;--s:44px;}
.tzg .c{position:relative;width:var(--s);height:var(--s);border:1.5px solid var(--lc);background:color-mix(in srgb,var(--lc) 6%,transparent);display:grid;place-items:center;font-family:var(--hz);font-weight:500;font-size:calc(var(--s)*.7);line-height:1;color:var(--ink);}
:root:not(.hei) .tzg .c{font-size:calc(var(--s)*.76);}
.tzg .c + .c{border-left-width:0;}
.tzg .c::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed color-mix(in srgb,var(--lc) 45%,transparent);}
.tzg .c::after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px dashed color-mix(in srgb,var(--lc) 45%,transparent);}
.tzg .c > span{position:relative;z-index:1;}
.tzg .c.cur{background:color-mix(in srgb,var(--lc) 20%,transparent);}
.tzg.sm{--s:32px;}
.tzg.xl{--s:min(27vw,112px);}
.tzg.xl .c{border-width:2px;}
.tzg.xl .c + .c{border-left-width:0;}

/* header */
.top{border-bottom:1px solid var(--line);background:var(--paper);}
.brand{display:flex;align-items:center;gap:12px;padding:14px 0 10px;}
.brand h1{margin:0;font-size:18px;line-height:1.25;font-weight:700;letter-spacing:-.01em;}
.brand p{margin:0;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.cloud{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;}
.cloud::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3);}
.cloud.synced::before{background:var(--good);}
.cloud.saving::before,.cloud.connecting::before{background:var(--hard);}
.cloud.error::before{background:var(--again);}
.fontbtn{margin-left:auto;height:34px;padding:0 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;}
.fontbtn .hzi{font-family:var(--hz);font-size:16px;color:var(--ink);margin-left:4px;}
.tabs{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:10px;}
.tabs button{border:0;background:none;padding:8px 2px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);}
.chips{display:flex;align-items:center;flex-wrap:wrap;gap:6px 4px;padding-bottom:12px;}
.chips .lbl{font-size:13px;color:var(--ink-2);margin-right:4px;}
.chip{height:32px;min-width:32px;padding:0 8px;border:1.5px solid var(--lc);background:transparent;color:var(--lc);font-weight:700;font-size:14px;border-radius:8px;}
.chip[aria-pressed="true"]{background:var(--lc);color:#fff;}
.chip.all{--lc:var(--ink);font-weight:600;font-size:13px;margin-left:4px;}
.chip.all[aria-pressed="true"]{color:var(--paper);}
main{padding:18px 0 48px;}

/* generic */
.intro{margin:0 0 14px;color:var(--ink-2);font-size:15px;max-width:64ch;}
.h2{font-size:19px;margin:30px 0 6px;line-height:1.3;}
.h2:first-child{margin-top:0;}
.h2 .zh{color:var(--grid);margin-right:8px;}
.tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:18px;}
.search{flex:1 1 220px;min-width:0;height:40px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:0 12px;font:inherit;font-size:15px;}
.toggles{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.toggles .lbl{font-size:13px;color:var(--ink-2);margin-right:2px;}
.tg{height:34px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2);}
.tg[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper);}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap;}
.seg button{border:0;background:none;padding:7px 12px;border-radius:7px;font-size:14px;font-weight:600;color:var(--ink-2);}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
.seg button .hzi{font-family:var(--hz);}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-bottom:14px;}
.row .lbl{width:140px;font-size:14px;font-weight:600;color:var(--ink-2);}
.btn{min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;}
.say{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:50%;color:var(--ink-2);flex:none;}
.say:hover{color:var(--ink);border-color:var(--ink-3);}
.tip{font-size:14px;color:var(--ink-2);margin:0 0 22px;max-width:64ch;padding-left:12px;border-left:3px solid var(--grid);}
.empty{color:var(--ink-2);padding:24px 0;}
.sub{font-size:13px;color:var(--ink-3);margin:0;}

/* lesson block */
.lesson{margin-bottom:34px;}
.lh{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:baseline;padding-bottom:10px;border-bottom:3px solid var(--lc);margin-bottom:4px;}
.lh .ln{font-size:13px;font-weight:700;color:#fff;background:var(--lc);padding:2px 8px;border-radius:6px;white-space:nowrap;}
.lh h2{margin:0;font-family:var(--hz);font-size:22px;font-weight:700;line-height:1.3;}
.lh p{grid-column:2;margin:2px 0 0;font-size:14px;color:var(--ink-2);}

/* word list */
.wl{list-style:none;margin:0;padding:0;}
.w{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.w .wz{padding-top:2px;max-width:46vw;}
.w .wz .tzg{flex-wrap:wrap;}
.w .py{font-size:17px;font-weight:600;line-height:1.3;color:var(--lc);}
.w .uz{font-size:15px;line-height:1.4;margin-top:2px;}
.w .pos{font-style:normal;font-size:12px;color:var(--ink-3);margin-left:4px;white-space:nowrap;}
.w .hook{margin:6px 0 0;font-size:14.5px;line-height:1.5;color:var(--ink-2);max-width:60ch;}
.w .wex{margin:8px 0 0;font-size:13.5px;line-height:1.55;color:var(--ink-2);max-width:60ch;}
.w .wex [lang="zh"]{color:var(--ink);font-size:17px;}
.ws{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.dots{display:flex;gap:3px;}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);}
.dots i.on{background:var(--good);}
.h-hz .w:not(.open) .wz .c > span{visibility:hidden;}
.h-py .w:not(.open) .py span,.h-uz .w:not(.open) .uz span{color:transparent;background:var(--mask);border-radius:4px;user-select:none;}
.h-uz .w:not(.open) .pos{visibility:hidden;}
.h-any .w:not(.open) .hook,.h-any .w:not(.open) .wex{display:none;}

/* flashcard */
.fc{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 14px 34px -24px rgba(0,0,0,.35);}
.fc-band{background:var(--lc);color:#fff;padding:9px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;font-weight:700;}
.fc-band [lang="zh"]{font-size:15px;opacity:.95;text-align:right;}
.fc-body{padding:24px 18px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;min-height:250px;}
.fc.tap{cursor:pointer;}
.fc .ptr{font-size:clamp(21px,5.4vw,27px);font-weight:700;line-height:1.35;margin:0 0 6px;max-width:28ch;}
.fc .pzh{font-family:var(--hz);font-size:clamp(24px,6vw,32px);line-height:1.5;margin:4px 0 8px;max-width:20em;}
.fc .hint{font-size:14px;color:var(--ink-2);margin:20px 0 0;max-width:40ch;}
.fc-ans{border-top:1px dashed var(--line);margin-top:18px;padding-top:16px;width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;}
.fc-py{font-size:26px;font-weight:700;color:var(--lc);line-height:1.2;}
.fc-uz{font-size:18px;}
.fc-zh{font-family:var(--hz);font-size:clamp(22px,5.5vw,28px);line-height:1.5;}
.fc-sec{text-align:left;margin-top:12px;background:var(--paper);border-radius:12px;padding:10px 12px;width:100%;}
.fc-lbl{display:block;font-size:12px;font-weight:700;color:var(--lc);margin-bottom:2px;}
.fc-sec p{margin:0;font-size:14.5px;color:var(--ink-2);}
.fc-sec .ex{font-family:var(--hz);font-size:20px;color:var(--ink);line-height:1.5;}
.reveal{margin-top:16px;width:100%;}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
.gb{border-radius:12px;border:1.5px solid transparent;padding:10px 6px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px;}
.gb small{font-weight:500;font-size:12px;opacity:.85;}
.gb.again{background:var(--again-soft);color:var(--again);border-color:var(--again);}
.gb.hard{background:var(--hard-soft);color:var(--hard);border-color:var(--hard);}
.gb.good{background:var(--good-soft);color:var(--good);border-color:var(--good);}
.keys{font-size:12px;color:var(--ink-3);text-align:center;margin-top:12px;}
@media (hover:none){.keys{display:none;}}
.fc-ans,.fb{animation:rise .22s ease-out;}
@keyframes rise{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.card-top .prog{flex:1;height:6px;background:var(--mask);border-radius:3px;overflow:hidden;}
.card-top .prog i{display:block;height:100%;background:var(--lc);transition:width .25s ease;}
.card-top .cnt{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.card-top .stop{background:none;border:0;color:var(--ink-2);font-size:13px;font-weight:600;padding:6px 0;}
.stats{border-top:2px solid var(--ink);padding-top:12px;margin-bottom:6px;}
.st{display:grid;grid-template-columns:minmax(76px,max-content) 1fr auto;gap:12px;align-items:center;padding:5px 0;font-size:14px;}
.st .ln{color:var(--lc);font-weight:700;}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--mask);}
.bar i{display:block;height:100%;}
.bar .b-learn{background:color-mix(in srgb,var(--lc) 45%,transparent);}
.bar .b-solid{background:var(--lc);}
.st .num{color:var(--ink-2);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink-2);margin:6px 0 16px;}
.today{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 20px;}
.today div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--ink-2);}
.today b{display:block;font-size:24px;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums;}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-2);margin:4px 0 18px;cursor:pointer;}
.chk input{width:18px;height:18px;accent-color:var(--primary);}
.weak h3{margin:0 0 4px;font-size:16px;}
.weak p{margin:0 0 10px;font-size:14px;color:var(--ink-2);}
.wk{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:8px;}
.wk li{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:13px;}
.wk .x{color:var(--again);font-weight:700;font-variant-numeric:tabular-nums;}
.linkbtn{background:none;border:0;padding:0;color:var(--ink-3);font-size:13px;text-decoration:underline;text-underline-offset:3px;margin-top:22px;}
.copybox{width:100%;min-height:90px;margin-top:8px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--ink);}
.done h2{margin:0 0 6px;font-size:22px;}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 20px;}
.sum div{border-radius:12px;padding:12px;text-align:center;font-size:13px;}
.sum b{display:block;font-size:26px;line-height:1.2;}
.s-again{background:var(--again-soft);color:var(--again);}
.s-hard{background:var(--hard-soft);color:var(--hard);}
.s-good{background:var(--good-soft);color:var(--good);}
.mlist{list-style:none;padding:0;margin:0 0 20px;}
.mlist li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;}
.mlist .dz{font-family:var(--hz);font-size:22px;min-width:3.2em;color:var(--lc);}

/* grammar */
.legendr{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 0 18px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:12.5px;}
.legendr span{display:inline-flex;align-items:center;gap:5px;}
.legendr i{width:16px;height:3px;background:var(--rc);display:inline-block;border-radius:2px;}
.g{padding:18px 16px 18px;margin:14px 0;border:1px solid var(--line);border-left:5px solid var(--lc);border-radius:14px;background:var(--surface);}
.g h3{margin:0;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;}
.g .gzh{font-family:var(--hz);font-size:23px;font-weight:700;color:var(--lc);}
.g .guz{font-size:15px;font-weight:600;color:var(--ink-2);}
.gsec{margin-top:14px;}
.glbl{display:block;font-size:12.5px;font-weight:700;color:var(--lc);margin-bottom:4px;}
.gsec p{margin:0;font-size:15px;max-width:66ch;}
.formula{margin:0 0 6px;padding:10px 14px;border-radius:10px;background:color-mix(in srgb,var(--lc) 10%,transparent);font-size:16px;line-height:1.6;font-weight:600;}
.eg{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:12px;}
.eg li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px dashed var(--line);cursor:pointer;}
.eg .xtra{display:inline-block;font-size:11px;font-weight:700;color:var(--lc);border:1px solid var(--lc);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px;}
.tgs{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px 4px;}
.ch{display:inline-flex;flex-direction:column;align-items:center;}
.ch .ct{font-family:var(--hz);font-size:21px;line-height:1.35;padding:0 3px 1px;border-bottom:3px solid var(--rc);}
.ch .cr{font-size:10.5px;line-height:1.3;color:var(--rc);font-weight:700;margin-top:1px;}
.ch.r-K .ct{background:color-mix(in srgb,var(--lc) 18%,transparent);border-radius:5px 5px 0 0;}
.r-K{--rc:var(--lc);}
.etr{margin:6px 0 0;font-size:14px;color:var(--ink-2);}
.ewords{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px;}
.ewords span{font-size:12px;color:var(--ink-2);background:var(--paper);border-radius:6px;padding:1px 7px;}
.ewords span [lang="zh"]{font-size:14px;color:var(--ink);margin-right:3px;}
.h-tr .eg li:not(.open) .etr span{color:transparent;background:var(--mask);border-radius:4px;user-select:none;}
.mis{display:grid;gap:8px;}
.mis div{background:var(--paper);border-radius:10px;padding:8px 12px;font-size:14px;}
.mis .bad{color:var(--again);text-decoration:line-through;font-family:var(--hz);font-size:18px;}
.mis .ok{color:var(--good);font-family:var(--hz);font-size:18px;}
.mis .xm{font-weight:700;margin-right:6px;font-family:var(--ui);text-decoration:none;display:inline-block;}
.mis p{margin:4px 0 0;color:var(--ink-2);font-size:13.5px;}
.gact{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:14px;}
.gact .sub{font-size:13px;}

/* exercises */
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;margin-top:6px;}
.hubc{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:3px;}
.hubc:hover{border-color:var(--ink-3);}
.hubc .zh{font-size:22px;color:var(--grid);line-height:1.3;}
.hubc b{font-size:15px;}
.hubc span{font-size:13px;color:var(--ink-2);line-height:1.4;}
.hubc .acc{font-size:12px;color:var(--ink-3);margin-top:4px;}
.hubc:disabled{opacity:.45;}
.qlbl{font-size:13px;color:var(--ink-3);margin:0 0 14px;}
.opts{display:grid;gap:8px;margin-top:16px;}
.opts.two{grid-template-columns:1fr 1fr;}
.opt{min-height:54px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;text-align:left;font-size:16px;line-height:1.35;}
.opt.hz{text-align:center;font-family:var(--hz);font-size:28px;}
.opt.py{text-align:center;font-size:20px;font-weight:600;}
.opt.ok{border-color:var(--good);background:var(--good-soft);}
.opt.bad{border-color:var(--again);background:var(--again-soft);}
.opt:disabled{cursor:default;color:var(--ink);}
.fb{margin-top:14px;border-radius:12px;padding:14px 16px;border:1.5px solid var(--line);background:var(--surface);}
.fb.ok{border-color:var(--good);}
.fb.bad{border-color:var(--again);}
.fb .v{font-weight:700;margin:0 0 8px;}
.fb.ok .v{color:var(--good);}
.fb.bad .v{color:var(--again);}
.fb .fw{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.fb .fw .zh{font-size:28px;}
.fb p{margin:6px 0 0;font-size:14px;color:var(--ink-2);}
.fillzh{font-family:var(--hz);font-size:clamp(22px,5.6vw,28px);line-height:1.6;margin:0 0 8px;}
.blank{display:inline-block;min-width:2.2em;border-bottom:2.5px solid var(--lc);color:var(--lc);margin:0 2px;}
.bigsay{width:96px;height:96px;border-radius:50%;border:2px solid var(--lc);background:color-mix(in srgb,var(--lc) 8%,transparent);color:var(--lc);display:grid;place-items:center;margin:4px auto 10px;}
.bigsay svg{width:40px;height:40px;}
.aline{min-height:62px;border-bottom:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0;margin:6px 0 16px;width:100%;justify-content:center;}
.aline .ph{color:var(--ink-3);font-size:14px;}
.chunks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.chunk{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-family:var(--hz);font-size:21px;line-height:1.3;}
.aline .chunk{background:var(--surface);border-color:var(--lc);}
.chunk.used{visibility:hidden;}
.match{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;width:100%;}
.mcol{display:grid;gap:8px;align-content:start;}
.mi{min-height:56px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;font-size:14.5px;line-height:1.3;}
.mi.zh{font-size:24px;}
.mi.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset;}
.mi.done{opacity:.25;pointer-events:none;border-color:var(--good);}
.mi.wrong{border-color:var(--again);background:var(--again-soft);}

/* writing */
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;}
.steps{display:flex;gap:4px;width:100%;}
.steps span{flex:1;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink-3);padding-top:6px;border-top:4px solid var(--mask);}
.steps span.on{color:var(--lc);border-top-color:var(--lc);}
.steps span.done{color:var(--ink-2);border-top-color:color-mix(in srgb,var(--lc) 45%,transparent);}
.winfo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;text-align:center;}
.winfo .py{font-size:19px;font-weight:700;color:var(--lc);}
.winfo .uz{font-size:15px;color:var(--ink-2);}
.wtitle{font-size:17px;font-weight:700;margin:0;text-align:center;}
.wtext{font-size:14.5px;color:var(--ink-2);max-width:52ch;text-align:center;margin:0;}
.pad{position:relative;width:min(82vw,300px);aspect-ratio:1/1;border:2px solid var(--lc);background:color-mix(in srgb,var(--lc) 5%,transparent);}
.pad::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed color-mix(in srgb,var(--lc) 45%,transparent);}
.pad::after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px dashed color-mix(in srgb,var(--lc) 45%,transparent);}
.pad .diag{position:absolute;inset:0;pointer-events:none;background:linear-gradient(45deg,transparent calc(50% - .5px),var(--lc) calc(50% - .5px),var(--lc) calc(50% + .5px),transparent calc(50% + .5px)),linear-gradient(-45deg,transparent calc(50% - .5px),var(--lc) calc(50% - .5px),var(--lc) calc(50% + .5px),transparent calc(50% + .5px));opacity:.14;}
.pad .model{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hz);font-size:min(64vw,234px);line-height:1;color:var(--ink);opacity:0;pointer-events:none;}
.pad .model.trace{opacity:.15;}
.pad .model.check{opacity:.45;color:var(--lc);}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;}
.wnav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.charpick{display:flex;}
.charpick button{border:0;padding:0;background:none;}
.parts{display:grid;gap:10px;width:100%;}
.part{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--paper);border-radius:12px;padding:10px 12px;}
.part .rads{display:flex;flex-wrap:wrap;gap:6px;}
.part .rads span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:13px;}
.part .rads span b{font-family:var(--hei);font-size:18px;margin-right:4px;}
.counter{font-size:14px;font-weight:700;color:var(--lc);}
.strokes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;}
.sk{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:grid;grid-template-columns:60px 1fr;gap:4px 10px;align-items:start;}
.sk svg{grid-row:span 3;width:60px;height:60px;border:1px dashed var(--grid-soft);border-radius:6px;}
.sk b{font-family:var(--hz);font-size:18px;}
.sk b small{font-family:var(--ui);font-size:12.5px;color:var(--ink-2);font-weight:600;margin-left:6px;}
.sk p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.4;}
.sk .exs{font-family:var(--hz);font-size:17px;color:var(--ink);}
.rules{display:grid;gap:10px;}
.rl{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;}
.rl h3{margin:0;font-size:15px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;}
.rl h3 .zh{font-size:19px;color:var(--grid);}
.rl p{margin:6px 0 0;font-size:14px;color:var(--ink-2);}
.rl ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px;}
.rl li{display:flex;gap:10px;align-items:center;font-size:14px;}
.rl li .zh{font-size:28px;line-height:1;min-width:1.2em;}
.structs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.sx{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;}
.sx b{display:block;font-size:15px;}
.sx b .zh{color:var(--grid);margin-right:6px;}
.sx p{margin:4px 0 6px;font-size:13px;color:var(--ink-2);}
.sx .exs{font-family:var(--hz);font-size:24px;letter-spacing:.15em;}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;}
.tiles div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--ink-2);}
.tiles b{display:block;font-size:24px;line-height:1.2;color:var(--ink);font-variant-numeric:tabular-nums;}
.insight{display:grid;gap:8px;margin:0 0 8px;}
.insight div{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--again);border-radius:10px;padding:10px 12px;font-size:14.5px;}
.insight div.good{border-left-color:var(--good);}
.insight b{font-weight:700;}
.chart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:120px;padding:8px 0 0;border-bottom:1px solid var(--line);}
.chart div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;}
.chart i{display:block;width:100%;background:var(--primary);border-radius:4px 4px 0 0;min-height:2px;}
.chart i.zero{background:var(--mask);}
.chartx{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;font-size:10.5px;color:var(--ink-3);text-align:center;margin-top:4px;}
.hb{display:grid;grid-template-columns:minmax(110px,170px) 1fr 70px;gap:10px;align-items:center;padding:6px 0;font-size:14px;}
.hb .bar{height:12px;}
.hb .bar i{background:var(--lc);}
.hb .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px;}
.hb .nm [lang="zh"]{font-size:17px;}
.hw{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);}
.hw .er{color:var(--again);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;text-align:right;}
.hw .er small{display:block;color:var(--ink-3);font-weight:500;font-size:12px;}
.hw b{color:var(--lc);}

/* tips */
.guide{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px;}
.guide li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;}
.guide li::before{content:counter(s);width:28px;height:28px;border:1.5px solid var(--grid);color:var(--grid);display:grid;place-items:center;font-weight:700;}
.guide b{display:block;font-size:15px;margin-bottom:2px;}
.rad{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.rad .rg{width:54px;height:54px;border:1.5px solid var(--grid);background:var(--grid-fill);display:grid;place-items:center;font-family:var(--hei);font-size:32px;line-height:1;}
.rad .rn{font-size:15px;font-weight:600;}
.rad .rn small{font-weight:500;color:var(--ink-3);margin-left:6px;font-size:12.5px;}
.rad .rw{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.rad .rw > span{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 8px;font-size:13px;color:var(--ink-2);}
.rad .rw span [lang="zh"]{font-size:17px;color:var(--lc);margin-right:4px;}
.conf{display:grid;gap:10px;}
.cf{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;}
.cf h3{margin:0 0 8px;font-size:15px;}
.cf .cr{display:flex;flex-wrap:wrap;gap:8px 18px;}
.cf .ci{display:flex;align-items:center;gap:8px;}
.cf .ci .zh{font-size:26px;}
.cf .ci span{font-size:13px;color:var(--ink-2);line-height:1.3;}
.cf .ci span b{display:block;color:var(--ink);font-size:14px;}
.cf p{margin:8px 0 0;font-size:14px;color:var(--ink-2);}

.homebar{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 14px;margin:0 0 12px;font-size:13.5px;color:var(--ink-2);}
.sp{border:1px solid var(--line);border-left:5px solid var(--lc);background:var(--surface);border-radius:14px;padding:14px;margin:12px 0;}
.sph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.sph .py{font-size:19px;font-weight:700;color:var(--lc);}
.sph .uz{font-size:15px;}
.sph .btn{margin-left:auto;}
.spc{display:grid;gap:10px;margin-top:12px;}
.cx{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--paper);border-radius:12px;padding:10px 12px;align-items:start;}
.cx .tzg{--s:64px;}
.cx b{font-size:14px;}
.cx p{margin:4px 0 0;font-size:14px;color:var(--ink-2);}
.cx .fm{font-size:17px;color:var(--ink);}
.lbl{font-weight:700;color:var(--lc);}
.cx .tp{color:var(--ink);}
.spx{margin:10px 0 0;font-size:14px;color:var(--ink-2);}
.spx [lang="zh"]{font-size:18px;color:var(--ink);}
.books{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
.books button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 10px;text-align:left;display:flex;flex-direction:column;gap:0;}
.books button [lang="zh"]{font-size:16px;line-height:1.3;}
.books small{font-size:12px;color:var(--ink-2);}
.books button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset;}
.twin{display:inline-block;font-size:11.5px;font-weight:700;color:var(--good);border:1px solid var(--good);border-radius:6px;padding:0 6px;margin-top:4px;}
.cab{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px;}
.cab .av{width:56px;height:56px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-size:24px;font-weight:700;overflow:hidden;}
.cab .av img{width:100%;height:100%;object-fit:cover;}
.cab b{display:block;font-size:17px;}
.cab .sub{display:block;margin-top:2px;}
/* ===== app shell ===== */
body{padding-bottom:calc(78px + env(safe-area-inset-bottom,0px));}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:color-mix(in srgb,var(--paper) 86%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(16px);backdrop-filter:saturate(1.5) blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent);}
body::before{background:color-mix(in srgb,var(--paper) 86%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);}
.appbar{display:flex;align-items:center;gap:10px;padding:12px 0 8px;}
.ttl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;}
.ttl h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.1;}
.ttl .cloud{margin-top:3px;text-decoration:none;}
.back{width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:26px;line-height:1;display:grid;place-items:center;padding:0 0 4px;color:var(--ink);}
.ctxrow{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;}
.ctxrow::-webkit-scrollbar{display:none;}
.ctxrow .books{display:flex;flex:none;grid-template-columns:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:0;margin:0;}
.ctxrow .books button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink-2);display:block;box-shadow:none;}
.ctxrow .books button [lang="zh"]{font-size:14px;}
.ctxrow .books button[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none;}
.ctxrow .books small{display:none;}
.ctxrow .chips{display:flex;flex:none;flex-wrap:nowrap;padding:0;gap:5px;}
.ctxrow .chips .lbl{display:none;}
.ctxrow .chip{height:31px;min-width:31px;border-radius:999px;font-size:13.5px;}
.ctxrow .chip.all{margin-left:0;padding:0 11px;}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;display:grid;grid-template-columns:repeat(5,1fr);max-width:780px;margin:0 auto;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--ink-3);font-size:11px;font-weight:600;letter-spacing:.01em;}
.nav .ic{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .2s ease;}
.nav svg,.mrow svg,.qa svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.nav button[aria-current="page"]{color:var(--primary);}
.nav button[aria-current="page"] .ic{background:color-mix(in srgb,var(--primary) 15%,transparent);}
.nav button[aria-current="page"] svg{stroke-width:2.2;}
main{padding:16px 0 20px;}
/* ===== home ===== */
.hero{position:relative;border-radius:24px;padding:20px 18px 18px;background:#1E4B3D;color:#F2F4F0;overflow:hidden;margin-bottom:16px;}
.hero::after{content:attr(data-hz);position:absolute;right:-14px;bottom:-34px;font-family:var(--hz);font-size:168px;line-height:1;color:rgba(255,255,255,.07);pointer-events:none;}
.hero .greet{margin:0;font-size:14px;opacity:.75;}
.hero .greet,.hero h2,.hero .ctx{padding-right:86px;position:relative;z-index:1;}
.hero h2{margin:2px 0 0;font-size:28px;letter-spacing:-.02em;line-height:1.15;}
.hero .ctx{margin:6px 0 0;font-size:14px;opacity:.8;}
.seal{position:absolute;top:18px;right:18px;width:66px;height:66px;border:3px solid #E0573F;border-radius:8px;color:#E0573F;display:grid;place-items:center;text-align:center;transform:rotate(-7deg);font-family:var(--hz);line-height:1;}
.seal b{display:block;font-size:26px;font-family:var(--ui);font-weight:800;}
.seal small{display:block;font-size:13px;margin-top:2px;}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 14px;position:relative;z-index:1;}
.hstats div{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;font-size:12px;opacity:.95;}
.hstats b{display:block;font-size:24px;line-height:1.15;font-variant-numeric:tabular-nums;}
.hero .go{position:relative;z-index:1;width:100%;min-height:50px;border:0;border-radius:14px;background:#F2F4F0;color:#1E4B3D;font-weight:700;font-size:16px;}
.hero .go:disabled{opacity:.55;}
.sect{margin:22px 0 10px;font-size:18px;font-weight:700;letter-spacing:-.01em;}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.qa button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:112px;}
.qa .qi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--qc);}
.qa b{font-size:15px;line-height:1.25;}
.qa span{font-size:12.5px;color:var(--ink-2);line-height:1.35;}
.wod{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;}
.wod .tzg{--s:64px;}
.wod .py{font-size:20px;font-weight:700;color:var(--lc);}
.wod .uz{font-size:15px;margin-top:1px;}
.wod p{margin:6px 0 0;font-size:13.5px;color:var(--ink-2);}
.lp{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 14px;}
.lp .row1{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);}
.lp .row1:last-child{border-bottom:0;}
.lp .dot{width:10px;height:10px;border-radius:50%;background:var(--lc);}
.lp .nm{font-size:14px;font-weight:600;}
.lp .nm [lang="zh"]{display:block;font-weight:400;font-size:15px;color:var(--ink-2);}
.lp .pc{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;}
.lp .bar{grid-column:1/-1;height:6px;margin-top:-2px;}
/* ===== Dilobar 老师 (HSK 5) ===== */
:root.dilobar{--primary:#C2185B;--primary-ink:#fff;}
:root.dilobar .hero{background:linear-gradient(140deg,#9E1249 0%,#D63A7E 100%);box-shadow:inset 0 0 0 2px #E6C35C;}
:root.dilobar .seal{border-color:#F2D27A;color:#F2D27A;}
:root.dilobar .hero .go{color:#9E1249;}
:root.dilobar .top{background:color-mix(in srgb,#E91E63 6%,color-mix(in srgb,var(--paper) 88%,transparent));}
.dil-banner{position:relative;border-radius:22px;padding:16px 18px;margin-bottom:14px;background:color-mix(in srgb,#E91E63 9%,var(--surface));border:2px solid #D4AF37;box-shadow:inset 0 0 0 4px color-mix(in srgb,#D4AF37 14%,transparent);overflow:hidden;}
.dil-banner h2{margin:0;font-size:22px;line-height:1.2;color:#C2185B;letter-spacing:-.01em;padding-right:30px;}
.dil-banner h2 [lang="zh"]{color:#A67C00;}
.dil-banner p{margin:5px 0 0;color:color-mix(in srgb,#8C6D1F 80%,var(--ink));font-weight:600;font-size:13.5px;}
.dil-banner .orn{position:absolute;top:10px;right:14px;font-size:22px;color:#D4AF37;}
.dil-banner .dil-note{font-weight:400;font-size:12px;opacity:.8;}
.dil-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.dil-stats div{background:var(--surface);border:1px solid color-mix(in srgb,#D4AF37 55%,transparent);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--ink-2);}
.dil-stats b{display:block;font-size:21px;color:#C2185B;font-variant-numeric:tabular-nums;}
.ctxrow .books button.dil{color:#C2185B;}
.ctxrow .books button.dil[aria-pressed="true"]{background:linear-gradient(135deg,#B3124F,#E04B8A);color:#FFE7A0;}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px;}
.set{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 6px 7px;text-align:center;color:var(--ink);}
.set b{display:block;font-size:18px;color:var(--lc);}
.set small{display:block;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;}
.set .bar{display:flex;height:5px;margin-top:6px;}
.set.gold{border-color:#D4AF37;background:color-mix(in srgb,#D4AF37 16%,var(--surface));}
.set.gold b{color:#A67C00;}
.set.on{box-shadow:0 0 0 2px var(--primary) inset;}
.fams{display:grid;gap:8px;margin:10px 0;}
.fam{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;background:var(--paper);border-radius:12px;padding:8px 10px;}
.fam .fc1{font-family:var(--hz);font-size:30px;line-height:1.1;color:#C2185B;text-align:center;}
.fam .fw{display:inline-block;margin:2px 8px 2px 0;font-size:13px;color:var(--ink-2);}
.fam .fw [lang="zh"]{font-size:16px;color:var(--ink);}
/* ===== Dilobar studio ===== */
.dh{position:relative;border-radius:24px;padding:18px;margin-bottom:14px;background:linear-gradient(150deg,#9E1249,#D63A7E 70%,#E86AA0);color:#FFF5F9;border:2px solid #E6C35C;box-shadow:0 18px 36px -24px rgba(158,18,73,.8);overflow:hidden;}
.dh::after{content:"老师";position:absolute;right:-6px;bottom:-30px;font-family:var(--hz);font-size:118px;line-height:1;color:rgba(255,231,160,.12);pointer-events:none;}
.dh-orn{position:absolute;top:12px;right:14px;color:#F2D27A;font-size:20px;}
.dh-only{display:inline-block;margin:0 0 8px;padding:3px 10px;border-radius:999px;background:rgba(255,231,160,.16);border:1px solid rgba(242,210,122,.65);color:#FFE7A0;font-size:12px;font-weight:700;}
.dh h2{margin:0;font-size:25px;line-height:1.15;letter-spacing:-.02em;padding-right:24px;}
.dh h2 [lang="zh"]{color:#FFE7A0;}
.dh-sub{margin:4px 0 0;font-size:13.5px;opacity:.88;}
.dh-row{display:flex;gap:16px;align-items:center;margin-top:14px;position:relative;z-index:1;}
.dh .donut > circle:first-child{stroke:rgba(255,255,255,.22);}
.dh .donut text{fill:#fff;}
.dh-leg{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13px;flex:1;}
.dh-leg li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;}
.dh-leg i{width:10px;height:10px;border-radius:3px;}
.dh .dh-leg i[style*="var(--line)"]{background:rgba(255,255,255,.3)!important;}
.donut text{font-size:8.5px;font-weight:800;font-family:var(--ui);fill:var(--ink);}
.dh.small{padding:14px 16px;}
.dcont{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:2px solid #D4AF37;background:color-mix(in srgb,#D4AF37 12%,var(--surface));border-radius:18px;padding:12px 14px;margin-bottom:6px;color:var(--ink);}
.dci{width:40px;height:40px;border-radius:12px;background:#C2185B;color:#FFE7A0;display:grid;place-items:center;font-family:var(--hz);font-size:22px;}
.dcont .s{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px;}
.dcont .chev{color:var(--ink-3);font-size:22px;}
.dsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.dsel button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--ink);}
.dsel button b{margin-left:4px;color:#C2185B;}
.dsel button[aria-pressed="true"]{background:#C2185B;border-color:#C2185B;color:#fff;}
.dsel button[aria-pressed="true"] b{color:#FFE7A0;}
.dstack{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line);margin-top:6px;}
.dstack i{display:block;height:100%;transition:width .5s ease;}
.dsum{display:grid;gap:2px;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;}
.dmodes{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dmode{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:120px;position:relative;overflow:hidden;color:var(--ink);}
.dmode::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#C2185B,#D4AF37);}
.dmi{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,#C2185B 12%,var(--surface));color:#C2185B;display:grid;place-items:center;font-family:var(--hz);font-size:24px;}
.dmode b{font-size:15.5px;}
.dmode span:last-child{font-size:12.5px;color:var(--ink-2);line-height:1.35;}
.dlinks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.dsearch{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;background:var(--surface);color:var(--ink);font-size:15px;margin-bottom:10px;}
.dsearch:focus{outline:none;border-color:#C2185B;}
.dlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;}
.dlist li{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);}
.dlist li:last-child{border-bottom:0;}
.dlist.sm li{grid-template-columns:auto 1fr auto auto;}
.dz{font-family:var(--hz);font-size:22px;min-width:2.2em;}
.dtx b{display:block;font-size:13.5px;color:#C2185B;font-weight:700;}
.dtx span{font-size:13.5px;color:var(--ink-2);}
.dk{width:9px;height:9px;border-radius:50%;}
.star{border:0;background:none;font-size:20px;color:color-mix(in srgb,var(--ink-3) 60%,transparent);padding:4px;line-height:1;transition:transform .15s ease,color .15s;}
.star[aria-pressed="true"]{color:#D4AF37;}
.x{font-weight:700;color:#C2185B;font-size:13px;}
.mtop{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-bottom:8px;}
.mx{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:16px;color:var(--ink);}
.mt b{display:block;font-size:17px;}
.mt span{font-size:12.5px;color:var(--ink-2);}
.mc{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;}
.mbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:16px;}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#C2185B,#E0458A);transition:width .35s ease;}
.fcopts{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;}
.fcopts .seg{margin:0;}
.fstage{position:relative;perspective:1200px;margin-bottom:14px;}
.fcard{position:relative;height:min(50vh,330px);touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;transition:transform .3s ease, opacity .3s;}
.fcard .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.75,.25,1);}
.fcard.flipped .inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;box-shadow:0 20px 40px -28px rgba(0,0,0,.5);text-align:center;}
.face.ffront{border-top:5px solid #C2185B;}
.face.fback{transform:rotateY(180deg);background:color-mix(in srgb,#E91E63 5%,var(--surface));border-color:color-mix(in srgb,#D4AF37 60%,var(--line));}
.fhz{font-family:var(--hz);font-size:clamp(56px,16vw,92px);line-height:1.1;}
.fhz.sm{font-size:clamp(40px,11vw,60px);}
.fpy{font-size:22px;font-weight:700;color:#C2185B;}
.fuz{font-size:18px;line-height:1.4;}
.fuz.big{font-size:24px;font-weight:600;}
.fhint{position:absolute;bottom:14px;font-size:12px;color:var(--ink-3);}
.ftools{position:absolute;top:10px;right:10px;display:flex;gap:4px;align-items:center;z-index:2;}
.fcard.lean-r .face{box-shadow:0 0 0 3px #2E8B57 inset;}
.fcard.lean-l .face{box-shadow:0 0 0 3px #D1495B inset;}
.fcard.enter{animation:fin .32s cubic-bezier(.2,.75,.25,1);}
@keyframes fin{from{opacity:0;transform:translateY(14px) scale(.97);}}
.fcbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fcbtns button{min-height:58px;border-radius:16px;border:1.5px solid;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;}
.fcbtns b{font-size:20px;}
.fcbtns span{font-size:12.5px;opacity:.8;font-weight:600;background:rgba(0,0,0,.06);border-radius:999px;padding:1px 8px;}
.fbad{background:color-mix(in srgb,#D1495B 10%,var(--surface));border-color:#D1495B;color:#B23A4A;}
.fgood{background:color-mix(in srgb,#2E8B57 10%,var(--surface));border-color:#2E8B57;color:#23704A;}
.dcenter{text-align:center;margin-top:10px;}
.qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:20px;text-align:center;margin-bottom:14px;}
.qcard.enter,.dopts,.dfb{animation:fin .3s ease both;}
.ql{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);}
.qhz{font-family:var(--hz);font-size:clamp(48px,14vw,76px);line-height:1.15;}
.qhz.sm{font-size:40px;}
.quz{font-size:21px;font-weight:600;line-height:1.35;}
.quz.sm{font-size:17px;}
.dopts{display:grid;gap:8px;}
.dopts.two{grid-template-columns:1fr 1fr;}
.dopt{min-height:54px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-size:15.5px;text-align:left;color:var(--ink);transition:transform .12s ease, border-color .15s, background .15s;}
.dopt .ohz{font-family:var(--hz);font-size:24px;}
.dopt.sel{border-color:#C2185B;background:color-mix(in srgb,#C2185B 8%,var(--surface));}
.dopt.ok{border-color:#2E8B57;background:color-mix(in srgb,#2E8B57 12%,var(--surface));}
.dopt.bad{border-color:#D1495B;background:color-mix(in srgb,#D1495B 12%,var(--surface));animation:shake .35s;}
.dopt.dim{opacity:.5;}
@keyframes shake{20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(3px);}}
.dfb{margin-top:12px;border-radius:16px;padding:12px 14px;border:1.5px solid;}
.dfb.ok{border-color:#2E8B57;background:color-mix(in srgb,#2E8B57 8%,var(--surface));}
.dfb.bad{border-color:#D1495B;background:color-mix(in srgb,#D1495B 8%,var(--surface));}
.dfb > b{display:block;margin-bottom:6px;}
.dfb.ok > b{color:#23704A;}
.dfb.bad > b{color:#B23A4A;}
.dfw{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;}
.dtype{display:grid;grid-template-columns:1fr auto;gap:8px;}
.dtype input,.tin{min-height:52px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;font-size:18px;background:var(--surface);color:var(--ink);width:100%;}
.dtype input:focus,.tin:focus{outline:none;border-color:#C2185B;box-shadow:0 0 0 3px color-mix(in srgb,#C2185B 18%,transparent);}
.tin.ok{border-color:#2E8B57;}
.tin.bad{border-color:#D1495B;}
.dhint{font-family:var(--hz);font-size:40px;margin:10px 0 0;color:#C2185B;}
.dend{text-align:center;padding:10px 0;}
.dend-big{font-family:var(--hz);font-size:84px;line-height:1;color:#C2185B;animation:pop .5s cubic-bezier(.2,1.4,.4,1);}
.dend-big.gold{color:#C9A227;}
@keyframes pop{from{transform:scale(.4);opacity:0;}}
.dend h2{margin:8px 0 12px;}
.dendst{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px;}
.dendst div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;font-size:13px;color:var(--ink-2);}
.dendst b{display:block;font-size:26px;color:var(--ink);}
.dendst .g b{color:#23704A;}
.dendst .b b{color:#B23A4A;}
.dend .actions{justify-content:center;}
.lprog{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
.lprog div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:12.5px;color:var(--ink-2);}
.lprog b{display:block;font-size:22px;color:#C2185B;}
.dend .dlist{text-align:left;margin-top:12px;}
.dtys{display:flex;gap:6px;flex-wrap:wrap;}
.dtys .tg[aria-pressed="true"]{background:#C2185B;border-color:#C2185B;color:#fff;}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:12px;}
.tq{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 14px 14px 46px;}
.tq.ok{border-color:#2E8B57;}
.tq.bad{border-color:#D1495B;}
.tn{position:absolute;left:12px;top:14px;width:24px;height:24px;border-radius:50%;background:color-mix(in srgb,#C2185B 14%,var(--surface));color:#C2185B;font-size:12px;font-weight:700;display:grid;place-items:center;}
.tq .ql{text-align:left;}
.tq .qhz,.tq .quz{margin-bottom:10px;}
.tfp{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.dscore{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:color-mix(in srgb,#E91E63 8%,var(--surface));border:2px solid #D4AF37;border-radius:20px;padding:14px 16px;margin-bottom:14px;}
.dsc-big{font-size:38px;font-weight:800;color:#C2185B;}
.dscore .sub{display:block;}
.mhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.mclock{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:#C2185B;}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.mtile{min-height:84px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:8px;font-size:13.5px;line-height:1.3;color:var(--ink);transition:transform .2s ease, opacity .3s ease, border-color .15s;}
.mtile.h span{font-family:var(--hz);font-size:24px;}
.mtile.sel{border-color:#C2185B;background:color-mix(in srgb,#C2185B 10%,var(--surface));transform:scale(1.03);}
.mtile.gone{opacity:0;transform:scale(.7);pointer-events:none;}
.mtile.shake{animation:shake .35s;border-color:#D1495B;}
.dnote{background:var(--surface);border:1px solid var(--line);border-left:4px solid #D4AF37;border-radius:14px;padding:12px 14px;font-size:14px;margin:12px 0;}
.dchart{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:130px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px 8px;}
.dcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
.dcol i{display:block;width:100%;min-height:2px;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#E0458A,#C2185B);}
.dcol span{font-size:10.5px;color:var(--ink-3);}
.dbars{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;}
.dbar{display:grid;grid-template-columns:92px 1fr 42px 30px;gap:8px;align-items:center;font-size:13.5px;}
.dbar .track{height:8px;border-radius:4px;background:var(--line);overflow:hidden;}
.dbar .track i{display:block;height:100%;background:linear-gradient(90deg,#C2185B,#D4AF37);}
.dbar b{text-align:right;}
.dbar small{color:var(--ink-3);text-align:right;}
.thist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
.thist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;}
.thist li:last-child{border-bottom:0;}
.thist b.g{color:#A67C00;}
/* ===== motion ===== */
main > section:not([hidden]){animation:vin .26s ease both;}
@keyframes vin{from{opacity:0;transform:translateY(8px);}}
button:active:not(:disabled){transform:scale(.97);}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important;} }

/* ===== more ===== */
.mgroup{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:18px;}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 14px;}
.mrow:last-child{border-bottom:0;}
.mrow .mi2{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--qc);}
.mrow b{display:block;font-size:15.5px;}
.mrow span.s{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px;}
.mrow .chev{color:var(--ink-3);font-size:22px;line-height:1;}
.mrow .val{font-size:14px;color:var(--ink-2);}
.mhead{font-size:13px;color:var(--ink-2);margin:0 4px 8px;font-weight:600;}
.fc,.g,.sp,.wcard,.today div,.tiles div{border-radius:20px;}
.fc{box-shadow:0 18px 40px -28px rgba(0,0,0,.45);}
.btn{border-radius:14px;}
.btn.primary{box-shadow:0 8px 18px -12px var(--primary);}
@media (min-width:700px){ .qa{grid-template-columns:repeat(4,1fr);} }
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20;}
.foot{font-size:12.5px;color:var(--ink-3);padding:8px 0 28px;}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
@media (max-width:640px){
  .tabs{grid-template-columns:repeat(4,1fr);}
  .chips .lbl{display:none;}
  .tzg{--s:40px;}
  .tzg.sm{--s:30px;}
  .row .lbl{width:100%;}
  .opt.hz{font-size:26px;}
  .brand h1{font-size:17px;}
  .tiles{grid-template-columns:repeat(2,1fr);}
  .hb{grid-template-columns:110px 1fr 60px;}
  .g{padding:16px 12px;}
}

/* ===== telefon ekrani: kartalar (flip) ===== */
.tzg.lg{--s:min(20vw,84px);}
.tzg.md{--s:54px;}
:root.focus .ctxrow,:root.focus .homebar,:root.focus .foot{display:none !important;}
:root.focus main{padding-top:10px;padding-bottom:0;}
#v-cards.play{display:flex;flex-direction:column;height:var(--ph,calc(100dvh - 190px));}
#v-cards.play .card-top{margin-bottom:10px;flex:none;}
.hstage{flex:1;min-height:0;perspective:1400px;margin-bottom:12px;}
.hcard{position:relative;height:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .3s ease,opacity .3s ease;}
.hcard .inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.25,1);}
.hcard.flipped .inner{transform:rotateY(180deg);}
.hcard.enter{animation:fin .32s cubic-bezier(.2,.75,.25,1);}
.hcard .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;background:var(--surface);border:1px solid var(--line);box-shadow:0 22px 44px -30px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;align-items:stretch;justify-content:flex-start;padding:0;gap:0;text-align:left;}
.hcard .face .fc-band{flex:none;border-radius:0;}

:root.dilobar[data-theme="dark"]{--paper:#1D0D14;--surface:#2B1520;--ink:#FBEAF0;--ink-2:#D9AFBF;--ink-3:#A07888;--line:#4A2738;--mask:#3B1F2D;--primary:#FF6FA3;--primary-ink:#2A0A16;}
:root.dilobar body{background:radial-gradient(900px 520px at 110% -10%,color-mix(in srgb,#FF8FB5 34%,transparent),transparent 62%),radial-gradient(760px 480px at -20% 105%,color-mix(in srgb,#FFB6CE 38%,transparent),transparent 60%),linear-gradient(180deg,var(--paper),color-mix(in srgb,#FFC2D6 22%,var(--paper)));background-attachment:fixed;}
:root.dilobar .top{background:color-mix(in srgb,#FFD6E4 30%,color-mix(in srgb,var(--paper) 80%,transparent));}
:root.dilobar .nav{background:color-mix(in srgb,#FFD6E4 18%,color-mix(in srgb,var(--surface) 86%,transparent));}

.ctxrow .books.dbooks{background:color-mix(in srgb,#FF7AA8 14%,var(--surface));border-color:color-mix(in srgb,#E91E63 35%,var(--line));align-items:center;}
.ctxrow .books .dback{color:var(--primary);}
.dtag{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;font-size:13px;font-weight:800;color:#C2185B;white-space:nowrap;}

.dtag .hrt{color:#FF4F8B;animation:beat 1.4s ease-in-out infinite;}

/* home: kirish kartasi */
.dspecial{position:relative;width:100%;display:flex;align-items:center;gap:14px;margin:0 0 6px;padding:16px 18px;border-radius:22px;border:0;text-align:left;color:#FFF5F9;overflow:hidden;background:linear-gradient(120deg,#9E1249 0%,#D63A7E 55%,#FF8FB5 100%);background-size:180% 100%;animation:dshine 6s ease-in-out infinite;box-shadow:0 16px 30px -18px rgba(214,58,126,.9),inset 0 0 0 1.5px rgba(255,231,160,.55);}
@keyframes dshine{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.dspecial .ds-tx{flex:1;display:flex;flex-direction:column;position:relative;z-index:1;}
.dspecial small{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#FFE7A0;}

.dspecial b [lang="zh"]{color:#FFE7A0;}
.dspecial .ds-tx > span{font-size:12.5px;opacity:.88;margin-top:2px;}
.dspecial .ds-go{position:relative;z-index:1;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px;color:#fff;animation:beat 1.6s ease-in-out infinite;}
.ds-hearts i,.dh-float i{position:absolute;bottom:-20px;color:rgba(255,255,255,.28);font-size:calc(12px + var(--i)*3px);left:calc(8% + var(--i)*15%);animation:floatup calc(5s + var(--i)*.7s) linear infinite;animation-delay:calc(var(--i)*-1.1s);pointer-events:none;}
@keyframes floatup{0%{transform:translateY(0) rotate(-10deg);opacity:0;}15%{opacity:1;}100%{transform:translateY(-170px) rotate(14deg);opacity:0;}}
.dmore{border:1.5px solid color-mix(in srgb,#E91E63 45%,var(--line));background:color-mix(in srgb,#FF7AA8 8%,var(--surface));}
.dmore b{color:#C2185B;}
.dmore .mi2{color:#fff;}
/* hub hero */
.dh .dh-float{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.dh-orn{border:0;background:rgba(255,255,255,.16);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:#FFD3E2;padding:0;z-index:2;animation:beat 1.6s ease-in-out infinite;}
.dh h2{cursor:pointer;}
.dh-only{letter-spacing:.08em;text-transform:uppercase;}
/* yurakcha portlashi va kirish ekrani */
.hburst{position:fixed;z-index:60;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);pointer-events:none;animation:hb 1s cubic-bezier(.2,.7,.3,1) forwards;}
.hburst .hrt{width:100%;height:100%;}
@keyframes hb{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1;}70%{opacity:1;}100%{transform:translate(var(--x),var(--y)) scale(1) rotate(var(--r));opacity:0;}}
.dlove{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(255,143,181,.92),rgba(158,18,73,.96) 75%);animation:dlin .45s ease both;overflow:hidden;}
.dlove.out{animation:dlout .55s ease forwards;}
@keyframes dlin{from{opacity:0;}}
@keyframes dlout{to{opacity:0;transform:scale(1.06);}}
.dl-h i{position:absolute;bottom:-60px;width:var(--s);height:var(--s);animation:rise2 var(--t) cubic-bezier(.3,.6,.4,1) var(--d) both;}
.dl-h .hrt{width:100%;height:100%;filter:drop-shadow(0 4px 8px rgba(120,0,40,.25));}
@keyframes rise2{0%{transform:translate(0,0) scale(.4);opacity:0;}12%{opacity:1;}100%{transform:translate(var(--dr),-115vh) scale(1.1) rotate(18deg);opacity:.2;}}
.dl-card{position:relative;text-align:center;color:#FFF5F9;animation:pop .7s cubic-bezier(.2,1.4,.4,1) .1s both;}
.dl-card .dl-big{display:inline-block;width:92px;height:92px;color:#fff;filter:drop-shadow(0 10px 24px rgba(120,0,40,.45));animation:beat 1.3s ease-in-out infinite .6s;}
.dl-card .dl-big .hrt{width:100%;height:100%;}
.dl-card p{margin:10px 0 0;font-size:15px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#FFE7A0;}
.dl-card h2{margin:2px 0 6px;font-size:40px;line-height:1.1;letter-spacing:-.01em;text-shadow:0 4px 18px rgba(120,0,40,.35);}
.dl-card h2 [lang="zh"]{color:#FFE7A0;}
.dl-card small{font-size:14px;opacity:.9;}
@keyframes pop{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}
@media (prefers-reduced-motion: reduce){.dspecial,.ds-hearts i,.dh-float i,.dtag .hrt,.dh-orn,.ds-go{animation:none;}}

.rmodes button{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-size:14px;color:var(--ink-2);}
.rmodes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.rfil{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:4px;scrollbar-width:none;}
.rfil::-webkit-scrollbar{display:none;}
.rfil .chip{flex:0 0 auto;width:auto;padding:0 12px;border-radius:999px;font-size:13px;}
.rfil .chip,.rfil .chip[aria-pressed]{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);height:32px;}
.rfil .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.rc{position:relative;aspect-ratio:1/1.05;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;min-width:0;}
.rc-c{font-family:var(--hz);font-size:30px;line-height:1.1;color:var(--ink);}
.rc-v{position:absolute;top:4px;right:6px;font-family:var(--hz);font-size:13px;color:var(--ink-3);}
.rc-m{font-size:10.5px;color:var(--ink-2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rc.ok{border-color:color-mix(in srgb,var(--good,#2E8B57) 55%,var(--line));background:color-mix(in srgb,var(--good,#2E8B57) 7%,var(--surface));}
.rc.ok::after{content:"✓";position:absolute;top:3px;left:6px;font-size:11px;font-weight:800;color:var(--good,#2E8B57);}
.rg{font-family:var(--hz);display:inline-flex;align-items:flex-start;gap:4px;line-height:1;}
.rg i{font-style:normal;font-size:.38em;color:var(--ink-3);margin-top:.1em;}
.rg.xl{font-size:64px;}
.rg.lg{font-size:52px;}
.rg.xxl{font-size:110px;}
.rsheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:150;animation:fadein .2s;}
.rsheet{position:fixed;left:0;right:0;bottom:0;z-index:151;max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.2);animation:sheetup .25s ease;max-height:85vh;overflow-y:auto;}
@keyframes sheetup{from{transform:translateY(40%);opacity:0;}}
@keyframes fadein{from{opacity:0;}}
.rs-top{display:flex;gap:16px;align-items:center;}
.rs-n{font-size:12px;font-weight:700;color:var(--ink-3);}
.rs-py{font-size:17px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:8px;margin-top:2px;}
.rs-uz{font-size:18px;font-weight:700;margin-top:2px;}
.rs-uz.big{font-size:21px;text-align:center;}
.rs-nm{font-family:var(--hz);font-size:15px;color:var(--ink-2);margin-top:2px;}
.rs-h{margin:16px 0 8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);}
.rexs{display:flex;flex-wrap:wrap;gap:6px;}
.rexs.c{justify-content:center;margin-top:12px;}
.rex{display:flex;flex-direction:column;align-items:center;padding:6px 12px;border-radius:12px;background:var(--paper);border:1px solid var(--line);}
.rex b{font-family:var(--hz);font-size:26px;font-weight:400;line-height:1.2;}
.rex small{font-size:11px;color:var(--ink-2);white-space:nowrap;}
.rs-act{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;margin-top:18px;}
.rsub{font-size:13px;color:var(--ink-2);text-align:center;margin:4px 0 10px;}
.rcard{perspective:1200px;height:min(52vh,360px);cursor:pointer;}
.rcard-in{position:relative;height:100%;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;}
.rcard.flipped .rcard-in{transform:rotateY(180deg);}
.rf{position:absolute;inset:0;width:auto;height:auto;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;box-shadow:0 12px 28px -20px rgba(0,0,0,.4);}
.rf.rback{width:auto;height:auto;font-size:inherit;padding:16px;transform:rotateY(180deg);}
.rf .fhint{position:absolute;bottom:12px;font-size:12px;color:var(--ink-3);}
.rctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.rctl .gb{height:52px;border-radius:14px;font-size:16px;justify-content:center;}
.rctl .btn{height:52px;}
.rq{display:flex;justify-content:center;padding:10px 0 16px;}
.ropts{display:grid;gap:8px;}
.ropt{min-height:52px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:16px;font-weight:600;text-align:left;padding:0 16px;color:var(--ink);}
.ropt.ok{background:color-mix(in srgb,var(--good,#2E8B57) 15%,var(--surface));border-color:var(--good,#2E8B57);}
.ropt.bad{background:color-mix(in srgb,var(--again,#C0392B) 12%,var(--surface));border-color:var(--again,#C0392B);}
.rstart{width:100%;margin-top:14px;height:52px;}
.rres{display:flex;flex-direction:column;align-items:center;padding:24px 0 4px;}
.rres b{font-size:44px;}
.rres span{color:var(--ink-2);}

/* ================= REBRAND: tinch, yetuk dizayn ================= */
:root:not(.dilobar){--paper:#F5F4F0;--surface:#FFFFFF;--ink:#1A1D1B;--ink-2:#5E6560;--ink-3:#9AA09B;--line:#E6E4DE;--mask:#ECEAE4;--primary:#1A1D1B;--primary-ink:#FFFFFF;--acc:#C8452F;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not(.dilobar){--paper:#111312;--surface:#1A1D1B;--ink:#ECECE7;--ink-2:#A8ADA9;--ink-3:#727874;--line:#2A2E2B;--mask:#242826;--primary:#ECECE7;--primary-ink:#111312;--acc:#E0705B;}}
:root[data-theme="dark"]:not(.dilobar){--paper:#111312;--surface:#1A1D1B;--ink:#ECECE7;--ink-2:#A8ADA9;--ink-3:#727874;--line:#2A2E2B;--mask:#242826;--primary:#ECECE7;--primary-ink:#111312;--acc:#E0705B;}
:root{--acc:#C8452F;}
.top{border-bottom:0;background:var(--paper);}
.appbar{padding:14px 0 10px;}
.ttl{flex-direction:row;align-items:center;gap:8px;}
.ttl h1{font-size:24px;letter-spacing:-.03em;}
.ttl .cloud{margin:0;font-size:0;gap:0;padding:6px;}
.ttl .cloud::before{width:7px;height:7px;}
.fontbtn{height:34px;border-radius:999px;padding:0 12px;font-size:12px;}
.ctxrow{flex-wrap:wrap;overflow:visible;gap:8px;padding-bottom:12px;}
.ctxrow .books{flex:1 1 0;min-width:0;display:grid;grid-template-columns:1fr 1fr;background:var(--mask);border:0;padding:3px;border-radius:12px;}
.ctxrow .books.dbooks{display:flex;}
.ctxrow .books button{border-radius:9px;padding:7px 4px;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:700;text-align:center;white-space:nowrap;}
.ctxrow .books button small{display:none;font-size:10.5px;font-weight:600;color:var(--ink-3);margin-left:4px;}
.ctxrow .books button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.lessbtn{flex:none;display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:13px;color:var(--ink-2);}
.lessbtn b{color:var(--ink);font-size:13.5px;max-width:22vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lessbtn i{font-style:normal;font-size:11px;transition:transform .2s;}
.lessbtn[aria-expanded="true"] i{transform:rotate(180deg);}
.ctxrow .chips{display:none;flex:1 1 100%;flex-wrap:wrap;gap:6px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;}
.ctxrow .chips.open{display:flex;}
.ctxrow .chip,.chip{border:1px solid var(--line);color:var(--ink-2);background:var(--surface);height:34px;min-width:34px;border-radius:10px;font-weight:600;}
.ctxrow .chip[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--lc);border-color:var(--lc);color:#fff;}
.ctxrow .chip.all{color:var(--ink);}
.ctxrow .chip.all[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);}
main{padding-top:6px;}
/* hero */
.hero{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
.hero::after{display:none;}
.h-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.hero .greet{font-size:17px;font-weight:700;opacity:1;padding:0;color:var(--ink);}
.hero .ctx{font-size:13px;color:var(--ink-3);opacity:1;padding:0;margin-top:2px;}
.streak{flex:none;font-size:12px;color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);border-radius:999px;padding:3px 10px;white-space:nowrap;}
.streak b{font-size:14px;}
.hstats{gap:0;margin:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.hstats div{background:none;border-radius:0;padding:12px 4px;text-align:center;opacity:1;}
.hstats div + div{border-left:1px solid var(--line);}
.hstats b{font-size:26px;font-weight:700;letter-spacing:-.02em;}
.hstats span{font-size:12px;color:var(--ink-3);}
.hero .go{background:var(--primary);color:var(--primary-ink);border-radius:14px;min-height:52px;font-size:15.5px;}
.hero .go:disabled{background:var(--mask);color:var(--ink-3);opacity:1;}
/* Dilobar kartasi: ixcham */
.dspecial{padding:12px 14px;border-radius:16px;animation:none;background:linear-gradient(120deg,#8E1747,#C23C76);box-shadow:none;}
.dspecial b{font-size:18px;}
.dspecial small{font-size:10.5px;}
.dspecial .ds-go{width:36px;height:36px;font-size:16px;animation:none;}
.ds-hearts{display:none;}
/* section heads */
.sect{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:26px 2px 10px;}
/* quick actions */
.qa{gap:8px;}
.qa button{min-height:0;padding:14px;border-radius:16px;gap:10px;flex-direction:row;align-items:center;flex-wrap:wrap;}
.qa .qi{width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--qc) 13%,transparent);color:var(--qc);}
.qa svg{width:20px;height:20px;}
.qa button b{font-size:14.5px;flex:1;min-width:0;line-height:1.25;}
.qa button > span:not(.qi){display:none;}
.qa .qa-wide > span:not(.qi){display:block;flex-basis:auto;font-size:12.5px;color:var(--ink-3);}
.qa .qa-rad .qi{font-size:19px;}
.wod,.lp{border-radius:18px;}
/* more menu */
.mgroup{border-radius:16px;}
.mrow .mi2{width:34px;height:34px;background:color-mix(in srgb,var(--qc) 13%,transparent);color:var(--qc);}
.mrow .mi2 b[lang="zh"]{color:var(--qc) !important;}
.mrow svg{width:20px;height:20px;}
.mhead{text-transform:uppercase;letter-spacing:.07em;font-size:12px;color:var(--ink-3);}
/* nav */
.nav button[aria-current="page"]{color:var(--ink);}
.nav button[aria-current="page"] .ic{background:var(--mask);}
/* flashcard */
.hcard .face{border-radius:22px;box-shadow:0 18px 40px -32px rgba(0,0,0,.5);}
.hcard .face .fc-band{background:none;color:var(--ink-3);border-bottom:1px solid var(--line);padding:10px 16px;font-size:12px;}
.hcard .face .fc-band::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lc);margin-right:-4px;align-self:center;}
.hcard .face .fc-band span:first-of-type{margin-right:auto;}
.hcard .face .fc-band [lang="zh"]{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%;}
.hf-body .hint{font-size:13px;color:var(--ink-3);}
.hb-head .py,.hcard .py{color:var(--ink);}
.fc-sec{background:none;border-top:1px solid var(--line);border-radius:0;padding:12px 2px 0;margin-top:12px;}
.fc-lbl{color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-size:11px;}
.grades{grid-template-columns:1fr 1fr !important;gap:10px;}
.hctl .gb{min-height:56px;font-size:16px;}
.gb small{font-size:11.5px;font-weight:600;opacity:.8;}
.card-top .prog i{background:var(--ink);}
.btn{border-radius:12px;}
/* exercise hub */
.exn{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;}
.exn > span{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);}
.exn .seg{border-radius:12px;background:var(--mask);border:0;}
.exn .seg button{min-width:42px;padding:7px 10px;border-radius:9px;}
.exn .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.hub{grid-template-columns:1fr 1fr;gap:10px;}
.hubc{border-radius:18px;padding:12px;gap:6px;position:relative;}
.hubc .pv{height:74px;border-radius:12px;background:var(--paper);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;color:var(--ink-2);margin-bottom:4px;}
.hubc .pv b{font-family:var(--hz);font-weight:400;font-size:34px;color:var(--ink);line-height:1;}
.hubc .pv em{font-style:normal;font-weight:700;font-size:16px;color:var(--ink);}
.hubc .pv em u{text-decoration:none;color:var(--acc);}
.hubc .pv i{font-style:normal;color:var(--ink-3);}
.hubc .pv i.gap{width:30px;border-bottom:2px solid var(--acc);height:26px;}
.hubc .pv .pc{font-family:var(--hz);font-size:20px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 8px;}
.hubc .pv svg{width:34px;height:34px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.hubc b{font-size:14.5px;line-height:1.25;}
.hubc .acc{position:absolute;top:18px;right:18px;font-size:11.5px;font-weight:700;color:var(--ink-3);margin:0;}
.hubc .abar{height:3px;border-radius:2px;background:var(--mask);overflow:hidden;}
.hubc .abar i{display:block;height:100%;background:var(--good);}
/* yodlash / kalitlar */
.wtop{background:var(--mask);}
.rmodes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-color:var(--ink);}
.rs-py{color:var(--acc);}
.h2 .zh{color:var(--acc);}
</style>
</head>

<script>
const D = {"lessons": [{"n": 1, "zh": "我们去机场接你们", "py": "Wǒmen qù jīchǎng jiē nǐmen", "uz": "Sizlarni aeroportdan kutib olamiz", "words": [["以为", "yǐwéi", "v", "deb oʻylamoq (koʻpincha xato)", "觉得 — shunchaki “oʻylayman”, 以为 — “oʻylagan edim, lekin notoʻgʻri chiqdi”: 我以为你是老师。", "", "我以为你是中国人。", "Men seni xitoylik deb oʻylabman."], ["像", "xiàng", "v", "oʻxshamoq", "亻 odam + 象 xiàng (fil): “bu odam filga oʻxshaydimi?” Ovozi ham bir xil.", "", "你长得很像你妈妈。", "Sen onangga juda oʻxshaysan."], ["长", "zhǎng", "v", "oʻsmoq; 长得 — koʻrinishi", "Ikki oʻqilishi bor: cháng — uzun, zhǎng — oʻsmoq. Oʻsgan narsa uzun boʻladi.", "长得", "他长得很高。", "Uning boʻyi juda baland (oʻsib ketgan)."], ["身高", "shēngāo", "n", "boʻy (balandlik)", "身 tana + 高 baland = tananing balandligi.", "", "他身高一米八。", "Uning boʻyi 1,8 metr."], ["米", "mǐ", "m", "metr", "米 aslida “guruch”, lekin ovozi “metr”ga yaqin boʻlgani uchun metr ham boʻlib ketgan: 一米八 — 1,8 metr.", "", "我身高一米七五。", "Boʻyim 1,75 metr."], ["瘦", "shòu", "adj", "oriq, ozgʻin", "疒 — kasallik belgisi: kasal odam ozib ketadi.", "", "你最近瘦了。", "Oxirgi paytda ozib qolibsan."], ["接", "jiē", "v", "kutib olmoq; (telefonni) koʻtarmoq", "扌 qoʻl: qoʻl choʻzib kutib olish. 接电话 — telefonga javob bermoq.", "", "我们去机场接你们。", "Sizlarni aeroportdan kutib olamiz."], ["行李", "xíngli", "n", "yuk, bagaj", "行 yoʻl yurish + 李: safarda olib yuriladigan narsa.", "", "你的行李多吗？", "Yuklaring koʻpmi?"], ["丢", "diū", "v", "yoʻqotmoq", "去 (ketmoq) ustiga bitta chiziq: “ketib qoldi”, yaʼni yoʻqoldi.", "", "他丢了一个箱子。", "U bitta chamadonini yoʻqotdi."], ["箱子", "xiāngzi", "n", "chamadon, quti", "⺮ bambuk: qadimda qutilar bambukdan boʻlgan. 3-mavzudagi 冰箱 — “muz qutisi”.", "", "这个箱子是你的吗？", "Bu chamadon senikimi?"], ["号码", "hàomǎ", "n", "raqam (telefon, xona)", "手机号码 — telefon raqami.", "", "你的手机号码是多少？", "Telefon raqaming nechchi?"], ["好像", "hǎoxiàng", "adv", "shekilli, goʻyo", "像 — oʻxshamoq (shu mavzuda). 好像 — “oʻxshaydi”, yaʼni shekilli.", "", "他好像不在家。", "U uyda yoʻq shekilli."], ["重要",
